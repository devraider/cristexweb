---
- name: Validate exact synthetic storage mount attribution
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    read_only_discovery_kubernetes_attempted: false
    read_only_discovery_host_summary: {}
    read_only_discovery_datastore_summary: {}
    read_only_discovery_kubernetes_raw:
      results:
        - item:
            id: nodes
            api_version: v1
            kind: Node
          api_found: true
          resources:
            - metadata:
                name: synthetic-node
                uid: 11111111-1111-1111-1111-111111111111
                labels:
                  sensitive.example/label: omitted
                annotations:
                  sensitive.example/annotation: omitted
              status:
                addresses:
                  - type: InternalIP
                    address: omitted-address
                nodeInfo:
                  kubeletVersion: v1.32.9+k3s1
                  kernelVersion: synthetic-kernel
                  containerRuntimeVersion: synthetic-runtime
                  machineID: synthetic-machine-id
                  systemUUID: synthetic-system-uuid
                  bootID: synthetic-boot-id
            - metadata:
                name: synthetic-node-without-status
                uid: 22222222-2222-2222-2222-222222222222
            - metadata:
                name: synthetic-node-without-node-info
                uid: 33333333-3333-3333-3333-333333333333
              status:
                addresses:
                  - type: Hostname
                    address: omitted.example
    read_only_discovery_host_raw:
      ansible_facts:
        ansible_devices:
          sda:
            sectors: 100
            sectorsize: 512
            rotational: 1
            removable: 0
            partitions:
              sda1:
                sectors: 50
                sectorsize: 512
          sdap:
            sectors: 100
            sectorsize: 512
            rotational: 1
            removable: 0
            partitions:
              sdap1:
                sectors: 50
                sectorsize: 512
          nvme0n1:
            sectors: 100
            sectorsize: 512
            rotational: 0
            removable: 0
            partitions:
              nvme0n1p1:
                sectors: 50
                sectorsize: 512
          nvme0n11:
            sectors: 100
            sectorsize: 512
            rotational: 0
            removable: 0
            partitions:
              nvme0n11p1:
                sectors: 50
                sectorsize: 512
        ansible_mounts:
          - device: /dev/sdap1
            fstype: ext4
          - device: /dev/nvme0n11
            fstype: xfs

  tasks:
    - name: Render the committed report template from synthetic colliding names
      ansible.builtin.set_fact:
        storage_report_rendered: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir ~ '/../ansible/roles/read_only_discovery/templates/report.json.j2')
             | from_json }}
      changed_when: false
      no_log: true

    - name: Require exact synthetic Node version projection
      ansible.builtin.assert:
        that:
          - storage_report_rendered.schema_version == 3
          - storage_report_rendered.kubernetes.queries | length == 1
          - storage_report_rendered.kubernetes.queries[0].id == 'nodes'
          - >-
            storage_report_rendered.kubernetes.queries[0].objects ==
            [{'name': 'synthetic-node', 'namespace': 'cluster-scoped',
              'kubelet_version': 'v1.32.9+k3s1'},
             {'name': 'synthetic-node-without-status',
              'namespace': 'cluster-scoped', 'kubelet_version': 'unknown'},
             {'name': 'synthetic-node-without-node-info',
              'namespace': 'cluster-scoped', 'kubelet_version': 'unknown'}]
        fail_msg: "Synthetic Node version was not projected exactly."
      changed_when: false

    - name: Index synthetic block devices by exact name
      ansible.builtin.set_fact:
        storage_devices_by_name: >-
          {{ dict(storage_report_rendered.storage.block_devices |
                  map(attribute='name') |
                  zip(storage_report_rendered.storage.block_devices)) }}
      changed_when: false
      no_log: true

    - name: Require collision-safe device and partition attribution
      ansible.builtin.assert:
        that:
          - not storage_devices_by_name.sda.direct_mount_observed_for_device_or_partition
          - storage_devices_by_name.sdap.direct_mount_observed_for_device_or_partition
          - storage_devices_by_name.sdap.filesystem_types_observed_while_mounted == ['ext4']
          - not storage_devices_by_name.nvme0n1.direct_mount_observed_for_device_or_partition
          - storage_devices_by_name.nvme0n11.direct_mount_observed_for_device_or_partition
          - storage_devices_by_name.nvme0n11.filesystem_types_observed_while_mounted == ['xfs']
          - not storage_devices_by_name.sda.partitions[0].direct_mount_observed
          - storage_devices_by_name.sdap.partitions[0].direct_mount_observed
          - not storage_devices_by_name.nvme0n1.partitions[0].direct_mount_observed
          - not storage_devices_by_name.nvme0n11.partitions[0].direct_mount_observed
        fail_msg: "Synthetic colliding block-device names were attributed incorrectly."
      changed_when: false
