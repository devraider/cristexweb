---
- name: Reject direct Infisical database Secret seam action-only mutation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    infisical_database_secrets_bootstrap_approved: true
    infisical_database_secrets_bootstrap_state: present
    infisical_database_secrets_bootstrap_internal_preflight_binding:
      attestation_sha256: >-
        {{ lookup('ansible.builtin.env', 'CRISTEXWEB_INFISICAL_DATABASE_SECRETS_BOOTSTRAP_TOKEN') |
           ansible.builtin.hash('sha256') }}
      object_count: 13
      identity_set_sha256: 9101cb207aaa89c2036770a26229ab6d23d1af19ec13486d507440aadee6c4fc
      prestate_count: 13
      admission_count: 6
      rbac_count: 2
      source_count: 5
      alternate_target_count: 3
      static_secret_inventory_count: 0
      credential_contract: true
      target_contract: true
      namespace_contract: true
      crd_count: 6
  tasks:
    - name: Attempt one exact object without canonical guarded role task source
      infisical_database_secrets_guarded_k8s:
        state: present
        definition: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~
             '/../ansible/files/components/infisical-database-secrets/source/infisical-cloud-connection.yaml') |
             from_yaml }}
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        wait: false
        wait_timeout: 60
