---
- name: Reject direct Infisical proxy Secret action-only mutation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    infisical_proxy_secret_zero_approved: true
  tasks:
    - name: Attempt one proxy Secret without the guarded writer role
      infisical_proxy_secret_zero_guarded_k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: infisical-egress-proxy-client
            namespace: shared-services
            labels:
              app.kubernetes.io/part-of: cristex-platform
              app.kubernetes.io/managed-by: ansible
              cristex.io/component: infisical-operator
              cristex.io/value-owner: secret-zero
          type: Opaque
          data:
            proxy-url: aW52YWxpZA==
        kubeconfig: /etc/rancher/k3s/k3s.yaml
