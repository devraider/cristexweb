---
- name: Reject direct Infisical Argo CD Secret seam action-only mutation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    infisical_argocd_secrets_bootstrap_approved: true
    infisical_argocd_secrets_bootstrap_state: present
    infisical_argocd_secrets_bootstrap_internal_preflight_binding:
      attestation_sha256: >-
        {{ lookup('ansible.builtin.env', 'CRISTEXWEB_INFISICAL_ARGOCD_SECRETS_BOOTSTRAP_TOKEN') |
           ansible.builtin.hash('sha256') }}
      object_count: 11
      identity_set_sha256: bbfddcc3da0de1de6da0632fb51fb7a364960f7080e3eeca4094a267b27e1698
      prestate_count: 11
      admission_count: 6
      rbac_count: 2
      source_count: 3
      alternate_target_count: 3
      static_secret_inventory_count: 0
      credential_contract: true
      target_contract: true
      namespace_contract: true
      crd_count: 6
  tasks:
    - name: Attempt one exact object without canonical guarded role task source
      infisical_argocd_secrets_guarded_k8s:
        state: present
        definition: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~
             '/../ansible/files/components/infisical-argocd-secrets/source/infisical-cloud-connection.yaml') |
             from_yaml }}
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        wait: false
        wait_timeout: 60
