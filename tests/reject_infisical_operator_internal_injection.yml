---
- name: Prove forged Infisical bootstrap internals fail before API tasks
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Exercise the production Infisical role with forged internals
      block:
        - name: Include the production Infisical bootstrap role
          ansible.builtin.include_role:
            name: infisical_operator_bootstrap
      rescue:
        - name: Verify the unique internal-variable guard rejected the fixture
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Reject externally supplied Infisical bootstrap internal variables'
              - >-
                'INTERNAL_VARIABLE_GUARD' in
                (ansible_failed_result | ansible.builtin.to_json)

        - name: Record successful fail-closed fixture behavior
          ansible.builtin.set_fact:
            infisical_operator_fixture_guard_rejected: true

    - name: Require the Infisical role to fail closed at its first task
      ansible.builtin.assert:
        that:
          - infisical_operator_fixture_guard_rejected | default(false) | bool
