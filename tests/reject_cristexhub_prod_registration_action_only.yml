---
- name: Reject direct CristexHub PROD registration action-only mutation
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    cristexhub_prod_registration_approved: true
    cristexhub_prod_registration_state: present
    cristexhub_prod_registration_internal_preflight_binding:
      attestation_sha256: >-
        {{ lookup('ansible.builtin.env',
                  'CRISTEXWEB_CRISTEXHUB_PROD_REGISTRATION_TOKEN') |
           ansible.builtin.hash('sha256') }}
      manifest_names:
        - argocd-application-controller-cristexhub-prod
        - argocd-application-controller-cristexhub-prod
        - argocd-cluster-cristexhub-prod
        - cristexhub-prod
        - cristexhub-prod
      prestate_names:
        - argocd-application-controller-cristexhub-prod
        - argocd-application-controller-cristexhub-prod
        - argocd-cluster-cristexhub-prod
        - cristexhub-prod
        - cristexhub-prod
      object_count: 5
      namespace_contract: true
      repository_contract: true
      revision: 751885a42798d282e168131db147f13694a0a621
      no_delete_path: true
  tasks:
    - name: Attempt one exact object without the guarded role task source
      cristexhub_prod_registration_guarded_k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cristexhub-prod
            namespace: argocd
            labels:
              app.kubernetes.io/name: cristexhub-prod
              app.kubernetes.io/part-of: cristexhub
              app.kubernetes.io/managed-by: ansible
              cristex.io/component: cristexhub-prod-registration
          spec:
            project: cristexhub-prod
            source:
              repoURL: ssh://git@ssh.github.com:443/devraider/cristexhub.git
              targetRevision: 751885a42798d282e168131db147f13694a0a621
              path: infra/kubernetes/cristexhub-prod
            destination:
              name: cristexhub-prod-local
              server: ''
              namespace: cristexhub-prod
            syncPolicy:
              syncOptions:
                - CreateNamespace=false
                - Prune=false
                - ServerSideApply=false
                - Replace=false
                - FailOnSharedResource=true
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        wait: false
        wait_timeout: 60
