---
# yamllint disable rule:line-length
- name: Validate bounded k3s config and encryption JSON parser fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    k3s_datastore_preflight_config_max_bytes: 65536
    k3s_datastore_preflight_encryption_output_max_bytes: 65536
    k3s_datastore_preflight_internal_version_result:
      rc: 0
      stdout: k3s version v1.36.2+k3s1 (fixture)
      stdout_lines: ["k3s version v1.36.2+k3s1 (fixture)"]
    k3s_datastore_preflight_internal_executable_state:
      stat: {exists: true, isreg: true, islnk: false, executable: true, pw_name: root, gr_name: root, mode: '0755'}
    k3s_datastore_preflight_internal_config_state:
      stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 45}
    k3s_datastore_preflight_internal_config_read_allowed: true
    k3s_datastore_preflight_internal_config_content_stable: true
    k3s_datastore_preflight_internal_config_slurp_result:
      failed: false
      skipped: false
      content: "{{ 'secrets-encryption: true\ncluster-init: false\n' | b64encode }}"
    k3s_datastore_preflight_internal_sqlite_marker_state:
      stat: {isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600'}
    k3s_datastore_preflight_internal_etcd_marker_state:
      stat: {isdir: false, islnk: false}
    k3s_datastore_preflight_internal_exec_start_result:
      rc: 0
      stdout: '{ path=/usr/local/bin/k3s ; argv[]=/usr/local/bin/k3s server ; ignore_errors=no }'
      stdout_lines: ['{ path=/usr/local/bin/k3s ; argv[]=/usr/local/bin/k3s server ; ignore_errors=no }']
    k3s_datastore_preflight_internal_environment_results:
      results:
        - {rc: 0, stdout: '', stdout_lines: []}
        - {rc: 0, stdout: '', stdout_lines: []}
    k3s_datastore_preflight_internal_encryption_result:
      rc: 0
      stdout: '{"stage":"start","activekey":"fixture-active-key","enable":true,"hashmatch":true,"inactivekeys":["fixture-inactive-key"]}'
      stderr: ''
      stdout_lines: []
    k3s_datastore_preflight_internal_service_fields:
      results:
        - {rc: 0, stdout_lines: [loaded, active, running]}
        - {rc: 0, stdout_lines: [loaded, active, running]}
    k3s_datastore_preflight_internal_nodes_result: {rc: 1, stdout: '', stdout_lines: []}
  tasks:
    - name: Parse stable start with safely parsed default config
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml

    - name: Require safe config default and stable encryption projection
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_config_parse_valid | bool
          - k3s_datastore_preflight_internal_config_data_dir_state == 'absent'
          - k3s_datastore_preflight_internal_config_encryption_status == 'enabled'
          - k3s_datastore_preflight_internal_data_dir_source == 'config_default'
          - k3s_datastore_preflight_internal_datastore_type == 'sqlite'
          - k3s_datastore_preflight_internal_encryption_command_status == 'available'
          - k3s_datastore_preflight_internal_encryption_status == 'enabled'
          - k3s_datastore_preflight_internal_rotation_stage == 'initial'
          - "'fixture-active-key' not in (k3s_datastore_preflight_internal_encryption_status | string)"
          - "'fixture-hash-error' not in (k3s_datastore_preflight_internal_rotation_stage | string)"
        fail_msg: Stable JSON/config parser fixture failed or disclosed a sentinel.
      changed_when: false

    - name: Parse stable reencrypt_finished with an exact default data directory
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 56}
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ 'data-dir: /var/lib/rancher/k3s\nsecrets-encryption: true\n' | b64encode }}"
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"reencrypt_finished","activekey":"fixture-active-key","enable":true,"hashmatch":true}'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 1
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require reencrypt_finished to be stable
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_config_data_dir_state == 'default'
          - k3s_datastore_preflight_internal_data_dir_source == 'config_default'
          - k3s_datastore_preflight_internal_rotation_stage == 'finished'
      changed_when: false

    - name: Parse external and embedded-etcd config markers together
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 88}
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ 'datastore-endpoint: https://fixture.invalid\ncluster-init: true\nsecrets-encryption: true\n' | b64encode }}"
        k3s_datastore_preflight_internal_exec_start_result:
          rc: 0
          stdout: '{ path=/usr/local/bin/k3s ; argv[]=/usr/local/bin/k3s server ; ignore_errors=no }'
          stdout_lines: ['{ path=/usr/local/bin/k3s ; argv[]=/usr/local/bin/k3s server ; ignore_errors=no }']
      changed_when: false
    - name: Run bounded parser fixture 2
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require external plus cluster-init ambiguity without disclosure
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_config_external_marker | bool
          - k3s_datastore_preflight_internal_config_etcd_marker | bool
          - k3s_datastore_preflight_internal_external_marker | bool
          - k3s_datastore_preflight_internal_etcd_marker | bool
          - k3s_datastore_preflight_internal_datastore_type == 'ambiguous'
          - "'fixture.invalid' not in (k3s_datastore_preflight_internal_datastore_type | string)"
      changed_when: false

    - name: Reject a custom data directory even with a safe config file
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 52}
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ 'data-dir: /srv/fixture-k3s\nsecrets-encryption: true\n' | b64encode }}"
        k3s_datastore_preflight_internal_sqlite_marker_state:
          stat: {isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600'}
      changed_when: false
    - name: Run bounded parser fixture 3
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require custom data directory to remain unknown
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_config_data_dir_state == 'custom'
          - k3s_datastore_preflight_internal_data_dir_source == 'unknown'
          - k3s_datastore_preflight_internal_datastore_type == 'unknown'
      changed_when: false

    - name: Reject malformed nonmapping duplicate and typed config content
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 56}
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ 'data-dir: /var/lib/rancher/k3s\ndata-dir: /srv/duplicate\n' | b64encode }}"
      changed_when: false
    - name: Run bounded parser fixture 4
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require duplicate relevant config keys to fail closed
      ansible.builtin.assert:
        that:
          - not (k3s_datastore_preflight_internal_config_parse_valid | bool)
          - k3s_datastore_preflight_internal_config_key_counts.data_dir | int == 2
          - k3s_datastore_preflight_internal_data_dir_source == 'unknown'
          - k3s_datastore_preflight_internal_datastore_type == 'unknown'
      changed_when: false

    - name: Reject malformed YAML, nonmapping YAML, and relevant type errors
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 28}
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ 'secrets-encryption: [broken\n' | b64encode }}"
      changed_when: false
    - name: Run bounded parser fixture 5
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require malformed YAML to fail closed
      ansible.builtin.assert:
        that:
          - not (k3s_datastore_preflight_internal_config_parse_valid | bool)
          - k3s_datastore_preflight_internal_data_dir_source == 'unknown'
      changed_when: false
    - name: Bind negative parser fixture input 1
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 11}
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ '- data-dir\n' | b64encode }}"
      changed_when: false
    - name: Run bounded parser fixture 6
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Bind negative parser fixture input 2
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 28}
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ 'secrets-encryption: enabled\n' | b64encode }}"
      changed_when: false
    - name: Run bounded parser fixture 7
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require nonmapping and type-error config to fail closed
      ansible.builtin.assert:
        that:
          - not (k3s_datastore_preflight_internal_config_parse_valid | bool)
          - k3s_datastore_preflight_internal_config_encryption_status == 'unknown'
          - k3s_datastore_preflight_internal_data_dir_source == 'unknown'
      changed_when: false

    - name: Reject unsafe config metadata without slurping its content
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0644', size: 20}
        k3s_datastore_preflight_internal_config_read_allowed: false
        k3s_datastore_preflight_internal_config_content_stable: false
        k3s_datastore_preflight_internal_config_slurp_result: {skipped: true, failed: false}
      changed_when: false
    - name: Run bounded parser fixture 8
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require unsafe config to remain unknown
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_config_status == 'unsafe'
          - k3s_datastore_preflight_internal_data_dir_source == 'unknown'
      changed_when: false

    - name: Validate JSON stderr, nonzero, malformed, active, pending, and hash mismatch cases
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state: {stat: {exists: false}}
        k3s_datastore_preflight_internal_config_read_allowed: false
        k3s_datastore_preflight_internal_config_content_stable: false
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"prepare","activekey":"fixture-active-key","enable":true,"hashmatch":false,"hasherror":"fixture-hash-error"}'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 9
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require pending stage without stable hash claim
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_command_status == 'available'
          - k3s_datastore_preflight_internal_encryption_status == 'enabled'
          - k3s_datastore_preflight_internal_rotation_stage == 'pending'
      changed_when: false
    - name: Bind negative parser fixture input 3
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"reencrypt_request","activekey":"fixture-active-key","enable":true,"hashmatch":false}'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 10
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require reencrypt request to project as pending
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_command_status == 'available'
          - k3s_datastore_preflight_internal_rotation_stage == 'pending'
      changed_when: false
    - name: Bind negative parser fixture input 4
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"start","activekey":"fixture-active-key","enable":true,"hashmatch":false,"hasherror":"fixture-hash-error"}'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 11
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require pending and stable hash mismatch to fail closed
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_rotation_stage == 'unknown'
          - k3s_datastore_preflight_internal_encryption_status == 'enabled'
      changed_when: false
    - name: Bind negative parser fixture input 5
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"start","activekey":"fixture-active-key","enable":true,"hashmatch":true}'
          stderr: 'fixture-stderr'
      changed_when: false
    - name: Run bounded parser fixture 12
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require successful output with stderr to remain unknown
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_command_status == 'unknown'
          - k3s_datastore_preflight_internal_encryption_status == 'unknown'
          - k3s_datastore_preflight_internal_rotation_stage == 'unknown'
      changed_when: false
    - name: Bind negative parser fixture input 6
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 7
          stdout: '{"stage":"start","activekey":"fixture-active-key","enable":true,"hashmatch":true}'
          stderr: 'fixture-stderr'
      changed_when: false
    - name: Run bounded parser fixture 13
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require nonzero encryption command to be unavailable
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_command_status == 'unavailable'
          - k3s_datastore_preflight_internal_encryption_status == 'unavailable'
          - k3s_datastore_preflight_internal_rotation_stage == 'unknown'
      changed_when: false
    - name: Bind negative parser fixture input 7
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{not-json'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 14
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require malformed JSON output to fail closed
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_command_status == 'unknown'
          - k3s_datastore_preflight_internal_encryption_status == 'unknown'
          - k3s_datastore_preflight_internal_rotation_stage == 'unknown'
          - "'fixture-active-key' not in (k3s_datastore_preflight_internal_rotation_stage | string)"
          - "'fixture-hash-error' not in (k3s_datastore_preflight_internal_rotation_stage | string)"
      changed_when: false

    - name: Bind duplicate encryption JSON keys
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"start","stage":"reencrypt_finished","activekey":"fixture-active-key","enable":true,"hashmatch":true}'
          stderr: ''
      changed_when: false
    - name: Run duplicate encryption JSON fixture
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require duplicate encryption keys to fail closed
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_key_counts.stage | int == 2
          - k3s_datastore_preflight_internal_encryption_command_status == 'unknown'
          - k3s_datastore_preflight_internal_rotation_stage == 'unknown'
      changed_when: false

    - name: Bind oversized encryption JSON output
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: "{{ '{\"stage\":\"start\",\"activekey\":\"fixture-active-key\",\"enable\":true,\"hashmatch\":false,\"hasherror\":\"' ~ ('x' * 65536) ~ '\"}' }}"
          stderr: ''
      changed_when: false
    - name: Run oversized encryption JSON fixture
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require oversized encryption JSON to fail closed
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_result.stdout | length > k3s_datastore_preflight_encryption_output_max_bytes
          - k3s_datastore_preflight_internal_encryption_command_status == 'unknown'
          - k3s_datastore_preflight_internal_rotation_stage == 'unknown'
      changed_when: false

    - name: Bind an active re-encryption fixture
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"reencrypt_active","activekey":"fixture-active-key","enable":true}'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 15
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require active re-encryption to remain active
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_command_status == 'available'
          - k3s_datastore_preflight_internal_encryption_status == 'enabled'
          - k3s_datastore_preflight_internal_rotation_stage == 'active'
      changed_when: false

    - name: Bind a disabled encryption fixture
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"start","activekey":"","enable":false,"hashmatch":true}'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 16
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require disabled encryption to be non-applicable
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_encryption_status == 'disabled'
          - k3s_datastore_preflight_internal_rotation_stage == 'not_applicable'
      changed_when: false

    - name: Bind conflicting config and runtime encryption evidence
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 26}
        k3s_datastore_preflight_internal_config_read_allowed: true
        k3s_datastore_preflight_internal_config_content_stable: true
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ 'secrets-encryption: false\n' | b64encode }}"
        k3s_datastore_preflight_internal_encryption_result:
          rc: 0
          stdout: '{"stage":"reencrypt_finished","activekey":"fixture-active-key","enable":true,"hashmatch":true}'
          stderr: ''
      changed_when: false
    - name: Run bounded parser fixture 17
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require config and runtime encryption conflict to fail closed
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_config_encryption_status == 'disabled'
          - k3s_datastore_preflight_internal_encryption_status == 'unknown'
          - k3s_datastore_preflight_internal_rotation_stage == 'unknown'
      changed_when: false

    - name: Bind a quoted selected config key
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0600', size: 33}
        k3s_datastore_preflight_internal_config_content_stable: true
        k3s_datastore_preflight_internal_config_slurp_result:
          failed: false
          skipped: false
          content: "{{ '\"data-dir\": /var/lib/rancher/k3s\n' | b64encode }}"
      changed_when: false
    - name: Run bounded parser fixture 18
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require quoted selected keys to remain unknown
      ansible.builtin.assert:
        that:
          - not (k3s_datastore_preflight_internal_config_parse_valid | bool)
          - k3s_datastore_preflight_internal_data_dir_source == 'unknown'
      changed_when: false

    - name: Bind duplicate ExecStart datastore endpoint options
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state: {stat: {exists: false}}
        k3s_datastore_preflight_internal_config_read_allowed: false
        k3s_datastore_preflight_internal_config_content_stable: false
        k3s_datastore_preflight_internal_exec_start_result:
          rc: 0
          stdout: '{ path=/usr/local/bin/k3s ; argv[]=/usr/local/bin/k3s server --datastore-endpoint=postgres://first --datastore-endpoint=postgres://second ; ignore_errors=no }'
          stdout_lines: ['duplicate datastore endpoint options']
      changed_when: false
    - name: Run bounded parser fixture 19
      ansible.builtin.include_tasks: ../ansible/roles/k3s_datastore_preflight/tasks/parse.yml
    - name: Require duplicate endpoint options to make ExecStart unsafe
      ansible.builtin.assert:
        that:
          - k3s_datastore_preflight_internal_external_arg_count | int == 2
          - k3s_datastore_preflight_internal_exec_start_status == 'unsafe'
          - k3s_datastore_preflight_internal_datastore_type == 'unknown'
      changed_when: false

    - name: Bind unsafe config with an exact data-directory argument
      ansible.builtin.set_fact:
        k3s_datastore_preflight_internal_config_state:
          stat: {exists: true, isreg: true, islnk: false, pw_name: root, gr_name: root, mode: '0644', size: 26}
        k3s_datastore_preflight_internal_config_read_allowed: false
        k3s_datastore_preflight_internal_config_content_stable: false
