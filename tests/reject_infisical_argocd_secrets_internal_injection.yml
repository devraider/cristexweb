---
- name: Prove forged Infisical Argo CD Secret seam internals fail closed
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    infisical_argocd_secrets_bootstrap_internal_manifests: []
  tasks:
    - name: Exercise the production Infisical Argo CD Secret seam role with forged internals
      block:
        - name: Include the production Infisical Argo CD Secret seam role
          ansible.builtin.include_role:
            name: infisical_argocd_secrets_bootstrap
      rescue:
        - name: Verify the unique internal-variable guard rejected the fixture
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Reject externally supplied Infisical Argo CD Secret seam internals'
              - "'INTERNAL_VARIABLE_GUARD' in (ansible_failed_result | ansible.builtin.to_json)"
        - name: Record successful fail-closed fixture behavior
          ansible.builtin.set_fact:
            infisical_argocd_secrets_fixture_guard_rejected: true
    - name: Require the seam role to fail closed at its first task
      ansible.builtin.assert:
        that: infisical_argocd_secrets_fixture_guard_rejected | default(false) | bool
