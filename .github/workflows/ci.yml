name: Infrastructure CI

"on":
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.7"

      - name: Install locked controller dependencies
        run: |
          python -m pip install uv==0.7.2
          uv sync --frozen --all-groups

      - name: Install pinned Ansible collection
        run: |
          uv run ansible-galaxy collection install \
            -r ansible/requirements.yml \
            -p ansible/.ansible/collections

      - name: Prepare portable contract harness
        run: |
          sudo install -d -m 0755 /home/paul /home/paul/projects
          sudo chown "$(id -u):$(id -g)" /home/paul
          install -d -m 0700 /home/paul/.ansible/tmp
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/paul/projects/cristexweb

      - name: Run offline contract tests
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          while IFS='=' read -r name _; do
            case "$name" in
              CLOUDFLARE_*|cloudflare_*|LD_*|DYLD_*|read_hidden_result|cloudflare_token|cloudflare_token_sha256)
                unset "$name"
                ;;
            esac
          done < <(env)
          uv run python -m unittest discover -s tests -v
          uv run python -m compileall -q tests

      - name: Validate Ansible source
        run: |
          cd ansible
          for playbook in playbooks/*.yml; do
            uv run ansible-playbook "$playbook" --syntax-check
          done
          uv run ansible-lint . ../tests/validate_storage_report.yml

      - name: Verify vendored evidence hashes
        run: |
          (cd ansible/files/vendor/argocd/10.3.0 && shasum -a 256 -c SHA256SUMS)
          (cd ansible/files/vendor/infisical-operator/0.11.7 && shasum -a 256 -c SHA256SUMS)
