---
- name: Reject externally supplied shared MongoDB NetworkPolicy internals
  ansible.builtin.assert:
    that:
      - item not in vars
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied shared MongoDB
      NetworkPolicy variable {{ item }}.
  loop:
    - shared_mongodb_networkpolicy_bootstrap_internal_attestation_state
    - shared_mongodb_networkpolicy_bootstrap_internal_source_states
    - shared_mongodb_networkpolicy_bootstrap_internal_manifests
    - shared_mongodb_networkpolicy_bootstrap_internal_identity_keys
    - shared_mongodb_networkpolicy_bootstrap_internal_prestate
    - shared_mongodb_networkpolicy_bootstrap_internal_namespace
    - shared_mongodb_networkpolicy_bootstrap_internal_mongodb
    - shared_mongodb_networkpolicy_bootstrap_internal_statefulset
    - shared_mongodb_networkpolicy_bootstrap_internal_pod
    - shared_mongodb_networkpolicy_bootstrap_internal_client_pods
    - shared_mongodb_networkpolicy_bootstrap_internal_coredns_pods
    - shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies
    - shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state
    - shared_mongodb_networkpolicy_bootstrap_internal_preflight_binding
    - shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_prestate
    - shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_between_prestate
    - shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_poststate
    - shared_mongodb_networkpolicy_bootstrap_internal_poststate
    - shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_poststate
  changed_when: false

- name: Require source-only shared MongoDB NetworkPolicy approval contract
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_ATTESTATION_FILE') | length > 0
      - shared_mongodb_networkpolicy_bootstrap_approved | bool
      - shared_mongodb_networkpolicy_bootstrap_state == 'present'
      - shared_mongodb_networkpolicy_bootstrap_mode in ['check', 'apply']
      - (ansible_check_mode | bool) == (shared_mongodb_networkpolicy_bootstrap_mode == 'check')
      - ansible_diff_mode
      - >-
        (shared_mongodb_networkpolicy_bootstrap_mode == 'check') or
        lookup('ansible.builtin.env', 'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_APPLY_APPROVED') == 'v1'
      - (ansible_limit | default('')) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - shared_mongodb_networkpolicy_bootstrap_manifest_paths | length == 2
      - shared_mongodb_networkpolicy_bootstrap_expected_hashes | length == 2
      - shared_mongodb_networkpolicy_bootstrap_object_count == 2
      - shared_mongodb_networkpolicy_bootstrap_target_names | sort == ['shared-mongodb-networkpolicy-allow', 'shared-mongodb-networkpolicy-default-deny']
      - shared_mongodb_networkpolicy_bootstrap_identity_set_sha256 == '11352b9439d10f2ffdfad385ee31f524885fead8d74d38937101614f742ab575'
      - shared_mongodb_networkpolicy_bootstrap_namespace == 'shared-services'
      - shared_mongodb_networkpolicy_bootstrap_mongodb_cr_name == 'shared-mongodb'
      - shared_mongodb_networkpolicy_bootstrap_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
    fail_msg: Refusing anything outside the source-only two-policy shared MongoDB closure.
  changed_when: false

- name: Inspect protected k3s kubeconfig metadata
  ansible.builtin.stat:
    path: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state
  changed_when: false
  no_log: true

- name: Require protected root-owned k3s-admin kubeconfig
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state.stat.exists | default(false)
      - shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state.stat.isreg | default(false)
      - not (shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state.stat.islnk | default(false))
      - shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state.stat.pw_name == 'root'
      - shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state.stat.gr_name == 'k3s-admin'
      - shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state.stat.mode == '0640'
      - shared_mongodb_networkpolicy_bootstrap_internal_kubeconfig_state.stat.path == '/etc/rancher/k3s/k3s.yaml'
    fail_msg: Refusing shared MongoDB NetworkPolicy check without protected root:k3s-admin mode-0640 kubeconfig.
  changed_when: false
  no_log: true

- name: Inspect private single-run shared MongoDB NetworkPolicy attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: shared_mongodb_networkpolicy_bootstrap_internal_attestation_state
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Require private source-only attestation
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_attestation_state.stat.exists | default(false)
      - shared_mongodb_networkpolicy_bootstrap_internal_attestation_state.stat.isreg | default(false)
      - not (shared_mongodb_networkpolicy_bootstrap_internal_attestation_state.stat.islnk | default(false))
      - shared_mongodb_networkpolicy_bootstrap_internal_attestation_state.stat.pw_name == shared_mongodb_networkpolicy_bootstrap_controller_user
      - shared_mongodb_networkpolicy_bootstrap_internal_attestation_state.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_TOKEN') ~ ':entrypoint'
    fail_msg: Refusing missing, reusable, foreign-owned, symlinked, or invalid source-only attestation.
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Inspect exact shared MongoDB NetworkPolicy source leaves
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_manifest_paths }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_source_states
  delegate_to: localhost
  changed_when: false

- name: Require hash-bound source-only policy leaves
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == shared_mongodb_networkpolicy_bootstrap_controller_user
      - item.stat.mode == '0644'
      - (item.item | realpath) == item.item
      - >-
        item.stat.checksum == (
          shared_mongodb_networkpolicy_bootstrap_expected_hashes |
          selectattr('path', 'equalto', item.item) |
          map(attribute='sha256') | first
        )
      - >-
        item.item.startswith(
          shared_mongodb_networkpolicy_bootstrap_repository_root ~
          '/ansible/files/components/shared-mongodb-networkpolicy/'
        )
    fail_msg: Refusing missing, unsafe, or hash-drifted shared MongoDB NetworkPolicy source.
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_source_states.results }}"
  delegate_to: localhost
  changed_when: false

- name: Load exact source-only shared MongoDB NetworkPolicy objects
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_manifests: >-
      {{ (shared_mongodb_networkpolicy_bootstrap_internal_manifests | default([])) +
      [lookup('ansible.builtin.file', item) | from_yaml] }}
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_manifest_paths }}"
  changed_when: false
  no_log: true

- name: Bind exact source-only policy identities
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_identity_keys: >-
      {{
        (shared_mongodb_networkpolicy_bootstrap_internal_identity_keys | default([])) +
        [item.apiVersion ~ '|' ~ item.kind ~ '|' ~
        (item.metadata.namespace | default('')) ~ '|' ~ item.metadata.name]
      }}
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_manifests }}"
  changed_when: false
  no_log: true

- name: Require exact two-policy inventory and no generated resources
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | length == 2
      - shared_mongodb_networkpolicy_bootstrap_internal_identity_keys | unique | length == 2
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'NetworkPolicy') | list | length == 2
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | selectattr('metadata.namespace', 'equalto', 'shared-services') | list | length == 2
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Secret') | list | length == 0
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Service') | list | length == 0
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'StatefulSet') | list | length == 0
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Deployment') | list | length == 0
      - shared_mongodb_networkpolicy_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'MongoDBCommunity') | list | length == 0
      - >-
        shared_mongodb_networkpolicy_bootstrap_internal_manifests |
        map(attribute='metadata.name') | list | sort ==
        ['shared-mongodb-networkpolicy-allow',
        'shared-mongodb-networkpolicy-default-deny']
    fail_msg: Refusing source outside the exact two NetworkPolicy closure.
  changed_when: false

- name: Capture host service health without mutation
  ansible.builtin.service_facts:
  register: shared_mongodb_networkpolicy_bootstrap_internal_services
  check_mode: false
  changed_when: false

- name: Require k3s and Tailscale health
  ansible.builtin.assert:
    that:
      - >-
        (shared_mongodb_networkpolicy_bootstrap_internal_services.ansible_facts.services |
        default({})).get('k3s.service', {}).get('state', '') == 'running'
      - >-
        (shared_mongodb_networkpolicy_bootstrap_internal_services.ansible_facts.services |
        default({})).get('tailscaled.service', {}).get('state', '') == 'running'
    fail_msg: Refusing shared MongoDB NetworkPolicy check while host service health is not proven.
  changed_when: false

- name: Query established shared-services Namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: shared-services
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_namespace
  changed_when: false

- name: Require exact shared-services Namespace prerequisite
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_namespace.resources | length == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_namespace.resources[0].status.phase == 'Active'
      - shared_mongodb_networkpolicy_bootstrap_internal_namespace.resources[0].metadata.labels.get('kubernetes.io/metadata.name') == 'shared-services'
    fail_msg: Refusing shared MongoDB NetworkPolicy check without the established shared-services Namespace.
  changed_when: false

- name: Query live operator-managed MongoDB custom resource
  kubernetes.core.k8s_info:
    api_version: mongodbcommunity.mongodb.com/v1
    kind: MongoDBCommunity
    namespace: shared-services
    name: shared-mongodb
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_mongodb
  changed_when: false
  no_log: true

- name: Require live operator-managed MongoDB contract
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources | length == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources[0].spec.version == '8.0.12'
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources[0].spec.members | int == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources[0].spec.type == 'ReplicaSet'
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources[0].status.phase == 'Running'
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources[0].status.version == '8.0.12'
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources[0].status.currentMongoDBMembers | int == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources[0].status.currentStatefulSetReplicas | int == 1
    fail_msg: Refusing NetworkPolicy check without the exact healthy operator-managed shared MongoDB resource.
  changed_when: false
  no_log: true

- name: Query the exact live MongoDB StatefulSet
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: shared-services
    name: shared-mongodb
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_statefulset
  changed_when: false
  no_log: true

- name: Require exact ready operator-managed MongoDB StatefulSet
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources | length == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].metadata.uid | length > 0
      - shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].spec.replicas | int == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].status.currentReplicas | int == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].status.readyReplicas | int == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].spec.template.metadata.labels['app'] == 'shared-mongodb-svc'
      - >-
        shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].spec.template.metadata.labels[
        'app.kubernetes.io/part-of'] == 'shared-databases'
      - shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].spec.template.metadata.labels['cristex.io/component'] == 'mongodb'
    fail_msg: Refusing NetworkPolicy check without the exact ready shared-mongodb StatefulSet.
  changed_when: false
  no_log: true

- name: Query the exact live MongoDB pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: shared-services
    name: shared-mongodb-0
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_pod
  changed_when: false
  no_log: true

- name: Require exact ready nonterminating MongoDB pod ownership and labels
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources | length == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.name == 'shared-mongodb-0'
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.labels['app'] == 'shared-mongodb-svc'
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases'
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.labels['cristex.io/component'] == 'mongodb'
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].status.phase == 'Running'
      - (shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.deletionTimestamp | default('')) == ''
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences | length == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].apiVersion == 'apps/v1'
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].kind == 'StatefulSet'
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].name == 'shared-mongodb'
      - >-
        shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].uid ==
        shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].metadata.uid
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].controller | bool
      - >-
        shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].status.conditions |
        selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') |
        list | length == 1
      - shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].spec.hostNetwork | default(false) | bool == false
    fail_msg: Refusing NetworkPolicy check without exactly shared-mongodb-0 Running/Ready StatefulSet-owned pod.
  changed_when: false
  no_log: true

- name: Query exact DEV/PROD backend and Celery client pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ item }}"
    label_selectors:
      - app.kubernetes.io/part-of=cristexhub
      - app.kubernetes.io/name in (backend,celery-worker)
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  loop:
    - cristexhub-dev
    - cristexhub-prod
  register: shared_mongodb_networkpolicy_bootstrap_internal_client_pods
  changed_when: false
  no_log: true

- name: Require exact DEV/PROD backend and Celery client inventory
  ansible.builtin.assert:
    that:
      - item.item in ['cristexhub-dev', 'cristexhub-prod']
      - item.resources | length == 2
      - >-
        item.resources | map(attribute='metadata.labels') | map('dict2items') | flatten |
        selectattr('key', 'equalto', 'app.kubernetes.io/name') | map(attribute='value') |
        list | sort == ['backend', 'celery-worker']
    fail_msg: Refusing NetworkPolicy check without exact backend/Celery clients in both environments.
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_client_pods.results }}"
  changed_when: false
  no_log: true

- name: Require exact DEV/PROD client labels
  ansible.builtin.assert:
    that:
      - item.metadata.labels['app.kubernetes.io/name'] in ['backend', 'celery-worker']
      - item.metadata.labels['app.kubernetes.io/part-of'] == 'cristexhub'
    fail_msg: Refusing NetworkPolicy check with a client pod outside the exact selector.
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_client_pods.results | map(attribute='resources') | flatten }}"
  changed_when: false
  no_log: true

- name: Require ready nonterminating non-host-network DEV/PROD client pods
  ansible.builtin.assert:
    that:
      - item.status.phase == 'Running'
      - (item.metadata.deletionTimestamp | default('')) == ''
      - (item.spec.hostNetwork | default(false) | bool) == false
      - item.status.conditions | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length == 1
    fail_msg: Refusing NetworkPolicy check without exact ready backend/Celery client pod state.
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_client_pods.results | map(attribute='resources') | flatten }}"
  changed_when: false
  no_log: true

- name: Query live CoreDNS selector closure
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: kube-system
    label_selectors:
      - k8s-app=kube-dns
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_coredns_pods
  changed_when: false
  no_log: true

- name: Require at least one CoreDNS pod matching the policy selector
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_coredns_pods.resources | length >= 1
    fail_msg: Refusing NetworkPolicy check without CoreDNS matching k8s-app=kube-dns.
  changed_when: false
  no_log: true

- name: Require exact CoreDNS labels
  ansible.builtin.assert:
    that:
      - item.metadata.labels['k8s-app'] == 'kube-dns'
    fail_msg: Refusing NetworkPolicy check with a pod outside the CoreDNS selector.
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_coredns_pods.resources }}"
  changed_when: false
  no_log: true

- name: Require ready nonterminating non-host-network CoreDNS pods
  ansible.builtin.assert:
    that:
      - item.status.phase == 'Running'
      - (item.metadata.deletionTimestamp | default('')) == ''
      - (item.spec.hostNetwork | default(false) | bool) == false
      - item.status.conditions | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length == 1
    fail_msg: Refusing NetworkPolicy check without ready CoreDNS pod state.
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_coredns_pods.resources }}"
  changed_when: false
  no_log: true

- name: Enumerate every shared-services NetworkPolicy
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: shared-services
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies
  changed_when: false
  no_log: true

- name: Query exact target NetworkPolicy pre-state
  kubernetes.core.k8s_info:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_manifests }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_prestate
  changed_when: false
  no_log: true

- name: Refuse foreign or terminating existing target NetworkPolicies
  ansible.builtin.assert:
    that:
      - item.resources | length in [0, 1]
      - item.resources | length == 0 or item.resources[0].metadata.labels.get('app.kubernetes.io/managed-by') == 'ansible'
      - item.resources | length == 0 or item.resources[0].metadata.labels.get('cristex.io/component') == 'shared-mongodb-networkpolicy'
      - >-
        item.resources | length == 0 or
        (
        item.resources[0].metadata.uid | default('') | length > 0 and
        item.resources[0].metadata.resourceVersion | default('') | length > 0 and
        'deletionTimestamp' not in item.resources[0].metadata and
        'deletionGracePeriodSeconds' not in item.resources[0].metadata and
        'deletionGracePeriod' not in item.resources[0].metadata and
        'finalizers' not in item.resources[0].metadata and
        'ownerReferences' not in item.resources[0].metadata
        )
    fail_msg: Refusing a foreign, terminating, or replacement shared MongoDB NetworkPolicy target.
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_prestate.results }}"
  changed_when: false

- name: Bind exact existing NetworkPolicy UID and resourceVersion ledger
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_prestate: >-
      {{ (shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_prestate | default([])) +
      ([{
        'name': item.resources[0].metadata.name,
        'uid': item.resources[0].metadata.uid,
        'resource_version': item.resources[0].metadata.resourceVersion
      }] if item.resources | length == 1 else []) }}
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_prestate.results }}"
  changed_when: false
  no_log: true

- name: Bind source-only shared MongoDB NetworkPolicy preflight
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_preflight_binding:
      attestation_sha256: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_SHARED_MONGODB_NETWORKPOLICY_TOKEN') | hash('sha256') }}"
      object_count: 2
      identity_set_sha256: "{{ shared_mongodb_networkpolicy_bootstrap_internal_identity_keys | sort | join('\n') | hash('sha256') }}"
      prestate_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_prestate.results | map(attribute='resources') | map('length') | sum }}"
      initial_prestate_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_prestate.results | map(attribute='resources') | map('length') | sum }}"
      networkpolicy_prestate: "{{ shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_prestate | default([]) | sort(attribute='name') }}"
      transition_phase: initial
      mongodb_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_mongodb.resources | length }}"
      statefulset_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources | length }}"
      statefulset_uid: "{{ shared_mongodb_networkpolicy_bootstrap_internal_statefulset.resources[0].metadata.uid }}"
      pod_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources | length }}"
      pod_name: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.name }}"
      pod_phase: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].status.phase }}"
      pod_ready: >-
        {{ (shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].status.conditions |
        selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') |
        list | length) == 1 }}
      pod_terminating: "{{ (shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.deletionTimestamp | default('')) != '' }}"
      pod_owner_api_version: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].apiVersion }}"
      pod_owner_kind: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].kind }}"
      pod_owner_name: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].name }}"
      pod_owner_uid: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].uid }}"
      pod_owner_controller: "{{ shared_mongodb_networkpolicy_bootstrap_internal_pod.resources[0].metadata.ownerReferences[0].controller | bool }}"
      networkpolicy_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies.resources | length }}"
      networkpolicy_names: "{{ shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies.resources | map(attribute='metadata.name') | list | sort }}"
      client_environment_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_client_pods.results | length }}"
      coredns_count: "{{ shared_mongodb_networkpolicy_bootstrap_internal_coredns_pods.resources | length }}"
      kubeconfig_contract: true
      namespace_contract: true
      no_delete_path: true
  changed_when: false
  no_log: true

- name: Reconcile the exact default-deny policy before any allow policy
  shared_mongodb_networkpolicy_guarded_k8s:
    state: present
    definition: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_manifests |
      selectattr('metadata.name', 'equalto', 'shared-mongodb-networkpolicy-default-deny') |
      first }}
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
    wait: false
    wait_timeout: 60
    prestate_binding: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_prestate |
      selectattr('name', 'equalto', 'shared-mongodb-networkpolicy-default-deny') |
      list | first | default({}, true) }}
    validation_only: false
  register: shared_mongodb_networkpolicy_bootstrap_internal_default_deny_mutation
  no_log: true

- name: Refresh the full NetworkPolicy inventory after deny-first step
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: shared-services
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_between
  changed_when: false

- name: Query exact target prestates after deny-first step
  kubernetes.core.k8s_info:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_manifests }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_between_prestate
  changed_when: false
  no_log: true

- name: Bind the deny-first transition prestate and inventory
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_between_prestate: >-
      {{ (shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_between_prestate | default([])) +
      ([{
        'name': item.resources[0].metadata.name,
        'uid': item.resources[0].metadata.uid,
        'resource_version': item.resources[0].metadata.resourceVersion
      }] if item.resources | length == 1 else []) }}
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_between_prestate.results }}"
  changed_when: false
  no_log: true

- name: Bind the exact deny-first state for the second CAS step
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies: "{{ shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_between }}"
    shared_mongodb_networkpolicy_bootstrap_internal_preflight_binding: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_preflight_binding | combine({'prestate_count':
      shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_between_prestate | length,
      'networkpolicy_prestate': shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_between_prestate |
      sort(attribute='name'),
      'networkpolicy_count': shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_between.resources |
      length,
      'networkpolicy_names': shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_between.resources |
      map(attribute='metadata.name') | list | sort,
      'transition_phase': 'after-default-deny'}) }}
  changed_when: false
  no_log: true

- name: Reconcile the exact allow policy only after deny-first state is bound
  shared_mongodb_networkpolicy_guarded_k8s:
    state: present
    definition: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_manifests |
      selectattr('metadata.name', 'equalto', 'shared-mongodb-networkpolicy-allow') |
      first }}
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
    wait: false
    wait_timeout: 60
    prestate_binding: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_between_prestate |
      selectattr('name', 'equalto', 'shared-mongodb-networkpolicy-allow') |
      list | first | default({}, true) }}
    validation_only: false
  register: shared_mongodb_networkpolicy_bootstrap_internal_allow_mutation
  no_log: true

- name: Bind the exact sequential NetworkPolicy mutation result list
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_check:
      results:
        - "{{ shared_mongodb_networkpolicy_bootstrap_internal_default_deny_mutation }}"
        - "{{ shared_mongodb_networkpolicy_bootstrap_internal_allow_mutation }}"
  changed_when: false
  no_log: true

- name: Require exact deny-first mutation count and order
  ansible.builtin.assert:
    that:
      - shared_mongodb_networkpolicy_bootstrap_internal_check.results | length == 2
      - >-
        shared_mongodb_networkpolicy_bootstrap_internal_check.results[0].identity |
        default('') ==
        'networking.k8s.io/v1|NetworkPolicy|shared-services|shared-mongodb-networkpolicy-default-deny'
      - >-
        shared_mongodb_networkpolicy_bootstrap_internal_check.results[1].identity |
        default('') ==
        'networking.k8s.io/v1|NetworkPolicy|shared-services|shared-mongodb-networkpolicy-allow'
      - >-
        (shared_mongodb_networkpolicy_bootstrap_internal_check.results |
        selectattr('changed', 'equalto', true) | list | length) ==
        (2 - (shared_mongodb_networkpolicy_bootstrap_internal_preflight_binding.initial_prestate_count | int))
    fail_msg: Refusing an unexpected deny-first NetworkPolicy mutation sequence.
  changed_when: false
  no_log: true

- name: Enumerate every NetworkPolicy after the complete closure mutation
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: shared-services
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_poststate
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Query exact target NetworkPolicy poststate
  kubernetes.core.k8s_info:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_manifests }}"
  register: shared_mongodb_networkpolicy_bootstrap_internal_poststate
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Bind the complete poststate UID/resourceVersion ledger
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_poststate: >-
      {{ (shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_poststate | default([])) +
      ([{
        'name': item.resources[0].metadata.name,
        'uid': item.resources[0].metadata.uid,
        'resource_version': item.resources[0].metadata.resourceVersion
      }] if item.resources | length == 1 else []) }}
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_poststate.results | default([]) }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Bind the fresh poststate inventory to the guarded validator
  ansible.builtin.set_fact:
    shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies: "{{ shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_poststate }}"
    shared_mongodb_networkpolicy_bootstrap_internal_preflight_binding: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_preflight_binding | combine({'prestate_count':
      shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_poststate | length,
      'networkpolicy_prestate': shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_poststate |
      sort(attribute='name'),
      'networkpolicy_count': shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_poststate.resources |
      length,
      'networkpolicy_names': shared_mongodb_networkpolicy_bootstrap_internal_all_networkpolicies_poststate.resources |
      map(attribute='metadata.name') | list | sort,
      'transition_phase': 'post'}) }}
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require exact target NetworkPolicy poststate and preserved identities
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].apiVersion == item.item.apiVersion
      - item.resources[0].kind == item.item.kind
      - item.resources[0].metadata.namespace == item.item.metadata.namespace
      - item.resources[0].metadata.name == item.item.metadata.name
      - >-
        item.resources[0].metadata.labels ==
        (shared_mongodb_networkpolicy_bootstrap_internal_manifests |
        selectattr('metadata.name', 'equalto', item.item.metadata.name) |
        map(attribute='metadata.labels') | first)
      - >-
        item.resources[0].spec ==
        (shared_mongodb_networkpolicy_bootstrap_internal_manifests |
        selectattr('metadata.name', 'equalto', item.item.metadata.name) |
        map(attribute='spec') | first)
      - item.resources[0].metadata.uid | default('') | length > 0
      - item.resources[0].metadata.resourceVersion is match('^[0-9]+$')
      - >-
        (shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_prestate |
        selectattr('name', 'equalto', item.item.metadata.name) | list | length == 0) or
        item.resources[0].metadata.uid ==
        (shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_prestate |
        selectattr('name', 'equalto', item.item.metadata.name) | map(attribute='uid') | first)
      - >-
        'deletionTimestamp' not in item.resources[0].metadata
      - >-
        'deletionGracePeriodSeconds' not in item.resources[0].metadata
      - >-
        'deletionGracePeriod' not in item.resources[0].metadata
      - >-
        'finalizers' not in item.resources[0].metadata
      - >-
        'ownerReferences' not in item.resources[0].metadata
      - >-
        (item.resources[0].metadata.annotations | default({}) | length) == 0
      - >-
        (item.resources[0].metadata.keys() | list |
        difference(['name', 'namespace', 'uid', 'resourceVersion', 'generation',
        'creationTimestamp', 'managedFields', 'labels', 'annotations']) | length) == 0
  loop: "{{ shared_mongodb_networkpolicy_bootstrap_internal_poststate.results | default([]) }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Validate exact namespace-wide NetworkPolicy closure after mutation
  shared_mongodb_networkpolicy_guarded_k8s:
    state: present
    definition: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_manifests |
      selectattr('metadata.name', 'equalto', 'shared-mongodb-networkpolicy-default-deny') |
      first }}
    kubeconfig: "{{ shared_mongodb_networkpolicy_bootstrap_kubeconfig }}"
    wait: false
    wait_timeout: 60
    prestate_binding: >-
      {{ shared_mongodb_networkpolicy_bootstrap_internal_networkpolicy_poststate |
      selectattr('name', 'equalto', 'shared-mongodb-networkpolicy-default-deny') |
      list | first | default({}, true) }}
    validation_only: true
  register: shared_mongodb_networkpolicy_bootstrap_internal_poststate_validation
  no_log: true
  when: not ansible_check_mode
