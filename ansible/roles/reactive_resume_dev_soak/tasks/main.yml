---
- name: Reject externally supplied Reactive Resume DEV soak internals
  ansible.builtin.assert:
    that:
      - >-
        (vars.keys() | select('match', '^reactive_resume_dev_soak_internal_') |
        list | length) == 0
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied Reactive Resume DEV
      soak state.
  changed_when: false

- name: Require the exact source-only Reactive Resume DEV soak invocation
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_approved | bool
      - ansible_check_mode
      - ansible_diff_mode
      - (ansible_limit | default('') | string) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - inventory_hostname == 'crtxweb'
      - reactive_resume_dev_soak_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - reactive_resume_dev_soak_namespace == 'cristexhub-dev'
      - reactive_resume_dev_soak_prod_namespace == 'cristexhub-prod'
      - reactive_resume_dev_soak_hostname == 'resume-dev.cristex-soft.com'
      - reactive_resume_dev_soak_url == 'https://resume-dev.cristex-soft.com/'
      - reactive_resume_dev_soak_health_url == 'https://resume-dev.cristex-soft.com/api/health'
      - reactive_resume_dev_soak_oidc_discovery_url == 'https://auth.cristex-soft.com/realms/cristexhub/.well-known/openid-configuration'
      - reactive_resume_dev_soak_oidc_issuer == 'https://auth.cristex-soft.com/realms/cristexhub'
      - reactive_resume_dev_soak_oidc_jwks_url == 'https://auth.cristex-soft.com/realms/cristexhub/protocol/openid-connect/certs'
      - reactive_resume_dev_soak_deployment == 'reactive-resume-dev'
      - reactive_resume_dev_soak_service == 'reactive-resume-dev'
      - reactive_resume_dev_soak_ingress == 'reactive-resume-dev-private'
      - reactive_resume_dev_soak_network_policy == 'reactive-resume-dev-route-allow-traefik'
      - reactive_resume_dev_soak_app_label_selector == 'app.kubernetes.io/name=reactive-resume-dev'
      - reactive_resume_dev_soak_tls_secret == 'reactive-resume-dev-tls'
      - reactive_resume_dev_soak_backup_timer == 'cristexweb-reactive-resume-dev-backup.timer'
      - reactive_resume_dev_soak_prod_label_selector == 'app.kubernetes.io/part-of=reactive-resume'
      - reactive_resume_dev_soak_duration_seconds == 900
      - reactive_resume_dev_soak_interval_seconds == 60
      - reactive_resume_dev_soak_sample_count == 16
      - reactive_resume_dev_soak_sample_count == (reactive_resume_dev_soak_duration_seconds // reactive_resume_dev_soak_interval_seconds) + 1
      - reactive_resume_dev_soak_receipt_format == 'sanitized-v1'
      - >-
        reactive_resume_dev_soak_prod_queries == [
          {'api_version': 'v1', 'kind': 'Secret'},
          {'api_version': 'v1', 'kind': 'Pod'},
          {'api_version': 'apps/v1', 'kind': 'Deployment'},
          {'api_version': 'apps/v1', 'kind': 'StatefulSet'},
          {'api_version': 'apps/v1', 'kind': 'DaemonSet'},
          {'api_version': 'apps/v1', 'kind': 'ReplicaSet'},
          {'api_version': 'batch/v1', 'kind': 'Job'},
          {'api_version': 'batch/v1', 'kind': 'CronJob'},
          {'api_version': 'v1', 'kind': 'Service'},
          {'api_version': 'discovery.k8s.io/v1', 'kind': 'EndpointSlice'},
          {'api_version': 'networking.k8s.io/v1', 'kind': 'Ingress'},
          {'api_version': 'networking.k8s.io/v1', 'kind': 'NetworkPolicy'},
          {'api_version': 'v1', 'kind': 'PersistentVolumeClaim'},
          {'api_version': 'secrets.infisical.com/v1beta1', 'kind': 'InfisicalStaticSecret'}
        ]
      - >-
        reactive_resume_dev_soak_prod_inventory_queries == [
          {'api_version': 'v1', 'kind': 'ConfigMap'},
          {'api_version': 'v1', 'kind': 'Secret'},
          {'api_version': 'v1', 'kind': 'ServiceAccount'},
          {'api_version': 'v1', 'kind': 'Pod'},
          {'api_version': 'apps/v1', 'kind': 'Deployment'},
          {'api_version': 'apps/v1', 'kind': 'StatefulSet'},
          {'api_version': 'apps/v1', 'kind': 'DaemonSet'},
          {'api_version': 'apps/v1', 'kind': 'ReplicaSet'},
          {'api_version': 'batch/v1', 'kind': 'Job'},
          {'api_version': 'batch/v1', 'kind': 'CronJob'},
          {'api_version': 'v1', 'kind': 'Service'},
          {'api_version': 'discovery.k8s.io/v1', 'kind': 'EndpointSlice'},
          {'api_version': 'networking.k8s.io/v1', 'kind': 'Ingress'},
          {'api_version': 'networking.k8s.io/v1', 'kind': 'NetworkPolicy'},
          {'api_version': 'rbac.authorization.k8s.io/v1', 'kind': 'Role'},
          {'api_version': 'rbac.authorization.k8s.io/v1', 'kind': 'RoleBinding'},
          {'api_version': 'v1', 'kind': 'PersistentVolumeClaim'},
          {'api_version': 'secrets.infisical.com/v1beta1', 'kind': 'InfisicalAuth'},
          {'api_version': 'secrets.infisical.com/v1beta1', 'kind': 'InfisicalConnection'},
          {'api_version': 'secrets.infisical.com/v1beta1', 'kind': 'InfisicalStaticSecret'}
        ]
      - >-
        reactive_resume_dev_soak_argocd_queries == [
          {'api_version': 'argoproj.io/v1alpha1', 'kind': 'Application'},
          {'api_version': 'argoproj.io/v1alpha1', 'kind': 'ApplicationSet'}
        ]
      - >-
        reactive_resume_dev_soak_shared_queries == [
          {'api_version': 'v1', 'kind': 'ConfigMap'},
          {'api_version': 'v1', 'kind': 'Secret'},
          {'api_version': 'v1', 'kind': 'ServiceAccount'},
          {'api_version': 'v1', 'kind': 'Pod'},
          {'api_version': 'apps/v1', 'kind': 'Deployment'},
          {'api_version': 'apps/v1', 'kind': 'StatefulSet'},
          {'api_version': 'apps/v1', 'kind': 'DaemonSet'},
          {'api_version': 'apps/v1', 'kind': 'ReplicaSet'},
          {'api_version': 'batch/v1', 'kind': 'Job'},
          {'api_version': 'batch/v1', 'kind': 'CronJob'},
          {'api_version': 'v1', 'kind': 'Service'},
          {'api_version': 'discovery.k8s.io/v1', 'kind': 'EndpointSlice'},
          {'api_version': 'networking.k8s.io/v1', 'kind': 'Ingress'},
          {'api_version': 'networking.k8s.io/v1', 'kind': 'NetworkPolicy'},
          {'api_version': 'v1', 'kind': 'PersistentVolumeClaim'},
          {'api_version': 'rbac.authorization.k8s.io/v1', 'kind': 'Role'},
          {'api_version': 'rbac.authorization.k8s.io/v1', 'kind': 'RoleBinding'},
          {'api_version': 'postgresql.cnpg.io/v1', 'kind': 'Cluster'},
          {'api_version': 'postgresql.cnpg.io/v1', 'kind': 'Database'},
          {'api_version': 'postgresql.cnpg.io/v1', 'kind': 'DatabaseRole'},
          {'api_version': 'secrets.infisical.com/v1beta1', 'kind': 'InfisicalAuth'},
          {'api_version': 'secrets.infisical.com/v1beta1', 'kind': 'InfisicalConnection'},
          {'api_version': 'secrets.infisical.com/v1beta1', 'kind': 'InfisicalStaticSecret'}
        ]
      - reactive_resume_dev_soak_rr_name_pattern == 'reactive[-_]resume'
    fail_msg: >-
      The soak is a fixed 15-minute, 16-sample, check-only closure for the
      selected private DEV hostname and shared cristexhub realm.
  changed_when: false

- name: Require the canonical guarded soak wrapper
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_SOAK_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_SOAK_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_SOAK_ATTESTATION_FILE') | length > 0
      - reactive_resume_dev_soak_controller_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - reactive_resume_dev_soak_controller_user == lookup('ansible.builtin.env', 'USER')
    fail_msg: >-
      ENTRYPOINT_GUARD: use only the canonical non-passthrough soak wrapper.
  changed_when: false

- name: Inspect the ephemeral soak attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_SOAK_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: reactive_resume_dev_soak_internal_attestation_state
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the private single-run soak attestation
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_attestation_state.stat.isreg | default(false)
      - not (reactive_resume_dev_soak_internal_attestation_state.stat.islnk | default(false))
      - reactive_resume_dev_soak_internal_attestation_state.stat.pw_name == reactive_resume_dev_soak_controller_user
      - reactive_resume_dev_soak_internal_attestation_state.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file',
          lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_SOAK_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_SOAK_TOKEN') ~ ':entrypoint'
    fail_msg: >-
      ENTRYPOINT_GUARD: refusing a missing, reusable, foreign-owned, symlinked,
      or invalid soak attestation.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Record the soak start epoch without mutation
  ansible.builtin.command:
    argv:
      - date
      - +%s
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: reactive_resume_dev_soak_internal_start_time
  no_log: true

- name: Require a valid soak start epoch
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_start_time.rc == 0
      - reactive_resume_dev_soak_internal_start_time.stdout is match('^[0-9]+$')
  changed_when: false
  no_log: true

- name: Require the existing DEV and PROD namespaces without adoption
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  loop:
    - "{{ reactive_resume_dev_soak_namespace }}"
    - "{{ reactive_resume_dev_soak_prod_namespace }}"
  register: reactive_resume_dev_soak_internal_namespaces
  check_mode: false
  changed_when: false
  no_log: true

- name: Require exact existing namespace phases
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].status.phase == 'Active'
  loop: "{{ reactive_resume_dev_soak_internal_namespaces.results }}"
  loop_control:
    label: fixed-namespace
  changed_when: false
  no_log: true

- name: Run the fixed periodic private DEV acceptance samples
  ansible.builtin.include_tasks: sample.yml
  loop: "{{ range(0, reactive_resume_dev_soak_sample_count) | list }}"
  loop_control:
    loop_var: reactive_resume_dev_soak_sample_index
    label: "sample-{{ reactive_resume_dev_soak_sample_index }}"

- name: Record the soak end epoch without mutation
  ansible.builtin.command:
    argv:
      - date
      - +%s
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: reactive_resume_dev_soak_internal_end_time
  no_log: true

- name: Require a valid soak end epoch and measure elapsed duration
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_end_time.rc == 0
      - reactive_resume_dev_soak_internal_end_time.stdout is match('^[0-9]+$')
      - reactive_resume_dev_soak_internal_end_time.stdout | int >= reactive_resume_dev_soak_internal_start_time.stdout | int
  changed_when: false
  no_log: true

- name: Record measured soak duration
  ansible.builtin.set_fact:
    reactive_resume_dev_soak_internal_elapsed_seconds: >-
      {{ reactive_resume_dev_soak_internal_end_time.stdout | int - reactive_resume_dev_soak_internal_start_time.stdout | int }}
  changed_when: false
  no_log: true

- name: Require every soak sample to pass
  ansible.builtin.assert:
    that:
      - (reactive_resume_dev_soak_internal_samples | default([])) | length == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples | map(attribute='sample') | list) ==
        (range(0, reactive_resume_dev_soak_sample_count) | list)
      - reactive_resume_dev_soak_internal_elapsed_seconds >= reactive_resume_dev_soak_duration_seconds
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('hostname_root_http', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('hostname_tls_http', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('oidc_issuer', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('oidc_jwks', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('app_ready', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('backup_timer_active_enabled', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('prod_reactive_resume_markers_absent', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
      - >-
        (reactive_resume_dev_soak_internal_samples |
        selectattr('exposure_pass', 'equalto', true) | list | length) == reactive_resume_dev_soak_sample_count
    fail_msg: >-
      Every fixed soak sample must pass the private root/health probes, shared-realm
      OIDC discovery/JWKS, app readiness, exact timer state, API-wide exposure closure,
      and scoped zero-RR-PROD inventory check; elapsed time must meet the fixed window.
  changed_when: false
  no_log: true

- name: Emit the sanitized Reactive Resume DEV soak receipt
  ansible.builtin.debug:
    msg:
      soak_receipt: reactive-resume-dev-soak
      receipt_format: "{{ reactive_resume_dev_soak_receipt_format }}"
      result: pass
      hostname: "{{ reactive_resume_dev_soak_hostname }}"
      duration_seconds: "{{ reactive_resume_dev_soak_duration_seconds }}"
      measured_elapsed_seconds: "{{ reactive_resume_dev_soak_internal_elapsed_seconds }}"
      interval_seconds: "{{ reactive_resume_dev_soak_interval_seconds }}"
      samples: "{{ reactive_resume_dev_soak_sample_count }}"
      checks:
        hostname_root_http: pass
        hostname_tls_http: pass
        oidc_issuer: pass
        oidc_jwks: pass
        app_ready: pass
        backup_timer_active_enabled: pass
        exposure_pass: pass
        prod_reactive_resume_markers_absent: pass
      exposure_pass: true
      scope_note: checked_exact_rr_markers_only_not_universal_prod_absence
      values_output: false
  changed_when: false
