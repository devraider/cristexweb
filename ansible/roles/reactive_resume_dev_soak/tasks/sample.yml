---
- name: Wait between private hostname soak samples
  ansible.builtin.pause:
    seconds: "{{ reactive_resume_dev_soak_interval_seconds }}"
  when: reactive_resume_dev_soak_sample_index | int > 0
  check_mode: false
  changed_when: false

- name: Probe the private hostname root over browser-trusted TLS
  ansible.builtin.uri:
    url: "{{ reactive_resume_dev_soak_url }}"
    method: GET
    status_code: [200]
    timeout: 30
    validate_certs: true
    return_content: false
  delegate_to: localhost
  become: false
  register: reactive_resume_dev_soak_internal_root
  check_mode: false
  changed_when: false
  no_log: true

- name: Require the private hostname root response
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_root.status == 200
    fail_msg: The private hostname root must return HTTP 200 over validated TLS.
  changed_when: false
  no_log: true

- name: Probe the private hostname health over browser-trusted TLS
  ansible.builtin.uri:
    url: "{{ reactive_resume_dev_soak_health_url }}"
    method: GET
    headers:
      Accept: application/json
    status_code: [200]
    timeout: 30
    validate_certs: true
    return_content: true
  delegate_to: localhost
  become: false
  register: reactive_resume_dev_soak_internal_health
  check_mode: false
  changed_when: false
  no_log: true

- name: Parse the private health response without output
  ansible.builtin.set_fact:
    reactive_resume_dev_soak_internal_health_payload: "{{ reactive_resume_dev_soak_internal_health.content | from_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require healthy private hostname response
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_health.status == 200
      - reactive_resume_dev_soak_internal_health_payload.status == 'healthy'
    fail_msg: >-
      The private hostname must return HTTP 200 with the exact healthy application
      status over validated TLS.
  changed_when: false
  no_log: true

- name: Probe the shared CristexHub OIDC discovery document
  ansible.builtin.uri:
    url: "{{ reactive_resume_dev_soak_oidc_discovery_url }}"
    method: GET
    headers:
      Accept: application/json
    status_code: [200]
    timeout: 30
    validate_certs: true
    return_content: true
  delegate_to: localhost
  become: false
  register: reactive_resume_dev_soak_internal_oidc
  check_mode: false
  changed_when: false
  no_log: true

- name: Parse the OIDC discovery response without output
  ansible.builtin.set_fact:
    reactive_resume_dev_soak_internal_oidc_payload: "{{ reactive_resume_dev_soak_internal_oidc.content | from_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the shared CristexHub OIDC issuer
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_oidc.status == 200
      - reactive_resume_dev_soak_internal_oidc_payload.issuer == reactive_resume_dev_soak_oidc_issuer
      - reactive_resume_dev_soak_internal_oidc_payload.jwks_uri == reactive_resume_dev_soak_oidc_jwks_url
    fail_msg: >-
      Reactive Resume must resolve OIDC discovery to the retained shared
      cristexhub realm and its exact JWKS endpoint, not the retired successor realm.
  changed_when: false
  no_log: true

- name: Fetch the shared CristexHub JWKS endpoint
  ansible.builtin.uri:
    url: "{{ reactive_resume_dev_soak_oidc_jwks_url }}"
    method: GET
    headers:
      Accept: application/json
    status_code: [200]
    timeout: 30
    validate_certs: true
    return_content: true
  delegate_to: localhost
  become: false
  register: reactive_resume_dev_soak_internal_jwks
  check_mode: false
  changed_when: false
  no_log: true

- name: Parse the JWKS response without output
  ansible.builtin.set_fact:
    reactive_resume_dev_soak_internal_jwks_payload: "{{ reactive_resume_dev_soak_internal_jwks.content | from_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require reachable non-empty shared-realm JWKS
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_jwks.status == 200
      - reactive_resume_dev_soak_internal_jwks_payload['keys'] is defined
      - reactive_resume_dev_soak_internal_jwks_payload['keys'] | length > 0
      - >-
        (reactive_resume_dev_soak_internal_jwks_payload['keys'] |
        selectattr('kid', 'defined') | list | length) == reactive_resume_dev_soak_internal_jwks_payload['keys'] | length
      - >-
        (reactive_resume_dev_soak_internal_jwks_payload['keys'] |
        selectattr('kty', 'defined') | list | length) == reactive_resume_dev_soak_internal_jwks_payload['keys'] | length
    fail_msg: The shared CristexHub JWKS endpoint must be reachable and contain keyed JSON Web Keys.
  changed_when: false
  no_log: true

- name: Check the exact backup timer active state without mutation
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - cristexweb-reactive-resume-dev-backup.timer
  check_mode: false
  changed_when: false
  failed_when: false
  register: reactive_resume_dev_soak_internal_timer_active
  no_log: true

- name: Check the exact backup timer enabled state without mutation
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - --quiet
      - cristexweb-reactive-resume-dev-backup.timer
  check_mode: false
  changed_when: false
  failed_when: false
  register: reactive_resume_dev_soak_internal_timer_enabled
  no_log: true

- name: Require exact active and enabled backup timer state
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_timer_active.rc == 0
      - reactive_resume_dev_soak_internal_timer_enabled.rc == 0
    fail_msg: The exact Reactive Resume DEV backup timer must remain active and enabled.
  changed_when: false
  no_log: true

- name: Query the DEV deployment readiness
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ reactive_resume_dev_soak_deployment }}"
    namespace: "{{ reactive_resume_dev_soak_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  register: reactive_resume_dev_soak_internal_deployment
  check_mode: false
  changed_when: false
  no_log: true

- name: Require one ready DEV Reactive Resume deployment
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_deployment.resources | length == 1
      - reactive_resume_dev_soak_internal_deployment.resources[0].spec.replicas == 1
      - >-
        reactive_resume_dev_soak_internal_deployment.resources[0].status.observedGeneration >=
        reactive_resume_dev_soak_internal_deployment.resources[0].metadata.generation
      - reactive_resume_dev_soak_internal_deployment.resources[0].status.replicas == 1
      - reactive_resume_dev_soak_internal_deployment.resources[0].status.updatedReplicas == 1
      - reactive_resume_dev_soak_internal_deployment.resources[0].status.readyReplicas == 1
      - reactive_resume_dev_soak_internal_deployment.resources[0].status.availableReplicas == 1
    fail_msg: The DEV Reactive Resume deployment must remain exactly one ready replica.
  changed_when: false
  no_log: true

- name: Query the DEV ClusterIP service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: "{{ reactive_resume_dev_soak_service }}"
    namespace: "{{ reactive_resume_dev_soak_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  register: reactive_resume_dev_soak_internal_service
  check_mode: false
  changed_when: false
  no_log: true

- name: Require the private DEV service contract
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_service.resources | length == 1
      - reactive_resume_dev_soak_internal_service.resources[0].spec.type == 'ClusterIP'
      - reactive_resume_dev_soak_internal_service.resources[0].spec.clusterIP != 'None'
      - reactive_resume_dev_soak_internal_service.resources[0].spec.clusterIP | length > 0
      - reactive_resume_dev_soak_internal_service.resources[0].spec.ports | length == 1
      - >-
        reactive_resume_dev_soak_internal_service.resources[0].spec.selector ==
        {'app.kubernetes.io/name': reactive_resume_dev_soak_deployment,
         'app.kubernetes.io/part-of': 'cristexhub'}
      - reactive_resume_dev_soak_internal_service.resources[0].spec.ports[0].name == 'http'
      - reactive_resume_dev_soak_internal_service.resources[0].spec.ports[0].port == 3000
      - reactive_resume_dev_soak_internal_service.resources[0].spec.ports[0].protocol == 'TCP'
      - reactive_resume_dev_soak_internal_service.resources[0].spec.ports[0].targetPort == 'http'
      - reactive_resume_dev_soak_internal_service.resources[0].spec.ports[0].nodePort is not defined
      - reactive_resume_dev_soak_internal_service.resources[0].spec.externalIPs is not defined
      - reactive_resume_dev_soak_internal_service.resources[0].spec.externalName is not defined
      - reactive_resume_dev_soak_internal_service.resources[0].spec.loadBalancerIP is not defined
      - reactive_resume_dev_soak_internal_service.resources[0].spec.loadBalancerSourceRanges is not defined
      - reactive_resume_dev_soak_internal_service.resources[0].spec.healthCheckNodePort is not defined
    fail_msg: The DEV application service must remain private ClusterIP port 3000 without external exposure fields.
  changed_when: false
  no_log: true

- name: Query the DEV private Ingress
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: "{{ reactive_resume_dev_soak_ingress }}"
    namespace: "{{ reactive_resume_dev_soak_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  register: reactive_resume_dev_soak_internal_ingress
  check_mode: false
  changed_when: false
  no_log: true

- name: Require the exact private Traefik Ingress contract
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_ingress.resources | length == 1
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.ingressClassName == 'traefik'
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.defaultBackend is not defined
      - >-
        reactive_resume_dev_soak_internal_ingress.resources[0].metadata.annotations ==
        {'traefik.ingress.kubernetes.io/router.entrypoints': 'websecure',
         'traefik.ingress.kubernetes.io/router.tls': 'true'}
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.rules | length == 1
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.rules[0].host == reactive_resume_dev_soak_hostname
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.rules[0].http.paths | length == 1
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.rules[0].http.paths[0].path == '/'
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.rules[0].http.paths[0].pathType == 'Prefix'
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.rules[0].http.paths[0].backend.service.name == reactive_resume_dev_soak_service
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.rules[0].http.paths[0].backend.service.port.number == 3000
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.tls | length == 1
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.tls[0].hosts == [reactive_resume_dev_soak_hostname]
      - reactive_resume_dev_soak_internal_ingress.resources[0].spec.tls[0].secretName == reactive_resume_dev_soak_tls_secret
    fail_msg: The private hostname must remain on the exact Traefik TLS Ingress.
  changed_when: false
  no_log: true

- name: Query the exact DEV route NetworkPolicy
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    name: "{{ reactive_resume_dev_soak_network_policy }}"
    namespace: "{{ reactive_resume_dev_soak_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  register: reactive_resume_dev_soak_internal_network_policy
  check_mode: false
  changed_when: false
  no_log: true

- name: Require the exact route NetworkPolicy exposure boundary
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_network_policy.resources | length == 1
      - reactive_resume_dev_soak_internal_network_policy.resources[0].spec.podSelector.matchLabels | length == 2
      - >-
        reactive_resume_dev_soak_internal_network_policy.resources[0].spec.podSelector.matchLabels['app.kubernetes.io/name'] ==
        reactive_resume_dev_soak_deployment
      - >-
        reactive_resume_dev_soak_internal_network_policy.resources[0].spec.podSelector.matchLabels['app.kubernetes.io/part-of'] ==
        'cristexhub'
      - reactive_resume_dev_soak_internal_network_policy.resources[0].spec.policyTypes == ['Ingress']
      - reactive_resume_dev_soak_internal_network_policy.resources[0].spec.ingress | length == 1
      - reactive_resume_dev_soak_internal_network_policy.resources[0].spec.ingress[0].from | length == 1
      - >-
        reactive_resume_dev_soak_internal_network_policy.resources[0].spec.ingress[0].from[0].namespaceSelector.matchLabels[
          'kubernetes.io/metadata.name'] == 'kube-system'
      - >-
        reactive_resume_dev_soak_internal_network_policy.resources[0].spec.ingress[0].from[0].podSelector.matchLabels[
          'app.kubernetes.io/name'] == 'traefik'
      - reactive_resume_dev_soak_internal_network_policy.resources[0].spec.ingress[0].ports | length == 1
      - >-
        reactive_resume_dev_soak_internal_network_policy.resources[0].spec.ingress[0].ports[0] ==
        {'protocol': 'TCP', 'port': 3000}
      - reactive_resume_dev_soak_internal_network_policy.resources[0].spec.ingress[0].ports[0].endPort is not defined
    fail_msg: The DEV route must retain the exact Traefik-only ingress NetworkPolicy without widened port ranges.
  changed_when: false
  no_log: true

- name: Query every DEV Ingress exposure object in the namespace
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: Ingress
    namespace: "{{ reactive_resume_dev_soak_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  register: reactive_resume_dev_soak_internal_namespace_ingresses
  check_mode: false
  changed_when: false
  no_log: true

- name: Query every DEV Service exposure object in the namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ reactive_resume_dev_soak_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  register: reactive_resume_dev_soak_internal_namespace_services
  check_mode: false
  changed_when: false
  no_log: true

- name: Query every DEV NetworkPolicy exposure object in the namespace
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{ reactive_resume_dev_soak_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  register: reactive_resume_dev_soak_internal_namespace_network_policies
  check_mode: false
  changed_when: false
  no_log: true

- name: Require exact API-wide DEV exposure closure
  ansible.builtin.assert:
    that:
      - >-
        reactive_resume_dev_soak_internal_namespace_ingresses.resources |
        map(attribute='metadata.name') | list == [reactive_resume_dev_soak_ingress]
      - >-
        reactive_resume_dev_soak_internal_namespace_services.resources |
        map(attribute='metadata.name') | list == [reactive_resume_dev_soak_service]
      - >-
        reactive_resume_dev_soak_internal_namespace_services.resources |
        selectattr('spec.type', 'equalto', 'ClusterIP') | list | length == 1
      - >-
        reactive_resume_dev_soak_internal_namespace_services.resources[0].spec.selector ==
        {'app.kubernetes.io/name': reactive_resume_dev_soak_deployment,
         'app.kubernetes.io/part-of': 'cristexhub'}
      - >-
        reactive_resume_dev_soak_internal_namespace_network_policies.resources |
        map(attribute='metadata.name') | list | sort ==
        ['reactive-resume-dev-default-deny', 'reactive-resume-dev-egress',
         'reactive-resume-dev-route-allow-traefik']
    fail_msg: >-
      The API-wide DEV exposure closure must contain only the exact Service, Ingress,
      and NetworkPolicies; unlabeled selectors or routes are forbidden.
  changed_when: false
  no_log: true

- name: Query only the precreated DEV TLS Secret type and key names
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig={{ reactive_resume_dev_soak_kubeconfig }}
      - --namespace={{ reactive_resume_dev_soak_namespace }}
      - get
      - secret
      - "{{ reactive_resume_dev_soak_tls_secret }}"
      - '-o=jsonpath={.type}{"\n"}{range $k,$v := .data}{$k}{"\n"}{end}'
  register: reactive_resume_dev_soak_internal_tls_secret_metadata
  check_mode: false
  changed_when: false
  no_log: true

- name: Require exact TLS Secret metadata without reading values
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_soak_internal_tls_secret_metadata.rc == 0
      - reactive_resume_dev_soak_internal_tls_secret_metadata.stdout_lines | length == 3
      - reactive_resume_dev_soak_internal_tls_secret_metadata.stdout_lines[0] == 'kubernetes.io/tls'
      - reactive_resume_dev_soak_internal_tls_secret_metadata.stdout_lines[1:] | sort == ['tls.crt', 'tls.key']
    fail_msg: The browser-trusted TLS Secret must retain its exact two-key contract.
  changed_when: false
  no_log: true

- name: Query labeled Reactive Resume PROD resource classes
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ reactive_resume_dev_soak_prod_namespace }}"
    label_selectors:
      - "{{ reactive_resume_dev_soak_prod_label_selector }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  loop: "{{ reactive_resume_dev_soak_prod_queries }}"
  register: reactive_resume_dev_soak_internal_prod_results
  check_mode: false
  changed_when: false
  no_log: true

- name: Require zero labeled Reactive Resume PROD resources
  ansible.builtin.assert:
    that:
      - item.resources | length == 0
  loop: "{{ reactive_resume_dev_soak_internal_prod_results.results }}"
  loop_control:
    label: fixed-prod-labeled-resource-class
    fail_msg: No labeled Reactive Resume PROD resource may exist during the DEV soak.
  changed_when: false
  no_log: true

- name: Query unlabeled and common PROD resource inventory
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ reactive_resume_dev_soak_prod_namespace }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  loop: "{{ reactive_resume_dev_soak_prod_inventory_queries }}"
  register: reactive_resume_dev_soak_internal_prod_inventory_results
  check_mode: false
  changed_when: false
  no_log: true

- name: Query Argo applications for Reactive Resume PROD markers
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: argocd
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  loop: "{{ reactive_resume_dev_soak_argocd_queries }}"
  register: reactive_resume_dev_soak_internal_argocd_results
  check_mode: false
  changed_when: false
  no_log: true

- name: Query shared-services common PROD resource inventory
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: shared-services
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  loop: "{{ reactive_resume_dev_soak_shared_queries }}"
  register: reactive_resume_dev_soak_internal_shared_results
  check_mode: false
  changed_when: false
  no_log: true

- name: Query labeled Reactive Resume Argo applications
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: argocd
    label_selectors:
      - "{{ reactive_resume_dev_soak_prod_label_selector }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  loop: "{{ reactive_resume_dev_soak_argocd_queries }}"
  register: reactive_resume_dev_soak_internal_argocd_labeled_results
  check_mode: false
  changed_when: false
  no_log: true

- name: Query labeled Reactive Resume shared-services objects
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: shared-services
    label_selectors:
      - "{{ reactive_resume_dev_soak_prod_label_selector }}"
    kubeconfig: "{{ reactive_resume_dev_soak_kubeconfig }}"
  loop: "{{ reactive_resume_dev_soak_shared_queries }}"
  register: reactive_resume_dev_soak_internal_shared_labeled_results
  check_mode: false
  changed_when: false
  no_log: true

- name: Require no unlabeled or common Reactive Resume PROD markers
  ansible.builtin.assert:
    that:
      - >-
        (item.resources | map(attribute='metadata') | list | to_json |
        regex_findall(reactive_resume_dev_soak_rr_name_pattern) | length) == 0
    fail_msg: >-
      No resource named with the exact Reactive Resume marker may exist in the
      checked PROD, Argo, or shared-services inventories.
  loop: >-
    {{ reactive_resume_dev_soak_internal_prod_inventory_results.results +
       reactive_resume_dev_soak_internal_argocd_results.results +
       reactive_resume_dev_soak_internal_shared_results.results +
       reactive_resume_dev_soak_internal_argocd_labeled_results.results +
       reactive_resume_dev_soak_internal_shared_labeled_results.results }}
  loop_control:
    label: fixed-rr-marker-inventory
  changed_when: false
  no_log: true

- name: Record only sanitized pass booleans for this sample
  ansible.builtin.set_fact:
    reactive_resume_dev_soak_internal_samples: >-
      {{ (reactive_resume_dev_soak_internal_samples | default([])) + [{
        'sample': reactive_resume_dev_soak_sample_index | int,
        'hostname_root_http': true,
        'hostname_tls_http': true,
        'oidc_issuer': true,
        'oidc_jwks': true,
        'app_ready': true,
        'backup_timer_active_enabled': true,
        'exposure_pass': true,
        'prod_reactive_resume_markers_absent': true
      }] }}
  changed_when: false
  no_log: true
