- name: Reject externally supplied registration internals
  ansible.builtin.assert:
    that: item not in vars
    fail_msg: "INTERNAL_VARIABLE_GUARD: refusing externally supplied registration internal {{ item }}."
  loop:
    - cristexhub_prod_registration_internal_manifests
    - cristexhub_prod_registration_internal_states
    - cristexhub_prod_registration_internal_attestation_state
    - cristexhub_prod_registration_internal_prestate
    - cristexhub_prod_registration_internal_argocd_namespace
    - cristexhub_prod_registration_internal_kubeconfig_state
    - cristexhub_prod_registration_internal_preflight_binding
    - cristexhub_prod_registration_internal_legacy_transition_candidates
    - cristexhub_prod_registration_internal_target_transition_candidates
    - cristexhub_prod_registration_internal_prestate_bindings
    - cristexhub_prod_registration_internal_prestate_recheck
    - cristexhub_prod_registration_internal_mutation_manifests
    - cristexhub_prod_registration_internal_manifest_identities
    - cristexhub_prod_registration_internal_prestate_identities
    - cristexhub_prod_registration_internal_observed_prestate_identities
    - cristexhub_prod_registration_internal_mutation_results
    - cristexhub_prod_registration_internal_mutation_changed_identities
    - cristexhub_prod_registration_internal_finalstate
  changed_when: false
- name: Require the exact non-passthrough registration contract
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_REGISTRATION_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_REGISTRATION_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_REGISTRATION_ATTESTATION_FILE') | length > 0
      - cristexhub_prod_registration_approved | bool
      - cristexhub_prod_registration_state == 'present'
      - ansible_diff_mode
      - (ansible_limit | default('')) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - cristexhub_prod_registration_manifest_paths | length == 5
      - cristexhub_prod_registration_expected_hashes | length == 5
      - cristexhub_prod_registration_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - cristexhub_prod_registration_repository == 'ssh://git@ssh.github.com:443/devraider/cristexhub.git'
      - cristexhub_prod_registration_revision == '751885a42798d282e168131db147f13694a0a621'
      - cristexhub_prod_registration_path == 'infra/kubernetes/cristexhub-prod'
      - cristexhub_prod_registration_legacy_transition_object_count == 2
      - >-
        cristexhub_prod_registration_legacy_transition_specs.Application |
        to_json(sort_keys=True, separators=(',', ':')) | hash('sha256') ==
        'efcaa04cff588189490810ec3dc2d799e9d09d9deb2e6ce45475d61f75021c34'
      - >-
        cristexhub_prod_registration_legacy_transition_specs.AppProject |
        to_json(sort_keys=True, separators=(',', ':')) | hash('sha256') ==
        '7b51035757a7684cffb823339379e7fd3d80ada29a51a3bdc205b2f4b30027bf'
      - >-
        cristexhub_prod_registration_legacy_transition_spec_hashes.Application ==
        (cristexhub_prod_registration_legacy_transition_specs.Application |
        to_json(sort_keys=True, separators=(',', ':')) | hash('sha256'))
      - >-
        cristexhub_prod_registration_legacy_transition_spec_hashes.AppProject ==
        (cristexhub_prod_registration_legacy_transition_specs.AppProject |
        to_json(sort_keys=True, separators=(',', ':')) | hash('sha256'))
      - >-
        cristexhub_prod_registration_legacy_transition_uids ==
        {'Application': 'e2016a99-2c4f-4e2e-ac28-0640cafa2a8e',
        'AppProject': '6c04c48c-7d71-46c3-b4d0-7fc9f437f5d6'}
      - >-
        cristexhub_prod_registration_legacy_transition_spec_hashes ==
        {'Application': 'efcaa04cff588189490810ec3dc2d799e9d09d9deb2e6ce45475d61f75021c34',
        'AppProject': '7b51035757a7684cffb823339379e7fd3d80ada29a51a3bdc205b2f4b30027bf'}
      - >-
        cristexhub_prod_registration_legacy_transition_manifest_hashes ==
        {'Application': '29a3bd87c83d881e73f6e50739e9b510d89f58d2d851be93276658f1ad35bdf1',
        'AppProject': '4625c40d6030961d799f7b04b386f5a840273bc96b5d7031a507bf48ab57afa2'}
      - >-
        cristexhub_prod_registration_legacy_transition_metadata_hash ==
        'a4ef801de0c6aaf91a3c44e718afa10d17ab11727ce9b06b3d40727fd4c3ad30'
      - cristexhub_prod_registration_legacy_transition_specs.Application.destination.server == 'https://kubernetes.default.svc'
      - >-
        cristexhub_prod_registration_legacy_transition_specs.AppProject.destinations ==
        [{'server': 'https://kubernetes.default.svc', 'namespace': 'cristexhub-prod'}]
    fail_msg: Refusing unapproved or non-canonical CristexHub PROD registration.
  changed_when: false
- name: Inspect exact k3s administrator kubeconfig boundary
  ansible.builtin.stat:
    path: '{{ cristexhub_prod_registration_kubeconfig }}'
    follow: false
  register: cristexhub_prod_registration_internal_kubeconfig_state
  changed_when: false
  no_log: true

- name: Require protected regular k3s administrator kubeconfig
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_kubeconfig_state.stat.isreg | default(false)
      - not (cristexhub_prod_registration_internal_kubeconfig_state.stat.islnk | default(false))
      - cristexhub_prod_registration_internal_kubeconfig_state.stat.mode == '0640'
      - cristexhub_prod_registration_internal_kubeconfig_state.stat.pw_name == 'root'
      - cristexhub_prod_registration_internal_kubeconfig_state.stat.gr_name == 'k3s-admin'
    fail_msg: Refusing an absent, symlinked, or permission-drifted k3s administrator kubeconfig.
  changed_when: false
  no_log: true

- name: Inspect canonical registration manifests
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: '{{ cristexhub_prod_registration_manifest_paths }}'
  register: cristexhub_prod_registration_internal_states
  delegate_to: localhost
  changed_when: false
- name: Require hash-bound registration manifests
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.mode == '0644'
      - item.stat.checksum == (cristexhub_prod_registration_expected_hashes | selectattr('path', 'equalto', item.item) | map(attribute='sha256') | first)
      - item.item.startswith(cristexhub_prod_registration_repository_root ~ '/ansible/files/components/cristexhub-prod-registration/')
    fail_msg: Refusing hash-drifted registration source.
  loop: '{{ cristexhub_prod_registration_internal_states.results }}'
  delegate_to: localhost
  changed_when: false
- name: Load exact registration objects
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_manifests: >-
      {{ (cristexhub_prod_registration_internal_manifests | default([])) +
      [lookup('ansible.builtin.file', item) | from_yaml] }}
  loop: '{{ cristexhub_prod_registration_manifest_paths }}'
  changed_when: false
  no_log: true
- name: Record exact manifest identities
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_manifest_identities: >-
      {{ (cristexhub_prod_registration_internal_manifest_identities | default([])) +
      [item.apiVersion ~ '|' ~ item.kind ~ '|' ~ (item.metadata.namespace | default('')) ~ '|' ~ item.metadata.name] }}
  loop: '{{ cristexhub_prod_registration_internal_manifests }}'
  changed_when: false
  no_log: true

- name: Require unique exact manifest identity closure
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_manifest_identities | length == 5
      - cristexhub_prod_registration_internal_manifest_identities | unique | list | length == 5
      - >-
        cristexhub_prod_registration_internal_manifest_identities |
        difference([
        'argoproj.io/v1alpha1|AppProject|argocd|cristexhub-prod',
        'argoproj.io/v1alpha1|Application|argocd|cristexhub-prod',
        'rbac.authorization.k8s.io/v1|Role|cristexhub-prod|argocd-application-controller-cristexhub-prod',
        'rbac.authorization.k8s.io/v1|RoleBinding|cristexhub-prod|argocd-application-controller-cristexhub-prod',
        'v1|Secret|argocd|argocd-cluster-cristexhub-prod']) | length == 0
      - >-
        ['argoproj.io/v1alpha1|AppProject|argocd|cristexhub-prod',
        'argoproj.io/v1alpha1|Application|argocd|cristexhub-prod',
        'rbac.authorization.k8s.io/v1|Role|cristexhub-prod|argocd-application-controller-cristexhub-prod',
        'rbac.authorization.k8s.io/v1|RoleBinding|cristexhub-prod|argocd-application-controller-cristexhub-prod',
        'v1|Secret|argocd|argocd-cluster-cristexhub-prod'] |
        difference(cristexhub_prod_registration_internal_manifest_identities) | length == 0
    fail_msg: Refusing duplicate, missing, or foreign PROD registration manifest identities.
  changed_when: false
  no_log: true

- name: Query exact CristexHub PROD Namespace prerequisite
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: cristexhub-prod
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  register: cristexhub_prod_registration_internal_namespace
  changed_when: false
- name: Query exact Argo control Namespace prerequisite
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: argocd
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  register: cristexhub_prod_registration_internal_argocd_namespace
  changed_when: false

- name: Query Infisical-owned Argo repository credential metadata
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: argocd
    name: argocd-repository-cristexhub
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  register: cristexhub_prod_registration_internal_repository_secret
  changed_when: false
  no_log: true
- name: Require exact Namespace and repository credential prerequisites
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_namespace.resources | length == 1
      - cristexhub_prod_registration_internal_namespace.resources[0].status.phase == 'Active'
      - cristexhub_prod_registration_internal_argocd_namespace.resources | length == 1
      - cristexhub_prod_registration_internal_argocd_namespace.resources[0].status.phase == 'Active'
      - cristexhub_prod_registration_internal_argocd_namespace.resources[0].metadata.labels.get('kubernetes.io/metadata.name') == 'argocd'
      - >-
        cristexhub_prod_registration_internal_namespace.resources[0].metadata.labels ==
        {'app.kubernetes.io/part-of': 'cristexhub',
        'cristex.io/environment': 'prod',
        'cristex.io/bootstrap-writer': 'ansible',
        'cristex.io/desired-owner': 'argocd',
        'kubernetes.io/metadata.name': 'cristexhub-prod'}
      - cristexhub_prod_registration_internal_repository_secret.resources | length == 1
      - cristexhub_prod_registration_internal_repository_secret.resources[0].type == 'Opaque'
      - (cristexhub_prod_registration_internal_repository_secret.resources[0].data | default({})).keys() | list | sort == ['sshPrivateKey', 'type', 'url']
      - cristexhub_prod_registration_internal_repository_secret.resources[0].data.type | b64decode == 'git'
      - cristexhub_prod_registration_internal_repository_secret.resources[0].data.url | b64decode == 'ssh://git@ssh.github.com:443/devraider/cristexhub.git'
      - (cristexhub_prod_registration_internal_repository_secret.resources[0].binaryData | default({})) | length == 0
      - not (cristexhub_prod_registration_internal_repository_secret.resources[0].immutable | default(false) | bool)
      - (cristexhub_prod_registration_internal_repository_secret.resources[0].metadata.ownerReferences | default([])) | length == 0
      - >-
        (cristexhub_prod_registration_internal_repository_secret.resources[0].metadata.annotations |
        default({})).keys() | list == ['secrets.infisical.com/version']
      - cristexhub_prod_registration_internal_repository_secret.resources[0].metadata.annotations['secrets.infisical.com/version'] | length > 0
      - >-
        cristexhub_prod_registration_internal_repository_secret.resources[0].metadata.labels ==
        {'app.kubernetes.io/managed-by': 'infisical',
        'app.kubernetes.io/part-of': 'argocd',
        'argocd.argoproj.io/secret-type': 'repository',
        'cristex.io/value-owner': 'infisical-cloud'}
    fail_msg: Refusing registration without the exact Namespace and Infisical-owned repository credential.
  changed_when: false
  no_log: true
- name: Query exact PROD registration pre-state
  kubernetes.core.k8s_info:
    api_version: '{{ item.apiVersion }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.metadata.namespace | default(omit) }}'
    name: '{{ item.metadata.name }}'
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  loop: '{{ cristexhub_prod_registration_internal_manifests }}'
  register: cristexhub_prod_registration_internal_prestate
  changed_when: false
  no_log: true

- name: Require the complete existing five-object prestate for the bounded transition
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_prestate.results | length == 5
      - >-
        cristexhub_prod_registration_internal_prestate.results |
        map(attribute='resources') | map('length') | list == [1, 1, 1, 1, 1]
    fail_msg: Refusing a partial, absent, or multiply-resolved PROD registration prestate.
  changed_when: false
  no_log: true

- name: Record exact prestate identities
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_prestate_identities: >-
      {{ (cristexhub_prod_registration_internal_prestate_identities | default([])) +
      [item.item.apiVersion ~ '|' ~ item.item.kind ~ '|' ~ (item.item.metadata.namespace | default('')) ~ '|' ~ item.item.metadata.name] }}
  loop: '{{ cristexhub_prod_registration_internal_prestate.results }}'
  changed_when: false
  no_log: true

- name: Record exact observed prestate identities
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_observed_prestate_identities: >-
      {{ (cristexhub_prod_registration_internal_observed_prestate_identities | default([])) +
      [item.resources[0].apiVersion ~ '|' ~ item.resources[0].kind ~ '|' ~
      (item.resources[0].metadata.namespace | default('')) ~ '|' ~
      item.resources[0].metadata.name] }}
  loop: '{{ cristexhub_prod_registration_internal_prestate.results }}'
  changed_when: false
  no_log: true

- name: Require unique exact prestate identity closure
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_prestate_identities | length == 5
      - cristexhub_prod_registration_internal_prestate_identities | unique | list | length == 5
      - cristexhub_prod_registration_internal_prestate_identities | sort == cristexhub_prod_registration_internal_manifest_identities | sort
      - cristexhub_prod_registration_internal_observed_prestate_identities | length == 5
      - cristexhub_prod_registration_internal_observed_prestate_identities | unique | list | length == 5
      - cristexhub_prod_registration_internal_observed_prestate_identities | sort == cristexhub_prod_registration_internal_manifest_identities | sort
    fail_msg: Refusing duplicate, missing, or mismatched PROD registration prestate identities.
  changed_when: false
  no_log: true

- name: Bind exact prestate UID and resourceVersion for every registration object
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_prestate_bindings: >-
      {{ (cristexhub_prod_registration_internal_prestate_bindings | default([])) +
      [{
        'apiVersion': item.item.apiVersion,
        'kind': item.item.kind,
        'namespace': item.item.metadata.namespace | default(''),
        'name': item.item.metadata.name,
        'identity': item.item.apiVersion ~ '|' ~ item.item.kind ~ '|' ~ (item.item.metadata.namespace | default('')) ~ '|' ~ item.item.metadata.name,
        'uid': item.resources[0].metadata.uid,
        'resourceVersion': item.resources[0].metadata.resourceVersion,
        'generation': item.resources[0].metadata.generation | default(0) | string
      }] }}
  loop: '{{ cristexhub_prod_registration_internal_prestate.results }}'
  changed_when: false
  no_log: true

- name: Require complete exact prestate UID and resourceVersion bindings
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_prestate_bindings | length == 5
      - >-
        cristexhub_prod_registration_internal_prestate_bindings |
        selectattr('uid', 'defined') | list | length == 5
      - >-
        cristexhub_prod_registration_internal_prestate_bindings |
        selectattr('resourceVersion', 'defined') | list | length == 5
      - >-
        cristexhub_prod_registration_internal_prestate_bindings |
        map(attribute='uid') | select('match', '^[0-9a-fA-F-]{36}$') | list | length == 5
      - >-
        cristexhub_prod_registration_internal_prestate_bindings |
        map(attribute='resourceVersion') | select('match', '^[0-9]+$') | list | length == 5
      - >-
        cristexhub_prod_registration_internal_prestate_bindings |
        map(attribute='uid') | unique | list | length == 5
      - >-
        cristexhub_prod_registration_internal_prestate_bindings |
        map(attribute='generation') | select('match', '^[0-9]+$') | list | length == 5
    fail_msg: Refusing registration without exact unique UID/resourceVersion/generation preconditions for all five objects.
  changed_when: false
  no_log: true

- name: Record exact legacy-to-alias transition candidates
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_legacy_transition_candidates: >-
      {{ (cristexhub_prod_registration_internal_legacy_transition_candidates | default([])) +
      ([item.item.kind] if
      (item.resources | length == 1 and
       item.item.kind in ['Application', 'AppProject'] and
       item.resources[0].metadata.uid == cristexhub_prod_registration_legacy_transition_uids[item.item.kind] and
       item.resources[0].spec == cristexhub_prod_registration_legacy_transition_specs[item.item.kind])
      else []) }}
  loop: '{{ cristexhub_prod_registration_internal_prestate.results }}'
  changed_when: false
  no_log: true

- name: Record exact target transition candidates
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_target_transition_candidates: >-
      {{ (cristexhub_prod_registration_internal_target_transition_candidates | default([])) +
      ([item.item.kind] if
      (item.resources | length == 1 and
       item.item.kind in ['Application', 'AppProject'] and
       item.resources[0].metadata.uid == cristexhub_prod_registration_legacy_transition_uids[item.item.kind] and
       item.resources[0].spec == item.item.spec)
      else []) }}
  loop: '{{ cristexhub_prod_registration_internal_prestate.results }}'
  changed_when: false
  no_log: true

- name: Reject partial or duplicate legacy-to-alias transitions
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_legacy_transition_object_count == 2
      - >-
        cristexhub_prod_registration_internal_legacy_transition_candidates | sort in
        [[], ['AppProject'], ['Application'], ['Application', 'AppProject']]
      - >-
        cristexhub_prod_registration_internal_target_transition_candidates | sort in
        [[], ['AppProject'], ['Application'], ['Application', 'AppProject']]
      - >-
        (cristexhub_prod_registration_internal_legacy_transition_candidates |
        union(cristexhub_prod_registration_internal_target_transition_candidates) |
        unique | sort) == ['Application', 'AppProject']
      - >-
        cristexhub_prod_registration_internal_legacy_transition_candidates | intersect(
        cristexhub_prod_registration_internal_target_transition_candidates) | length == 0
      - >-
        (cristexhub_prod_registration_internal_legacy_transition_candidates | length == 2 and
        cristexhub_prod_registration_internal_target_transition_candidates | length == 0) or
        (cristexhub_prod_registration_internal_legacy_transition_candidates | length == 1 and
        cristexhub_prod_registration_internal_target_transition_candidates | length == 1) or
        (cristexhub_prod_registration_internal_legacy_transition_candidates | length == 0 and
        cristexhub_prod_registration_internal_target_transition_candidates | length == 2)
    fail_msg: Refusing a partial, foreign, or unrecognized legacy-to-alias transition; only an exact legacy pair, mixed recovery pair, or target pair is accepted.
  changed_when: false
  no_log: true

- name: Reject foreign PROD registration objects before mutation
  ansible.builtin.assert:
    that:
      - item.resources | length in [0, 1]
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.labels | default({})).get('app.kubernetes.io/managed-by') == 'ansible'
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.labels | default({})).get('cristex.io/component') == 'cristexhub-prod-registration'
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.ownerReferences | default([]) | length) == 0
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.finalizers | default([]) | length) == 0
      - >-
        item.resources | length == 0 or
        item.resources[0].metadata.get('deletionTimestamp') in [none, '']
      - >-
        item.resources | length == 0 or
        item.resources[0].metadata.get('deletionGracePeriodSeconds') in [none, 0]
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.managedFields | default([])) is sequence
      - >-
        item.resources | length == 0 or
        ((item.resources[0].metadata.managedFields | default([]) |
        map(attribute='manager') | select('defined') | reject('equalto', '') | list | length) ==
        (item.resources[0].metadata.managedFields | default([]) | length))
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.keys() | list |
        difference(['name', 'namespace', 'uid', 'resourceVersion', 'generation',
        'creationTimestamp', 'managedFields', 'labels', 'annotations']) | length) == 0
      - >-
        item.resources | length == 0 or
        item.resources[0].metadata.uid | default('') | length > 0
      - >-
        item.resources | length == 0 or
        item.resources[0].metadata.resourceVersion | default('') is match('^[0-9]+$')
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.annotations | default({})) ==
        (item.item.metadata.annotations | default({}))
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.labels | default({})) == item.item.metadata.labels
      - >-
        item.resources | length == 0 or item.item.kind not in ['Application', 'AppProject'] or
        item.resources[0].spec == item.item.spec or
        (item.resources[0].metadata.uid == cristexhub_prod_registration_legacy_transition_uids[item.item.kind] and
        item.resources[0].spec == cristexhub_prod_registration_legacy_transition_specs[item.item.kind])
      - >-
        item.resources | length == 0 or item.item.kind not in ['Application', 'AppProject'] or
        item.resources[0].metadata.uid == cristexhub_prod_registration_legacy_transition_uids[item.item.kind]
      - >-
        item.resources | length == 0 or item.item.kind != 'Role' or
        item.resources[0].rules == item.item.rules
      - >-
        item.resources | length == 0 or item.item.kind != 'RoleBinding' or
        (item.resources[0].roleRef == item.item.roleRef and item.resources[0].subjects == item.item.subjects)
      - >-
        item.resources | length == 0 or item.item.kind != 'Secret' or
        (item.resources[0].type == 'Opaque' and
        (item.resources[0].data | default({})).keys() | list | sort == ['clusterResources', 'config', 'name', 'namespaces', 'server'] and
        item.resources[0].data.name | b64decode == 'cristexhub-prod-local' and
        item.resources[0].data.server | b64decode == 'https://kubernetes.default.svc' and
        item.resources[0].data.namespaces | b64decode == 'cristexhub-prod' and
        item.resources[0].data.clusterResources | b64decode == 'false' and
        item.resources[0].data.config | b64decode == '{}' and
        (item.resources[0].binaryData | default({}) | length) == 0 and
        not (item.resources[0].immutable | default(false) | bool))
    fail_msg: Refusing to overwrite a foreign, drifted, or multiply-resolved PROD registration object.
  loop: '{{ cristexhub_prod_registration_internal_prestate.results }}'
  changed_when: false
  no_log: true

- name: Bind complete PROD registration preflight to the guarded mutation
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_preflight_binding:
      attestation_sha256: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_REGISTRATION_TOKEN') | hash('sha256') }}"
      manifest_names: "{{ cristexhub_prod_registration_internal_manifests | map(attribute='metadata.name') | list | sort }}"
      manifest_identities: "{{ cristexhub_prod_registration_internal_manifest_identities | sort }}"
      prestate_names: "{{ cristexhub_prod_registration_internal_prestate.results | map(attribute='item.metadata.name') | list | sort }}"
      prestate_identities: "{{ cristexhub_prod_registration_internal_prestate_identities | sort }}"
      object_count: "{{ cristexhub_prod_registration_internal_manifests | length }}"
      namespace_contract: "{{ cristexhub_prod_registration_internal_namespace.resources | length == 1 }}"
      repository_contract: "{{ cristexhub_prod_registration_internal_repository_secret.resources | length == 1 }}"
      revision: '{{ cristexhub_prod_registration_revision }}'
      legacy_transition_kinds: "{{ cristexhub_prod_registration_internal_legacy_transition_candidates | sort }}"
      target_transition_kinds: "{{ cristexhub_prod_registration_internal_target_transition_candidates | sort }}"
      legacy_transition_change_count: "{{ cristexhub_prod_registration_internal_legacy_transition_candidates | length }}"
      legacy_transition_uids: "{{ cristexhub_prod_registration_legacy_transition_uids }}"
      legacy_transition_spec_hashes: "{{ cristexhub_prod_registration_legacy_transition_spec_hashes }}"
      legacy_transition_manifest_hashes: "{{ cristexhub_prod_registration_legacy_transition_manifest_hashes }}"
      legacy_transition_metadata_hash: '{{ cristexhub_prod_registration_legacy_transition_metadata_hash }}'
      no_delete_path: true
      prestate_object_count: "{{ cristexhub_prod_registration_internal_prestate_bindings | length }}"
      prestate_bindings: "{{ cristexhub_prod_registration_internal_prestate_bindings }}"
      transition_change_count: "{{ cristexhub_prod_registration_internal_legacy_transition_candidates | length }}"
  changed_when: false
  no_log: true

- name: Re-query exact five-object prestate immediately before mutation
  kubernetes.core.k8s_info:
    api_version: '{{ item.apiVersion }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.metadata.namespace | default(omit) }}'
    name: '{{ item.metadata.name }}'
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  loop: '{{ cristexhub_prod_registration_internal_manifests }}'
  register: cristexhub_prod_registration_internal_prestate_recheck
  changed_when: false
  no_log: true

- name: Require unchanged UID and resourceVersion immediately before mutation
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].apiVersion == item.item.apiVersion
      - item.resources[0].kind == item.item.kind
      - item.resources[0].metadata.name == item.item.metadata.name
      - item.resources[0].metadata.namespace | default('') == item.item.metadata.namespace | default('')
      - item.resources[0].metadata.uid == cristexhub_prod_registration_internal_prestate_bindings[prestate_recheck_index].uid
      - item.resources[0].metadata.resourceVersion == cristexhub_prod_registration_internal_prestate_bindings[prestate_recheck_index].resourceVersion
      - >-
        (item.resources[0].metadata.keys() | list |
        difference(['name', 'namespace', 'uid', 'resourceVersion', 'generation',
        'creationTimestamp', 'managedFields', 'labels', 'annotations']) | length) == 0
      - item.resources[0].metadata.get('deletionTimestamp') in [none, '']
      - item.resources[0].metadata.get('deletionGracePeriodSeconds') in [none, 0]
      - (item.resources[0].metadata.ownerReferences | default([]) | length) == 0
      - (item.resources[0].metadata.finalizers | default([]) | length) == 0
      - (item.resources[0].metadata.managedFields | default([])) is sequence
      - >-
        (item.resources[0].metadata.managedFields | default([]) |
        map(attribute='manager') | select('defined') | reject('equalto', '') | list | length) ==
        (item.resources[0].metadata.managedFields | default([]) | length)
    fail_msg: Refusing replacement, changed resourceVersion, or metadata drift before PROD registration mutation.
  loop: '{{ cristexhub_prod_registration_internal_prestate_recheck.results }}'
  loop_control:
    index_var: prestate_recheck_index
  changed_when: false
  no_log: true

- name: Add exact resourceVersion optimistic-concurrency preconditions
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_mutation_manifests: >-
      {{ (cristexhub_prod_registration_internal_mutation_manifests | default([])) +
      [cristexhub_prod_registration_internal_manifests[mutation_manifest_index] |
      combine({'metadata':
      (cristexhub_prod_registration_internal_manifests[mutation_manifest_index].metadata |
      combine({'resourceVersion':
      cristexhub_prod_registration_internal_prestate_bindings[mutation_manifest_index].resourceVersion},
      recursive=True))}, recursive=True)] }}
  loop: '{{ range(0, cristexhub_prod_registration_internal_manifests | length) | list }}'
  loop_control:
    loop_var: mutation_manifest_index
  changed_when: false
  no_log: true

- name: Reconcile registration source without synchronization
  cristexhub_prod_registration_guarded_k8s:
    state: present
    definition: '{{ item }}'
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
    wait: false
    wait_timeout: 60
  loop: >-
    {{ cristexhub_prod_registration_internal_mutation_manifests |
    default(cristexhub_prod_registration_internal_manifests | default([{}])) }}
  register: cristexhub_prod_registration_internal_mutation_results
  no_log: true

- name: Record exact changed registration identities
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_mutation_changed_identities: >-
      {{ (cristexhub_prod_registration_internal_mutation_changed_identities | default([])) +
      ([item.item.apiVersion ~ '|' ~ item.item.kind ~ '|' ~ (item.item.metadata.namespace | default('')) ~ '|' ~ item.item.metadata.name]
      if (item.changed | default(false) | bool) else []) }}
  loop: '{{ cristexhub_prod_registration_internal_mutation_results.results }}'
  changed_when: false
  no_log: true

- name: Derive exact expected changed registration identities
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_expected_changed_identities: >-
      {{
      (['argoproj.io/v1alpha1|AppProject|argocd|cristexhub-prod']
      if 'AppProject' in cristexhub_prod_registration_internal_legacy_transition_candidates else []) +
      (['argoproj.io/v1alpha1|Application|argocd|cristexhub-prod']
      if 'Application' in cristexhub_prod_registration_internal_legacy_transition_candidates else [])
      }}
  changed_when: false
  no_log: true

- name: Require exact registration mutation result closure
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_mutation_results.results | length == 5
      - >-
        cristexhub_prod_registration_internal_mutation_changed_identities |
        unique | list | length ==
        cristexhub_prod_registration_internal_mutation_changed_identities | length
      - >-
        cristexhub_prod_registration_internal_mutation_changed_identities |
        difference(cristexhub_prod_registration_internal_expected_changed_identities) |
        length == 0
      - >-
        cristexhub_prod_registration_internal_expected_changed_identities |
        difference(cristexhub_prod_registration_internal_mutation_changed_identities) |
        length == 0
      - >-
        cristexhub_prod_registration_internal_mutation_changed_identities | length ==
        cristexhub_prod_registration_internal_legacy_transition_candidates | length
    fail_msg: Refusing registration mutation with an unexpected changed identity or count.
  changed_when: false
  no_log: true

- name: Query exact live registration post-state before reconciliation wait
  kubernetes.core.k8s_info:
    api_version: '{{ item.apiVersion }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.metadata.namespace | default(omit) }}'
    name: '{{ item.metadata.name }}'
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  loop: '{{ cristexhub_prod_registration_internal_manifests }}'
  register: cristexhub_prod_registration_internal_pre_wait_state
  changed_when: false
  no_log: true
  when: not ansible_check_mode
- name: Wait for live PROD Application to reconcile
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: cristexhub-prod
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  register: cristexhub_prod_registration_internal_application_status
  changed_when: false
  no_log: true
  until:
    - cristexhub_prod_registration_internal_application_status.resources | length == 1
    - >-
      cristexhub_prod_registration_internal_application_status.resources[0].status.sync.status |
      default('') == 'Synced'
    - >-
      cristexhub_prod_registration_internal_application_status.resources[0].status.health.status |
      default('') == 'Healthy'
  retries: 30
  delay: 10
  when: not ansible_check_mode

- name: Query exact live registration post-state after reconciliation wait
  kubernetes.core.k8s_info:
    api_version: '{{ item.apiVersion }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.metadata.namespace | default(omit) }}'
    name: '{{ item.metadata.name }}'
    kubeconfig: '{{ cristexhub_prod_registration_kubeconfig }}'
  loop: '{{ cristexhub_prod_registration_internal_manifests }}'
  register: cristexhub_prod_registration_internal_poststate
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Extract fresh final PROD Application state
  ansible.builtin.set_fact:
    cristexhub_prod_registration_internal_finalstate: >-
      {{ (cristexhub_prod_registration_internal_poststate.results |
      selectattr('item.kind', 'equalto', 'Application') | first).resources[0] }}
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require live PROD Application Synced and Healthy
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_finalstate | length > 0
      - cristexhub_prod_registration_internal_finalstate.status.sync.status |
        default('') == 'Synced'
      - cristexhub_prod_registration_internal_finalstate.status.health.status |
        default('') == 'Healthy'
      - cristexhub_prod_registration_internal_finalstate.metadata.uid ==
        (cristexhub_prod_registration_internal_prestate_bindings |
        selectattr('kind', 'equalto', 'Application') | first).uid
      - cristexhub_prod_registration_internal_finalstate.status.sync.revision |
        default('') == cristexhub_prod_registration_revision
      - >-
        (cristexhub_prod_registration_internal_finalstate.metadata.generation | default(0) | int) ==
        (((cristexhub_prod_registration_internal_prestate_bindings |
        selectattr('kind', 'equalto', 'Application') | first).generation | int) +
        (1 if 'Application' in cristexhub_prod_registration_internal_legacy_transition_candidates else 0))
    fail_msg: Refusing PROD registration while the fresh live Argo Application is not the waited-for Synced and Healthy revision.

  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require exact PROD registration post-state metadata
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].apiVersion == item.item.apiVersion
      - item.resources[0].kind == item.item.kind
      - item.resources[0].metadata.name == item.item.metadata.name
      - item.resources[0].metadata.namespace == item.item.metadata.namespace
      - item.resources[0].metadata.uid == cristexhub_prod_registration_internal_prestate_bindings[poststate_index].uid
      - >-
        (item.resources[0].metadata.generation | default(0) | int) ==
        ((cristexhub_prod_registration_internal_prestate_bindings[poststate_index].generation | int) +
        (1 if item.item.kind in cristexhub_prod_registration_internal_legacy_transition_candidates else 0))
      - item.resources[0].metadata.labels == item.item.metadata.labels
      - >-
        (item.resources[0].metadata.keys() | list |
        difference(['name', 'namespace', 'uid', 'resourceVersion', 'generation',
        'creationTimestamp', 'managedFields', 'labels', 'annotations']) | length) == 0
      - (item.resources[0].metadata.annotations | default({})) == (item.item.metadata.annotations | default({}))
      - (item.resources[0].metadata.ownerReferences | default([]) | length) == 0
      - (item.resources[0].metadata.finalizers | default([]) | length) == 0
      - item.resources[0].metadata.get('deletionTimestamp') in [none, '']
      - item.resources[0].metadata.get('deletionGracePeriodSeconds') in [none, 0]
      - (item.resources[0].metadata.managedFields | default([])) is sequence
      - >-
        (item.resources[0].metadata.managedFields | default([]) |
        map(attribute='manager') | select('defined') | reject('equalto', '') | list | length) ==
        (item.resources[0].metadata.managedFields | default([]) | length)
      - item.item.kind != 'Secret' or item.resources[0].type == 'Opaque'
    fail_msg: Refusing drifted PROD registration identity, metadata, ownership, finalizer, or Secret type.
  loop: '{{ cristexhub_prod_registration_internal_poststate.results }}'
  loop_control:
    index_var: poststate_index
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require automated non-pruning PROD registration post-state
  ansible.builtin.assert:
    that:
      - cristexhub_prod_registration_internal_poststate.results | length == 5
      - cristexhub_prod_registration_internal_poststate.results | map(attribute='resources') | map('length') | list == [1, 1, 1, 1, 1]
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Application') | first).resources[0].spec ==
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Application') | first).item.spec
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Application') | first).resources[0].spec.syncPolicy.automated ==
        {'prune': false, 'selfHeal': true, 'allowEmpty': false}
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'AppProject') | first).resources[0].spec ==
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'AppProject') | first).item.spec
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'AppProject') | first).resources[0].spec.syncWindows is not defined
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Role') | first).resources[0].rules ==
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Role') | first).item.rules
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'RoleBinding') | first).resources[0].roleRef ==
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'RoleBinding') | first).item.roleRef
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'RoleBinding') | first).resources[0].subjects ==
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'RoleBinding') | first).item.subjects
      - >-
        ((cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].data |
        default({})).keys() | list | sort ==
        ['clusterResources', 'config', 'name', 'namespaces', 'server']
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].data.name |
        b64decode == 'cristexhub-prod-local'
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].data.server |
        b64decode == 'https://kubernetes.default.svc'
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].data.namespaces |
        b64decode == 'cristexhub-prod'
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].data.clusterResources |
        b64decode == 'false'
      - >-
        (cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].data.config |
        b64decode == '{}'
      - >-
        ((cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].binaryData |
        default({}) | length) == 0
      - >-
        not ((cristexhub_prod_registration_internal_poststate.results |
        selectattr('item.kind', 'equalto', 'Secret') | first).resources[0].immutable |
        default(false) | bool)
    fail_msg: Refusing registration whose live five-object closure drifted or can synchronize before promotion gates pass.
  changed_when: false
  no_log: true
  when: not ansible_check_mode
