        cristexhub_prod_mongodb_credential_rotation_check_version_annotation] | default('') | length > 0)
    fail_msg: Refusing missing, replaced, unowned, or unversioned Infisical source/target metadata.
  loop: "{{ cristexhub_prod_mongodb_credential_rotation_check_metadata_resources }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.namespace }}/{{ item.name }}"
  changed_when: false
  no_log: true

- name: Bind the fixed materialization version annotation name
  ansible.builtin.set_fact:
    cristexhub_prod_mongodb_credential_rotation_check_e: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_metadata.engine_target }}
    cristexhub_prod_mongodb_credential_rotation_check_r: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_metadata.runtime_target }}
    cristexhub_prod_mongodb_credential_rotation_check_v: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_version_annotation }}
  changed_when: false
  no_log: true

- name: Bind the two observed revision channels without claiming Infisical CAS
  ansible.builtin.set_fact:
    cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations:
      engine_source_resource_version: "{{ cristexhub_prod_mongodb_credential_rotation_check_internal_metadata.engine_source.resourceVersion }}"
      runtime_source_resource_version: "{{ cristexhub_prod_mongodb_credential_rotation_check_internal_metadata.runtime_source.resourceVersion }}"
      engine_materialization_version: >-
        {{ cristexhub_prod_mongodb_credential_rotation_check_e.annotations |
        dict2items | selectattr('key', 'equalto', cristexhub_prod_mongodb_credential_rotation_check_v) |
        map(attribute='value') | first }}
      runtime_materialization_version: >-
        {{ cristexhub_prod_mongodb_credential_rotation_check_r.annotations |
        dict2items | selectattr('key', 'equalto', cristexhub_prod_mongodb_credential_rotation_check_v) |
        map(attribute='value') | first }}
      engine_cas_status: unavailable
      runtime_url_cas_status: unavailable
      ambiguous_result: UNKNOWN-STOP
      missing_revision_result: UNKNOWN-STOP
  changed_when: false
  no_log: true

- name: Require both revision observations and the fail-closed CAS stop state
  ansible.builtin.assert:
    that:
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.engine_source_resource_version | length > 0
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.runtime_source_resource_version | length > 0
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.engine_materialization_version | length > 0
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.runtime_materialization_version | length > 0
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.engine_cas_status == 'unavailable'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.runtime_url_cas_status == 'unavailable'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.ambiguous_result == 'UNKNOWN-STOP'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_revision_observations.missing_revision_result == 'UNKNOWN-STOP'
    fail_msg: >-
      Refusing to proceed when either Infisical path lacks a proven expected
      revision/conditional-write contract.
  changed_when: false
  no_log: true

- name: Query the exact Infisical Operator controller health
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ cristexhub_prod_mongodb_credential_rotation_check_operator_deployment.namespace }}"
    name: "{{ cristexhub_prod_mongodb_credential_rotation_check_operator_deployment.name }}"
    kubeconfig: "{{ cristexhub_prod_mongodb_credential_rotation_check_kubeconfig }}"
  register: cristexhub_prod_mongodb_credential_rotation_check_internal_operator
  changed_when: false
  no_log: true

- name: Require an available Infisical Operator without mutating it
  ansible.builtin.assert:
    that:
      - cristexhub_prod_mongodb_credential_rotation_check_internal_operator.resources | length == 1
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_internal_operator.resources[0].metadata.labels ==
        cristexhub_prod_mongodb_credential_rotation_check_operator_deployment.labels
      - cristexhub_prod_mongodb_credential_rotation_check_internal_operator.resources[0].status.readyReplicas | default(0) | int == 1
      - cristexhub_prod_mongodb_credential_rotation_check_internal_operator.resources[0].status.availableReplicas | default(0) | int == 1
    fail_msg: Refusing source rotation while the Infisical Operator is absent or unavailable.
  changed_when: false
  no_log: true

- name: Query exact PROD consumer Deployment readiness
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ cristexhub_prod_mongodb_credential_rotation_check_namespace }}"
    name: "{{ item.name }}"
    kubeconfig: "{{ cristexhub_prod_mongodb_credential_rotation_check_kubeconfig }}"
  loop: "{{ cristexhub_prod_mongodb_credential_rotation_check_consumers }}"
  loop_control:
    label: "{{ item.name }}"
  register: cristexhub_prod_mongodb_credential_rotation_check_internal_consumers
  changed_when: false
  no_log: true

- name: Require current consumer readiness without claiming successor acceptance
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.name == item.item.name
      - item.resources[0].metadata.labels['app.kubernetes.io/name'] == item.item.name
      - item.resources[0].metadata.labels['app.kubernetes.io/part-of'] == 'cristexhub'
      - item.resources[0].metadata.uid | default('') | length > 0
      - item.resources[0].metadata.resourceVersion | default('') | length > 0
      - item.resources[0].status.readyReplicas | default(0) | int == 1
      - item.resources[0].status.availableReplicas | default(0) | int == 1
      - item.resources[0].status.updatedReplicas | default(0) | int == 1
    fail_msg: Refusing rotation while a required PROD consumer is not Ready.
  loop: "{{ cristexhub_prod_mongodb_credential_rotation_check_internal_consumers.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: false
  no_log: true

- name: Query the private PROD Argo Application status
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ cristexhub_prod_mongodb_credential_rotation_check_argo.namespace }}"
    name: "{{ cristexhub_prod_mongodb_credential_rotation_check_argo.name }}"
    kubeconfig: "{{ cristexhub_prod_mongodb_credential_rotation_check_kubeconfig }}"
  register: cristexhub_prod_mongodb_credential_rotation_check_internal_argo
  changed_when: false
  no_log: true

- name: Require private PROD Argo health before any future cutover
  ansible.builtin.assert:
    that:
      - cristexhub_prod_mongodb_credential_rotation_check_internal_argo.resources | length == 1
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_internal_argo.resources[0].spec.destination.server ==
        cristexhub_prod_mongodb_credential_rotation_check_argo.server
      - cristexhub_prod_mongodb_credential_rotation_check_internal_argo.resources[0].spec.destination.name | default('') == ''
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_internal_argo.resources[0].spec.source.targetRevision ==
        cristexhub_prod_mongodb_credential_rotation_check_argo.revision
      - cristexhub_prod_mongodb_credential_rotation_check_internal_argo.resources[0].status.sync.status == 'Synced'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_argo.resources[0].status.health.status == 'Healthy'
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_internal_argo.resources[0].status.sync.revision ==
        cristexhub_prod_mongodb_credential_rotation_check_argo.revision
    fail_msg: Refusing future MongoDB cutover while private PROD Argo state is stale, aliased, or unhealthy.
  changed_when: false
  no_log: true

- name: Record explicit non-executable rotation stop state
  ansible.builtin.assert:
    that:
      - cristexhub_prod_mongodb_credential_rotation_check_source_write_status == 'forbidden'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_cas_status == 'unavailable'
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_cas_status == 'unavailable'
      - cristexhub_prod_mongodb_credential_rotation_check_apply_status == 'NOT-RUN-BLOCKED'
      - cristexhub_prod_mongodb_credential_rotation_check_auth_negative_status == 'NOT-RUN-BLOCKED'
      - cristexhub_prod_mongodb_credential_rotation_check_predecessor_revocation_status == 'SEPARATE-APPROVAL-REQUIRED'
    fail_msg: >-
      Refusing to claim MongoDB rotation readiness: no source writer, CAS
      protocol, value-bearing authentication probe, or revocation operation is
      present in this check-only lane.
  changed_when: false
  no_log: true

- name: Emit sanitized MongoDB rotation preflight result
  ansible.builtin.debug:
    msg:
      status: source-only-check-complete
      apply_status: NOT-RUN-BLOCKED
      source_write: forbidden
      engine_path_cas: unavailable
      runtime_url_path_cas: unavailable
      auth_negative_validation: NOT-RUN-BLOCKED
      predecessor_revocation: SEPARATE-APPROVAL-REQUIRED
      values_read: false
      secret_data_requested: false
      infisical_mutation: false
      kubernetes_mutation: false
      consumer_restart: false
      argo: Synced/Healthy
  changed_when: false
