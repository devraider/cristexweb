---
- name: Reject externally supplied MongoDB rotation-check internals
  ansible.builtin.assert:
    that:
      - >-
        (vars.keys() |
        select('match', '^cristexhub_prod_mongodb_credential_rotation_check_internal_') |
        list | length) == 0
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied MongoDB PROD
      rotation-check state.
  changed_when: false

- name: Require the exact metadata-only MongoDB rotation preflight
  ansible.builtin.assert:
    that:
      - cristexhub_prod_mongodb_credential_rotation_check_approved | bool
      - ansible_check_mode
      - ansible_diff_mode
      - (ansible_limit | default('') | string) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - inventory_hostname == 'crtxweb'
      - cristexhub_prod_mongodb_credential_rotation_check_mode == 'check'
      - cristexhub_prod_mongodb_credential_rotation_check_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - cristexhub_prod_mongodb_credential_rotation_check_repository_root == '/home/paul/projects/cristexweb'
      - cristexhub_prod_mongodb_credential_rotation_check_namespace == 'cristexhub-prod'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_namespace == 'shared-services'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_source_path == '/shared-services/mongodb'
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_source_path == '/cristexhub/prod/runtime'
      - cristexhub_prod_mongodb_credential_rotation_check_environment_slug == 'prod'
      - cristexhub_prod_mongodb_credential_rotation_check_project_id == '619656da-14f3-4872-857b-be103cdc5326'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_source_directory == 'ansible/files/components/infisical-database-secrets/source'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_source_filename == 'shared-mongodb-infisical-secrets.yaml'
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_source_directory == 'ansible/files/components/infisical-cristexhub-prod-runtime/source'
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_source_filename == 'cristexhub-prod-runtime-static-secret.yaml'
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_engine_source_manifest ==
        'ansible/files/components/infisical-database-secrets/source/shared-mongodb-infisical-secrets.yaml'
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_runtime_source_manifest ==
        'ansible/files/components/infisical-cristexhub-prod-runtime/source/cristexhub-prod-runtime-static-secret.yaml'
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_networkpolicy_source_manifests ==
        ['ansible/files/components/shared-mongodb-networkpolicy/network/shared-mongodb-networkpolicy-default-deny.yaml',
        'ansible/files/components/shared-mongodb-networkpolicy/network/shared-mongodb-networkpolicy-allow.yaml']
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_networkpolicy_names ==
        ['shared-mongodb-networkpolicy-default-deny', 'shared-mongodb-networkpolicy-allow']
      - cristexhub_prod_mongodb_credential_rotation_check_engine_source_keys == ['MONGODB_CRISTEXHUB_PROD_USERNAME', 'MONGODB_CRISTEXHUB_PROD_PASSWORD']
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_source_key == 'MONGODB_URL'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_target_name == 'shared-mongodb-cristexhub-prod'
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_target_name == 'cristexhub-prod-runtime'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_target_keys == ['username', 'password']
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_target_keys == ['MONGODB_URL']
      - cristexhub_prod_mongodb_credential_rotation_check_source_write_status == 'forbidden'
      - cristexhub_prod_mongodb_credential_rotation_check_engine_cas_status == 'unavailable'
      - cristexhub_prod_mongodb_credential_rotation_check_runtime_cas_status == 'unavailable'
      - cristexhub_prod_mongodb_credential_rotation_check_ambiguous_status == 'UNKNOWN-STOP'
      - cristexhub_prod_mongodb_credential_rotation_check_missing_revision_status == 'UNKNOWN-STOP'
      - cristexhub_prod_mongodb_credential_rotation_check_apply_status == 'NOT-RUN-BLOCKED'
      - cristexhub_prod_mongodb_credential_rotation_check_auth_negative_status == 'NOT-RUN-BLOCKED'
      - cristexhub_prod_mongodb_credential_rotation_check_predecessor_revocation_status == 'SEPARATE-APPROVAL-REQUIRED'
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        map(attribute='id') | list | sort == ['engine_source', 'engine_target',
        'runtime_source', 'runtime_target']
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_source') | map(attribute='api_path') | first) ==
        '/apis/secrets.infisical.com/v1beta1/namespaces/shared-services/infisicalstaticsecrets/shared-mongodb-infisical-secrets'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_source') | map(attribute='api_path') | first) ==
        '/apis/secrets.infisical.com/v1beta1/namespaces/cristexhub-prod/infisicalstaticsecrets/cristexhub-prod-runtime'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_target') | map(attribute='api_path') | first) ==
        '/api/v1/namespaces/shared-services/secrets/shared-mongodb-cristexhub-prod'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_target') | map(attribute='api_path') | first) ==
        '/api/v1/namespaces/cristexhub-prod/secrets/cristexhub-prod-runtime'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_source') | map(attribute='kind') | first) ==
        'InfisicalStaticSecret'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_source') | map(attribute='kind') | first) ==
        'InfisicalStaticSecret'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_target') | map(attribute='kind') | first) == 'Secret'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_target') | map(attribute='kind') | first) == 'Secret'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_source') | map(attribute='api_version') | first) ==
        'secrets.infisical.com/v1beta1'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_source') | map(attribute='api_version') | first) ==
        'secrets.infisical.com/v1beta1'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_target') | map(attribute='api_version') | first) == 'v1'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_target') | map(attribute='api_version') | first) == 'v1'
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_source') | map(attribute='labels') | first) == {
        'app.kubernetes.io/part-of': 'cristex-platform',
        'app.kubernetes.io/managed-by': 'ansible',
        'cristex.io/component': 'infisical-database-secrets'}
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_source') | map(attribute='labels') | first) == {
        'app.kubernetes.io/part-of': 'cristex-platform',
        'app.kubernetes.io/managed-by': 'ansible',
        'cristex.io/component': 'infisical-cristexhub-prod-runtime'}
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'engine_target') | map(attribute='labels') | first) == {
        'app.kubernetes.io/managed-by': 'infisical',
        'app.kubernetes.io/part-of': 'shared-databases',
        'cristex.io/value-owner': 'infisical-cloud'}
      - >-
        (cristexhub_prod_mongodb_credential_rotation_check_metadata_resources |
        selectattr('id', 'equalto', 'runtime_target') | map(attribute='labels') | first) == {
        'app.kubernetes.io/managed-by': 'infisical',
        'app.kubernetes.io/part-of': 'cristexhub',
        'cristex.io/value-owner': 'infisical-cloud'}
      - cristexhub_prod_mongodb_credential_rotation_check_consumers | map(attribute='name') | list == ['backend', 'celery-worker']
      - cristexhub_prod_mongodb_credential_rotation_check_consumers | map(attribute='runtime_key') | list == ['MONGODB_URL', 'MONGODB_URL']
      - cristexhub_prod_mongodb_credential_rotation_check_operator_deployment.name == 'infisical-operator-controller'
      - cristexhub_prod_mongodb_credential_rotation_check_operator_deployment.namespace == 'shared-services'
      - cristexhub_prod_mongodb_credential_rotation_check_argo.name == 'cristexhub-prod'
      - cristexhub_prod_mongodb_credential_rotation_check_argo.namespace == 'argocd'
      - cristexhub_prod_mongodb_credential_rotation_check_argo.server == 'https://kubernetes.default.svc'
      - cristexhub_prod_mongodb_credential_rotation_check_argo.revision == '751885a42798d282e168131db147f13694a0a621'
    fail_msg: >-
      Refusing a MongoDB PROD rotation check outside the exact one-host,
      value-free, source-only contract.
  changed_when: false
  no_log: true

- name: Require the canonical check wrapper attestation
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_MONGODB_ROTATION_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_MONGODB_ROTATION_MODE') == 'check'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_MONGODB_ROTATION_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_MONGODB_ROTATION_ATTESTATION_FILE') | length > 0
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_WRAPPER_PATH') ==
        '/home/paul/projects/cristexweb/ansible/bin/check-cristexhub-prod-mongodb-credential-rotation'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_WRAPPER_CANONICAL_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_WRAPPER_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_TASK_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_DEFAULTS_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_PLAYBOOK_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_POLICY_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_METADATA_MODULE_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_INVENTORY_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_ANSIBLE_CONFIG_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_CONTROLLER_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_REPOSITORY_ROOT') == '/home/paul/projects/cristexweb'
    fail_msg: >-
      ENTRYPOINT_GUARD: use only the canonical check-only MongoDB PROD
      credential rotation wrapper.
  changed_when: false
  no_log: true

- name: Inspect the one-run metadata-check attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_MONGODB_ROTATION_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: cristexhub_prod_mongodb_credential_rotation_check_internal_attestation
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require a private single-use metadata-check attestation
  ansible.builtin.assert:
    that:
      - cristexhub_prod_mongodb_credential_rotation_check_internal_attestation.stat.exists | default(false)
      - cristexhub_prod_mongodb_credential_rotation_check_internal_attestation.stat.isreg | default(false)
      - not (cristexhub_prod_mongodb_credential_rotation_check_internal_attestation.stat.islnk | default(false))
      - cristexhub_prod_mongodb_credential_rotation_check_internal_attestation.stat.pw_name == cristexhub_prod_mongodb_credential_rotation_check_controller_user
      - cristexhub_prod_mongodb_credential_rotation_check_internal_attestation.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_CRISTEXHUB_PROD_MONGODB_ROTATION_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_MONGODB_ROTATION_TOKEN') ~ ':entrypoint'
    fail_msg: Refusing a missing, reusable, foreign-owned, or invalid rotation-check attestation.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect the exact MongoDB rotation source closure
  ansible.builtin.stat:
    path: "{{ cristexhub_prod_mongodb_credential_rotation_check_repository_root }}/{{ item.path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  loop:
    - {path: 'ansible/bin/check-cristexhub-prod-mongodb-credential-rotation', mode: '0755'}
    - {path: 'ansible/roles/cristexhub_prod_mongodb_credential_rotation_check/tasks/main.yml', mode: '0644'}
    - {path: 'ansible/roles/cristexhub_prod_mongodb_credential_rotation_check/defaults/main.yml', mode: '0644'}
    - {path: 'ansible/playbooks/check_cristexhub_prod_mongodb_credential_rotation.yml', mode: '0644'}
    - {path: 'ansible/files/policies/cristexhub-prod-mongodb-credential-rotation.yml', mode: '0644'}
    - {path: 'ansible/library/cristexhub_prod_mongodb_credential_rotation_metadata.py', mode: '0755'}
    - {path: 'ansible/files/components/infisical-database-secrets/source/shared-mongodb-infisical-secrets.yaml', mode: '0644'}
    - {path: 'ansible/files/components/infisical-cristexhub-prod-runtime/source/cristexhub-prod-runtime-static-secret.yaml', mode: '0644'}
    - {path: 'ansible/files/components/shared-mongodb-networkpolicy/network/shared-mongodb-networkpolicy-default-deny.yaml', mode: '0644'}
    - {path: 'ansible/files/components/shared-mongodb-networkpolicy/network/shared-mongodb-networkpolicy-allow.yaml', mode: '0644'}
  register: cristexhub_prod_mongodb_credential_rotation_check_internal_source_states
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require exact source modes and wrapper-bound source hashes
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == cristexhub_prod_mongodb_credential_rotation_check_controller_user
      - item.stat.mode == item.item.mode
      - >-
        (item.item.path == 'ansible/bin/check-cristexhub-prod-mongodb-credential-rotation' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_WRAPPER_SHA256')) or
        (item.item.path == 'ansible/roles/cristexhub_prod_mongodb_credential_rotation_check/tasks/main.yml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_TASK_SHA256')) or
        (item.item.path == 'ansible/roles/cristexhub_prod_mongodb_credential_rotation_check/defaults/main.yml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_DEFAULTS_SHA256')) or
        (item.item.path == 'ansible/playbooks/check_cristexhub_prod_mongodb_credential_rotation.yml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_PLAYBOOK_SHA256')) or
        (item.item.path == 'ansible/files/policies/cristexhub-prod-mongodb-credential-rotation.yml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_POLICY_SHA256')) or
        (item.item.path == 'ansible/library/cristexhub_prod_mongodb_credential_rotation_metadata.py' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_METADATA_MODULE_SHA256')) or
        (item.item.path == 'ansible/files/components/infisical-database-secrets/source/shared-mongodb-infisical-secrets.yaml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_ENGINE_SOURCE_MANIFEST_SHA256')) or
        (item.item.path == 'ansible/files/components/infisical-cristexhub-prod-runtime/source/cristexhub-prod-runtime-static-secret.yaml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_RUNTIME_SOURCE_MANIFEST_SHA256')) or
        (item.item.path == 'ansible/files/components/shared-mongodb-networkpolicy/network/shared-mongodb-networkpolicy-default-deny.yaml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_NETWORKPOLICY_DEFAULT_DENY_SHA256')) or
        (item.item.path == 'ansible/files/components/shared-mongodb-networkpolicy/network/shared-mongodb-networkpolicy-allow.yaml' and
        item.stat.checksum == lookup('ansible.builtin.env', 'CRISTEXWEB_PROD_MONGODB_ROTATION_NETWORKPOLICY_ALLOW_SHA256'))
    fail_msg: Refusing source closure drift, symlinks, or mode/owner drift.
  loop: "{{ cristexhub_prod_mongodb_credential_rotation_check_internal_source_states.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Load the value-free engine and runtime source manifests
  ansible.builtin.set_fact:
    cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest: >-
      {{ lookup('ansible.builtin.file',
      cristexhub_prod_mongodb_credential_rotation_check_repository_root ~ '/' ~
      cristexhub_prod_mongodb_credential_rotation_check_engine_source_directory ~ '/' ~
      cristexhub_prod_mongodb_credential_rotation_check_engine_source_filename) | from_yaml }}
    cristexhub_prod_mongodb_credential_rotation_check_internal_runtime_manifest: >-
      {{ lookup('ansible.builtin.file',
      cristexhub_prod_mongodb_credential_rotation_check_repository_root ~ '/' ~
      cristexhub_prod_mongodb_credential_rotation_check_runtime_source_directory ~ '/' ~
      cristexhub_prod_mongodb_credential_rotation_check_runtime_source_filename) | from_yaml }}
  changed_when: false
  no_log: true

- name: Load exact source-only MongoDB NetworkPolicy manifests
  ansible.builtin.set_fact:
    cristexhub_prod_mongodb_credential_rotation_check_internal_networkpolicy_manifests: >-
      {{ (cristexhub_prod_mongodb_credential_rotation_check_internal_networkpolicy_manifests | default([])) +
      [lookup('ansible.builtin.file', cristexhub_prod_mongodb_credential_rotation_check_repository_root ~ '/' ~ item) | from_yaml] }}
  loop: "{{ cristexhub_prod_mongodb_credential_rotation_check_networkpolicy_source_manifests }}"
  changed_when: false
  no_log: true

- name: Bind exact value-free source targets
  ansible.builtin.set_fact:
    cristexhub_prod_mongodb_credential_rotation_check_internal_engine_target: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.targets |
      selectattr('name', 'equalto', cristexhub_prod_mongodb_credential_rotation_check_engine_target_name) | list | first | default({}) }}
    cristexhub_prod_mongodb_credential_rotation_check_internal_engine_admin_target: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.targets |
      selectattr('name', 'equalto', 'shared-mongodb-auth') | list | first | default({}) }}
    cristexhub_prod_mongodb_credential_rotation_check_internal_engine_tls_target: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.targets |
      selectattr('name', 'equalto', 'shared-mongodb-tls') | list | first | default({}) }}
    cristexhub_prod_mongodb_credential_rotation_check_internal_engine_dev_target: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.targets |
      selectattr('name', 'equalto', 'shared-mongodb-cristexhub-dev') | list | first | default({}) }}
    cristexhub_prod_mongodb_credential_rotation_check_internal_runtime_target: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_runtime_manifest.spec.targets |
      selectattr('name', 'equalto', cristexhub_prod_mongodb_credential_rotation_check_runtime_target_name) | list | first | default({}) }}
    cristexhub_prod_mongodb_credential_rotation_check_internal_runtime_pull_target: >-
      {{ cristexhub_prod_mongodb_credential_rotation_check_internal_runtime_manifest.spec.targets |
      selectattr('name', 'equalto', 'cristexhub-prod-ghcr-pull') | list | first | default({}) }}
  changed_when: false
  no_log: true

- name: Require exact two-path Infisical source contracts
  ansible.builtin.assert:
    that:
      - cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.apiVersion == 'secrets.infisical.com/v1beta1'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.kind == 'InfisicalStaticSecret'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.metadata.name == 'shared-mongodb-infisical-secrets'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.metadata.namespace == 'shared-services'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.sources | length == 1
      - >-
        cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.sources[0].projectId ==
        cristexhub_prod_mongodb_credential_rotation_check_project_id
      - cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.sources[0].environmentSlug == 'prod'
      - cristexhub_prod_mongodb_credential_rotation_check_internal_engine_manifest.spec.sources[0].secretPath == '/shared-services/mongodb'
