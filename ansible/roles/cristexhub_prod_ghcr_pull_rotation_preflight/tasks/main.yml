  ansible.builtin.set_fact:
    cristexhub_prod_ghcr_pull_rotation_preflight_internal_receipt:
      status: NOT-RUN-BLOCKED
      value_owner: infisical-cloud
      registry_owner: github-container-registry
      registry_scope: private-ghcr-only
      source_path: /cristexhub/prod/runtime
      source_key: DOCKER_CONFIG_JSON
      source_cr_uid: "{{ cristexhub_prod_ghcr_pull_rotation_preflight_internal_source_cr_binding.uid }}"
      source_cr_resource_version: "{{ cristexhub_prod_ghcr_pull_rotation_preflight_internal_source_cr_binding.resource_version }}"
      target_name: cristexhub-prod-ghcr-pull
      target_namespace: cristexhub-prod
      target_type: kubernetes.io/dockerconfigjson
      target_key: .dockerconfigjson
      target_uid: "{{ cristexhub_prod_ghcr_pull_rotation_preflight_internal_target_metadata.metadata.uid }}"
      target_resource_version: "{{ cristexhub_prod_ghcr_pull_rotation_preflight_internal_target_metadata.metadata.resourceVersion }}"
      consumers: "{{ cristexhub_prod_ghcr_pull_rotation_preflight_internal_workload_bindings | map(attribute='name') | list }}"
      consumer_identities: "{{ cristexhub_prod_ghcr_pull_rotation_preflight_internal_workload_bindings | map(attribute='uid') | list }}"
      consumer_resource_versions: "{{ cristexhub_prod_ghcr_pull_rotation_preflight_internal_workload_bindings | map(attribute='resource_version') | list }}"
      rollout_gate: FUTURE-CONTROLLED-ONE-WORKLOAD-AT-A-TIME
      predecessor_revoke_gate: NOT-RUN-BLOCKED
      no_secret_data_read: true
      no_mutation: true
  changed_when: false
  no_log: true
