---
- name: Reject externally supplied runtime seam internals
  ansible.builtin.assert:
    that:
      - item not in vars
    fail_msg: "INTERNAL_VARIABLE_GUARD: refusing externally supplied runtime seam internal variable {{ item }}."
  loop:
    - cristexhub_prod_runtime_manifests
    - cristexhub_prod_runtime_bootstrap_internal_preflight_binding
    - cristexhub_prod_runtime_namespace
    - cristexhub_prod_runtime_credential
    - cristexhub_prod_runtime_manifest_states
    - cristexhub_prod_runtime_operator_prerequisites
    - cristexhub_prod_runtime_generic_admission_policies
    - cristexhub_prod_runtime_generic_admission_bindings
    - cristexhub_prod_runtime_bootstrap_attestation
    - cristexhub_prod_runtime_cr_inventory
    - cristexhub_prod_runtime_target_secret_inventory
    - cristexhub_prod_runtime_cr_inventory_recheck
    - cristexhub_prod_runtime_target_secret_inventory_recheck
    - cristexhub_prod_runtime_expected_operator_deployment
    - cristexhub_prod_runtime_expected_operator_role
    - cristexhub_prod_runtime_expected_operator_rolebinding
    - cristexhub_prod_runtime_expected_generic_policies
    - cristexhub_prod_runtime_expected_generic_bindings
    - cristexhub_prod_runtime_admission_policies
    - cristexhub_prod_runtime_admission_bindings
    - cristexhub_prod_runtime_rbac_objects
    - cristexhub_prod_runtime_source_objects
    - cristexhub_prod_runtime_identity_keys
    - cristexhub_prod_runtime_prestate
    - cristexhub_prod_runtime_poststate
    - cristexhub_prod_runtime_admission_apply
    - cristexhub_prod_runtime_admission_policy_state
    - cristexhub_prod_runtime_admission_binding_apply
    - cristexhub_prod_runtime_admission_binding_state
    - cristexhub_prod_runtime_rbac_apply
    - cristexhub_prod_runtime_source_apply
    - cristexhub_prod_runtime_source_state
    - cristexhub_prod_runtime_target_secret_poststate
    - cristexhub_prod_runtime_apply
  changed_when: false

- name: Require the guarded source-only CristexHub PROD runtime contract
  ansible.builtin.assert:
    that:
      - cristexhub_prod_runtime_bootstrap_approved | bool
      - cristexhub_prod_runtime_bootstrap_state == 'present'
      - ansible_diff_mode
      - (ansible_limit | default('')) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_RUNTIME_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_RUNTIME_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_RUNTIME_ATTESTATION_FILE') | length > 0
      - cristexhub_prod_runtime_bootstrap_manifest_paths | length == 13
      - cristexhub_prod_runtime_bootstrap_manifest_paths | unique | length == 13
      - cristexhub_prod_runtime_bootstrap_expected_hashes | length == 13
      - cristexhub_prod_runtime_bootstrap_expected_hashes | map(attribute='path') | list == cristexhub_prod_runtime_bootstrap_manifest_paths
      - cristexhub_prod_runtime_bootstrap_expected_hashes | map(attribute='path') | list | unique | length == 13
      - cristexhub_prod_runtime_bootstrap_namespace == 'cristexhub-prod'
      - cristexhub_prod_runtime_bootstrap_project_id == '619656da-14f3-4872-857b-be103cdc5326'
      - cristexhub_prod_runtime_bootstrap_environment_slug == 'prod'
      - cristexhub_prod_runtime_bootstrap_secret_path == '/cristexhub/prod/runtime'
      - cristexhub_prod_runtime_bootstrap_credential_name == 'cristexhub-prod-infisical-universal-auth'
      - cristexhub_prod_runtime_bootstrap_target_keys | length == 9
      - cristexhub_prod_runtime_bootstrap_target_contract.runtime.name == 'cristexhub-prod-runtime'
      - cristexhub_prod_runtime_bootstrap_target_contract.runtime.namespace == 'cristexhub-prod'
      - cristexhub_prod_runtime_bootstrap_target_contract.runtime.type == 'Opaque'
      - cristexhub_prod_runtime_bootstrap_target_contract.runtime.keys == cristexhub_prod_runtime_bootstrap_target_keys
      - cristexhub_prod_runtime_bootstrap_target_contract.ghcr_pull.name == 'cristexhub-prod-ghcr-pull'
      - cristexhub_prod_runtime_bootstrap_target_contract.ghcr_pull.namespace == 'cristexhub-prod'
      - cristexhub_prod_runtime_bootstrap_target_contract.ghcr_pull.type == 'kubernetes.io/dockerconfigjson'
      - cristexhub_prod_runtime_bootstrap_target_contract.ghcr_pull.keys == ['.dockerconfigjson']
      - cristexhub_prod_runtime_bootstrap_credential_contract.name == 'cristexhub-prod-infisical-universal-auth'
      - cristexhub_prod_runtime_bootstrap_credential_contract.namespace == 'cristexhub-prod'
      - cristexhub_prod_runtime_bootstrap_credential_contract.type == 'Opaque'
      - cristexhub_prod_runtime_bootstrap_credential_contract['keys'] == ['clientId', 'clientSecret']
      - >-
        cristexhub_prod_runtime_bootstrap_expected_cr_kinds ==
        [
          {'kind': 'InfisicalSecret', 'api_version': 'secrets.infisical.com/v1alpha1'},
          {'kind': 'InfisicalPushSecret', 'api_version': 'secrets.infisical.com/v1alpha1'},
          {'kind': 'InfisicalDynamicSecret', 'api_version': 'secrets.infisical.com/v1alpha1'},
          {'kind': 'InfisicalConnection', 'api_version': 'secrets.infisical.com/v1beta1'},
          {'kind': 'InfisicalAuth', 'api_version': 'secrets.infisical.com/v1beta1'},
          {'kind': 'InfisicalStaticSecret', 'api_version': 'secrets.infisical.com/v1beta1'}
        ]
      - >-
        cristexhub_prod_runtime_bootstrap_expected_target_secret_names ==
        ['cristexhub-prod-infisical-universal-auth', 'cristexhub-prod-runtime', 'cristexhub-prod-ghcr-pull']
    fail_msg: Refusing an unapproved, selected, non-diff, or altered runtime seam invocation.
  changed_when: false

- name: Inspect one-time runtime seam attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_RUNTIME_ATTESTATION_FILE') }}"
    follow: false
  register: cristexhub_prod_runtime_bootstrap_attestation
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Require private runtime seam attestation
  ansible.builtin.assert:
    that:
      - cristexhub_prod_runtime_bootstrap_attestation.stat.isreg | default(false)
      - not (cristexhub_prod_runtime_bootstrap_attestation.stat.islnk | default(false))
      - cristexhub_prod_runtime_bootstrap_attestation.stat.mode == '0600'
      - lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_RUNTIME_ATTESTATION_FILE')) == lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_RUNTIME_TOKEN') ~ ':entrypoint'
    fail_msg: Refusing missing or invalid runtime seam attestation.
  changed_when: false
  no_log: true

- name: Query required runtime namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: cristexhub-prod
    kubeconfig: "{{ cristexhub_prod_runtime_bootstrap_kubeconfig }}"
  register: cristexhub_prod_runtime_namespace
  changed_when: false

- name: Require precreated target namespace
  ansible.builtin.assert:
    that:
      - cristexhub_prod_runtime_namespace.resources | length == 1
      - cristexhub_prod_runtime_namespace.resources[0].status.phase == 'Active'
      - cristexhub_prod_runtime_namespace.resources[0].metadata.labels.get('app.kubernetes.io/part-of') == 'cristexhub'
      - cristexhub_prod_runtime_namespace.resources[0].metadata.labels.get('cristex.io/environment') == 'prod'
      - cristexhub_prod_runtime_namespace.resources[0].metadata.labels.get('cristex.io/bootstrap-writer') == 'ansible'
      - cristexhub_prod_runtime_namespace.resources[0].metadata.labels.get('cristex.io/desired-owner') == 'argocd'
    fail_msg: Refusing to create or reconcile a missing or drifted application namespace.
  changed_when: false

- name: Query separately approved Infisical Operator PROD prerequisites
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
    kubeconfig: "{{ cristexhub_prod_runtime_bootstrap_kubeconfig }}"
  loop:
    - api_version: apps/v1
      kind: Deployment
      namespace: shared-services
      name: infisical-operator-controller
      register_name: deployment
    - api_version: rbac.authorization.k8s.io/v1
      kind: Role
      namespace: cristexhub-prod
      name: infisical-operator-manager
      register_name: role
    - api_version: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      namespace: cristexhub-prod
      name: infisical-operator-manager
      register_name: rolebinding
  register: cristexhub_prod_runtime_operator_prerequisites
  changed_when: false
  no_log: true

- name: Query generic Infisical admission prerequisites
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    name: "{{ item }}"
    kubeconfig: "{{ cristexhub_prod_runtime_bootstrap_kubeconfig }}"
  loop:
    - infisical-connection-boundary
    - infisical-auth-boundary
    - infisical-static-secret-boundary
  register: cristexhub_prod_runtime_generic_admission_policies
  changed_when: false
  no_log: true

- name: Query generic Infisical admission binding prerequisites
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    name: "{{ item }}"
    kubeconfig: "{{ cristexhub_prod_runtime_bootstrap_kubeconfig }}"
  loop:
    - infisical-connection-boundary
    - infisical-auth-boundary
    - infisical-static-secret-boundary
  register: cristexhub_prod_runtime_generic_admission_bindings
  changed_when: false
  no_log: true

- name: Load exact Operator and generic admission source contracts
  ansible.builtin.set_fact:
    cristexhub_prod_runtime_expected_operator_deployment: >-
      {{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~
         '/ansible/files/components/infisical-operator/controller/deployment.yaml') | from_yaml }}
    cristexhub_prod_runtime_expected_operator_role: >-
      {{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~
         '/ansible/files/components/infisical-operator/rbac/manager-role-cristexhub-prod.yaml') | from_yaml }}
    cristexhub_prod_runtime_expected_operator_rolebinding: >-
      {{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~
         '/ansible/files/components/infisical-operator/rbac/manager-rolebinding-cristexhub-prod.yaml') | from_yaml }}
    cristexhub_prod_runtime_expected_generic_policies:
      - "{{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~ '/ansible/files/components/infisical-operator/admission/infisical-auth-boundary.yaml') | from_yaml }}"
      - "{{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~ '/ansible/files/components/infisical-operator/admission/infisical-connection-boundary.yaml') | from_yaml }}"
      - "{{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~ '/ansible/files/components/infisical-operator/admission/infisical-static-secret-boundary.yaml') | from_yaml }}"
    cristexhub_prod_runtime_expected_generic_bindings:
      - "{{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~ '/ansible/files/components/infisical-operator/admission/infisical-auth-boundary-binding.yaml') | from_yaml }}"
      - "{{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~ '/ansible/files/components/infisical-operator/admission/infisical-connection-boundary-binding.yaml') | from_yaml }}"
      - "{{ lookup('ansible.builtin.file', cristexhub_prod_runtime_bootstrap_repository_root ~ '/ansible/files/components/infisical-operator/admission/infisical-static-secret-boundary-binding.yaml') | from_yaml }}"
  changed_when: false
  no_log: true

- name: Query every Infisical custom-resource kind in PROD
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: cristexhub-prod
    kubeconfig: "{{ cristexhub_prod_runtime_bootstrap_kubeconfig }}"
  loop: "{{ cristexhub_prod_runtime_bootstrap_expected_cr_kinds }}"
  register: cristexhub_prod_runtime_cr_inventory
  changed_when: false
  no_log: true

- name: Query every Secret in the PROD Namespace before mutation
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: cristexhub-prod
    kubeconfig: "{{ cristexhub_prod_runtime_bootstrap_kubeconfig }}"
  register: cristexhub_prod_runtime_target_secret_inventory
  changed_when: false
  no_log: true

- name: Reject noncanonical existing PROD Infisical resources and Secrets
  ansible.builtin.assert:
    that:
      - cristexhub_prod_runtime_cr_inventory.results | length == 6
      - >-
        item.item.kind in ['InfisicalSecret', 'InfisicalPushSecret', 'InfisicalDynamicSecret']
        and item.resources | length == 0 or
        item.item.kind == 'InfisicalConnection' and
        (item.resources | map(attribute='metadata.name') | list | difference(['infisical-cloud']) | length == 0) or
        item.item.kind == 'InfisicalAuth' and
        (item.resources | map(attribute='metadata.name') | list | difference(['cristexhub-prod-infisical-auth']) | length == 0) or
        item.item.kind == 'InfisicalStaticSecret' and
        (item.resources | map(attribute='metadata.name') | list | difference(['cristexhub-prod-runtime']) | length == 0)
      - item.resources | length <= 1
    fail_msg: Refusing an unexpected or duplicate PROD Infisical custom resource.
  loop: "{{ cristexhub_prod_runtime_cr_inventory.results }}"
  loop_control:
    label: "{{ item.item.kind }}"
  changed_when: false
  no_log: true

- name: Reject noncanonical existing PROD target Secret names
  ansible.builtin.assert:
    that:
      - item.resources | map(attribute='metadata.name') | list | difference(cristexhub_prod_runtime_bootstrap_expected_target_secret_names) | length == 0
      - item.resources | map(attribute='metadata.name') | list | unique | length == item.resources | length
    fail_msg: Refusing an unexpected or duplicate PROD Secret before runtime seam mutation.
  loop:
    - "{{ cristexhub_prod_runtime_target_secret_inventory }}"
  loop_control:
    label: cristexhub-prod
  changed_when: false
  no_log: true

- name: Reject drifted existing PROD target Secret contracts
  ansible.builtin.assert:
    that:
      - >-
        cristexhub_prod_runtime_target_secret_inventory.resources |
        selectattr('metadata.name', 'equalto', item.value.name) | list | length in [0, 1]
      - >-
        cristexhub_prod_runtime_target_secret_inventory.resources |
        selectattr('metadata.name', 'equalto', item.value.name) | list | length == 0 or
        ((cristexhub_prod_runtime_target_secret_inventory.resources |
          selectattr('metadata.name', 'equalto', item.value.name) | first).type == item.value.type and
         ((cristexhub_prod_runtime_target_secret_inventory.resources |
           selectattr('metadata.name', 'equalto', item.value.name) | first).data | default({})).keys() | list | sort == item.value.keys | sort and
         ((cristexhub_prod_runtime_target_secret_inventory.resources |
           selectattr('metadata.name', 'equalto', item.value.name) | first).binaryData | default({}) | length == 0 and
         not ((cristexhub_prod_runtime_target_secret_inventory.resources |
           selectattr('metadata.name', 'equalto', item.value.name) | first).immutable | default(false) | bool) and
         ((cristexhub_prod_runtime_target_secret_inventory.resources |
           selectattr('metadata.name', 'equalto', item.value.name) | first).metadata.ownerReferences | default([]) | length == 0 and
         ((cristexhub_prod_runtime_target_secret_inventory.resources |
           selectattr('metadata.name', 'equalto', item.value.name) | first).metadata.labels | default({})) == cristexhub_prod_runtime_bootstrap_labels and
         ((cristexhub_prod_runtime_target_secret_inventory.resources |
           selectattr('metadata.name', 'equalto', item.value.name) | first).metadata.annotations | default({})).keys() | list == ['secrets.infisical.com/version'] and
         ((cristexhub_prod_runtime_target_secret_inventory.resources |
           selectattr('metadata.name', 'equalto', item.value.name) | first).metadata.annotations['secrets.infisical.com/version'] | length > 0)
    fail_msg: Refusing an existing drifted PROD runtime target Secret.
  loop: "{{ cristexhub_prod_runtime_bootstrap_target_contract | dict2items }}"
  loop_control:
    label: "{{ item.value.name }}"
  changed_when: false
  no_log: true

- name: Stop until the Infisical Operator PROD checkpoint is separately approved
  ansible.builtin.assert:
    that:
      - cristexhub_prod_runtime_operator_prerequisites.results | length == 3
      - cristexhub_prod_runtime_operator_prerequisites.results | map(attribute='resources') | map('length') | list == [1, 1, 1]
      - >-
        cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].status.observedGeneration ==
        cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].metadata.generation
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].status.replicas | default(0) | int == 1
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].status.updatedReplicas | default(0) | int == 1
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].status.readyReplicas | default(0) | int == 1
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].status.availableReplicas | default(0) | int == 1
      - >-
        cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].status.conditions |
        selectattr('type', 'equalto', 'Available') | selectattr('status', 'equalto', 'True') |
        list | length == 1
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.replicas == 1
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.strategy == cristexhub_prod_runtime_expected_operator_deployment.spec.strategy
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.selector == cristexhub_prod_runtime_expected_operator_deployment.spec.selector
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.metadata.labels == cristexhub_prod_runtime_expected_operator_deployment.spec.template.metadata.labels
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.metadata.annotations == cristexhub_prod_runtime_expected_operator_deployment.spec.template.metadata.annotations
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.serviceAccountName == 'infisical-operator-controller'
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.automountServiceAccountToken | bool
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.containers | length == 1
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.containers[0].name == 'manager'
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.containers[0].image == cristexhub_prod_runtime_expected_operator_deployment.spec.template.spec.containers[0].image
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.containers[0].args == cristexhub_prod_runtime_expected_operator_deployment.spec.template.spec.containers[0].args
      - >-
        cristexhub_prod_runtime_expected_operator_deployment.spec.template.spec.containers[0].args ==
        ['--metrics-bind-address=0', '--leader-elect', '--health-probe-bind-address=:8081',
         '--namespaces=shared-services,argocd,cristexhub-dev,cristexhub-prod,platform-edge']
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.containers[0].env == cristexhub_prod_runtime_expected_operator_deployment.spec.template.spec.containers[0].env
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.containers[0].readinessProbe.httpGet.path == '/readyz'
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].spec.template.spec.containers[0].readinessProbe.httpGet.port == 'health'
      - cristexhub_prod_runtime_operator_prerequisites.results[0].resources[0].metadata.labels == cristexhub_prod_runtime_expected_operator_deployment.metadata.labels
      - cristexhub_prod_runtime_operator_prerequisites.results[1].resources[0].rules == cristexhub_prod_runtime_expected_operator_role.rules
      - cristexhub_prod_runtime_operator_prerequisites.results[1].resources[0].metadata.labels == cristexhub_prod_runtime_expected_operator_role.metadata.labels
      - cristexhub_prod_runtime_operator_prerequisites.results[2].resources[0].roleRef == cristexhub_prod_runtime_expected_operator_rolebinding.roleRef
      - cristexhub_prod_runtime_operator_prerequisites.results[2].resources[0].subjects == cristexhub_prod_runtime_expected_operator_rolebinding.subjects
      - cristexhub_prod_runtime_operator_prerequisites.results[2].resources[0].metadata.labels == cristexhub_prod_runtime_expected_operator_rolebinding.metadata.labels
      - cristexhub_prod_runtime_generic_admission_policies.results | map(attribute='resources') | map('length') | list == [1, 1, 1]
      - cristexhub_prod_runtime_generic_admission_policies.results | map(attribute='resources.0.spec') | list == cristexhub_prod_runtime_expected_generic_policies | map(attribute='spec') | list
      - cristexhub_prod_runtime_generic_admission_bindings.results | map(attribute='resources.0.spec') | list == cristexhub_prod_runtime_expected_generic_bindings | map(attribute='spec') | list
      - cristexhub_prod_runtime_generic_admission_bindings.results | map(attribute='resources') | map('length') | list == [1, 1, 1]
      - >-
        cristexhub_prod_runtime_generic_admission_policies.results |
        map(attribute='resources.0.spec.failurePolicy') | list | unique | list == ['Fail']
      - >-
        cristexhub_prod_runtime_generic_admission_bindings.results |
        map(attribute='resources.0.spec.validationActions') | list | unique | list == [['Deny']]
      - >-
        cristexhub_prod_runtime_generic_admission_policies.results |
        map(attribute='resources.0.spec.validations') | map('to_json') |
        select('search', 'cristexhub-prod') | list | length == 3
    fail_msg: "BLOCKED: the existing Infisical Operator closure does not yet have separately approved cristexhub-prod watch/RBAC/admission. No runtime seam mutation was attempted."
  changed_when: false
  no_log: true

- name: Require generic PROD admission policies to be type-checked at observed generation
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - >-
        item.resources[0].status.conditions | default([]) | length == 0 or
        (item.resources[0].status.conditions | default([]) |
         selectattr('type', 'equalto', 'TypeChecking') |
         selectattr('status', 'equalto', 'True') |
         selectattr('observedGeneration', 'equalto', item.resources[0].metadata.generation) |
         list | length == 1)
    fail_msg: Refusing runtime seam mutation until every generic PROD admission policy is type-checked at its observed generation.
  loop: "{{ cristexhub_prod_runtime_generic_admission_policies.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  no_log: true

- name: Inspect canonical runtime seam manifests
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ cristexhub_prod_runtime_bootstrap_manifest_paths }}"
  register: cristexhub_prod_runtime_manifest_states
  delegate_to: localhost
  changed_when: false

- name: Require regular canonical runtime seam manifests
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.mode == '0644'
      - item.stat.checksum == (cristexhub_prod_runtime_bootstrap_expected_hashes | selectattr('path', 'equalto', item.item) | map(attribute='sha256') | first)
      - (item.item | ansible.builtin.realpath) == item.item
      - item.item.startswith(cristexhub_prod_runtime_bootstrap_repository_root ~ '/ansible/files/components/infisical-cristexhub-prod-runtime/')
    fail_msg: Refusing missing, symlinked, mode-drifted, or hash-drifted runtime seam source.
