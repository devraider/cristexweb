infisical_argocd_secrets_bootstrap_credential_contract:
  name: argocd-infisical-universal-auth
  namespace: argocd
  type: Opaque
  keys:
    - clientId
    - clientSecret
  labels:
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: infisical-operator
    cristex.io/component: infisical-runtime-auth
    cristex.io/value-owner: infisical-cloud
infisical_argocd_secrets_bootstrap_target_contract:
  argocd-secret:
    type: Opaque
    keys:
      - admin.password
      - admin.passwordMtime
      - server.secretkey
  argocd-redis:
    type: Opaque
    keys:
      - auth
  argocd-server-tls:
    type: kubernetes.io/tls
    keys:
      - ca.crt
      - tls.crt
      - tls.key
  argocd-repository-cristexhub:
    type: Opaque
    keys:
      - sshPrivateKey
      - type
      - url
  argocd-repository-cristexweb:
    type: Opaque
    keys:
      - sshPrivateKey
      - type
      - url
