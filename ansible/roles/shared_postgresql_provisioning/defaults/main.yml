---
# yamllint disable rule:line-length rule:indentation
shared_postgresql_provisioning_approved: false
shared_postgresql_provisioning_state: present
shared_postgresql_provisioning_kubeconfig: /etc/rancher/k3s/k3s.yaml
shared_postgresql_provisioning_repository_root: '{{ playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname }}'
shared_postgresql_provisioning_controller_user: '{{ lookup(''ansible.builtin.env'', ''USER'') }}'
shared_postgresql_provisioning_namespace: shared-services
shared_postgresql_provisioning_pod_name: shared-postgresql-0
shared_postgresql_provisioning_container: postgresql
shared_postgresql_provisioning_statefulset_name: shared-postgresql
shared_postgresql_provisioning_admin_secret: shared-postgresql-admin
shared_postgresql_provisioning_tls_secret: shared-postgresql-tls
shared_postgresql_provisioning_helper_image: docker.io/library/postgres@sha256:dbbeb22a65db2503050cdbbe5e78f017478f10a1002a226463f049dbb017e99b
shared_postgresql_provisioning_check_script: '{{ shared_postgresql_provisioning_repository_root }}/ansible/files/database-provisioning/postgresql-check.sh'
shared_postgresql_provisioning_apply_script: '{{ shared_postgresql_provisioning_repository_root }}/ansible/files/database-provisioning/postgresql-apply.sh'
shared_postgresql_provisioning_scopes:
  - consumer: cristexhub-dev
    database: cristexhub_dev
    role: cristexhub_dev_owner
    secret: shared-postgresql-cristexhub-dev
    other_database: reactive_resume_dev
    activation: inactive
  - consumer: cristexhub-prod
    database: cristexhub_prod
    role: cristexhub_prod_owner
    secret: shared-postgresql-cristexhub-prod
    other_database: reactive_resume_prod
    activation: inactive
  - consumer: reactive-resume-dev
    database: reactive_resume_dev
    role: reactive_resume_dev_owner
    secret: shared-postgresql-reactive-resume-dev
    other_database: cristexhub_dev
    activation: inactive
  - consumer: reactive-resume-prod
    database: reactive_resume_prod
    role: reactive_resume_prod_owner
    secret: shared-postgresql-reactive-resume-prod
    other_database: cristexhub_prod
    activation: inactive
  - consumer: keycloak
    database: keycloak
    role: keycloak_owner
    secret: shared-postgresql-keycloak
    other_database: cristexhub_dev
    activation: inactive
shared_postgresql_provisioning_secret_contract:
  type: Opaque
  keys:
    - password
    - username
  labels:
    app.kubernetes.io/managed-by: infisical
    app.kubernetes.io/part-of: shared-databases
    cristex.io/value-owner: infisical-cloud
shared_postgresql_provisioning_helper_labels:
  app.kubernetes.io/name: shared-postgresql-provision-helper
  app.kubernetes.io/managed-by: ansible
  cristex.io/component: database-logical-provisioning
  cristex.io/provisioning-engine: postgresql
shared_postgresql_provisioning_database_labels:
  app.kubernetes.io/name: shared-postgresql
  app.kubernetes.io/part-of: cristex-platform
shared_postgresql_provisioning_script_hashes:
  postgresql-check.sh: edd5c0b8aee1636b76cae4f2f6ff7e94b54bdb5e62a08e9ea5438eabb224b514
  postgresql-apply.sh: 08a98b5796c2be31d63c6b47e391aaed741bb6620023cc22e3af6abe514cbc4a
