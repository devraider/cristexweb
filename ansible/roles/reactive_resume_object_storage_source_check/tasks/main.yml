---
- name: Reject externally supplied object-storage source-check internals
  ansible.builtin.assert:
    that:
      - item not in vars
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied object-storage
      source-check internal variable {{ item }}.
  loop:
    - reactive_resume_object_storage_source_check_internal_attestation
    - reactive_resume_object_storage_source_check_internal_manifest_states
    - reactive_resume_object_storage_source_check_internal_manifests
    - reactive_resume_object_storage_source_check_internal_manifest_paths
    - reactive_resume_object_storage_source_check_internal_current_path
    - reactive_resume_object_storage_source_check_internal_current_leaf
    - reactive_resume_object_storage_source_check_internal_history_allow_dev
    - reactive_resume_object_storage_source_check_internal_current_app_labels
    - reactive_resume_object_storage_source_check_internal_live_objects
    - reactive_resume_object_storage_source_check_internal_argo
    - reactive_resume_object_storage_source_check_internal_argo_resources
    - reactive_resume_object_storage_source_check_internal_identity_set
    - reactive_resume_object_storage_source_check_internal_namespace
    - reactive_resume_object_storage_source_check_internal_argo_resource_identities
    - reactive_resume_object_storage_source_check_internal_history_configmap
    - reactive_resume_object_storage_source_check_internal_history_statefulset
    - reactive_resume_object_storage_source_check_internal_history_config_volume
    - reactive_resume_object_storage_source_check_internal_history_seaweed_container
    - reactive_resume_object_storage_source_check_internal_history_config_mount
    - reactive_resume_object_storage_source_check_internal_manifest_ledger
    - reactive_resume_object_storage_source_check_internal_history_files
    - reactive_resume_object_storage_source_check_internal_history_directories
    - reactive_resume_object_storage_source_check_internal_history_links
    - reactive_resume_object_storage_source_check_internal_live_secret
    - reactive_resume_object_storage_source_check_internal_live_infisical_source
    - reactive_resume_object_storage_source_check_internal_secret_metadata
    - reactive_resume_object_storage_source_check_internal_alternate_producers
    - reactive_resume_object_storage_source_check_internal_metadata_inventory
  changed_when: false

- name: Require the check-only object-storage source contract
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_OBJECT_STORAGE_SOURCE_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_OBJECT_STORAGE_SOURCE_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_OBJECT_STORAGE_SOURCE_ATTESTATION_FILE') | length > 0
      - reactive_resume_object_storage_source_check_approved | bool
      - ansible_check_mode
      - (ansible_limit | default('') | string) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - reactive_resume_object_storage_source_check_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - reactive_resume_object_storage_source_check_repository_root == (playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname)
      - reactive_resume_object_storage_source_check_namespace == 'shared-services'
      - reactive_resume_object_storage_source_check_object_count == 8
      - reactive_resume_object_storage_source_check_managed_field_managers | length == 8
      - >-
        (reactive_resume_object_storage_source_check_managed_field_managers |
        to_json(sort_keys=true) | hash('sha256')) ==
        'a12c1ccfe58ad1c35408744b43ccb0d4f07eaa1c273a45e1eaccec665549daba'
    fail_msg: >-
      Refusing object-storage source inspection outside the single-host,
      check-only, canonical repository boundary.
  changed_when: false
  no_log: true

- name: Inspect the one-run source-check attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_OBJECT_STORAGE_SOURCE_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: reactive_resume_object_storage_source_check_internal_attestation
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require a private single-use source-check attestation
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_attestation.stat.exists | default(false)
      - reactive_resume_object_storage_source_check_internal_attestation.stat.isreg | default(false)
      - not (reactive_resume_object_storage_source_check_internal_attestation.stat.islnk | default(false))
      - reactive_resume_object_storage_source_check_internal_attestation.stat.pw_name == reactive_resume_object_storage_source_check_controller_user
      - reactive_resume_object_storage_source_check_internal_attestation.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_REACTIVE_RESUME_OBJECT_STORAGE_SOURCE_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_OBJECT_STORAGE_SOURCE_TOKEN') ~ ':entrypoint'
    fail_msg: Refusing a missing, reusable, foreign-owned, or invalid source-check attestation.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Bind the historical source manifest paths
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_manifest_paths: >-
      {{ (reactive_resume_object_storage_source_check_internal_manifest_paths | default([])) +
         [reactive_resume_object_storage_source_check_history_root ~ '/' ~ item.relative] }}
  loop: "{{ reactive_resume_object_storage_source_check_manifest_entries }}"
  changed_when: false
  no_log: true

- name: Inspect every historical object-storage source leaf
  ansible.builtin.stat:
    path: "{{ reactive_resume_object_storage_source_check_history_root }}/{{ item.relative }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ reactive_resume_object_storage_source_check_manifest_entries }}"
  register: reactive_resume_object_storage_source_check_internal_manifest_states
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require exact hash-bound historical source leaves
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == reactive_resume_object_storage_source_check_controller_user
      - item.stat.mode == item.item.mode
      - item.stat.checksum == item.item.sha256
    fail_msg: Refusing missing, symlinked, mode-drifted, or hash-drifted historical source.
  loop: "{{ reactive_resume_object_storage_source_check_internal_manifest_states.results }}"
  loop_control:
    label: "{{ item.item.relative }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect the historical manifest ledger
  ansible.builtin.stat:
    path: "{{ reactive_resume_object_storage_source_check_history_root }}/{{ reactive_resume_object_storage_source_check_manifest_ledger_relative }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  register: reactive_resume_object_storage_source_check_internal_manifest_ledger
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the exact historical manifest ledger
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_manifest_ledger.stat.exists | default(false)
      - reactive_resume_object_storage_source_check_internal_manifest_ledger.stat.isreg | default(false)
      - not (reactive_resume_object_storage_source_check_internal_manifest_ledger.stat.islnk | default(false))
      - reactive_resume_object_storage_source_check_internal_manifest_ledger.stat.pw_name == reactive_resume_object_storage_source_check_controller_user
      - reactive_resume_object_storage_source_check_internal_manifest_ledger.stat.mode == reactive_resume_object_storage_source_check_manifest_ledger_mode
      - reactive_resume_object_storage_source_check_internal_manifest_ledger.stat.checksum == reactive_resume_object_storage_source_check_manifest_ledger_sha256
    fail_msg: Refusing a missing, symlinked, mode-drifted, or hash-drifted manifest ledger.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect the complete historical source directory inventory
  ansible.builtin.find:
    paths: "{{ reactive_resume_object_storage_source_check_history_root }}"
    recurse: true
    file_type: file
    hidden: true
  register: reactive_resume_object_storage_source_check_internal_history_files
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect historical source directories and links
  ansible.builtin.find:
    paths: "{{ reactive_resume_object_storage_source_check_history_root }}"
    recurse: true
    file_type: directory
    hidden: true
  register: reactive_resume_object_storage_source_check_internal_history_directories
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect historical source links
  ansible.builtin.find:
    paths: "{{ reactive_resume_object_storage_source_check_history_root }}"
    recurse: true
    file_type: link
    hidden: true
  register: reactive_resume_object_storage_source_check_internal_history_links
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the exact historical source directory inventory
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_history_files.matched == reactive_resume_object_storage_source_check_object_count + 1
      - >-
        (reactive_resume_object_storage_source_check_internal_history_files.files
        | map(attribute='path') | map('regex_replace', '^' ~ reactive_resume_object_storage_source_check_history_root ~ '/', '') | sort) ==
        ((reactive_resume_object_storage_source_check_manifest_entries
        | map(attribute='relative') | list +
        [reactive_resume_object_storage_source_check_manifest_ledger_relative]) | sort)
      - >-
        (reactive_resume_object_storage_source_check_internal_history_directories.files
        | map(attribute='path') | map('regex_replace', '^' ~ reactive_resume_object_storage_source_check_history_root ~ '/', '') | sort) ==
        ['network', 'runtime', 'source']
      - reactive_resume_object_storage_source_check_internal_history_links.matched == 0
    fail_msg: Refusing a historical source tree with an unexpected or missing file, directory, or link.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Load the value-free historical object-storage source
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_manifests: >-
      {{ (reactive_resume_object_storage_source_check_internal_manifests | default([])) +
         [(lookup('ansible.builtin.file', reactive_resume_object_storage_source_check_history_root ~ '/' ~ item.relative) | from_yaml)] }}
  loop: "{{ reactive_resume_object_storage_source_check_manifest_entries }}"
  changed_when: false
  no_log: true

- name: Bind the exact historical object identities
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_identity_set: >-
      {{ (reactive_resume_object_storage_source_check_internal_identity_set | default([])) +
         [item.apiVersion ~ '|' ~ item.kind ~ '|' ~ (item.metadata.namespace | default('')) ~ '|' ~ item.metadata.name] }}
  loop: "{{ reactive_resume_object_storage_source_check_internal_manifests }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  changed_when: false
  no_log: true

- name: Require the exact eight-object historical source partition
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_manifests | length == 8
      - reactive_resume_object_storage_source_check_internal_identity_set | unique | length == 8
      - reactive_resume_object_storage_source_check_internal_identity_set | sort == [
          'apps/v1|StatefulSet|shared-services|reactive-resume-object-storage',
          'v1|ConfigMap|shared-services|reactive-resume-object-storage-config',
          'v1|Service|shared-services|reactive-resume-object-storage',
          'v1|ServiceAccount|shared-services|reactive-resume-object-storage',
          'networking.k8s.io/v1|NetworkPolicy|shared-services|reactive-resume-object-storage-allow-dev',
          'networking.k8s.io/v1|NetworkPolicy|shared-services|reactive-resume-object-storage-allow-dns',
          'networking.k8s.io/v1|NetworkPolicy|shared-services|reactive-resume-object-storage-default-deny',
          'secrets.infisical.com/v1beta1|InfisicalStaticSecret|shared-services|reactive-resume-object-storage-auth'
        ] | sort
      - reactive_resume_object_storage_source_check_internal_manifests | selectattr('kind', 'equalto', 'Secret') | list | length == 0
      - reactive_resume_object_storage_source_check_internal_manifests | selectattr('kind', 'equalto', 'PersistentVolumeClaim') | list | length == 0
      - reactive_resume_object_storage_source_check_internal_manifests | selectattr('kind', 'equalto', 'Ingress') | list | length == 0
      - reactive_resume_object_storage_source_check_internal_manifests | selectattr('kind', 'equalto', 'Job') | list | length == 0
    fail_msg: Refusing a historical source outside the exact private object-storage closure.
  changed_when: false
  no_log: true

- name: Bind the historical ConfigMap and StatefulSet source objects
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_history_configmap: >-
      {{ reactive_resume_object_storage_source_check_internal_manifests |
         selectattr('kind', 'equalto', 'ConfigMap') | list | first }}
    reactive_resume_object_storage_source_check_internal_history_statefulset: >-
      {{ reactive_resume_object_storage_source_check_internal_manifests |
         selectattr('kind', 'equalto', 'StatefulSet') | list | first }}
  changed_when: false
  no_log: true

- name: Bind the historical ConfigMap volume and SeaweedFS mount
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_history_config_volume: >-
      {{ reactive_resume_object_storage_source_check_internal_history_statefulset.spec.template.spec.volumes |
         selectattr('name', 'equalto', 'object-storage-config') | list | first }}
    reactive_resume_object_storage_source_check_internal_history_seaweed_container: >-
      {{ reactive_resume_object_storage_source_check_internal_history_statefulset.spec.template.spec.containers |
         selectattr('name', 'equalto', 'seaweedfs') | list | first }}
  changed_when: false
  no_log: true

- name: Bind the historical ConfigMap volume mount
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_history_config_mount: >-
      {{ reactive_resume_object_storage_source_check_internal_history_seaweed_container.volumeMounts |
         selectattr('name', 'equalto', 'object-storage-config') | list | first }}
  changed_when: false
  no_log: true

- name: Require the historical StatefulSet to use its ConfigMap source
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_history_configmap.metadata.name == 'reactive-resume-object-storage-config'
      - reactive_resume_object_storage_source_check_internal_history_config_volume.configMap.name == 'reactive-resume-object-storage-config'
      - reactive_resume_object_storage_source_check_internal_history_config_mount.mountPath == '/etc/seaweedfs/s3.json'
      - reactive_resume_object_storage_source_check_internal_history_config_mount.subPath == 's3.json'
      - >-
        '-s3.config=/etc/seaweedfs/s3.json' in
        reactive_resume_object_storage_source_check_internal_history_seaweed_container.args
    fail_msg: Refusing a historical StatefulSet that bypasses its recorded ConfigMap.
  changed_when: false
  no_log: true

- name: Bind the current DEV policy source path
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_current_path: >-
      {{ reactive_resume_object_storage_source_check_repository_root ~ '/' ~
         reactive_resume_object_storage_source_check_current_allow_dev_relative }}
  changed_when: false
  no_log: true

- name: Inspect the current DEV object-storage allow policy source
  ansible.builtin.stat:
    path: "{{ reactive_resume_object_storage_source_check_internal_current_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  register: reactive_resume_object_storage_source_check_internal_current_leaf
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the bound current DEV policy leaf
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_current_leaf.stat.exists | default(false)
      - reactive_resume_object_storage_source_check_internal_current_leaf.stat.isreg | default(false)
      - not (reactive_resume_object_storage_source_check_internal_current_leaf.stat.islnk | default(false))
      - reactive_resume_object_storage_source_check_internal_current_leaf.stat.pw_name == reactive_resume_object_storage_source_check_controller_user
      - reactive_resume_object_storage_source_check_internal_current_leaf.stat.mode == '0644'
      - reactive_resume_object_storage_source_check_internal_current_leaf.stat.checksum == reactive_resume_object_storage_source_check_current_allow_dev_sha256
    fail_msg: Refusing an unbound current object-storage policy leaf.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Load the current DEV policy leaf without mutating it
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_current_leaf: >-
      {{ lookup('ansible.builtin.file', reactive_resume_object_storage_source_check_internal_current_path) | from_yaml }}
  changed_when: false
  no_log: true

- name: Bind the historical allow policy identity
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_history_allow_dev: >-
      {{ reactive_resume_object_storage_source_check_internal_manifests
         | selectattr('kind', 'equalto', 'NetworkPolicy')
         | selectattr('metadata.name', 'equalto', 'reactive-resume-object-storage-allow-dev')
         | list | first }}
  changed_when: false
  no_log: true

- name: Bind the current app selector identity
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_current_app_labels: >-
      {{ reactive_resume_object_storage_source_check_internal_current_leaf.spec.ingress[0]['from'][0].podSelector.matchLabels }}
  changed_when: false
  no_log: true

- name: Bind the historical/current source difference
  ansible.builtin.assert:
    that:
      - >-
        reactive_resume_object_storage_source_check_internal_current_leaf.metadata.labels['cristex.io/component'] ==
        reactive_resume_object_storage_source_check_current_allow_dev_component
      - >-
        reactive_resume_object_storage_source_check_internal_current_leaf.metadata.annotations['cristex.io/source-service'] ==
        'reactive-resume-dev'
      - >-
        reactive_resume_object_storage_source_check_internal_current_leaf.metadata.annotations['cristex.io/source-service-port'] == '8333'
      - reactive_resume_object_storage_source_check_internal_current_app_labels['app.kubernetes.io/part-of'] == 'cristexhub'
      - >-
        reactive_resume_object_storage_source_check_internal_history_allow_dev.metadata.labels['cristex.io/component'] ==
        reactive_resume_object_storage_source_check_history_allow_dev_component
      - reactive_resume_object_storage_source_check_internal_history_allow_dev.metadata.annotations | default({}) == {}
    fail_msg: Historical/current object-storage source identity difference is not explicitly bound.
  changed_when: false
  no_log: true

- name: Inspect the current shared-services Namespace metadata
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ reactive_resume_object_storage_source_check_namespace }}"
    kubeconfig: "{{ reactive_resume_object_storage_source_check_kubeconfig }}"
  register: reactive_resume_object_storage_source_check_internal_namespace
  check_mode: false
  changed_when: false
  no_log: true

- name: Require the established shared-services Namespace identity
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_namespace.resources | length == 1
      - reactive_resume_object_storage_source_check_internal_namespace.resources[0].status.phase == 'Active'
      - reactive_resume_object_storage_source_check_internal_namespace.resources[0].metadata.labels.get('app.kubernetes.io/part-of') == 'cristex-platform'
    fail_msg: Refusing source binding against a missing or drifted shared-services Namespace.
  changed_when: false
  no_log: true

- name: Inspect current object-storage identities without reading Secret or PVC data
  kubernetes.core.k8s_info:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace | default(omit) }}"
    kubeconfig: "{{ reactive_resume_object_storage_source_check_kubeconfig }}"
  loop: "{{ reactive_resume_object_storage_source_check_internal_manifests | rejectattr('kind', 'equalto', 'InfisicalStaticSecret') | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: reactive_resume_object_storage_source_check_internal_live_objects
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true

- name: Require every historical runtime object-storage identity to be live exactly once
  ansible.builtin.assert:
    that:
      - >-
        reactive_resume_object_storage_source_check_internal_live_objects.results | length ==
        reactive_resume_object_storage_source_check_live_runtime_object_count
      - item.failed | default(false) | bool == false
      - item.resources | default([]) | length == 1
    fail_msg: Refusing a partial or absent live object-storage runtime closure; no apply path exists.
  loop: "{{ reactive_resume_object_storage_source_check_internal_live_objects.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true

- name: Inspect live object-storage Secret custody metadata with exact PartialObjectMetadata closure without requesting Secret data
  reactive_resume_object_storage_metadata:
    kubeconfig: "{{ reactive_resume_object_storage_source_check_kubeconfig }}"
    api_path: "{{ reactive_resume_object_storage_source_check_secret_metadata_resource.api_path }}"
  register: reactive_resume_object_storage_source_check_internal_secret_metadata
  check_mode: false
  changed_when: false
  no_log: true

- name: Require the exact alternate producer collection inventory
  ansible.builtin.assert:
    that:
      - >-
        reactive_resume_object_storage_source_check_alternate_producers |
        map(attribute='kind') | list ==
        ['InfisicalSecret', 'InfisicalStaticSecret', 'InfisicalPushSecret',
        'InfisicalDynamicSecret', 'ExternalSecret', 'SealedSecret',
        'SecretProviderClass']
      - >-
        reactive_resume_object_storage_source_check_alternate_producers |
        map(attribute='api_version') | list ==
        ['secrets.infisical.com/v1alpha1', 'secrets.infisical.com/v1beta1',
        'secrets.infisical.com/v1alpha1', 'secrets.infisical.com/v1alpha1',
        'external-secrets.io/v1beta1', 'bitnami.com/v1alpha1',
        'secrets-store.csi.x-k8s.io/v1']
      - item.kind in ['InfisicalSecret', 'InfisicalStaticSecret',
        'InfisicalPushSecret', 'InfisicalDynamicSecret', 'ExternalSecret',
        'SealedSecret', 'SecretProviderClass']
      - item.api_version is match('^[a-z0-9.-]+/v[0-9]')
      - item.target_namespace == reactive_resume_object_storage_source_check_secret_metadata_resource.namespace
      - item.target_name == reactive_resume_object_storage_source_check_live_secret_name
      - item.api_path is match('^/apis/.+/v')
    fail_msg: Refusing an incomplete or misbound alternate producer inventory.
  loop: "{{ reactive_resume_object_storage_source_check_alternate_producers }}"
  loop_control:
    label: "{{ item.kind }} -> {{ item.target_namespace }}/{{ item.target_name }}"
  changed_when: false
  no_log: true

- name: Inventory every alternate producer collection with PartialObjectMetadataList without requesting Secret data
  reactive_resume_object_storage_metadata:
    kubeconfig: "{{ reactive_resume_object_storage_source_check_kubeconfig }}"
    api_path: "{{ item.api_path }}"
    collection: true
    resource_kind: "{{ item.kind }}"
    resource_api_version: "{{ item.api_version }}"
  loop: "{{ reactive_resume_object_storage_source_check_alternate_producers }}"
  loop_control:
    label: "{{ item.kind }} -> {{ item.target_namespace }}/{{ item.target_name }}"
  register: reactive_resume_object_storage_source_check_internal_alternate_producers
  check_mode: false
  changed_when: false
  no_log: true

- name: Initialize the sanitized owner provenance and deletion metadata inventory
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_metadata_inventory:
      - identity: "Secret/shared-services/{{ reactive_resume_object_storage_source_check_live_secret_name }}"
        found: "{{ reactive_resume_object_storage_source_check_internal_secret_metadata.found | default(false) }}"
        metadata: "{{ reactive_resume_object_storage_source_check_internal_secret_metadata.metadata | default({}) }}"
  changed_when: false
  no_log: true

- name: Inventory alternate producer owner provenance and deletion metadata
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_metadata_inventory: >-
      {{ reactive_resume_object_storage_source_check_internal_metadata_inventory + [
        {
          'identity': item.item.kind,
          'api_version': item.item.api_version,
          'target_namespace': item.item.target_namespace,
          'target_name': item.item.target_name,
          'found': item.found | default(false),
          'metadata': item.metadata | default({}),
          'target_identities': item.targets | default([])
        }
      ] }}
  loop: "{{ reactive_resume_object_storage_source_check_internal_alternate_producers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.kind }} collection"
  changed_when: false
  no_log: true

- name: Require historical Infisical source absence and separate live Secret custody
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_secret_metadata.api_available | default(false) | bool
      - reactive_resume_object_storage_source_check_internal_secret_metadata.found | default(false) | bool
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.name == reactive_resume_object_storage_source_check_live_secret_name
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.labels == reactive_resume_object_storage_source_check_live_secret_labels
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.annotations.get('argocd.argoproj.io/instance', '') == ''
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.annotations.get('argocd.argoproj.io/tracking-id', '') == ''
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.ownerReferences | default([]) | length == 0
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.finalizers | default([]) | length == 0
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.deletionTimestamp | default(None) is none
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.deletionGracePeriodSeconds | default(None) is none
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields is defined
      - reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields | length > 0
      - >-
        (reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        map(attribute='manager') | list | sort) ==
        (reactive_resume_object_storage_source_check_managed_field_managers[
        'v1|Secret|shared-services|' ~ reactive_resume_object_storage_source_check_live_secret_name] | sort)
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        rejectattr('manager', 'undefined') | list | length ==
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields | length
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        rejectattr('operation', 'equalto', 'Update') | list | length == 0
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        rejectattr('apiVersion', 'equalto', 'v1') | list | length == 0
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        rejectattr('fieldsType', 'equalto', 'FieldsV1') | list | length == 0
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        selectattr('fieldsV1', 'defined') | list | length ==
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields | length
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        map(attribute='fieldsV1') | map('type_debug') | reject('equalto', 'dict') | list | length == 0
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        map(attribute='fieldsV1') | map('length') | select('equalto', 0) | list | length == 0
      - >-
        reactive_resume_object_storage_source_check_internal_secret_metadata.metadata.managedFields |
        selectattr('subresource', 'defined') | map(attribute='subresource') |
        reject('in', [None, '']) | list | length == 0
    fail_msg: Refusing missing, foreign, owned, terminating, or value-unverified live Secret custody.
  changed_when: false
  no_log: true

- name: Require the historical object-storage target contract without requesting Secret data
  ansible.builtin.assert:
    that:
      - >-
        (reactive_resume_object_storage_source_check_internal_manifests |
        selectattr('kind', 'equalto', 'InfisicalStaticSecret') | list | first).spec.targets | length == 1
      - >-
        (reactive_resume_object_storage_source_check_internal_manifests |
        selectattr('kind', 'equalto', 'InfisicalStaticSecret') | list | first).spec.targets[0].name ==
        reactive_resume_object_storage_source_check_live_secret_name
      - >-
        (reactive_resume_object_storage_source_check_internal_manifests |
        selectattr('kind', 'equalto', 'InfisicalStaticSecret') | list | first).spec.targets[0].namespace ==
        reactive_resume_object_storage_source_check_secret_metadata_resource.namespace
      - >-
        (reactive_resume_object_storage_source_check_internal_manifests |
        selectattr('kind', 'equalto', 'InfisicalStaticSecret') | list | first).spec.targets[0].kind == 'Secret'
      - >-
        (reactive_resume_object_storage_source_check_internal_manifests |
        selectattr('kind', 'equalto', 'InfisicalStaticSecret') | list | first).spec.targets[0].secretType ==
        reactive_resume_object_storage_source_check_live_secret_type
    fail_msg: Refusing an object-storage target source without the exact Opaque Secret contract.
  changed_when: false
  no_log: true

- name: Require alternate producers to omit only the exact object-storage Secret target
  ansible.builtin.assert:
    that:
      - item.api_available | default(false) | bool
      - item.item.target_namespace == reactive_resume_object_storage_source_check_secret_metadata_resource.namespace
      - item.item.target_name == reactive_resume_object_storage_source_check_live_secret_name
      - >-
        (item.targets | default([]) |
        selectattr('kind', 'equalto', 'Secret') |
        selectattr('namespace', 'equalto', item.item.target_namespace) |
        selectattr('name', 'equalto', item.item.target_name) | list | length) == 0
    fail_msg: >-
      Refusing an alternate Secret producer targeting the object-storage Secret
      {{ item.item.target_namespace }}/{{ item.item.target_name }}:
      {{ item.item.kind }}.
  loop: "{{ reactive_resume_object_storage_source_check_internal_alternate_producers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.kind }} collection -> {{ item.item.target_namespace }}/{{ item.item.target_name }}"
  changed_when: false
  no_log: true

- name: Require live source objects have no foreign owner or deletion metadata
  ansible.builtin.assert:
    that:
      - item.resources[0].metadata.ownerReferences | default([]) | length == 0
      - item.resources[0].metadata.finalizers | default([]) | length == 0
      - item.resources[0].metadata.deletionTimestamp | default(None) is none
      - item.resources[0].metadata.deletionGracePeriodSeconds | default(None) is none
    fail_msg: Refusing an object-storage source with foreign ownership or pending deletion metadata.
  loop: "{{ reactive_resume_object_storage_source_check_internal_live_objects.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true

- name: Require current object ownership to remain Ansible pending Argo handoff
  ansible.builtin.assert:
    that:
      - item.resources[0].metadata.labels.get('app.kubernetes.io/name') == 'reactive-resume-object-storage'
      - item.resources[0].metadata.labels.get('app.kubernetes.io/managed-by') == 'ansible'
      - item.resources[0].metadata.labels.get('cristex.io/bootstrap-writer') == 'ansible'
      - item.resources[0].metadata.labels.get('cristex.io/desired-owner') == 'argocd'
      - item.resources[0].metadata.labels.get('argocd.argoproj.io/instance', '') == ''
      - item.resources[0].metadata.annotations.get('argocd.argoproj.io/tracking-id', '') == ''
      - item.resources[0].metadata.managedFields is defined
      - item.resources[0].metadata.managedFields | length > 0
      - >-
        (item.resources[0].metadata.managedFields |
        map(attribute='manager') | list | sort) ==
        (reactive_resume_object_storage_source_check_managed_field_managers[
        item.item.apiVersion ~ '|' ~ item.item.kind ~ '|' ~
        item.item.metadata.namespace ~ '|' ~ item.item.metadata.name] | sort)
      - >-
        item.resources[0].metadata.managedFields |
        rejectattr('manager', 'undefined') | list | length ==
        item.resources[0].metadata.managedFields | length
      - >-
        item.resources[0].metadata.managedFields |
        rejectattr('operation', 'equalto', 'Update') | list | length == 0
      - >-
        item.resources[0].metadata.managedFields |
        rejectattr('apiVersion', 'equalto', item.item.apiVersion) | list | length == 0
      - >-
        item.resources[0].metadata.managedFields |
        rejectattr('fieldsType', 'equalto', 'FieldsV1') | list | length == 0
      - >-
        item.resources[0].metadata.managedFields |
        selectattr('fieldsV1', 'defined') | list | length ==
        item.resources[0].metadata.managedFields | length
      - >-
        item.resources[0].metadata.managedFields |
        map(attribute='fieldsV1') | map('type_debug') | reject('equalto', 'dict') | list | length == 0
      - >-
        item.resources[0].metadata.managedFields |
        map(attribute='fieldsV1') | map('length') | select('equalto', 0) | list | length == 0
      - >-
        item.resources[0].metadata.managedFields |
        selectattr('subresource', 'defined') | map(attribute='subresource') |
        reject('in', [None, '']) | list | length == 0
    fail_msg: Refusing a live object-storage identity with unreviewed ownership, managed-field provenance, or Argo tracking metadata.
  loop: "{{ reactive_resume_object_storage_source_check_internal_live_objects.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true

- name: Require exact normalized current object full-spec fidelity
  reactive_resume_object_storage_full_spec_guarded:
    desired: >-
      {{ reactive_resume_object_storage_source_check_internal_current_leaf
         if item.item.metadata.name == 'reactive-resume-object-storage-allow-dev'
         else item.item }}
    live: "{{ item.resources[0] }}"
  loop: "{{ reactive_resume_object_storage_source_check_internal_live_objects.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true

- name: Inspect current Argo ownership metadata only
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ reactive_resume_object_storage_source_check_argo_application }}"
    namespace: "{{ reactive_resume_object_storage_source_check_argo_namespace }}"
    kubeconfig: "{{ reactive_resume_object_storage_source_check_kubeconfig }}"
  register: reactive_resume_object_storage_source_check_internal_argo
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true

- name: Bind current Argo resources for read-only assertions
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_argo_resources: >-
      {{ reactive_resume_object_storage_source_check_internal_argo.resources | default([]) }}
  changed_when: false
  no_log: true

- name: Require exactly one current Argo Application and exact handoff state
  ansible.builtin.assert:
    that:
      - reactive_resume_object_storage_source_check_internal_argo.failed | default(false) | bool == false
      - reactive_resume_object_storage_source_check_internal_argo_resources | length == 1
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].status.sync.status ==
        reactive_resume_object_storage_source_check_argo_sync_status
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].status.health.status ==
        reactive_resume_object_storage_source_check_argo_health_status
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].status.sync.revision ==
        reactive_resume_object_storage_source_check_argo_revision
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.source.repoURL ==
        reactive_resume_object_storage_source_check_argo_repo_url
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.source.path ==
        reactive_resume_object_storage_source_check_argo_path
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.source.targetRevision ==
        reactive_resume_object_storage_source_check_argo_revision
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.destination.server ==
        reactive_resume_object_storage_source_check_argo_destination_server
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.destination.namespace ==
        reactive_resume_object_storage_source_check_argo_destination_namespace
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.project ==
        reactive_resume_object_storage_source_check_argo_project
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.syncPolicy.automated.selfHeal ==
        reactive_resume_object_storage_source_check_argo_self_heal
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.syncPolicy.automated.prune ==
        reactive_resume_object_storage_source_check_argo_prune
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.syncPolicy.automated.allowEmpty ==
        reactive_resume_object_storage_source_check_argo_allow_empty
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].spec.syncPolicy.syncOptions | sort ==
        reactive_resume_object_storage_source_check_argo_sync_options | sort
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].status.resources | length ==
        reactive_resume_object_storage_source_check_argo_resource_identities | length
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].status.resources |
        map(attribute='group') | list | length ==
        reactive_resume_object_storage_source_check_argo_resource_identities | length
    fail_msg: Refusing a missing, unhealthy, drifted, or unexpectedly reconciled Argo Application.
  changed_when: false
  no_log: true

- name: Bind the exact current Argo resource inventory
  ansible.builtin.set_fact:
    reactive_resume_object_storage_source_check_internal_argo_resource_identities: >-
      {{ (reactive_resume_object_storage_source_check_internal_argo_resource_identities | default([])) +
         [(item.group | default('')) ~ '|' ~ item.version ~ '|' ~ item.kind ~ '|' ~
          item.namespace ~ '|' ~ item.name] }}
  loop: "{{ reactive_resume_object_storage_source_check_internal_argo_resources[0].status.resources }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  changed_when: false
  no_log: true

- name: Require exact Argo resource inventory without shared-services handoff
  ansible.builtin.assert:
    that:
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resource_identities | sort ==
        reactive_resume_object_storage_source_check_argo_resource_identities | sort
      - >-
        reactive_resume_object_storage_source_check_internal_argo_resources[0].status.resources |
        selectattr('namespace', 'equalto', reactive_resume_object_storage_source_check_namespace) | list | length == 0
    fail_msg: Refusing Argo ownership evidence that includes an unexpected or shared-services object.
  changed_when: false
  no_log: true

- name: Emit a sanitized read-only ownership result
  ansible.builtin.debug:
    msg: >-
      object_storage_source_check=passed historical_objects=8 live_runtime_objects=7
      historical_infisical_static_secret=absent live_secret_custody=present current_leaf=bound
      live_identity_query=partial_metadata_and_nonsecret_full_spec secret_values_requested=false pvc_data_read=false
      argo_application=present argo_sync=Synced argo_health=Healthy argo_shared_services_resources=0
      argo_tracking=absent handoff=not_proven argo_apply=false pvc_apply=false delete=false
  changed_when: false
