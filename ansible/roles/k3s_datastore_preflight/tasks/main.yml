---
- name: Reject externally supplied k3s datastore preflight internals
  ansible.builtin.assert:
    that:
      - item not in vars
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied k3s datastore preflight
      internal variable.
  loop:
    - k3s_datastore_preflight_internal_attestation_state
    - k3s_datastore_preflight_internal_executable_state
    - k3s_datastore_preflight_internal_config_path_states
    - k3s_datastore_preflight_internal_config_state
    - k3s_datastore_preflight_internal_config_post_state
    - k3s_datastore_preflight_internal_config_slurp_result
    - k3s_datastore_preflight_internal_config_content_stable
    - k3s_datastore_preflight_internal_config_raw
    - k3s_datastore_preflight_internal_config_decode_result
    - k3s_datastore_preflight_internal_config_payload
    - k3s_datastore_preflight_internal_config_parse_result
    - k3s_datastore_preflight_internal_config_validation_result
    - k3s_datastore_preflight_internal_config_key_counts
    - k3s_datastore_preflight_internal_config_read_allowed
    - k3s_datastore_preflight_internal_config_parse_valid
    - k3s_datastore_preflight_internal_config_data_dir_state
    - k3s_datastore_preflight_internal_config_external_marker
    - k3s_datastore_preflight_internal_config_etcd_marker
    - k3s_datastore_preflight_internal_config_encryption_status
    - k3s_datastore_preflight_internal_data_dir_state
    - k3s_datastore_preflight_internal_remote_path_states
    - k3s_datastore_preflight_internal_controller_output_path_states
    - k3s_datastore_preflight_internal_sqlite_marker_state
    - k3s_datastore_preflight_internal_etcd_marker_state
    - k3s_datastore_preflight_internal_version_result
    - k3s_datastore_preflight_internal_exec_start_result
    - k3s_datastore_preflight_internal_environment_results
    - k3s_datastore_preflight_internal_environment_post_results
    - k3s_datastore_preflight_internal_environment_file_path_states
    - k3s_datastore_preflight_internal_environment_file_states
    - k3s_datastore_preflight_internal_environment_file_post_states
    - k3s_datastore_preflight_internal_environment_file_key_count_result
    - k3s_datastore_preflight_internal_environment_file_path_exact
    - k3s_datastore_preflight_internal_environment_file_read_allowed
    - k3s_datastore_preflight_internal_environment_file_content_stable
    - k3s_datastore_preflight_internal_environment_file_key_count
    - k3s_datastore_preflight_internal_environment_file_relevant_keys_absent
    - k3s_datastore_preflight_internal_environment_overrides_absent
    - k3s_datastore_preflight_internal_encryption_result
    - k3s_datastore_preflight_internal_encryption_payload
    - k3s_datastore_preflight_internal_encryption_key_counts
    - k3s_datastore_preflight_internal_encryption_parse_result
    - k3s_datastore_preflight_internal_encryption_validation_result
    - k3s_datastore_preflight_internal_encryption_json_valid
    - k3s_datastore_preflight_internal_k3s_service_result
    - k3s_datastore_preflight_internal_tailscaled_service_result
    - k3s_datastore_preflight_internal_nodes_result
    - k3s_datastore_preflight_internal_node_payload
    - k3s_datastore_preflight_internal_node_parse_result
    - k3s_datastore_preflight_internal_node_envelope_result
    - k3s_datastore_preflight_internal_node_items_result
    - k3s_datastore_preflight_internal_node_query_valid
    - k3s_datastore_preflight_internal_ready_node_count
    - k3s_datastore_preflight_internal_node_count
    - k3s_datastore_preflight_internal_exec_start_server_marker
    - k3s_datastore_preflight_internal_exec_start_agent_marker
    - k3s_datastore_preflight_internal_config_arg_marker
    - k3s_datastore_preflight_internal_config_arg_exact_marker
    - k3s_datastore_preflight_internal_config_arg_other_marker
    - k3s_datastore_preflight_internal_data_dir_arg_marker
    - k3s_datastore_preflight_internal_data_dir_arg_exact_marker
    - k3s_datastore_preflight_internal_config_arg_count
    - k3s_datastore_preflight_internal_data_dir_arg_count
    - k3s_datastore_preflight_internal_external_arg_count
    - k3s_datastore_preflight_internal_external_arg_exact_marker
    - k3s_datastore_preflight_internal_cluster_init_arg_count
    - k3s_datastore_preflight_internal_cluster_reset_arg_count
    - k3s_datastore_preflight_internal_cluster_reset_restore_path_arg_count
    - k3s_datastore_preflight_internal_etcd_marker
    - k3s_datastore_preflight_internal_external_marker
    - k3s_datastore_preflight_internal_sqlite_marker
    - k3s_datastore_preflight_internal_datastore_type
    - k3s_datastore_preflight_internal_version
    - k3s_datastore_preflight_internal_executable_status
    - k3s_datastore_preflight_internal_config_status
    - k3s_datastore_preflight_internal_exec_start_status
    - k3s_datastore_preflight_internal_data_dir_source
    - k3s_datastore_preflight_internal_service_fields
    - k3s_datastore_preflight_internal_k3s_service_stage
    - k3s_datastore_preflight_internal_tailscaled_service_stage
    - k3s_datastore_preflight_internal_encryption_header
    - k3s_datastore_preflight_internal_encryption_status_values
    - k3s_datastore_preflight_internal_encryption_enabled_marker
    - k3s_datastore_preflight_internal_encryption_disabled_marker
    - k3s_datastore_preflight_internal_rotation_values
    - k3s_datastore_preflight_internal_encryption_command_status
    - k3s_datastore_preflight_internal_encryption_status
    - k3s_datastore_preflight_internal_rotation_stage
    - k3s_datastore_preflight_internal_report
    - k3s_datastore_preflight_internal_output_state
    - k3s_datastore_preflight_internal_output_post_state
  changed_when: false

- name: Require the exact read-only k3s datastore preflight invocation
  ansible.builtin.assert:
    that:
      - k3s_datastore_preflight_approved | bool
      - k3s_datastore_preflight_elevated_requested | bool
      - k3s_datastore_preflight_elevated_approved | bool
      - ansible_check_mode
      - ansible_diff_mode
      - (ansible_limit | default('') | string) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - k3s_datastore_preflight_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - k3s_datastore_preflight_k3s_binary == '/usr/local/bin/k3s'
      - k3s_datastore_preflight_systemctl_binary == '/usr/bin/systemctl'
      - >-
        k3s_datastore_preflight_environment_file_paths ==
        ['/etc/default/k3s', '/etc/sysconfig/k3s',
        '/etc/systemd/system/k3s.service.env']
      - k3s_datastore_preflight_environment_file_path_components ==
        ['/etc', '/etc/systemd', '/etc/systemd/system']
      - k3s_datastore_preflight_config_path == '/etc/rancher/k3s/config.yaml'
      - k3s_datastore_preflight_config_max_bytes == 65536
      - k3s_datastore_preflight_encryption_output_max_bytes == 65536
      - k3s_datastore_preflight_config_path_components == ['/etc', '/etc/rancher', '/etc/rancher/k3s']
      - k3s_datastore_preflight_data_dir == '/var/lib/rancher/k3s/server/db'
      - k3s_datastore_preflight_sqlite_marker_path == '/var/lib/rancher/k3s/server/db/state.db'
      - k3s_datastore_preflight_etcd_marker_path == '/var/lib/rancher/k3s/server/db/etcd'
      - >-
        k3s_datastore_preflight_remote_path_components ==
        ['/var', '/var/lib', '/var/lib/rancher', '/var/lib/rancher/k3s',
        '/var/lib/rancher/k3s/server', '/var/lib/rancher/k3s/server/db']
      - >-
        k3s_datastore_preflight_controller_output_path_components ==
        [playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname,
        playbook_dir | ansible.builtin.dirname,
        (playbook_dir | ansible.builtin.dirname) ~ '/.ansible']
      - k3s_datastore_preflight_output_path == (playbook_dir ~ '/../.ansible/k3s-datastore-preflight.local.json')
    fail_msg: >-
      This source-only preflight requires explicit elevation approval, --check,
      --diff, the exact crtxweb one-host limit, protected fixed paths, and the
      canonical controller artifact destination.
  changed_when: false

- name: Require the canonical wrapper entrypoint
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_K3S_DATASTORE_PREFLIGHT_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_K3S_DATASTORE_PREFLIGHT_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_K3S_DATASTORE_PREFLIGHT_ATTESTATION_FILE') | length > 0
      - k3s_datastore_preflight_controller_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - k3s_datastore_preflight_controller_user == lookup('ansible.builtin.env', 'USER')
    fail_msg: >-
      ENTRYPOINT_GUARD: use only the canonical non-passthrough preflight wrapper.
  changed_when: false

- name: Inspect the ephemeral preflight attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_K3S_DATASTORE_PREFLIGHT_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_attestation_state
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the private single-run preflight attestation
  ansible.builtin.assert:
    that:
      - k3s_datastore_preflight_internal_attestation_state.stat.exists | default(false)
      - k3s_datastore_preflight_internal_attestation_state.stat.isreg | default(false)
      - not (k3s_datastore_preflight_internal_attestation_state.stat.islnk | default(false))
      - k3s_datastore_preflight_internal_attestation_state.stat.pw_name == k3s_datastore_preflight_controller_user
      - k3s_datastore_preflight_internal_attestation_state.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_K3S_DATASTORE_PREFLIGHT_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_K3S_DATASTORE_PREFLIGHT_TOKEN') ~ ':entrypoint'
    fail_msg: >-
      ENTRYPOINT_GUARD: refusing a missing, reusable, foreign-owned, symlinked,
      or invalid preflight attestation.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect every fixed remote datastore path component
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /var
    - /var/lib
    - /var/lib/rancher
    - /var/lib/rancher/k3s
    - /var/lib/rancher/k3s/server
    - /var/lib/rancher/k3s/server/db
  register: k3s_datastore_preflight_internal_remote_path_states
  no_log: true

- name: Require root-owned non-symlinked remote datastore path components
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode in ['0700', '0711', '0750', '0755']
    fail_msg: >-
      DATASTORE_PATH_GUARD: a fixed datastore path component is missing,
      symlinked, foreign-owned, non-directory, or writable beyond the reviewed modes.
  loop: "{{ k3s_datastore_preflight_internal_remote_path_states.results }}"
  loop_control:
    label: redacted-fixed-component
  no_log: true

- name: Inspect every fixed k3s config path component
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /etc
    - /etc/rancher
    - /etc/rancher/k3s
  register: k3s_datastore_preflight_internal_config_path_states
  no_log: true

- name: Require root-owned non-symlinked k3s config path components
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode in ['0700', '0711', '0750', '0755']
    fail_msg: >-
      CONFIG_PATH_GUARD: a fixed config path component is missing, symlinked,
      foreign-owned, non-directory, or writable beyond the reviewed modes.
  loop: "{{ k3s_datastore_preflight_internal_config_path_states.results }}"
  loop_control:
    label: redacted-config-component
  no_log: true

- name: Inspect every fixed k3s EnvironmentFile parent path component
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /etc
    - /etc/systemd
    - /etc/systemd/system
  register: k3s_datastore_preflight_internal_environment_file_path_states
  no_log: true

- name: Require root-owned non-symlinked k3s EnvironmentFile parent path components
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode in ['0700', '0711', '0750', '0755']
    fail_msg: >-
      ENVIRONMENT_PATH_GUARD: a fixed k3s EnvironmentFile parent is missing,
      symlinked, foreign-owned, non-directory, or writable beyond the reviewed modes.
  loop: "{{ k3s_datastore_preflight_internal_environment_file_path_states.results }}"
  loop_control:
    label: redacted-environment-component
  no_log: true

- name: Inspect every canonical controller output path component
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - "{{ playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname }}"
    - "{{ playbook_dir | ansible.builtin.dirname }}"
    - "{{ playbook_dir | ansible.builtin.dirname }}/.ansible"
  register: k3s_datastore_preflight_internal_controller_output_path_states
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require owned non-symlinked controller output path components
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == k3s_datastore_preflight_controller_user
      - item.stat.mode in ['0700', '0750', '0755']
    fail_msg: >-
      OUTPUT_PATH_GUARD: a canonical controller path component is missing,
      symlinked, foreign-owned, non-directory, or writable beyond reviewed modes.
  loop: "{{ k3s_datastore_preflight_internal_controller_output_path_states.results }}"
  loop_control:
    label: redacted-canonical-component
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect the fixed k3s executable metadata
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_executable_state
  no_log: true

- name: Inspect the fixed k3s configuration metadata before private parsing
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_config_state
  no_log: true

- name: Inspect the fixed k3s datastore directory metadata without reading content
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_data_dir_state
  no_log: true

- name: Establish the bounded private k3s config read gate
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_read_allowed: >-
      {{ k3s_datastore_preflight_internal_config_state.stat.exists | default(false) | bool and
         k3s_datastore_preflight_internal_config_state.stat.isreg | default(false) | bool and
         not (k3s_datastore_preflight_internal_config_state.stat.islnk | default(false) | bool) and
         k3s_datastore_preflight_internal_config_state.stat.pw_name | default('') == 'root' and
         k3s_datastore_preflight_internal_config_state.stat.gr_name | default('') == 'root' and
         k3s_datastore_preflight_internal_config_state.stat.mode | default('') == '0600' and
         k3s_datastore_preflight_internal_config_state.stat.nlink | default(0) | int == 1 and
         k3s_datastore_preflight_internal_config_state.stat.size is number and
         k3s_datastore_preflight_internal_config_state.stat.size | int > 0 and
         k3s_datastore_preflight_internal_config_state.stat.size | int <= k3s_datastore_preflight_config_max_bytes }}
    k3s_datastore_preflight_internal_config_content_stable: false
  changed_when: false
  no_log: true

- name: Privately slurp only the bounded fixed k3s config
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/config.yaml
  register: k3s_datastore_preflight_internal_config_slurp_result
  when: k3s_datastore_preflight_internal_config_read_allowed | bool
  check_mode: false
  diff: false
  failed_when: false
  no_log: true

- name: Inspect the fixed k3s configuration metadata after private parsing
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_config_post_state
  when:
    - k3s_datastore_preflight_internal_config_read_allowed | bool
    - not (k3s_datastore_preflight_internal_config_slurp_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_config_slurp_result.skipped | default(false) | bool)
  no_log: true

- name: Require a stable single-link config read
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_content_stable: >-
      {{ k3s_datastore_preflight_internal_config_read_allowed | bool and
         not (k3s_datastore_preflight_internal_config_slurp_result.failed | default(false) | bool) and
         not (k3s_datastore_preflight_internal_config_slurp_result.skipped | default(false) | bool) and
         k3s_datastore_preflight_internal_config_slurp_result.source | default('') == k3s_datastore_preflight_config_path and
         k3s_datastore_preflight_internal_config_slurp_result.content | default(none) is string and
         k3s_datastore_preflight_internal_config_slurp_result.content | length > 0 and
         k3s_datastore_preflight_internal_config_slurp_result.content is match('^[A-Za-z0-9+/]+={0,2}$') and
         k3s_datastore_preflight_internal_config_post_state.stat.exists | default(false) | bool and
         k3s_datastore_preflight_internal_config_post_state.stat.isreg | default(false) | bool and
         not (k3s_datastore_preflight_internal_config_post_state.stat.islnk | default(false) | bool) and
         k3s_datastore_preflight_internal_config_post_state.stat.pw_name | default('') == 'root' and
         k3s_datastore_preflight_internal_config_post_state.stat.gr_name | default('') == 'root' and
         k3s_datastore_preflight_internal_config_post_state.stat.mode | default('') == '0600' and
         k3s_datastore_preflight_internal_config_post_state.stat.nlink | default(0) | int == 1 and
         (k3s_datastore_preflight_internal_config_post_state.stat.dev | default(-1)) ==
         (k3s_datastore_preflight_internal_config_state.stat.dev | default(-2)) and
         (k3s_datastore_preflight_internal_config_post_state.stat.inode | default(-1)) ==
         (k3s_datastore_preflight_internal_config_state.stat.inode | default(-2)) and
         (k3s_datastore_preflight_internal_config_post_state.stat.size | default(-1)) ==
         (k3s_datastore_preflight_internal_config_state.stat.size | default(-2)) and
         (k3s_datastore_preflight_internal_config_post_state.stat.mtime | default(-1)) ==
         (k3s_datastore_preflight_internal_config_state.stat.mtime | default(-2)) }}
  changed_when: false
  no_log: true

- name: Inspect the exact SQLite datastore marker without reading content
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/state.db
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_sqlite_marker_state
  no_log: true

- name: Inspect the exact embedded-etcd datastore marker without reading content
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_etcd_marker_state
  no_log: true

- name: Read the fixed k3s version command without logging output
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - --version
  register: k3s_datastore_preflight_internal_version_result
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Read the fixed k3s service ExecStart property without logging output
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=ExecStart
      - --value
      - k3s.service
  register: k3s_datastore_preflight_internal_exec_start_result
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Read fixed k3s service environment properties without logging values
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - "--property={{ item }}"
      - --value
      - k3s.service
  loop:
    - Environment
    - EnvironmentFiles
  loop_control:
    label: service-environment-metadata
  register: k3s_datastore_preflight_internal_environment_results
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Establish the exact pinned k3s EnvironmentFiles property gate
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_environment_file_path_exact: >-
      {{ k3s_datastore_preflight_internal_environment_results.results | default([]) | length == 2 and
         k3s_datastore_preflight_internal_environment_results.results[0].rc | default(1) | int == 0 and
         k3s_datastore_preflight_internal_environment_results.results[0].stdout | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_results.results[1].rc | default(1) | int == 0 and
         k3s_datastore_preflight_internal_environment_results.results[1].stderr | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_results.results[1].stdout_lines | default([]) ==
         ['/etc/default/k3s (ignore_errors=yes)',
          '/etc/sysconfig/k3s (ignore_errors=yes)',
          '/etc/systemd/system/k3s.service.env (ignore_errors=yes)'] }}
  changed_when: false
  no_log: true

- name: Inspect the three exact optional k3s EnvironmentFile paths before private counting
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /etc/default/k3s
    - /etc/sysconfig/k3s
    - /etc/systemd/system/k3s.service.env
  register: k3s_datastore_preflight_internal_environment_file_states
  when: k3s_datastore_preflight_internal_environment_file_path_exact | bool
  changed_when: false
  no_log: true

- name: Establish the bounded exact k3s service EnvironmentFile read gate
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_environment_file_read_allowed: >-
      {{ k3s_datastore_preflight_internal_environment_file_path_exact | bool and
         k3s_datastore_preflight_internal_environment_file_states.results | default([]) | length == 3 and
         not (k3s_datastore_preflight_internal_environment_file_states.results[0].stat.exists | default(false) | bool) and
         not (k3s_datastore_preflight_internal_environment_file_states.results[1].stat.exists | default(false) | bool) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.exists | default(false) | bool and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.isreg | default(false) | bool and
         not (k3s_datastore_preflight_internal_environment_file_states.results[2].stat.islnk | default(false) | bool) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.pw_name | default('') == 'root' and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.gr_name | default('') == 'root' and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.mode | default('') == '0600' and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.nlink | default(0) | int == 1 and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.size is number and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.size | int >= 0 and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.size | int <= k3s_datastore_preflight_config_max_bytes }}
  changed_when: false
  no_log: true

- name: Count only datastore and encryption keys in the exact k3s service EnvironmentFile
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - --text
      - --count
      - --extended-regexp
      - >-
        ^[[:space:]]*(export[[:space:]]+)?K3S_(CONFIG_FILE|DATA_DIR|DATASTORE_ENDPOINT|DATASTORE_CAFILE|DATASTORE_CERTFILE|DATASTORE_KEYFILE|DATASTORE_INSECURE_SKIP_VERIFY|CLUSTER_INIT|CLUSTER_RESET|CLUSTER_RESET_RESTORE_PATH|SECRETS_ENCRYPTION)[[:space:]]*=
      - --
      - /etc/systemd/system/k3s.service.env
  register: k3s_datastore_preflight_internal_environment_file_key_count_result
  when: k3s_datastore_preflight_internal_environment_file_read_allowed | bool
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Inspect the three exact optional k3s EnvironmentFile paths after private counting
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - /etc/default/k3s
    - /etc/sysconfig/k3s
    - /etc/systemd/system/k3s.service.env
  register: k3s_datastore_preflight_internal_environment_file_post_states
  when:
    - k3s_datastore_preflight_internal_environment_file_read_allowed | bool
    - not (k3s_datastore_preflight_internal_environment_file_key_count_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_environment_file_key_count_result.skipped | default(false) | bool)
  changed_when: false
  no_log: true

- name: Read fixed k3s service environment properties after private counting
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - "--property={{ item }}"
      - --value
      - k3s.service
  loop:
    - Environment
    - EnvironmentFiles
  loop_control:
    label: service-environment-metadata-post
  register: k3s_datastore_preflight_internal_environment_post_results
  when:
    - k3s_datastore_preflight_internal_environment_file_read_allowed | bool
    - not (k3s_datastore_preflight_internal_environment_file_key_count_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_environment_file_key_count_result.skipped | default(false) | bool)
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Read the fixed k3s encryption status command without logging output
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - secrets-encrypt
      - status
      - --output
      - json
  register: k3s_datastore_preflight_internal_encryption_result
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Read the fixed k3s service health properties without logging output
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=LoadState,ActiveState,SubState
      - --value
      - "{{ item }}"
  loop:
    - k3s.service
    - tailscaled.service
  loop_control:
    label: service-health
  register: k3s_datastore_preflight_internal_service_fields
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Read the fixed node-list command without logging identities or output
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - get
      - nodes
      - --output=json
  register: k3s_datastore_preflight_internal_nodes_result
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Parse and project private k3s datastore preflight evidence
  ansible.builtin.include_tasks: parse.yml

- name: Clear private raw probe facts before report construction
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_version_result: null
    k3s_datastore_preflight_internal_exec_start_result: null
    k3s_datastore_preflight_internal_environment_results: null
    k3s_datastore_preflight_internal_environment_post_results: null
    k3s_datastore_preflight_internal_environment_file_path_states: null
    k3s_datastore_preflight_internal_environment_file_states: null
    k3s_datastore_preflight_internal_environment_file_post_states: null
    k3s_datastore_preflight_internal_environment_file_key_count_result: null
    k3s_datastore_preflight_internal_encryption_result: null
    k3s_datastore_preflight_internal_encryption_payload: null
    k3s_datastore_preflight_internal_encryption_key_counts: null
    k3s_datastore_preflight_internal_encryption_parse_result: null
    k3s_datastore_preflight_internal_encryption_validation_result: null
    k3s_datastore_preflight_internal_config_slurp_result: null
    k3s_datastore_preflight_internal_config_post_state: null
    k3s_datastore_preflight_internal_config_raw: null
    k3s_datastore_preflight_internal_config_decode_result: null
    k3s_datastore_preflight_internal_config_payload: null
    k3s_datastore_preflight_internal_config_parse_result: null
    k3s_datastore_preflight_internal_config_validation_result: null
    k3s_datastore_preflight_internal_config_key_counts: null
    k3s_datastore_preflight_internal_service_fields: null
    k3s_datastore_preflight_internal_nodes_result: null
    k3s_datastore_preflight_internal_node_payload: null
    k3s_datastore_preflight_internal_node_parse_result: null
    k3s_datastore_preflight_internal_node_envelope_result: null
    k3s_datastore_preflight_internal_node_items_result: null
  changed_when: false
  no_log: true

- name: Build the exact sanitized preflight report
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_report:
      schema_version: 2
      evidence_class: read-only-k3s-datastore-encryption-preflight
      invocation:
        check_mode: "{{ ansible_check_mode | bool }}"
        diff_mode: "{{ ansible_diff_mode | bool }}"
        one_host_limit: "{{ (ansible_limit | default('') | string) == 'crtxweb' and (ansible_play_hosts_all | length == 1) }}"
        elevated_requested: "{{ k3s_datastore_preflight_elevated_requested | bool }}"
        elevated_approved: "{{ k3s_datastore_preflight_elevated_approved | bool }}"
      k3s:
        version: "{{ k3s_datastore_preflight_internal_version }}"
        executable_status: "{{ k3s_datastore_preflight_internal_executable_status }}"
        config_status: "{{ k3s_datastore_preflight_internal_config_status }}"
        exec_start_status: "{{ k3s_datastore_preflight_internal_exec_start_status }}"
        data_dir_source: "{{ k3s_datastore_preflight_internal_data_dir_source }}"
      datastore:
        type: "{{ k3s_datastore_preflight_internal_datastore_type }}"
        sqlite_marker_present: "{{ k3s_datastore_preflight_internal_sqlite_marker | bool }}"
        etcd_marker_present: "{{ k3s_datastore_preflight_internal_etcd_marker | bool }}"
        external_endpoint_explicit: "{{ k3s_datastore_preflight_internal_external_marker | bool }}"
      encryption:
        command_status: "{{ k3s_datastore_preflight_internal_encryption_command_status }}"
        status: "{{ k3s_datastore_preflight_internal_encryption_status }}"
        rotation_stage: "{{ k3s_datastore_preflight_internal_rotation_stage }}"
      health:
        k3s_service: "{{ k3s_datastore_preflight_internal_k3s_service_stage }}"
        tailscaled_service: "{{ k3s_datastore_preflight_internal_tailscaled_service_stage }}"
        node_query: "{{ 'available' if k3s_datastore_preflight_internal_node_query_valid | bool else 'unavailable' }}"
        node_count: "{{ k3s_datastore_preflight_internal_node_count | int if k3s_datastore_preflight_internal_node_query_valid | bool else 0 }}"
        ready_node_count: "{{ k3s_datastore_preflight_internal_ready_node_count | int if k3s_datastore_preflight_internal_node_query_valid | bool else 0 }}"
        node_stage: >-
          {{ 'unavailable' if not (k3s_datastore_preflight_internal_node_query_valid | bool) else
             'ready' if (
               (k3s_datastore_preflight_internal_node_count | int > 0) and
               (k3s_datastore_preflight_internal_ready_node_count | int == k3s_datastore_preflight_internal_node_count | int)
             ) else
             'partial' if k3s_datastore_preflight_internal_ready_node_count | int > 0 else
             'not_ready' }}
      disclosure_controls:
        remote_mutation: false
        backup_or_restore: false
        encryption_mutation: false
        secret_values: false
        key_material: false
        token_values: false
        config_content: false
        kubeconfig_content: false
        raw_command_output: false
        node_identifiers: false
        paths_or_urls: false
  changed_when: false
  no_log: true

- name: Validate the sanitized report schema and fail closed on unknown stages
  ansible.builtin.assert:
    that:
      - k3s_datastore_preflight_internal_report.schema_version == 2
      - k3s_datastore_preflight_internal_report.evidence_class == 'read-only-k3s-datastore-encryption-preflight'
      - k3s_datastore_preflight_internal_report.invocation.check_mode | bool
      - k3s_datastore_preflight_internal_report.invocation.diff_mode | bool
      - k3s_datastore_preflight_internal_report.invocation.one_host_limit | bool
      - k3s_datastore_preflight_internal_report.invocation.elevated_requested | bool
      - k3s_datastore_preflight_internal_report.invocation.elevated_approved | bool
      - k3s_datastore_preflight_internal_report.k3s.executable_status in ['safe', 'absent', 'unsafe']
      - k3s_datastore_preflight_internal_report.k3s.config_status in ['present_safe', 'absent', 'unsafe']
      - k3s_datastore_preflight_internal_report.k3s.exec_start_status in ['available', 'unavailable', 'unsafe']
      - >-
        k3s_datastore_preflight_internal_report.k3s.data_dir_source in
        ['default_no_config', 'config_default', 'explicit_arg',
         'config_override_unknown', 'environment_override_unknown', 'unknown']
      - k3s_datastore_preflight_internal_report.datastore.type in ['sqlite', 'embedded_etcd', 'external', 'ambiguous', 'unknown']
      - k3s_datastore_preflight_internal_report.encryption.command_status in ['available', 'unavailable', 'unknown']
      - k3s_datastore_preflight_internal_report.encryption.status in ['enabled', 'disabled', 'unknown', 'unavailable']
      - k3s_datastore_preflight_internal_report.encryption.rotation_stage in ['initial', 'finished', 'active', 'pending', 'unknown', 'not_applicable']
      - k3s_datastore_preflight_internal_report.health.k3s_service in ['running', 'stopped', 'absent', 'unknown']
      - k3s_datastore_preflight_internal_report.health.tailscaled_service in ['running', 'stopped', 'absent', 'unknown']
      - k3s_datastore_preflight_internal_report.health.node_query in ['available', 'unavailable']
      - k3s_datastore_preflight_internal_report.health.node_stage in ['ready', 'partial', 'not_ready', 'unavailable']
      - k3s_datastore_preflight_internal_report.health.node_count is number
      - k3s_datastore_preflight_internal_report.health.ready_node_count is number
      - k3s_datastore_preflight_internal_report.disclosure_controls.remote_mutation == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.backup_or_restore == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.encryption_mutation == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.secret_values == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.key_material == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.token_values == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.config_content == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.kubeconfig_content == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.raw_command_output == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.node_identifiers == false
      - k3s_datastore_preflight_internal_report.disclosure_controls.paths_or_urls == false
    fail_msg: Refusing an unknown or malformed preflight stage.
  changed_when: false
  no_log: true

- name: Inspect the fixed controller artifact destination
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.ansible/k3s-datastore-preflight.local.json"
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_output_state
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Refuse an unsafe existing controller artifact destination
  ansible.builtin.assert:
    that:
      - not (k3s_datastore_preflight_internal_output_state.stat.islnk | default(false))
      - >-
        not (k3s_datastore_preflight_internal_output_state.stat.exists | default(false)) or
        (k3s_datastore_preflight_internal_output_state.stat.isreg | default(false))
      - >-
        not (k3s_datastore_preflight_internal_output_state.stat.exists | default(false)) or
        k3s_datastore_preflight_internal_output_state.stat.pw_name ==
        k3s_datastore_preflight_controller_user
      - >-
        not (k3s_datastore_preflight_internal_output_state.stat.exists | default(false)) or
        k3s_datastore_preflight_internal_output_state.stat.mode == '0600'
      - >-
        not (k3s_datastore_preflight_internal_output_state.stat.exists | default(false)) or
        k3s_datastore_preflight_internal_output_state.stat.nlink == 1
    fail_msg: >-
      Refusing a symlinked, non-regular, foreign-owned, multiply-linked, or
      non-private existing preflight artifact destination.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Write only the sanitized mode-0600 controller artifact
  ansible.builtin.template:
    src: report.json.j2
    dest: "{{ playbook_dir }}/../.ansible/k3s-datastore-preflight.local.json"
    mode: '0600'
    owner: "{{ lookup('ansible.builtin.env', 'USER') }}"
    backup: false
  delegate_to: localhost
  become: false
  check_mode: false
  diff: false
  changed_when: true
  no_log: true

- name: Inspect the written controller artifact destination
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.ansible/k3s-datastore-preflight.local.json"
    follow: false
    get_checksum: false
    get_mime: false
  register: k3s_datastore_preflight_internal_output_post_state
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Require the exact written controller artifact metadata
  ansible.builtin.assert:
    that:
      - k3s_datastore_preflight_internal_output_post_state.stat.exists | default(false)
      - k3s_datastore_preflight_internal_output_post_state.stat.isreg | default(false)
      - not (k3s_datastore_preflight_internal_output_post_state.stat.islnk | default(false))
      - k3s_datastore_preflight_internal_output_post_state.stat.pw_name == k3s_datastore_preflight_controller_user
      - k3s_datastore_preflight_internal_output_post_state.stat.mode == '0600'
      - k3s_datastore_preflight_internal_output_post_state.stat.nlink == 1
    fail_msg: Refusing an inexact sanitized preflight artifact after write.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
