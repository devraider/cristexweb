---
- name: Initialize private bounded config and encryption parser state
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_raw: ''
    k3s_datastore_preflight_internal_config_decode_result:
      failed: true
      skipped: true
    k3s_datastore_preflight_internal_config_payload: {}
    k3s_datastore_preflight_internal_config_parse_result:
      failed: true
      skipped: true
    k3s_datastore_preflight_internal_config_validation_result:
      failed: true
      skipped: true
    k3s_datastore_preflight_internal_config_key_counts:
      data_dir: 0
      datastore_endpoint: 0
      cluster_init: 0
      secrets_encryption: 0
    k3s_datastore_preflight_internal_config_parse_valid: false
    k3s_datastore_preflight_internal_config_data_dir_state: unknown
    k3s_datastore_preflight_internal_config_external_marker: false
    k3s_datastore_preflight_internal_config_etcd_marker: false
    k3s_datastore_preflight_internal_config_encryption_status: unknown
    k3s_datastore_preflight_internal_config_arg_count: 0
    k3s_datastore_preflight_internal_data_dir_arg_count: 0
    k3s_datastore_preflight_internal_external_arg_count: 0
    k3s_datastore_preflight_internal_external_arg_exact_marker: false
    k3s_datastore_preflight_internal_cluster_init_arg_count: 0
    k3s_datastore_preflight_internal_environment_file_path_exact: false
    k3s_datastore_preflight_internal_environment_file_content_stable: false
    k3s_datastore_preflight_internal_environment_file_key_count: 0
    k3s_datastore_preflight_internal_environment_file_relevant_keys_absent: false
    k3s_datastore_preflight_internal_environment_overrides_absent: false
    k3s_datastore_preflight_internal_encryption_payload: {}
    k3s_datastore_preflight_internal_encryption_key_counts:
      stage: 0
      activekey: 0
      enable: 0
      hashmatch: 0
      hasherror: 0
      inactivekeys: 0
    k3s_datastore_preflight_internal_encryption_parse_result:
      failed: true
      skipped: true
    k3s_datastore_preflight_internal_encryption_validation_result:
      failed: true
      skipped: true
    k3s_datastore_preflight_internal_encryption_json_valid: false
    k3s_datastore_preflight_internal_node_count: 0
  changed_when: false
  no_log: true

- name: Initialize the validated k3s version as null
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_version: null
  changed_when: false
  no_log: true

- name: Parse a successful k3s version with an exact grammar
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_version: >-
      {{ k3s_datastore_preflight_internal_version_result.stdout |
         regex_findall('(?m)^k3s version (v[0-9]+[.][0-9]+[.][0-9]+(?:[+][0-9A-Za-z.-]+)?)') |
         first }}
  when:
    - k3s_datastore_preflight_internal_version_result.rc | default(1) | int == 0
    - >-
      k3s_datastore_preflight_internal_version_result.stdout is
      match('(?m)^k3s version v[0-9]+[.][0-9]+[.][0-9]+(?:[+][0-9A-Za-z.-]+)?')
  changed_when: false
  no_log: true

- name: Parse fixed executable and configuration metadata stages
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_executable_status: >-
      {{ 'absent' if not (k3s_datastore_preflight_internal_executable_state.stat.exists | default(false)) else
         'safe' if (
           k3s_datastore_preflight_internal_executable_state.stat.isreg | default(false) and
           not (k3s_datastore_preflight_internal_executable_state.stat.islnk | default(false)) and
           k3s_datastore_preflight_internal_executable_state.stat.executable | default(false) and
           k3s_datastore_preflight_internal_executable_state.stat.pw_name == 'root' and
           k3s_datastore_preflight_internal_executable_state.stat.gr_name == 'root' and
           k3s_datastore_preflight_internal_executable_state.stat.mode == '0755'
         ) else 'unsafe' }}
    k3s_datastore_preflight_internal_config_status: >-
      {{ 'absent' if not (k3s_datastore_preflight_internal_config_state.stat.exists | default(false)) else
         'present_safe' if (
           k3s_datastore_preflight_internal_config_state.stat.isreg | default(false) and
           not (k3s_datastore_preflight_internal_config_state.stat.islnk | default(false)) and
           k3s_datastore_preflight_internal_config_state.stat.pw_name == 'root' and
           k3s_datastore_preflight_internal_config_state.stat.gr_name == 'root' and
           k3s_datastore_preflight_internal_config_state.stat.mode == '0600'
         ) else 'unsafe' }}
  changed_when: false
  no_log: true

- name: Decode only the bounded private k3s config content
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_raw: >-
      {{ k3s_datastore_preflight_internal_config_slurp_result.content |
         default('') | b64decode }}
  when:
    - k3s_datastore_preflight_internal_config_content_stable | default(false) | bool
    - not ((k3s_datastore_preflight_internal_config_slurp_result | default({})).failed | default(false) | bool)
    - not ((k3s_datastore_preflight_internal_config_slurp_result | default({})).skipped | default(false) | bool)
  register: k3s_datastore_preflight_internal_config_decode_result
  ignore_errors: true
  changed_when: false
  no_log: true

- name: Count only selected config keys privately before YAML projection
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_key_counts:
      data_dir: >-
        {{ (k3s_datastore_preflight_internal_config_raw |
            regex_findall('(?m)^data-dir:[ \\t]*')) | length }}
      datastore_endpoint: >-
        {{ (k3s_datastore_preflight_internal_config_raw |
            regex_findall('(?m)^datastore-endpoint:[ \\t]*')) | length }}
      cluster_init: >-
        {{ (k3s_datastore_preflight_internal_config_raw |
            regex_findall('(?m)^cluster-init:[ \\t]*')) | length }}
      secrets_encryption: >-
        {{ (k3s_datastore_preflight_internal_config_raw |
            regex_findall('(?m)^secrets-encryption:[ \\t]*')) | length }}
  when:
    - not (k3s_datastore_preflight_internal_config_decode_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_config_decode_result.skipped | default(false) | bool)
    - k3s_datastore_preflight_internal_config_raw | length > 0
  changed_when: false
  no_log: true

- name: Parse bounded k3s config YAML privately
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_payload: >-
      {{ k3s_datastore_preflight_internal_config_raw | from_yaml }}
  when:
    - not (k3s_datastore_preflight_internal_config_decode_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_config_decode_result.skipped | default(false) | bool)
    - k3s_datastore_preflight_internal_config_raw | length > 0
    - k3s_datastore_preflight_internal_config_raw | length <= k3s_datastore_preflight_config_max_bytes
    - k3s_datastore_preflight_internal_config_key_counts.data_dir | int <= 1
    - k3s_datastore_preflight_internal_config_key_counts.datastore_endpoint | int <= 1
    - k3s_datastore_preflight_internal_config_key_counts.cluster_init | int <= 1
    - k3s_datastore_preflight_internal_config_key_counts.secrets_encryption | int <= 1
    - >-
      k3s_datastore_preflight_internal_config_raw |
      regex_findall("(?m)^[ \\t]*['\\\"](?:data-dir|datastore-endpoint|cluster-init|secrets-encryption)['\\\"]:[ \\t]*") |
      length == 0
    - k3s_datastore_preflight_internal_config_raw | regex_findall('(?m)^[.][.][.][ \\t]*(?:#.*)?$') | length == 0
    - k3s_datastore_preflight_internal_config_raw | regex_findall('(?m)^---[ \\t]*(?:#.*)?$') | length <= 1
  register: k3s_datastore_preflight_internal_config_parse_result
  ignore_errors: true
  changed_when: false
  no_log: true

- name: Validate selected k3s config shape and relevant-key uniqueness privately
  ansible.builtin.assert:
    that:
      - k3s_datastore_preflight_internal_config_payload is mapping
      - k3s_datastore_preflight_internal_config_raw | length == k3s_datastore_preflight_internal_config_state.stat.size | int
      - k3s_datastore_preflight_internal_config_raw is match('^[\\x09\\x0a\\x0d\\x20-\\x7e]+$')
      - k3s_datastore_preflight_internal_config_raw | regex_findall('(?m)^[.][.][.][ \\t]*(?:#.*)?$') | length == 0
      - k3s_datastore_preflight_internal_config_raw | regex_findall('(?m)^---[ \\t]*(?:#.*)?$') | length <= 1
      - k3s_datastore_preflight_internal_config_raw | regex_findall('(?m)^[ \\t]*(?:<<:|%YAML|%TAG)') | length == 0
      - k3s_datastore_preflight_internal_config_raw | regex_findall('(?m)(?:^|[ \\t])[&*!][^ \\t\\r\\n]+') | length == 0
      - k3s_datastore_preflight_internal_config_key_counts.data_dir | int <= 1
      - k3s_datastore_preflight_internal_config_key_counts.datastore_endpoint | int <= 1
      - k3s_datastore_preflight_internal_config_key_counts.cluster_init | int <= 1
      - k3s_datastore_preflight_internal_config_key_counts.secrets_encryption | int <= 1
      - >-
        k3s_datastore_preflight_internal_config_key_counts.data_dir | int ==
        (1 if 'data-dir' in k3s_datastore_preflight_internal_config_payload else 0)
      - >-
        k3s_datastore_preflight_internal_config_key_counts.datastore_endpoint | int ==
        (1 if 'datastore-endpoint' in k3s_datastore_preflight_internal_config_payload else 0)
      - >-
        k3s_datastore_preflight_internal_config_key_counts.cluster_init | int ==
        (1 if 'cluster-init' in k3s_datastore_preflight_internal_config_payload else 0)
      - >-
        k3s_datastore_preflight_internal_config_key_counts.secrets_encryption | int ==
        (1 if 'secrets-encryption' in k3s_datastore_preflight_internal_config_payload else 0)
      - >-
        ('data-dir' not in k3s_datastore_preflight_internal_config_payload) or
        (k3s_datastore_preflight_internal_config_payload.get('data-dir') is string and
         k3s_datastore_preflight_internal_config_payload.get('data-dir') | length > 0)
      - >-
        ('datastore-endpoint' not in k3s_datastore_preflight_internal_config_payload) or
        (k3s_datastore_preflight_internal_config_payload.get('datastore-endpoint') is string and
         k3s_datastore_preflight_internal_config_payload.get('datastore-endpoint') | length > 0)
      - >-
        ('cluster-init' not in k3s_datastore_preflight_internal_config_payload) or
        (k3s_datastore_preflight_internal_config_payload.get('cluster-init') is boolean)
      - >-
        ('secrets-encryption' not in k3s_datastore_preflight_internal_config_payload) or
        (k3s_datastore_preflight_internal_config_payload.get('secrets-encryption') is boolean)
  register: k3s_datastore_preflight_internal_config_validation_result
  when:
    - not (k3s_datastore_preflight_internal_config_parse_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_config_parse_result.skipped | default(false) | bool)
  ignore_errors: true
  changed_when: false
  no_log: true

- name: Establish the private safe k3s config parse gate
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_parse_valid: >-
      {{ not (k3s_datastore_preflight_internal_config_parse_result.failed | default(false) | bool) and
         not (k3s_datastore_preflight_internal_config_parse_result.skipped | default(false) | bool) and
         not (k3s_datastore_preflight_internal_config_validation_result.failed | default(true) | bool) and
         k3s_datastore_preflight_internal_config_payload is mapping }}
  changed_when: false
  no_log: true

- name: Project only bounded k3s config markers privately
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_data_dir_state: >-
      {{ 'unknown' if not (k3s_datastore_preflight_internal_config_parse_valid | bool) else
         'absent' if 'data-dir' not in k3s_datastore_preflight_internal_config_payload else
         'default' if k3s_datastore_preflight_internal_config_payload.get('data-dir') == '/var/lib/rancher/k3s' else
         'custom' if k3s_datastore_preflight_internal_config_payload.get('data-dir') is string else
         'unknown' }}
    k3s_datastore_preflight_internal_config_external_marker: >-
      {{ k3s_datastore_preflight_internal_config_parse_valid | bool and
         'datastore-endpoint' in k3s_datastore_preflight_internal_config_payload and
         k3s_datastore_preflight_internal_config_payload.get('datastore-endpoint') | length > 0 }}
    k3s_datastore_preflight_internal_config_etcd_marker: >-
      {{ k3s_datastore_preflight_internal_config_parse_valid | bool and
         k3s_datastore_preflight_internal_config_payload.get('cluster-init', false) == true }}
    k3s_datastore_preflight_internal_config_encryption_status: >-
      {{ 'enabled' if (
           k3s_datastore_preflight_internal_config_parse_valid | bool and
           k3s_datastore_preflight_internal_config_payload.get('secrets-encryption', none) is boolean and
           k3s_datastore_preflight_internal_config_payload.get('secrets-encryption', false) | bool
         ) else
         'disabled' if (
           k3s_datastore_preflight_internal_config_parse_valid | bool and
           k3s_datastore_preflight_internal_config_payload.get('secrets-encryption', none) is boolean
         ) else 'unknown' }}
  changed_when: false
  no_log: true

- name: Count fixed ExecStart datastore options privately
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_config_arg_count: >-
      {{ (k3s_datastore_preflight_internal_exec_start_result.stdout | default('') |
          regex_findall('--config(?:=|,|;| )')) | length }}
    k3s_datastore_preflight_internal_data_dir_arg_count: >-
      {{ (k3s_datastore_preflight_internal_exec_start_result.stdout | default('') |
          regex_findall('--data-dir(?:=|,|;| )')) | length }}
    k3s_datastore_preflight_internal_external_arg_count: >-
      {{ (k3s_datastore_preflight_internal_exec_start_result.stdout | default('') |
          regex_findall('--datastore-endpoint(?:=|,|;| )')) | length }}
    k3s_datastore_preflight_internal_cluster_init_arg_count: >-
      {{ (k3s_datastore_preflight_internal_exec_start_result.stdout | default('') |
          regex_findall('--cluster-init(?:,|;| |$)')) | length }}
  changed_when: false
  no_log: true

- name: Parse the fixed ExecStart property into safe marker booleans
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_exec_start_server_marker: >-
      {{ ((k3s_datastore_preflight_internal_exec_start_result.stdout | default('')) |
          regex_findall('(?:^|[=,; ])/usr/local/bin/k3s(?:,| )+server(?:,|;| |$)') | length) == 1 }}
    k3s_datastore_preflight_internal_exec_start_agent_marker: >-
      {{ ((k3s_datastore_preflight_internal_exec_start_result.stdout | default('')) |
          regex_findall('(?:^|[=,; ])/usr/local/bin/k3s(?:,| )+agent(?:,|;| |$)') | length) == 1 }}
    k3s_datastore_preflight_internal_config_arg_marker: >-
      {{ k3s_datastore_preflight_internal_config_arg_count | int == 1 }}
    k3s_datastore_preflight_internal_config_arg_exact_marker: >-
      {{ ((k3s_datastore_preflight_internal_exec_start_result.stdout | default('')) |
          regex_findall('--config(?:=|,|;| )/etc/rancher/k3s/config[.]yaml(?:,|;| |$)') | length) == 1 }}
    k3s_datastore_preflight_internal_data_dir_arg_marker: >-
      {{ k3s_datastore_preflight_internal_data_dir_arg_count | int == 1 }}
    k3s_datastore_preflight_internal_data_dir_arg_exact_marker: >-
      {{ ((k3s_datastore_preflight_internal_exec_start_result.stdout | default('')) |
          regex_findall('--data-dir(?:=|,|;| )/var/lib/rancher/k3s(?:,|;| |$)') | length) == 1 }}
    k3s_datastore_preflight_internal_external_arg_exact_marker: >-
      {{ k3s_datastore_preflight_internal_external_arg_count | int == 1 and
         ((k3s_datastore_preflight_internal_exec_start_result.stdout | default('')) |
          regex_findall('--datastore-endpoint(?:=|,|;| )[^,; ]+(?:,|;| |$)') | length) == 1 }}
    k3s_datastore_preflight_internal_external_marker: >-
      {{ k3s_datastore_preflight_internal_external_arg_exact_marker | bool or
         k3s_datastore_preflight_internal_config_external_marker | bool }}
    k3s_datastore_preflight_internal_etcd_marker: >-
      {{ k3s_datastore_preflight_internal_cluster_init_arg_count | int == 1 or
         k3s_datastore_preflight_internal_config_etcd_marker | bool }}
  changed_when: false
  no_log: true

- name: Derive the fixed ExecStart availability stage
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_exec_start_status: >-
      {{ 'unavailable' if (
           (k3s_datastore_preflight_internal_exec_start_result.rc | default(1) | int) != 0 or
           (k3s_datastore_preflight_internal_exec_start_result.stdout | default('') | length) == 0
         ) else
         'available' if (
           (k3s_datastore_preflight_internal_exec_start_result.stdout_lines | default([]) | length) == 1 and
           (k3s_datastore_preflight_internal_exec_start_server_marker or
            k3s_datastore_preflight_internal_exec_start_agent_marker) and
           k3s_datastore_preflight_internal_config_arg_count | int <= 1 and
           k3s_datastore_preflight_internal_data_dir_arg_count | int <= 1 and
           k3s_datastore_preflight_internal_external_arg_count | int <= 1 and
           k3s_datastore_preflight_internal_cluster_init_arg_count | int <= 1 and
           (not k3s_datastore_preflight_internal_config_arg_marker or
            k3s_datastore_preflight_internal_config_arg_exact_marker) and
           (not k3s_datastore_preflight_internal_data_dir_arg_marker or
            k3s_datastore_preflight_internal_data_dir_arg_exact_marker) and
           (k3s_datastore_preflight_internal_external_arg_count | int == 0 or
            k3s_datastore_preflight_internal_external_arg_exact_marker)
         ) else 'unsafe' }}
  changed_when: false
  no_log: true

- name: Establish the exact stable pinned k3s EnvironmentFiles property privately
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_environment_file_path_exact: >-
      {{ k3s_datastore_preflight_internal_environment_results.results | default([]) | length == 2 and
         k3s_datastore_preflight_internal_environment_post_results.results | default([]) | length == 2 and
         k3s_datastore_preflight_internal_environment_results.results[0].rc | default(1) | int == 0 and
         k3s_datastore_preflight_internal_environment_results.results[0].stderr | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_results.results[0].stdout | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_results.results[1].rc | default(1) | int == 0 and
         k3s_datastore_preflight_internal_environment_results.results[1].stderr | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_results.results[1].stdout_lines | default([]) ==
         ['/etc/default/k3s (ignore_errors=yes)',
          '/etc/sysconfig/k3s (ignore_errors=yes)',
          '/etc/systemd/system/k3s.service.env (ignore_errors=yes)'] and
         k3s_datastore_preflight_internal_environment_post_results.results[0].rc | default(1) | int == 0 and
         k3s_datastore_preflight_internal_environment_post_results.results[0].stderr | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_post_results.results[0].stdout | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_post_results.results[1].rc | default(1) | int == 0 and
         k3s_datastore_preflight_internal_environment_post_results.results[1].stderr | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_post_results.results[1].stdout_lines | default([]) ==
         ['/etc/default/k3s (ignore_errors=yes)',
          '/etc/sysconfig/k3s (ignore_errors=yes)',
          '/etc/systemd/system/k3s.service.env (ignore_errors=yes)'] and
         k3s_datastore_preflight_internal_environment_results.results[0].stdout ==
         k3s_datastore_preflight_internal_environment_post_results.results[0].stdout and
         k3s_datastore_preflight_internal_environment_results.results[1].stdout_lines ==
         k3s_datastore_preflight_internal_environment_post_results.results[1].stdout_lines }}
  changed_when: false
  no_log: true

- name: Establish metadata-stable count-only EnvironmentFile inspection privately
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_environment_file_content_stable: >-
      {{ k3s_datastore_preflight_internal_environment_file_path_exact | bool and
         k3s_datastore_preflight_internal_environment_file_read_allowed | default(false) | bool and
         not (k3s_datastore_preflight_internal_environment_file_key_count_result.failed | default(false) | bool) and
         not (k3s_datastore_preflight_internal_environment_file_key_count_result.skipped | default(false) | bool) and
         k3s_datastore_preflight_internal_environment_file_key_count_result.rc | default(2) | int in [0, 1] and
         k3s_datastore_preflight_internal_environment_file_key_count_result.stderr | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_file_key_count_result.stdout | default('') is match('^[0-9]+$') and
         k3s_datastore_preflight_internal_environment_file_states.results | default([]) | length == 3 and
         k3s_datastore_preflight_internal_environment_file_post_states.results | default([]) | length == 3 and
         not (k3s_datastore_preflight_internal_environment_file_states.results[0].stat.exists | default(false) | bool) and
         not (k3s_datastore_preflight_internal_environment_file_states.results[1].stat.exists | default(false) | bool) and
         not (k3s_datastore_preflight_internal_environment_file_post_states.results[0].stat.exists | default(false) | bool) and
         not (k3s_datastore_preflight_internal_environment_file_post_states.results[1].stat.exists | default(false) | bool) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.exists | default(false) | bool and
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.exists | default(false) | bool and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.isreg | default(false) | bool and
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.isreg | default(false) | bool and
         not (k3s_datastore_preflight_internal_environment_file_states.results[2].stat.islnk | default(false) | bool) and
         not (k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.islnk | default(false) | bool) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.pw_name | default('') == 'root' and
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.pw_name | default('') == 'root' and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.gr_name | default('') == 'root' and
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.gr_name | default('') == 'root' and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.mode | default('') == '0600' and
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.mode | default('') == '0600' and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.nlink | default(0) | int == 1 and
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.nlink | default(0) | int == 1 and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.dev | default(-1) ==
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.dev | default(-2) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.inode | default(-1) ==
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.inode | default(-2) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.size | default(-1) ==
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.size | default(-2) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.mtime | default(-1) ==
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.mtime | default(-2) and
         k3s_datastore_preflight_internal_environment_file_states.results[2].stat.ctime | default(-1) ==
         k3s_datastore_preflight_internal_environment_file_post_states.results[2].stat.ctime | default(-2) }}
  changed_when: false
  no_log: true

- name: Project only the exact EnvironmentFile key count privately
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_environment_file_key_count: >-
      {{ k3s_datastore_preflight_internal_environment_file_key_count_result.stdout | default('') | int
         if k3s_datastore_preflight_internal_environment_file_content_stable | bool else -1 }}
    k3s_datastore_preflight_internal_environment_file_relevant_keys_absent: >-
      {{ k3s_datastore_preflight_internal_environment_file_content_stable | bool and
         (k3s_datastore_preflight_internal_environment_file_key_count_result.stdout | default('') | int == 0) }}
  changed_when: false
  no_log: true

- name: Require absent systemd environment and safe exact environment-file overrides
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_environment_overrides_absent: >-
      {{ k3s_datastore_preflight_internal_environment_file_path_exact | bool and
         k3s_datastore_preflight_internal_environment_file_content_stable | bool and
         k3s_datastore_preflight_internal_environment_file_relevant_keys_absent | bool and
         k3s_datastore_preflight_internal_environment_results.results[0].stdout | default('') | length == 0 and
         k3s_datastore_preflight_internal_environment_post_results.results[0].stdout | default('') | length == 0 }}
  changed_when: false
  no_log: true

- name: Derive the fixed data-directory source stage
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_data_dir_source: >-
      {{ 'unknown' if k3s_datastore_preflight_internal_exec_start_status != 'available' else
         'environment_override_unknown' if not (k3s_datastore_preflight_internal_environment_overrides_absent | bool) else
         'explicit_arg' if (
           k3s_datastore_preflight_internal_environment_overrides_absent | bool and
           k3s_datastore_preflight_internal_data_dir_arg_exact_marker and
           (k3s_datastore_preflight_internal_config_status == 'absent' or
            k3s_datastore_preflight_internal_config_parse_valid | bool)
         ) else
         'config_default' if (
           k3s_datastore_preflight_internal_environment_overrides_absent | bool and
           k3s_datastore_preflight_internal_config_parse_valid | bool and
           k3s_datastore_preflight_internal_config_data_dir_state in ['absent', 'default'] and
           not k3s_datastore_preflight_internal_data_dir_arg_marker
         ) else
         'unknown' if (
           k3s_datastore_preflight_internal_config_parse_valid | bool and
           k3s_datastore_preflight_internal_config_data_dir_state == 'custom'
         ) else
         'unknown' if (
           k3s_datastore_preflight_internal_config_read_allowed | default(false) | bool and
           not (k3s_datastore_preflight_internal_config_parse_valid | bool)
         ) else
         'config_override_unknown' if (
           k3s_datastore_preflight_internal_config_status == 'present_safe' or
           k3s_datastore_preflight_internal_config_arg_marker
         ) else
         'default_no_config' if (
           k3s_datastore_preflight_internal_environment_overrides_absent | bool and
           k3s_datastore_preflight_internal_config_status == 'absent' and
           not k3s_datastore_preflight_internal_data_dir_arg_marker
         ) else
         'unknown' }}
  changed_when: false
  no_log: true

- name: Bind exact on-disk datastore marker evidence without reading content
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_sqlite_marker: >-
      {{ k3s_datastore_preflight_internal_sqlite_marker_state.stat.isreg | default(false) and
         not (k3s_datastore_preflight_internal_sqlite_marker_state.stat.islnk | default(false)) and
         k3s_datastore_preflight_internal_sqlite_marker_state.stat.pw_name == 'root' and
         k3s_datastore_preflight_internal_sqlite_marker_state.stat.gr_name == 'root' and
         k3s_datastore_preflight_internal_sqlite_marker_state.stat.mode == '0600' }}
    k3s_datastore_preflight_internal_etcd_marker: >-
      {{ k3s_datastore_preflight_internal_etcd_marker_state.stat.isdir | default(false) and
         not (k3s_datastore_preflight_internal_etcd_marker_state.stat.islnk | default(false)) and
         k3s_datastore_preflight_internal_etcd_marker_state.stat.pw_name == 'root' and
         k3s_datastore_preflight_internal_etcd_marker_state.stat.gr_name == 'root' }}
  changed_when: false
  no_log: true

- name: Merge safe config datastore markers with fixed on-disk markers
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_external_marker: >-
      {{ k3s_datastore_preflight_internal_external_marker | bool or
         k3s_datastore_preflight_internal_config_external_marker | bool or
         k3s_datastore_preflight_internal_external_arg_exact_marker | bool }}
    k3s_datastore_preflight_internal_etcd_marker: >-
      {{ k3s_datastore_preflight_internal_etcd_marker | bool or
         k3s_datastore_preflight_internal_config_etcd_marker | bool or
         k3s_datastore_preflight_internal_cluster_init_arg_count | int == 1 }}
  changed_when: false
  no_log: true

- name: Derive the datastore type only from bound markers and fixed ExecStart
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_datastore_type: >-
      {{ 'unknown' if (
           k3s_datastore_preflight_internal_exec_start_status != 'available' or
           not k3s_datastore_preflight_internal_exec_start_server_marker
         ) else
         'ambiguous' if (
           (k3s_datastore_preflight_internal_external_marker | int) +
           (k3s_datastore_preflight_internal_etcd_marker | int) +
           (k3s_datastore_preflight_internal_sqlite_marker | int) > 1
         ) else
         'external' if k3s_datastore_preflight_internal_external_marker else
         'embedded_etcd' if (
           k3s_datastore_preflight_internal_data_dir_source in
           ['default_no_config', 'config_default', 'explicit_arg'] and
           k3s_datastore_preflight_internal_etcd_marker
         ) else
         'sqlite' if (
           k3s_datastore_preflight_internal_data_dir_source in
           ['default_no_config', 'config_default', 'explicit_arg'] and
           k3s_datastore_preflight_internal_sqlite_marker
         ) else
         'unknown' }}
  changed_when: false
  no_log: true

- name: Parse k3s and Tailscale service stages without exposing status output
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_k3s_service_stage: >-
      {{ 'unknown' if (
           (k3s_datastore_preflight_internal_service_fields.results[0].rc | default(1) | int) != 0 or
           (k3s_datastore_preflight_internal_service_fields.results[0].stdout_lines | default([]) | length) != 3
         ) else
         'running' if k3s_datastore_preflight_internal_service_fields.results[0].stdout_lines == ['loaded', 'active', 'running'] else
         'absent' if k3s_datastore_preflight_internal_service_fields.results[0].stdout_lines[0] == 'not-found' else
         'stopped' if (
           k3s_datastore_preflight_internal_service_fields.results[0].stdout_lines[0] == 'loaded' and
           (k3s_datastore_preflight_internal_service_fields.results[0].stdout_lines[1] in ['inactive', 'failed'] or
            k3s_datastore_preflight_internal_service_fields.results[0].stdout_lines[2] in ['dead', 'failed', 'exited'])
         ) else
         'unknown' }}
    k3s_datastore_preflight_internal_tailscaled_service_stage: >-
      {{ 'unknown' if (
           (k3s_datastore_preflight_internal_service_fields.results[1].rc | default(1) | int) != 0 or
           (k3s_datastore_preflight_internal_service_fields.results[1].stdout_lines | default([]) | length) != 3
         ) else
         'running' if k3s_datastore_preflight_internal_service_fields.results[1].stdout_lines == ['loaded', 'active', 'running'] else
         'absent' if k3s_datastore_preflight_internal_service_fields.results[1].stdout_lines[0] == 'not-found' else
         'stopped' if (
           k3s_datastore_preflight_internal_service_fields.results[1].stdout_lines[0] == 'loaded' and
           (k3s_datastore_preflight_internal_service_fields.results[1].stdout_lines[1] in ['inactive', 'failed'] or
            k3s_datastore_preflight_internal_service_fields.results[1].stdout_lines[2] in ['dead', 'failed', 'exited'])
         ) else
         'unknown' }}
  changed_when: false
  no_log: true

- name: Count official encryption JSON keys before decoding
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_encryption_key_counts:
      stage: >-
        {{ k3s_datastore_preflight_internal_encryption_result.stdout | default('') |
           regex_findall('\"stage\"[ \\t\\r\\n]*:') | length }}
      activekey: >-
        {{ k3s_datastore_preflight_internal_encryption_result.stdout | default('') |
           regex_findall('\"activekey\"[ \\t\\r\\n]*:') | length }}
      enable: >-
        {{ k3s_datastore_preflight_internal_encryption_result.stdout | default('') |
           regex_findall('\"enable\"[ \\t\\r\\n]*:') | length }}
      hashmatch: >-
        {{ k3s_datastore_preflight_internal_encryption_result.stdout | default('') |
           regex_findall('\"hashmatch\"[ \\t\\r\\n]*:') | length }}
      hasherror: >-
        {{ k3s_datastore_preflight_internal_encryption_result.stdout | default('') |
           regex_findall('\"hasherror\"[ \\t\\r\\n]*:') | length }}
      inactivekeys: >-
        {{ k3s_datastore_preflight_internal_encryption_result.stdout | default('') |
           regex_findall('\"inactivekeys\"[ \\t\\r\\n]*:') | length }}
  changed_when: false
  no_log: true

- name: Parse the fixed encryption JSON object privately
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_encryption_payload: >-
      {{ k3s_datastore_preflight_internal_encryption_result.stdout | from_json }}
  when:
    - k3s_datastore_preflight_internal_encryption_result.rc | default(1) | int == 0
    - k3s_datastore_preflight_internal_encryption_result.stderr | default('') | length == 0
    - k3s_datastore_preflight_internal_encryption_result.stdout | default('') | length > 0
    - k3s_datastore_preflight_internal_encryption_result.stdout | default('') | length <= k3s_datastore_preflight_encryption_output_max_bytes
    - k3s_datastore_preflight_internal_encryption_key_counts.stage | int == 1
    - k3s_datastore_preflight_internal_encryption_key_counts.activekey | int == 1
    - k3s_datastore_preflight_internal_encryption_key_counts.enable | int <= 1
    - k3s_datastore_preflight_internal_encryption_key_counts.hashmatch | int <= 1
    - k3s_datastore_preflight_internal_encryption_key_counts.hasherror | int <= 1
    - k3s_datastore_preflight_internal_encryption_key_counts.inactivekeys | int <= 1
  register: k3s_datastore_preflight_internal_encryption_parse_result
  ignore_errors: true
  changed_when: false
  no_log: true

- name: Validate the bounded encryption JSON shape privately
  ansible.builtin.assert:
    that:
      - k3s_datastore_preflight_internal_encryption_payload is mapping
      - >-
        k3s_datastore_preflight_internal_encryption_payload.keys() |
        difference(['stage', 'activekey', 'enable', 'hashmatch', 'hasherror',
        'inactivekeys']) | length == 0
      - "'stage' in k3s_datastore_preflight_internal_encryption_payload"
      - k3s_datastore_preflight_internal_encryption_payload.get('stage') is string
      - "'activekey' in k3s_datastore_preflight_internal_encryption_payload"
      - k3s_datastore_preflight_internal_encryption_payload.get('activekey') is string
      - >-
        ('enable' not in k3s_datastore_preflight_internal_encryption_payload) or
        (k3s_datastore_preflight_internal_encryption_payload.get('enable') is boolean)
      - >-
        ('enable' not in k3s_datastore_preflight_internal_encryption_payload) or
        not (k3s_datastore_preflight_internal_encryption_payload.get('enable') | bool) or
        k3s_datastore_preflight_internal_encryption_payload.get('activekey') | length > 0
      - >-
        ('hashmatch' not in k3s_datastore_preflight_internal_encryption_payload) or
        (k3s_datastore_preflight_internal_encryption_payload.get('hashmatch') is boolean)
      - >-
        ('hasherror' not in k3s_datastore_preflight_internal_encryption_payload) or
        (k3s_datastore_preflight_internal_encryption_payload.get('hasherror') is string)
      - >-
        ('inactivekeys' not in k3s_datastore_preflight_internal_encryption_payload) or
        (k3s_datastore_preflight_internal_encryption_payload.get('inactivekeys') is sequence and
         k3s_datastore_preflight_internal_encryption_payload.get('inactivekeys') is not string and
         k3s_datastore_preflight_internal_encryption_payload.get('inactivekeys') is not mapping and
         (k3s_datastore_preflight_internal_encryption_payload.get('inactivekeys') |
          select('string') | list | length) ==
         (k3s_datastore_preflight_internal_encryption_payload.get('inactivekeys') | length))
      - >-
        k3s_datastore_preflight_internal_encryption_payload.get('stage') in
        ['start', 'prepare', 'rotate', 'rotate_keys', 'reencrypt_request',
         'reencrypt_active', 'reencrypt_finished'] or
        (k3s_datastore_preflight_internal_encryption_payload.get('stage') == '' and
         'enable' not in k3s_datastore_preflight_internal_encryption_payload and
         k3s_datastore_preflight_internal_encryption_payload.get('activekey') == '' and
         'hashmatch' not in k3s_datastore_preflight_internal_encryption_payload and
         'hasherror' not in k3s_datastore_preflight_internal_encryption_payload and
         'inactivekeys' not in k3s_datastore_preflight_internal_encryption_payload)
      - >-
        not (k3s_datastore_preflight_internal_encryption_payload.get('hashmatch', false) | bool) or
        k3s_datastore_preflight_internal_encryption_payload.get('hasherror', '') | length == 0
  register: k3s_datastore_preflight_internal_encryption_validation_result
  when:
    - not (k3s_datastore_preflight_internal_encryption_parse_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_encryption_parse_result.skipped | default(false) | bool)
  ignore_errors: true
  changed_when: false
  no_log: true

- name: Establish the private valid encryption JSON gate
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_encryption_json_valid: >-
      {{ not (k3s_datastore_preflight_internal_encryption_parse_result.failed | default(false) | bool) and
         not (k3s_datastore_preflight_internal_encryption_parse_result.skipped | default(false) | bool) and
         not (k3s_datastore_preflight_internal_encryption_validation_result.failed | default(true) | bool) }}
  changed_when: false
  no_log: true

- name: Derive encryption command and status fail-closed
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_encryption_command_status: >-
      {{ 'unavailable' if
           k3s_datastore_preflight_internal_encryption_result.rc | default(1) | int != 0 else
         'available' if k3s_datastore_preflight_internal_encryption_json_valid | bool else
         'unknown' }}
    k3s_datastore_preflight_internal_encryption_status: >-
      {{ 'unavailable' if
           k3s_datastore_preflight_internal_encryption_result.rc | default(1) | int != 0 else
         'enabled' if (
           k3s_datastore_preflight_internal_encryption_json_valid | bool and
           k3s_datastore_preflight_internal_encryption_payload.get('enable', none) is boolean and
           k3s_datastore_preflight_internal_encryption_payload.get('enable') | bool and
           k3s_datastore_preflight_internal_config_encryption_status in ['enabled', 'unknown']
         ) else
         'disabled' if (
           k3s_datastore_preflight_internal_encryption_json_valid | bool and
           k3s_datastore_preflight_internal_config_encryption_status in ['disabled', 'unknown'] and
           ((k3s_datastore_preflight_internal_encryption_payload.get('enable', none) is boolean and
             not (k3s_datastore_preflight_internal_encryption_payload.get('enable') | bool)) or
            ('enable' not in k3s_datastore_preflight_internal_encryption_payload and
             k3s_datastore_preflight_internal_encryption_payload.get('stage') == '' and
             k3s_datastore_preflight_internal_encryption_payload.get('activekey') == ''))
         ) else 'unknown' }}
  changed_when: false
  no_log: true

- name: Derive stable rotation stages without overstating initial encryption
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_rotation_stage: >-
      {{ 'unknown' if (
           k3s_datastore_preflight_internal_encryption_status not in ['enabled', 'disabled'] or
           not (k3s_datastore_preflight_internal_encryption_json_valid | bool)
         ) else
         'not_applicable' if k3s_datastore_preflight_internal_encryption_status == 'disabled' else
         'initial' if (
           k3s_datastore_preflight_internal_encryption_status == 'enabled' and
           k3s_datastore_preflight_internal_encryption_payload.get('stage') == 'start' and
           k3s_datastore_preflight_internal_encryption_payload.get('hashmatch', false) | bool
         ) else
         'finished' if (
           k3s_datastore_preflight_internal_encryption_status == 'enabled' and
           k3s_datastore_preflight_internal_encryption_payload.get('stage') == 'reencrypt_finished' and
           k3s_datastore_preflight_internal_encryption_payload.get('hashmatch', false) | bool
         ) else
         'pending' if k3s_datastore_preflight_internal_encryption_payload.get('stage') in
           ['prepare', 'rotate', 'rotate_keys', 'reencrypt_request'] else
         'active' if k3s_datastore_preflight_internal_encryption_payload.get('stage') == 'reencrypt_active' else
         'unknown' }}
  changed_when: false
  no_log: true

- name: Initialize a private empty node payload before parsing
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_node_payload: {}
    k3s_datastore_preflight_internal_ready_node_count: 0
  changed_when: false
  no_log: true

- name: Parse node JSON strictly without logging identities
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_node_payload: "{{ k3s_datastore_preflight_internal_nodes_result.stdout | from_json }}"
  when: k3s_datastore_preflight_internal_nodes_result.rc | default(1) | int == 0
  register: k3s_datastore_preflight_internal_node_parse_result
  ignore_errors: true
  no_log: true

- name: Validate the node-list envelope without logging node identities
  ansible.builtin.assert:
    that:
      - k3s_datastore_preflight_internal_node_payload is mapping
      - k3s_datastore_preflight_internal_node_payload.apiVersion == 'v1'
      - k3s_datastore_preflight_internal_node_payload.kind == 'List'
      - k3s_datastore_preflight_internal_node_payload.get('items', []) is sequence
      - k3s_datastore_preflight_internal_node_payload.get('items', []) is not string
    fail_msg: Refusing an invalid node-list envelope.
  register: k3s_datastore_preflight_internal_node_envelope_result
  when:
    - k3s_datastore_preflight_internal_nodes_result.rc | default(1) | int == 0
    - not (k3s_datastore_preflight_internal_node_parse_result.skipped | default(false) | bool)
    - not (k3s_datastore_preflight_internal_node_parse_result.failed | default(false) | bool)
  ignore_errors: true
  changed_when: false
  no_log: true

- name: Validate every node readiness shape without logging identities
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.status is mapping
      - item.status.conditions is sequence
      - item.status.conditions is not string
      - item.status.conditions | length > 0
      - item.status.conditions | selectattr('type', 'defined') | list | length == item.status.conditions | length
      - item.status.conditions | selectattr('status', 'defined') | list | length == item.status.conditions | length
      - item.status.conditions | selectattr('type', 'equalto', 'Ready') | list | length == 1
      - >-
        (item.status.conditions | selectattr('type', 'equalto', 'Ready') |
        map(attribute='status') | list | first) in ['True', 'False', 'Unknown']
    fail_msg: Refusing an invalid node readiness record.
  loop: "{{ k3s_datastore_preflight_internal_node_payload.get('items', []) }}"
  loop_control:
    label: node-readiness
  register: k3s_datastore_preflight_internal_node_items_result
  when:
    - k3s_datastore_preflight_internal_nodes_result.rc | default(1) | int == 0
    - not (k3s_datastore_preflight_internal_node_parse_result.skipped | default(false) | bool)
    - not (k3s_datastore_preflight_internal_node_parse_result.failed | default(false) | bool)
    - not (k3s_datastore_preflight_internal_node_envelope_result.failed | default(false) | bool)
  ignore_errors: true
  changed_when: false
  no_log: true

- name: Establish the private node query validity gate
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_node_query_valid: >-
      {{ (k3s_datastore_preflight_internal_nodes_result.rc | default(1) | int) == 0 and
         not (k3s_datastore_preflight_internal_node_parse_result.failed | default(false) | bool) and
         not (k3s_datastore_preflight_internal_node_envelope_result.failed | default(false) | bool) and
         not (k3s_datastore_preflight_internal_node_items_result.failed | default(false) | bool) and
         k3s_datastore_preflight_internal_node_payload is mapping and
         k3s_datastore_preflight_internal_node_payload.get('items', []) is sequence }}
  changed_when: false
  no_log: true

- name: Count Ready nodes only after the strict node gate passes
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_ready_node_count: >-
      {{ k3s_datastore_preflight_internal_ready_node_count +
         (1 if ((item.status.conditions | selectattr('type', 'equalto', 'Ready') |
                 map(attribute='status') | list | first) == 'True') else 0) }}
  loop: "{{ k3s_datastore_preflight_internal_node_payload.get('items', []) }}"
  loop_control:
    label: node-readiness
  when: k3s_datastore_preflight_internal_node_query_valid | bool
  changed_when: false
  no_log: true

- name: Project only the bounded node count before private payload cleanup
  ansible.builtin.set_fact:
    k3s_datastore_preflight_internal_node_count: >-
      {{ k3s_datastore_preflight_internal_node_payload.get('items', []) | length
         if k3s_datastore_preflight_internal_node_query_valid | bool else 0 }}
  changed_when: false
  no_log: true
