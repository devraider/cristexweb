---
- name: Reject externally supplied Reactive Resume DEV registration internals
  ansible.builtin.assert:
    that: item not in vars
    fail_msg: "INTERNAL_VARIABLE_GUARD: refusing externally supplied Reactive Resume DEV registration internal {{ item }}."
  loop:
    - reactive_resume_dev_argocd_registration_internal_attestation
    - reactive_resume_dev_argocd_registration_internal_kubeconfig_state
    - reactive_resume_dev_argocd_registration_internal_manifest_states
    - reactive_resume_dev_argocd_registration_internal_manifests
    - reactive_resume_dev_argocd_registration_internal_handoff_manifest_states
    - reactive_resume_dev_argocd_registration_internal_handoff_manifests
    - reactive_resume_dev_argocd_registration_internal_migration_source
    - reactive_resume_dev_argocd_registration_internal_migration_contract
    - reactive_resume_dev_argocd_registration_internal_namespace
    - reactive_resume_dev_argocd_registration_internal_argocd_namespace
    - reactive_resume_dev_argocd_registration_internal_repository_secret
    - reactive_resume_dev_argocd_registration_internal_dependency_states
    - reactive_resume_dev_argocd_registration_internal_dependency_data_keys
    - reactive_resume_dev_argocd_registration_internal_handoff_deployments
    - reactive_resume_dev_argocd_registration_internal_prestate
    - reactive_resume_dev_argocd_registration_internal_handoff_prestate
    - reactive_resume_dev_argocd_registration_internal_preflight_binding
    - reactive_resume_dev_argocd_registration_internal_poststate
    - reactive_resume_dev_argocd_registration_internal_alignment_contract
    - reactive_resume_dev_argocd_registration_internal_alignment_states
    - reactive_resume_dev_argocd_registration_internal_alignment_sources
  changed_when: false

- name: Require the exact non-passthrough Reactive Resume DEV registration contract
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_ARGOCD_REGISTRATION_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_ARGOCD_REGISTRATION_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_ARGOCD_REGISTRATION_ATTESTATION_FILE') | length > 0
      - reactive_resume_dev_argocd_registration_approved | bool
      - reactive_resume_dev_argocd_registration_state == 'present'
      - reactive_resume_dev_argocd_registration_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - reactive_resume_dev_argocd_registration_repository_root == '/home/paul/projects/cristexweb'
      - ansible_diff_mode
      - (ansible_limit | default('')) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - reactive_resume_dev_argocd_registration_manifest_paths | length == 5
      - reactive_resume_dev_argocd_registration_expected_hashes | length == 5
      - reactive_resume_dev_argocd_registration_object_count == 5
      - reactive_resume_dev_argocd_registration_repository == 'ssh://git@ssh.github.com:443/devraider/cristexweb.git'
      - reactive_resume_dev_argocd_registration_revision is match('^[0-9a-f]{40}$')
      - reactive_resume_dev_argocd_registration_path == 'ansible/files/components/reactive-resume-dev-argocd'
      - reactive_resume_dev_argocd_registration_handoff_manifest_paths | length == 8
      - reactive_resume_dev_argocd_registration_handoff_expected_hashes | length == 8
      - reactive_resume_dev_argocd_registration_handoff_object_count == 8
      - reactive_resume_dev_argocd_registration_handoff_objects | length == 8
      - reactive_resume_dev_argocd_registration_handoff_objects | selectattr('namespace', 'equalto', 'cristexhub-dev') | list | length == 8
      - reactive_resume_dev_argocd_registration_handoff_objects | selectattr('namespace', 'equalto', 'cristexhub-prod') | list | length == 0
    fail_msg: Refusing unapproved, mutable, dual-owner, or PROD Reactive Resume DEV registration.
  changed_when: false
  no_log: true

- name: Inspect exact protected k3s administrator kubeconfig boundary
  ansible.builtin.stat:
    path: '{{ reactive_resume_dev_argocd_registration_kubeconfig }}'
    follow: false
  register: reactive_resume_dev_argocd_registration_internal_kubeconfig_state
  changed_when: false
  no_log: true

- name: Require protected regular k3s administrator kubeconfig
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_argocd_registration_internal_kubeconfig_state.stat.isreg | default(false)
      - not (reactive_resume_dev_argocd_registration_internal_kubeconfig_state.stat.islnk | default(false))
      - reactive_resume_dev_argocd_registration_internal_kubeconfig_state.stat.mode == '0640'
      - reactive_resume_dev_argocd_registration_internal_kubeconfig_state.stat.pw_name == 'root'
      - reactive_resume_dev_argocd_registration_internal_kubeconfig_state.stat.gr_name == 'k3s-admin'
    fail_msg: Refusing an absent, symlinked, or permission-drifted k3s administrator kubeconfig.
  changed_when: false
  no_log: true

- name: Inspect hash-bound Reactive Resume DEV registration source
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: '{{ reactive_resume_dev_argocd_registration_manifest_paths }}'
  register: reactive_resume_dev_argocd_registration_internal_manifest_states
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Require immutable Reactive Resume DEV registration source
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.mode == '0644'
      - >-
        item.stat.checksum ==
        (reactive_resume_dev_argocd_registration_expected_hashes | dict2items |
        selectattr('key', 'equalto', item.item | regex_replace(
        '^' ~ reactive_resume_dev_argocd_registration_component_root ~ '/', '')) |
        map(attribute='value') | first)
      - item.item.startswith(reactive_resume_dev_argocd_registration_component_root ~ '/')
    fail_msg: Refusing hash-drifted Reactive Resume DEV registration source.
  loop: '{{ reactive_resume_dev_argocd_registration_internal_manifest_states.results }}'
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Inspect hash-bound Reactive Resume DEV handoff source
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: '{{ reactive_resume_dev_argocd_registration_handoff_manifest_paths }}'
  register: reactive_resume_dev_argocd_registration_internal_handoff_manifest_states
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Require immutable Reactive Resume DEV handoff source
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.mode == '0644'
      - >-
        item.stat.checksum ==
        (reactive_resume_dev_argocd_registration_handoff_expected_hashes |
        dict2items | selectattr('key', 'equalto', item.item |
        regex_replace('^' ~ reactive_resume_dev_argocd_registration_handoff_root ~
        '/', '')) | map(attribute='value') | first)
      - item.item.startswith(reactive_resume_dev_argocd_registration_handoff_root ~ '/')
    fail_msg: Refusing hash-drifted Reactive Resume DEV handoff source.
  loop: '{{ reactive_resume_dev_argocd_registration_internal_handoff_manifest_states.results }}'
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Load exact Reactive Resume DEV registration objects
  ansible.builtin.set_fact:
    reactive_resume_dev_argocd_registration_internal_manifests: >-
      {{ (reactive_resume_dev_argocd_registration_internal_manifests | default([])) +
      [lookup('ansible.builtin.file', item) | from_yaml] }}
  loop: '{{ reactive_resume_dev_argocd_registration_manifest_paths }}'
  changed_when: false
  no_log: true

- name: Load exact Reactive Resume DEV handoff objects
  ansible.builtin.set_fact:
    reactive_resume_dev_argocd_registration_internal_handoff_manifests: >-
      {{ (reactive_resume_dev_argocd_registration_internal_handoff_manifests | default([])) +
      [lookup('ansible.builtin.file', item) | from_yaml] }}
  loop: '{{ reactive_resume_dev_argocd_registration_handoff_manifest_paths }}'
  changed_when: false
  no_log: true

- name: Require value-free exact handoff source and no PROD scope
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_argocd_registration_internal_manifests | length == 5
      - reactive_resume_dev_argocd_registration_internal_handoff_manifests | length == 8
      - >-
        reactive_resume_dev_argocd_registration_internal_handoff_manifests |
        map(attribute='metadata.namespace') | list | unique == ['cristexhub-dev']
      - >-
        (reactive_resume_dev_argocd_registration_internal_handoff_manifests |
        map(attribute='kind') | list | sort) ==
        ['Deployment', 'Ingress', 'Job', 'NetworkPolicy', 'NetworkPolicy',
        'NetworkPolicy', 'Service', 'ServiceAccount']
      - >-
        reactive_resume_dev_argocd_registration_internal_handoff_manifests |
        rejectattr('kind', 'in', ['Secret', 'Namespace', 'PersistentVolumeClaim',
        'Role', 'RoleBinding', 'ClusterRole', 'ClusterRoleBinding']) |
        list | length == 8
      - reactive_resume_dev_argocd_registration_internal_handoff_manifests | selectattr('metadata.namespace', 'equalto', 'cristexhub-prod') | list | length == 0
      - reactive_resume_dev_argocd_registration_internal_manifests | selectattr('kind', 'equalto', 'Secret') | list | length == 1
      - reactive_resume_dev_argocd_registration_internal_manifests | selectattr('kind', 'equalto', 'Application') | list | length == 1
      - reactive_resume_dev_argocd_registration_internal_manifests | selectattr('kind', 'equalto', 'AppProject') | list | length == 1
      - reactive_resume_dev_argocd_registration_internal_manifests | selectattr('kind', 'equalto', 'Role') | list | length == 1
      - reactive_resume_dev_argocd_registration_internal_manifests | selectattr('kind', 'equalto', 'RoleBinding') | list | length == 1
    fail_msg: Refusing an incomplete, value-bearing, or PROD Reactive Resume DEV handoff source.
  changed_when: false
  no_log: true

- name: Require exact Ansible-bootstrap and future-Argo ownership labels on handoff source
  ansible.builtin.assert:
    that:
      - item.metadata.labels.get('app.kubernetes.io/managed-by') == 'ansible'
      - item.metadata.labels.get('cristex.io/desired-owner') == 'argocd'
      - >-
        item.metadata.labels.get('cristex.io/bootstrap-writer') == 'ansible' or
        item.metadata.labels.get('app.kubernetes.io/bootstrap-writer') == 'ansible'
    fail_msg: Refusing handoff source without explicit single-owner labels.
  loop: '{{ reactive_resume_dev_argocd_registration_internal_handoff_manifests }}'
  changed_when: false
  no_log: true

- name: Query exact Reactive Resume DEV and Argo namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: '{{ item }}'
    kubeconfig: '{{ reactive_resume_dev_argocd_registration_kubeconfig }}'
  loop: [cristexhub-dev, argocd]
  register: reactive_resume_dev_argocd_registration_internal_namespaces
  changed_when: false
  no_log: true

- name: Query Infisical-owned Argo repository credential metadata
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: argocd
    name: '{{ reactive_resume_dev_argocd_registration_repository_secret }}'
    kubeconfig: '{{ reactive_resume_dev_argocd_registration_kubeconfig }}'
    hidden_fields:
      - data
      - stringData
      - binaryData
  register: reactive_resume_dev_argocd_registration_internal_repository_secret
  changed_when: false
  no_log: true

- name: Query exact Reactive Resume DEV workload dependency metadata
  kubernetes.core.k8s_info:
    api_version: '{{ item.api_version }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.namespace }}'
    name: '{{ item.name }}'
    kubeconfig: '{{ reactive_resume_dev_argocd_registration_kubeconfig }}'
  loop: '{{ reactive_resume_dev_argocd_registration_dependency_contracts }}'
  register: reactive_resume_dev_argocd_registration_internal_dependency_states
  changed_when: false
  no_log: true

- name: Require exact Namespace and repository credential prerequisites
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_argocd_registration_internal_namespaces.results[0].resources | length == 1
      - reactive_resume_dev_argocd_registration_internal_namespaces.results[0].resources[0].status.phase == 'Active'
      - >-
        reactive_resume_dev_argocd_registration_internal_namespaces.results[0].resources[0].metadata.labels ==
        {'app.kubernetes.io/part-of': 'cristexhub', 'cristex.io/environment': 'dev',
        'cristex.io/bootstrap-writer': 'ansible', 'cristex.io/desired-owner': 'argocd',
        'kubernetes.io/metadata.name': 'cristexhub-dev'}
      - reactive_resume_dev_argocd_registration_internal_namespaces.results[1].resources | length == 1
      - reactive_resume_dev_argocd_registration_internal_namespaces.results[1].resources[0].status.phase == 'Active'
      - reactive_resume_dev_argocd_registration_internal_namespaces.results[1].resources[0].metadata.labels.get('kubernetes.io/metadata.name') == 'argocd'
      - reactive_resume_dev_argocd_registration_internal_repository_secret.resources | length == 1
      - reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].type == 'Opaque'
      - reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].metadata.namespace == 'argocd'
      - >-
        reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].metadata.name ==
        reactive_resume_dev_argocd_registration_repository_secret
      - >-
        (reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].metadata.ownerReferences |
        default([])) | length == 0
      - >-
        (reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].metadata.annotations |
        default({})).keys() | list == ['secrets.infisical.com/version']
      - reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].metadata.annotations['secrets.infisical.com/version'] | length > 0
      - >-
        reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].metadata.labels ==
        {'app.kubernetes.io/managed-by': 'infisical', 'app.kubernetes.io/part-of': 'argocd',
        'argocd.argoproj.io/secret-type': 'repository', 'cristex.io/value-owner': 'infisical-cloud'}
      - reactive_resume_dev_argocd_registration_internal_repository_secret.resources[0].data is not defined
    fail_msg: Refusing registration without exact Namespace and metadata-only Infisical-owned cristexweb repository credential validation.
  changed_when: false
  no_log: true

- name: Require exact RR Secret, CA, pull, and TLS dependency metadata
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.namespace == item.item.namespace
      - item.resources[0].metadata.name == item.item.name
      - item.resources[0].metadata.resourceVersion | default('') | length > 0
      - item.resources[0].metadata.labels == item.item.labels
      - (item.resources[0].metadata.ownerReferences | default([])) | length == 0
      - (item.resources[0].metadata.annotations | default({})).keys() | list | sort == item.item.annotation_keys | sort
      - item.resources[0].metadata.annotations['secrets.infisical.com/version'] | length > 0
      - item.item.type is not defined or item.resources[0].type == item.item.type
      - (item.resources[0].data | default({})).keys() | list | sort == item.item.data_keys | sort
      - item.resources[0].stringData is not defined
      - item.resources[0].binaryData is not defined
    fail_msg: Refusing RR DEV registration until every exact Infisical-owned Secret/CA/pull/TLS dependency is ready and value payloads remain suppressed.
  loop: '{{ reactive_resume_dev_argocd_registration_internal_dependency_states.results }}'
  changed_when: false
  no_log: true

- name: Bind exact RR dependency data-key closure without values
  ansible.builtin.set_fact:
    reactive_resume_dev_argocd_registration_internal_dependency_data_keys: >-
      {{ (reactive_resume_dev_argocd_registration_internal_dependency_data_keys | default({})) |
         combine({item.name: item.data_keys}) }}
  loop: '{{ reactive_resume_dev_argocd_registration_dependency_contracts }}'
  changed_when: false
  no_log: true

- name: Query exact Reactive Resume DEV handoff pre-state
  kubernetes.core.k8s_info:
    api_version: '{{ item.apiVersion }}'
    kind: '{{ item.kind }}'
    namespace: '{{ item.namespace }}'
    name: '{{ item.name }}'
    kubeconfig: '{{ reactive_resume_dev_argocd_registration_kubeconfig }}'
  loop: '{{ reactive_resume_dev_argocd_registration_handoff_objects }}'
  register: reactive_resume_dev_argocd_registration_internal_handoff_prestate
  changed_when: false
  no_log: true

- name: Require exact live handoff objects and no dual reconciliation
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.namespace == 'cristexhub-dev'
      - item.resources[0].metadata.labels == handoff_source.metadata.labels
      - (item.resources[0].metadata.ownerReferences | default([])) | length == 0
      - (item.resources[0].metadata.finalizers | default([])) | length == 0
      - "'argocd.argoproj.io/tracking-id' not in (item.resources[0].metadata.annotations | default({}))"
      - (item.resources[0].metadata.managedFields | default([]) | map(attribute='manager') | list | select('search', 'argocd') | list | length) == 0
    fail_msg: Refusing a missing, foreign, Argo-managed, or dual-reconciled Reactive Resume DEV handoff object.
  loop: '{{ reactive_resume_dev_argocd_registration_internal_handoff_prestate.results }}'
  loop_control:
    index_var: handoff_index
  vars:
    handoff_source: '{{ reactive_resume_dev_argocd_registration_internal_handoff_manifests[handoff_index] }}'
  changed_when: false
  no_log: true

- name: Require the exact completed migration Job source and live immutable spec
  ansible.builtin.assert:
    that:
      - item.item.kind != 'Job' or item.resources | length == 1
      - item.item.kind != 'Job' or item.resources[0].metadata.labels == migration_source.metadata.labels
      - >-
        item.item.kind != 'Job' or
        (item.resources[0].metadata.annotations | dict2items |
        rejectattr('key', 'equalto', 'kubectl.kubernetes.io/last-applied-configuration') |
        list | items2dict) == migration_source.metadata.annotations
      - item.item.kind != 'Job' or item.resources[0].spec.backoffLimit == migration_source.spec.backoffLimit
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.activeDeadlineSeconds == migration_source.spec.activeDeadlineSeconds
      - item.item.kind != 'Job' or item.resources[0].spec.completions == migration_source.spec.completions
      - item.item.kind != 'Job' or item.resources[0].spec.parallelism == migration_source.spec.parallelism
      - item.item.kind != 'Job' or item.resources[0].spec.manualSelector == migration_source.spec.manualSelector
      - >-
        item.item.kind != 'Job' or
        (item.resources[0].spec.template.metadata.labels | dict2items |
        rejectattr('key', 'in', migration_generated_label_keys) | list | items2dict) ==
        migration_source.spec.template.metadata.labels
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.metadata.labels['batch.kubernetes.io/job-name'] ==
        migration_source.metadata.name
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.metadata.labels['job-name'] == migration_source.metadata.name
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.metadata.labels['batch.kubernetes.io/controller-uid'] ==
        item.resources[0].metadata.uid
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.metadata.labels['controller-uid'] == item.resources[0].metadata.uid
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.restartPolicy == migration_source.spec.template.spec.restartPolicy
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.serviceAccountName ==
        migration_source.spec.template.spec.serviceAccountName
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.automountServiceAccountToken ==
        migration_source.spec.template.spec.automountServiceAccountToken
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.imagePullSecrets == migration_source.spec.template.spec.imagePullSecrets
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.securityContext == migration_source.spec.template.spec.securityContext
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.volumes == migration_source.spec.template.spec.volumes
      - item.item.kind != 'Job' or item.resources[0].spec.template.spec.containers | length == 1
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].name ==
        migration_source.spec.template.spec.containers[0].name
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].image ==
        migration_source.spec.template.spec.containers[0].image
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].imagePullPolicy ==
        migration_source.spec.template.spec.containers[0].imagePullPolicy
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].command ==
        migration_source.spec.template.spec.containers[0].command
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].args ==
        migration_source.spec.template.spec.containers[0].args
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].env ==
        migration_source.spec.template.spec.containers[0].env
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].volumeMounts ==
        migration_source.spec.template.spec.containers[0].volumeMounts
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].securityContext ==
        migration_source.spec.template.spec.containers[0].securityContext
      - >-
        item.item.kind != 'Job' or
        item.resources[0].spec.template.spec.containers[0].resources ==
        migration_source.spec.template.spec.containers[0].resources
      - >-
        item.item.kind != 'Job' or
        item.resources[0].status.succeeded | default(0) | int == migration_source.spec.completions
      - item.item.kind != 'Job' or item.resources[0].status.failed | default(0) | int == 0
      - item.item.kind != 'Job' or item.resources[0].status.active | default(0) | int == 0
      - item.item.kind != 'Job' or item.resources[0].status.startTime | default('') | length > 0
      - item.item.kind != 'Job' or item.resources[0].status.completionTime | default('') | length > 0
      - >-
        item.item.kind != 'Job' or
        (item.resources[0].status.conditions | default([]) |
        selectattr('type', 'equalto', 'Complete') |
        selectattr('status', 'equalto', 'True') | list | length) == 1
    fail_msg: >-
      Refusing registration until the completed migration Job exactly matches
      the immutable one-shot policy/source.
  loop: '{{ reactive_resume_dev_argocd_registration_internal_handoff_prestate.results }}'
  vars:
    migration_source: >-
      {{ reactive_resume_dev_argocd_registration_internal_handoff_manifests |
      selectattr('kind', 'equalto', 'Job') | first }}
    migration_generated_label_keys:
      - batch.kubernetes.io/controller-uid
      - batch.kubernetes.io/job-name
      - controller-uid
      - job-name
  changed_when: false
  no_log: true

- name: Require ready existing Reactive Resume DEV workload dependencies
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - >-
        item.item.kind != 'Deployment' or
        (item.resources[0].status.observedGeneration | default(0) | int) ==
        (item.resources[0].metadata.generation | default(0) | int)
      - >-
        item.item.kind != 'Deployment' or
        (item.resources[0].status.readyReplicas | default(0) | int) ==
