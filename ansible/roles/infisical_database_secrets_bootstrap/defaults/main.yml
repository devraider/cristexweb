infisical_database_secrets_bootstrap_project_slug: cristexweb-infrastructure
infisical_database_secrets_bootstrap_environment_slug: prod
infisical_database_secrets_bootstrap_credential_contracts:
  - name: shared-postgresql-infisical-universal-auth
    namespace: shared-services
    type: Opaque
    keys:
      - clientId
      - clientSecret
    labels: &credential_labels
      app.kubernetes.io/managed-by: ansible
      app.kubernetes.io/part-of: infisical-operator
      cristex.io/component: infisical-runtime-auth
      cristex.io/value-owner: infisical-cloud
  - name: shared-mongodb-infisical-universal-auth
    namespace: shared-services
    type: Opaque
    keys:
      - clientId
      - clientSecret
    labels: *credential_labels
infisical_database_secrets_bootstrap_target_contract:
  shared-postgresql-admin:
    type: Opaque
    keys:
      - password
      - username
  shared-postgresql-tls:
    type: kubernetes.io/tls
    keys:
      - ca.crt
      - tls.crt
      - tls.key
  shared-postgresql-cristexhub-dev:
    type: Opaque
    keys:
      - password
      - username
  shared-postgresql-cristexhub-prod:
    type: Opaque
