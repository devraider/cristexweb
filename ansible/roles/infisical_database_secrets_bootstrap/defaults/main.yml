      - username
  shared-postgresql-keycloak:
    type: Opaque
    keys:
      - password
      - username
  shared-mongodb-cristexhub-dev:
    type: Opaque
    keys:
      - password
      - username
  shared-mongodb-cristexhub-prod:
    type: Opaque
    keys:
      - password
      - username
infisical_database_secrets_bootstrap_target_count: 11
infisical_database_secrets_bootstrap_source_names:
