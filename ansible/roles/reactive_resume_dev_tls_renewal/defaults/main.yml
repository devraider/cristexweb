reactive_resume_dev_tls_renewal_approved: false
reactive_resume_dev_tls_renewal_mode: install
reactive_resume_dev_tls_renewal_repository_root: "{{ playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname }}"
reactive_resume_dev_tls_renewal_controller_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
