  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the fixed role defaults source digest
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_internal_defaults_digest.stat.isreg | default(false)
      - not (reactive_resume_dev_tls_renewal_internal_defaults_digest.stat.islnk | default(false))
      - reactive_resume_dev_tls_renewal_internal_defaults_digest.stat.pw_name == 'paul'
      - reactive_resume_dev_tls_renewal_internal_defaults_digest.stat.gr_name == 'paul'
      - reactive_resume_dev_tls_renewal_internal_defaults_digest.stat.mode == '0644'
      - reactive_resume_dev_tls_renewal_internal_defaults_digest.stat.checksum == reactive_resume_dev_tls_renewal_defaults_raw_hash
    fail_msg: Refusing a modified TLS renewal role defaults source.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Read the fixed role defaults source for override detection
  ansible.builtin.slurp:
    src: /home/paul/projects/cristexweb/ansible/roles/reactive_resume_dev_tls_renewal/defaults/main.yml
  register: reactive_resume_dev_tls_renewal_internal_defaults_raw
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require role source hash variables match the fixed defaults source
  ansible.builtin.assert:
    that:
      - >-
        (reactive_resume_dev_tls_renewal_source_hashes | map(attribute='sha256') | list) ==
        ((reactive_resume_dev_tls_renewal_internal_defaults_raw.content | b64decode |
        from_yaml).reactive_resume_dev_tls_renewal_source_hashes |
        map(attribute='sha256') | list)
      - >-
        (reactive_resume_dev_tls_renewal_execution_source_hashes | map(attribute='sha256') | list) ==
        ((reactive_resume_dev_tls_renewal_internal_defaults_raw.content | b64decode |
        from_yaml).reactive_resume_dev_tls_renewal_execution_source_hashes |
        map(attribute='sha256') | list)
    fail_msg: Refusing TLS renewal source hash variables overridden outside the fixed defaults source.
  changed_when: false
  no_log: true

