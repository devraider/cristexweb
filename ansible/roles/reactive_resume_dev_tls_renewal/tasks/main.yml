- name: Inspect the fixed wrapper-bound controller inputs
  ansible.builtin.stat:
    path: '{{ item.path }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - path: /home/paul/projects/cristexweb/.venv/bin/ansible-playbook
      mode: '0755'
      sha256: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_CONTROLLER_SHA256') }}"
    - path: /home/paul/projects/cristexweb/ansible/.ansible/inventory.local.yml
      mode: '0600'
      sha256: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_INVENTORY_SHA256') }}"
    - path: /home/paul/projects/cristexweb/ansible/ansible.cfg
      mode: '0644'
      sha256: 4e39dec40f1f0a0735e7f27e35f464093de3b16e8be1e5fa05299005528a85d9
  register: reactive_resume_dev_tls_renewal_internal_controller_inputs
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the fixed wrapper-bound controller inputs
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_CONTROLLER_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_INVENTORY_SHA256') is match('^[0-9a-f]{64}$')
      - >-
        lookup('ansible.builtin.env',
        'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_ANSIBLE_CONFIG_SHA256') ==
        '4e39dec40f1f0a0735e7f27e35f464093de3b16e8be1e5fa05299005528a85d9'
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'paul'
      - item.stat.gr_name == 'paul'
      - item.stat.mode == item.item.mode
      - item.stat.checksum == item.item.sha256
      - item.item.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: Refusing controller, inventory, or Ansible configuration drift outside the wrapper-bound inputs.
  loop: '{{ reactive_resume_dev_tls_renewal_internal_controller_inputs.results }}'
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect the fixed role defaults source digest
  ansible.builtin.stat:
    path: /home/paul/projects/cristexweb/ansible/roles/reactive_resume_dev_tls_renewal/defaults/main.yml
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
