---
- name: Reject externally supplied renewal internals
  ansible.builtin.assert:
    that:
      - >-
        (vars.keys() |
        select('match', '^reactive_resume_dev_tls_renewal_internal_') |
        list | length) == 0
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied Reactive Resume DEV
      TLS renewal state.
  changed_when: false

- name: Require the exact guarded TLS renewal wrapper
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_approved | bool
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_ENTRYPOINT') == 'v1'
      - (ansible_limit | default('') | string) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - inventory_hostname == 'crtxweb'
      - reactive_resume_dev_tls_renewal_mode in ['install', 'enable']
      - reactive_resume_dev_tls_renewal_repository_root == '/home/paul/projects/cristexweb'
      - reactive_resume_dev_tls_renewal_token_file == '/home/paul/.config/cristexweb/cloudflare-argo-dns-token'
      - reactive_resume_dev_tls_renewal_service == 'cristexweb-reactive-resume-dev-tls-renew.service'
      - reactive_resume_dev_tls_renewal_timer == 'cristexweb-reactive-resume-dev-tls-renew.timer'
    fail_msg: Refusing TLS renewal installation outside the fixed guarded wrapper.
  changed_when: false
  no_log: true

- name: Require the single-use TLS renewal wrapper attestation
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_ATTESTATION_FILE') | length > 0
      - reactive_resume_dev_tls_renewal_controller_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - reactive_resume_dev_tls_renewal_controller_user == lookup('ansible.builtin.env', 'USER')
    fail_msg: Refusing TLS renewal invocation without the canonical wrapper attestation.
  changed_when: false
  no_log: true

- name: Inspect the single-use TLS renewal wrapper attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: reactive_resume_dev_tls_renewal_internal_attestation_state
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the exact single-use TLS renewal wrapper attestation
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_internal_attestation_state.stat.isreg | default(false)
      - not (reactive_resume_dev_tls_renewal_internal_attestation_state.stat.islnk | default(false))
      - reactive_resume_dev_tls_renewal_internal_attestation_state.stat.pw_name == reactive_resume_dev_tls_renewal_controller_user
      - reactive_resume_dev_tls_renewal_internal_attestation_state.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_TOKEN') ~ ':entrypoint'
    fail_msg: Refusing a missing, reusable, foreign-owned, or invalid TLS renewal attestation.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Inspect the hash-bound renewal source closure on the controller
  ansible.builtin.stat:
    path: '{{ item.path }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: >-
    {{ [{'path': reactive_resume_dev_tls_renewal_manifest_path,
         'mode': '0644',
         'sha256': reactive_resume_dev_tls_renewal_manifest_sha256}] +
       reactive_resume_dev_tls_renewal_source_hashes +
       reactive_resume_dev_tls_renewal_execution_source_hashes }}
  register: reactive_resume_dev_tls_renewal_internal_source_states
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require the exact hash-bound renewal source closure
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'paul'
      - item.stat.mode == item.item.mode
      - >-
        (item.item.normalized_digest_name | default('') == '') or
        item.item.normalized_digest_name == 'reactive_resume_dev_tls_renewal_defaults_self_hash'
      - >-
        (item.item.normalized_digest_name | default('') != '') or
        item.stat.checksum == item.item.sha256
    fail_msg: Refusing TLS renewal install from an unreviewed, unsafe, or modified source closure.
  loop: '{{ reactive_resume_dev_tls_renewal_internal_source_states.results }}'
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require wrapper-bound renewal source digests
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_MANIFEST_SHA256') == reactive_resume_dev_tls_renewal_manifest_sha256
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_VALIDATOR_SHA256') ==
        (reactive_resume_dev_tls_renewal_source_hashes |
        selectattr('path', 'search', 'validate-reactive-resume-dev-tls-material') |
        map(attribute='sha256') | first)
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_CERTBOT_SHA256') ==
        (reactive_resume_dev_tls_renewal_source_hashes |
        selectattr('path', 'search', 'reactive-resume-dev-tls-renew') |
        map(attribute='sha256') | first)
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_SERVICE_SHA256') ==
        (reactive_resume_dev_tls_renewal_source_hashes |
        selectattr('path', 'search', 'cristexweb-reactive-resume-dev-tls-renew.service') |
        map(attribute='sha256') | first)
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_TIMER_SHA256') ==
        (reactive_resume_dev_tls_renewal_source_hashes |
        selectattr('path', 'search', 'cristexweb-reactive-resume-dev-tls-renew.timer') |
        map(attribute='sha256') | first)
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_WRAPPER_SHA256') ==
        (reactive_resume_dev_tls_renewal_execution_source_hashes |
        selectattr('path', 'search', 'configure-reactive-resume-dev-tls-renewal') |
        map(attribute='sha256') | first)
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_PLAYBOOK_SHA256') ==
        (reactive_resume_dev_tls_renewal_execution_source_hashes |
        selectattr('path', 'search', 'configure_reactive_resume_dev_tls_renewal.yml') |
        map(attribute='sha256') | first)
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_TASK_SHA256') ==
        (reactive_resume_dev_tls_renewal_execution_source_hashes |
        selectattr('path', 'search', 'reactive_resume_dev_tls_renewal/tasks/main.yml') |
        map(attribute='sha256') | first)
      - >-
        lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_TLS_RENEWAL_DEFAULTS_SHA256') ==
        (reactive_resume_dev_tls_renewal_execution_source_hashes |
        selectattr('path', 'search', 'reactive_resume_dev_tls_renewal/defaults/main.yml') |
        map(attribute='sha256') | first)
    fail_msg: Refusing TLS renewal source hashes not bound by the canonical wrapper.
  changed_when: false
  no_log: true

- name: Read normalized execution closure sources
  ansible.builtin.slurp:
    src: '{{ item.path }}'
  loop: '{{ reactive_resume_dev_tls_renewal_execution_source_hashes | selectattr("normalized_digest_name", "defined") | list }}'
  register: reactive_resume_dev_tls_renewal_internal_normalized_source_contents
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Require normalized execution closure source hashes
  ansible.builtin.assert:
    that:
      - item.item.normalized_digest_name == 'reactive_resume_dev_tls_renewal_defaults_self_hash'
      - >-
        item.content | b64decode |
        regex_replace(
          '^reactive_resume_dev_tls_renewal_defaults_self_hash:[ ]+[0-9a-f]{64}$',
          'reactive_resume_dev_tls_renewal_defaults_self_hash: __SELF_HASH__',
          multiline=True
        ) |
        regex_replace(
          '(?m)^    normalized_digest_name: reactive_resume_dev_tls_renewal_defaults_self_hash\n    sha256: [0-9a-f]{64}$',
          '    normalized_digest_name: reactive_resume_dev_tls_renewal_defaults_self_hash\n    sha256: __SELF_HASH__',
          multiline=True
        ) |
        hash('sha256') == item.item.sha256
    fail_msg: Refusing TLS renewal execution closure with modified role defaults.
  loop: '{{ reactive_resume_dev_tls_renewal_internal_normalized_source_contents.results }}'
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

# Certbot and its Cloudflare DNS-01 plugin are host prerequisites. Installing
# exactly these distro packages belongs to this explicitly approved install
# mode; check mode predicts the package changes without requiring them to be
# present already.
- name: Install exact renewal dependencies
  ansible.builtin.apt:
    name:
      - "certbot={{ reactive_resume_dev_tls_renewal_certbot_package_version }}"
      - "python3-certbot-dns-cloudflare={{ reactive_resume_dev_tls_renewal_dns_cloudflare_package_version }}"
    state: present
    update_cache: false
  when: reactive_resume_dev_tls_renewal_mode == 'install'

- name: Collect package facts for renewal dependencies
  ansible.builtin.package_facts:
    manager: apt

- name: Require the pinned renewal dependency versions and architecture after install
  ansible.builtin.assert:
    that:
      - ansible_check_mode or 'certbot' in ansible_facts.packages
      - ansible_check_mode or ansible_facts.packages['certbot'] | length == 1
      - ansible_check_mode or ansible_facts.packages['certbot'][0].version == reactive_resume_dev_tls_renewal_certbot_package_version
      - ansible_check_mode or ansible_facts.packages['certbot'][0].arch == 'all'
      - ansible_check_mode or 'python3-certbot-dns-cloudflare' in ansible_facts.packages
      - ansible_check_mode or ansible_facts.packages['python3-certbot-dns-cloudflare'] | length == 1
      - >-
        ansible_check_mode or
        ansible_facts.packages['python3-certbot-dns-cloudflare'][0].version ==
        reactive_resume_dev_tls_renewal_dns_cloudflare_package_version
      - ansible_check_mode or ansible_facts.packages['python3-certbot-dns-cloudflare'][0].arch == 'all'
    fail_msg: Refusing renewal dependencies outside the pinned Debian package provenance.
  changed_when: false
  no_log: true

- name: Inspect the pinned Certbot executable
  ansible.builtin.stat:
    path: "{{ reactive_resume_dev_tls_renewal_certbot_path }}"
    follow: false
  register: reactive_resume_dev_tls_renewal_internal_certbot_state
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode or reactive_resume_dev_tls_renewal_mode == 'enable'

- name: Require the pinned Certbot executable metadata
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_internal_certbot_state.stat.isreg | default(false)
      - not (reactive_resume_dev_tls_renewal_internal_certbot_state.stat.islnk | default(false))
      - reactive_resume_dev_tls_renewal_internal_certbot_state.stat.pw_name == 'root'
      - reactive_resume_dev_tls_renewal_internal_certbot_state.stat.gr_name == 'root'
      - reactive_resume_dev_tls_renewal_internal_certbot_state.stat.mode == '0755'
    fail_msg: Refusing a missing, symlinked, or unsafe pinned Certbot executable.
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode or reactive_resume_dev_tls_renewal_mode == 'enable'

- name: Verify pinned Certbot CLI provenance
  ansible.builtin.command:
    argv:
      - "{{ reactive_resume_dev_tls_renewal_certbot_path }}"
      - --version
  register: reactive_resume_dev_tls_renewal_internal_certbot_version
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode or reactive_resume_dev_tls_renewal_mode == 'enable'

- name: Require pinned Certbot CLI version
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_internal_certbot_version.rc == 0
      - >-
        (reactive_resume_dev_tls_renewal_internal_certbot_version.stdout ~ '\n' ~
         reactive_resume_dev_tls_renewal_internal_certbot_version.stderr) is
        search('certbot ' ~ reactive_resume_dev_tls_renewal_certbot_version)
    fail_msg: Refusing Certbot outside the pinned CLI version.
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode or reactive_resume_dev_tls_renewal_mode == 'enable'

- name: Inspect the pinned user-owned Infisical CLI as paul
  ansible.builtin.stat:
    path: "{{ reactive_resume_dev_tls_renewal_infisical_cli }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: reactive_resume_dev_tls_renewal_internal_infisical_state
  become: false
  changed_when: false
  no_log: true

- name: Require the pinned user-owned Infisical CLI
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_internal_infisical_state.stat.isreg | default(false)
      - not (reactive_resume_dev_tls_renewal_internal_infisical_state.stat.islnk | default(false))
      - reactive_resume_dev_tls_renewal_internal_infisical_state.stat.pw_name == 'paul'
      - reactive_resume_dev_tls_renewal_internal_infisical_state.stat.gr_name == 'paul'
      - reactive_resume_dev_tls_renewal_internal_infisical_state.stat.mode == '0755'
      - >-
        reactive_resume_dev_tls_renewal_internal_infisical_state.stat.checksum ==
        reactive_resume_dev_tls_renewal_infisical_cli_sha256
    fail_msg: Refusing a missing, unsafe, or hash-drifted pinned Infisical CLI.
  changed_when: false
  no_log: true

- name: Verify pinned Infisical CLI provenance as paul
  ansible.builtin.command:
    argv:
      - "{{ reactive_resume_dev_tls_renewal_infisical_cli }}"
      - --version
  register: reactive_resume_dev_tls_renewal_internal_infisical_version
  become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Require pinned Infisical CLI version
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_internal_infisical_version.rc == 0
      - >-
        (reactive_resume_dev_tls_renewal_internal_infisical_version.stdout ~ '\n' ~
         reactive_resume_dev_tls_renewal_internal_infisical_version.stderr) is
        search(reactive_resume_dev_tls_renewal_infisical_cli_version)
    fail_msg: Refusing Infisical CLI outside the pinned version.
  changed_when: false
  no_log: true

- name: Inspect protected Cloudflare token file
  ansible.builtin.stat:
    path: "{{ reactive_resume_dev_tls_renewal_token_file }}"
    follow: false
  register: reactive_resume_dev_tls_renewal_internal_token_state
  changed_when: false
  no_log: true

- name: Require protected Cloudflare token metadata
  ansible.builtin.assert:
    that:
      - reactive_resume_dev_tls_renewal_internal_token_state.stat.isreg | default(false)
      - not (reactive_resume_dev_tls_renewal_internal_token_state.stat.islnk | default(false))
      - reactive_resume_dev_tls_renewal_internal_token_state.stat.pw_name == 'paul'
      - reactive_resume_dev_tls_renewal_internal_token_state.stat.gr_name == 'paul'
      - reactive_resume_dev_tls_renewal_internal_token_state.stat.mode == '0600'
      - reactive_resume_dev_tls_renewal_internal_token_state.stat.size >= 20
  changed_when: false
  no_log: true

- name: Inspect exact installed TLS renewal files for enable mode
  ansible.builtin.stat:
    path: '{{ item.path }}'
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: '{{ reactive_resume_dev_tls_renewal_installed_file_contract }}'
  register: reactive_resume_dev_tls_renewal_internal_installed_files
  when: reactive_resume_dev_tls_renewal_mode == 'enable'
  changed_when: false
  no_log: true

- name: Require exact installed TLS renewal files for enable mode
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == item.item.mode
      - item.stat.checksum == item.item.sha256
    fail_msg: Refusing to enable TLS renewal with missing or drifted installed files.
  loop: '{{ reactive_resume_dev_tls_renewal_internal_installed_files.results | default([]) }}'
  when: reactive_resume_dev_tls_renewal_mode == 'enable'
  changed_when: false
  no_log: true

- name: Create protected renewal directories during install mode
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ reactive_resume_dev_tls_renewal_state_root }}", owner: paul, group: paul, mode: '0700'}
    - {path: "{{ reactive_resume_dev_tls_renewal_libexec_root }}", owner: root, group: root, mode: '0755'}
  when: reactive_resume_dev_tls_renewal_mode == 'install'

- name: Install the value-free TLS validator during install mode
  ansible.builtin.copy:
    src: "{{ reactive_resume_dev_tls_renewal_component_root }}/validate-reactive-resume-dev-tls-material"
    dest: "{{ reactive_resume_dev_tls_renewal_libexec_root }}/validate-reactive-resume-dev-tls-material"
    owner: root
    group: root
    mode: '0755'
  when: reactive_resume_dev_tls_renewal_mode == 'install'

- name: Install the guarded renewal executable during install mode
  ansible.builtin.copy:
    src: "{{ reactive_resume_dev_tls_renewal_component_root }}/reactive-resume-dev-tls-renew"
    dest: "{{ reactive_resume_dev_tls_renewal_libexec_root }}/reactive-resume-dev-tls-renew"
    owner: root
    group: root
    mode: '0755'
  when: reactive_resume_dev_tls_renewal_mode == 'install'

- name: Install the renewal service unit during install mode
  ansible.builtin.copy:
    src: "{{ reactive_resume_dev_tls_renewal_component_root }}/cristexweb-reactive-resume-dev-tls-renew.service"
    dest: /etc/systemd/system/cristexweb-reactive-resume-dev-tls-renew.service
    owner: root
    group: root
    mode: '0644'
  register: reactive_resume_dev_tls_renewal_internal_service_unit
  when: reactive_resume_dev_tls_renewal_mode == 'install'

- name: Install the renewal timer unit during install mode
  ansible.builtin.copy:
    src: "{{ reactive_resume_dev_tls_renewal_component_root }}/cristexweb-reactive-resume-dev-tls-renew.timer"
    dest: /etc/systemd/system/cristexweb-reactive-resume-dev-tls-renew.timer
    owner: root
    group: root
    mode: '0644'
  register: reactive_resume_dev_tls_renewal_internal_timer_unit
  when: reactive_resume_dev_tls_renewal_mode == 'install'

- name: Reload systemd after install-mode renewal unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - reactive_resume_dev_tls_renewal_mode == 'install'
    - reactive_resume_dev_tls_renewal_internal_service_unit.changed or reactive_resume_dev_tls_renewal_internal_timer_unit.changed

- name: Keep renewal timer disabled during install mode
  ansible.builtin.systemd_service:
    name: "{{ reactive_resume_dev_tls_renewal_timer }}"
    enabled: false
    state: stopped
  when:
    - reactive_resume_dev_tls_renewal_mode == 'install'
    - not ansible_check_mode

- name: Enable and start the guarded renewal timer
  ansible.builtin.systemd_service:
    name: "{{ reactive_resume_dev_tls_renewal_timer }}"
    enabled: true
    state: started
  when:
    - reactive_resume_dev_tls_renewal_mode == 'enable'
