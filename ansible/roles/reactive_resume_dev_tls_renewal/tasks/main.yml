      - reactive_resume_dev_tls_renewal_execution_source_hashes[3].mode == '0644'
      - reactive_resume_dev_tls_renewal_execution_source_hashes[3].normalized_digest_name == 'reactive_resume_dev_tls_renewal_defaults_self_hash'
