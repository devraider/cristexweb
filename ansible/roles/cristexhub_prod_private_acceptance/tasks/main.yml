---
- name: Require the exact private PROD acceptance process ancestry
  cristexhub_prod_private_acceptance_process_guarded:
    state: check
  register: cristexhub_prod_private_acceptance_internal_process_guard
  tags: [always]
  changed_when: false
  no_log: true

- name: Reject externally supplied private PROD acceptance internals
  ansible.builtin.assert:
    that:
      - >-
        (vars.keys() |
        select('match', '^cristexhub_prod_private_acceptance_internal_') |
        reject('equalto', 'cristexhub_prod_private_acceptance_internal_process_guard') |
        list | length) == 0
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied private PROD
      acceptance state.
  changed_when: false

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require the exact check-only private PROD acceptance invocation
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_approved | bool
      - ansible_check_mode
      - ansible_diff_mode
      - (ansible_limit | default('') | string) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - inventory_hostname == 'crtxweb'
      - cristexhub_prod_private_acceptance_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - cristexhub_prod_private_acceptance_namespace == 'cristexhub-prod'
      - cristexhub_prod_private_acceptance_argocd_namespace == 'argocd'
      - cristexhub_prod_private_acceptance_application == 'cristexhub-prod'
      - cristexhub_prod_private_acceptance_appproject == 'cristexhub-prod'
      - cristexhub_prod_private_acceptance_repository == 'ssh://git@ssh.github.com:443/devraider/cristexhub.git'
      - cristexhub_prod_private_acceptance_path == 'infra/kubernetes/cristexhub-prod'
      - cristexhub_prod_private_acceptance_revision == '751885a42798d282e168131db147f13694a0a621'
      - cristexhub_prod_private_acceptance_server == 'https://kubernetes.default.svc'
      - cristexhub_prod_private_acceptance_private_origin_ip == '100.122.139.32'
      - cristexhub_prod_private_acceptance_private_origin_url == 'http://100.122.139.32/'
      - cristexhub_prod_private_acceptance_private_origin_host == 'hub.cristex-soft.com'
      - cristexhub_prod_private_acceptance_repository_root == '/home/paul/projects/cristexweb'
      - cristexhub_prod_private_acceptance_workload_label == 'app.kubernetes.io/name'
      - cristexhub_prod_private_acceptance_workload_part_label == 'app.kubernetes.io/part-of'
      - cristexhub_prod_private_acceptance_workload_part_value == 'cristexhub'
      - cristexhub_prod_private_acceptance_deployments == ['backend', 'celery-worker', 'frontend', 'oauth2-proxy', 'redis']
      - >-
        cristexhub_prod_private_acceptance_expected_deployment_revisions ==
        {'backend': '1', 'celery-worker': '1', 'frontend': '1', 'oauth2-proxy': '1', 'redis': '1'}
      - >-
        cristexhub_prod_private_acceptance_expected_application_sync_options ==
        ['CreateNamespace=false', 'Prune=false', 'ServerSideApply=false', 'Replace=false', 'FailOnSharedResource=true']
      - >-
        cristexhub_prod_private_acceptance_expected_project_kinds ==
        [{'group': '', 'kind': 'ConfigMap'}, {'group': '', 'kind': 'Service'},
        {'group': 'apps', 'kind': 'Deployment'},
        {'group': 'networking.k8s.io', 'kind': 'NetworkPolicy'},
        {'group': 'networking.k8s.io', 'kind': 'Ingress'}]
    fail_msg: >-
      The private PROD acceptance lane is check-only, one-host, direct-server,
      and bound to the exact pinned application and five-workload closure.
  changed_when: false

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require the canonical private PROD acceptance wrapper
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ENTRYPOINT') == 'v2'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ATTESTATION_FILE') | length > 0
      - >-
        lookup('ansible.builtin.env',
        'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_PATH') ==
        '/home/paul/projects/cristexweb/ansible/bin/check-cristexhub-prod-private-acceptance'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_PID') is match('^[0-9]+$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_STARTTIME') is match('^[0-9]+$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_CANONICAL_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_SOURCE_CLOSURE_SHA256') is match('^[0-9a-f]{64}$')
      - >-
        lookup('ansible.builtin.env',
        'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_CONTROLLER') ==
        '/home/paul/projects/cristexweb/.venv/bin/ansible-playbook'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_PYTHON') == '/usr/bin/python3'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_TASK_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_DEFAULTS_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_PLAYBOOK_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_INVENTORY_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ANSIBLE_CONFIG_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_CONTROLLER_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_PYTHON_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ACTION_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_STRATEGY_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_STRATEGY_CANONICAL_SHA256') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_STRATEGY_ATTESTED') == 'v1'
    fail_msg: >-
      ENTRYPOINT_GUARD: use only the canonical non-passthrough private PROD
      acceptance wrapper.
  changed_when: false

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Inspect the ephemeral private PROD acceptance attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: cristexhub_prod_private_acceptance_internal_attestation_state
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require the private single-run acceptance attestation
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_attestation_state.stat.isreg | default(false)
      - not (cristexhub_prod_private_acceptance_internal_attestation_state.stat.islnk | default(false))
      - cristexhub_prod_private_acceptance_internal_attestation_state.stat.pw_name == cristexhub_prod_private_acceptance_controller_user
      - cristexhub_prod_private_acceptance_internal_attestation_state.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_TOKEN') ~
        ':entrypoint:' ~ lookup('ansible.builtin.env',
        'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_PID') ~ ':' ~
        lookup('ansible.builtin.env',
        'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_STARTTIME') ~ ':' ~
        lookup('ansible.builtin.env',
        'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_SHA256')
    fail_msg: >-
      ENTRYPOINT_GUARD: refusing a missing, reusable, foreign-owned, symlinked,
      or invalid private PROD acceptance attestation.
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Inspect the exact private PROD acceptance source closure
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  loop:
    - "{{ cristexhub_prod_private_acceptance_repository_root }}/ansible/bin/check-cristexhub-prod-private-acceptance"
    - "{{ cristexhub_prod_private_acceptance_repository_root }}/ansible/roles/cristexhub_prod_private_acceptance/tasks/main.yml"
    - "{{ cristexhub_prod_private_acceptance_repository_root }}/ansible/roles/cristexhub_prod_private_acceptance/defaults/main.yml"
    - "{{ cristexhub_prod_private_acceptance_repository_root }}/ansible/playbooks/check_cristexhub_prod_private_acceptance.yml"
    - "{{ cristexhub_prod_private_acceptance_repository_root }}/ansible/plugins/action/cristexhub_prod_private_acceptance_process_guarded.py"
    - "{{ cristexhub_prod_private_acceptance_repository_root }}/ansible/plugins/strategy/cristexhub_prod_private_acceptance_guarded_linear.py"
  register: cristexhub_prod_private_acceptance_internal_source_states
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require regular private PROD acceptance source leaves
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - >-
        item.stat.mode ==
        ('0755' if item.item.endswith('/ansible/bin/check-cristexhub-prod-private-acceptance') else '0644')
      - item.item.startswith(cristexhub_prod_private_acceptance_repository_root ~ '/')
      - item.stat.checksum | length == 64
    fail_msg: Refusing missing, symlinked, or unsafe private PROD acceptance source.
  loop: "{{ cristexhub_prod_private_acceptance_internal_source_states.results }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Bind the source closure hash supplied by the canonical wrapper
  ansible.builtin.set_fact:
    cristexhub_prod_private_acceptance_internal_source_closure_sha256: >-
      {{ ([lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_TASK_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_DEFAULTS_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_PLAYBOOK_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ACTION_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_INVENTORY_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ANSIBLE_CONFIG_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_CONTROLLER_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_PYTHON_SHA256'),
      lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_STRATEGY_SHA256')] |
      join(':') | hash('sha256')) }}
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require source leaves and hashes bound to the canonical wrapper
  ansible.builtin.assert:
    that:
      - >-
        cristexhub_prod_private_acceptance_internal_source_states.results[0].stat.checksum ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_WRAPPER_SHA256')
      - >-
        cristexhub_prod_private_acceptance_internal_source_states.results[1].stat.checksum ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_TASK_SHA256')
      - >-
        cristexhub_prod_private_acceptance_internal_source_states.results[2].stat.checksum ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_DEFAULTS_SHA256')
      - >-
        cristexhub_prod_private_acceptance_internal_source_states.results[3].stat.checksum ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_PLAYBOOK_SHA256')
      - >-
        cristexhub_prod_private_acceptance_internal_source_states.results[4].stat.checksum ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_ACTION_SHA256')
      - >-
        cristexhub_prod_private_acceptance_internal_source_states.results[5].stat.checksum ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_STRATEGY_SHA256')
      - >-
        cristexhub_prod_private_acceptance_internal_source_closure_sha256 ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_CRISTEXHUB_PROD_PRIVATE_ACCEPTANCE_SOURCE_CLOSURE_SHA256')
    fail_msg: Refusing source hashes that are not cryptographically bound to the canonical wrapper.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Capture host service health without mutation
  ansible.builtin.service_facts:
  register: cristexhub_prod_private_acceptance_internal_services
  check_mode: false
  changed_when: false

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require k3s and Tailscale health
  ansible.builtin.assert:
    that:
      - >-
        (cristexhub_prod_private_acceptance_internal_services.ansible_facts.services |
        default({})).get('k3s.service', {}).get('state', '') == 'running'
      - >-
        (cristexhub_prod_private_acceptance_internal_services.ansible_facts.services |
        default({})).get('tailscaled.service', {}).get('state', '') == 'running'
    fail_msg: Refusing private PROD acceptance while host service health is not proven.
  changed_when: false

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query the existing PROD Namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ cristexhub_prod_private_acceptance_namespace }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  register: cristexhub_prod_private_acceptance_internal_namespace
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require the established PROD Namespace
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_namespace.resources | length == 1
      - cristexhub_prod_private_acceptance_internal_namespace.resources[0].status.phase == 'Active'
      - cristexhub_prod_private_acceptance_internal_namespace.resources[0].metadata.name == 'cristexhub-prod'
      - cristexhub_prod_private_acceptance_internal_namespace.resources[0].metadata.labels.get('kubernetes.io/metadata.name') == 'cristexhub-prod'
    fail_msg: Refusing private PROD acceptance without the exact Active Namespace.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query the exact PROD Argo Application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ cristexhub_prod_private_acceptance_argocd_namespace }}"
    name: "{{ cristexhub_prod_private_acceptance_application }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  register: cristexhub_prod_private_acceptance_internal_application
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require direct-server pinned PROD Argo health and exact sync policy
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_application.resources | length == 1
      - cristexhub_prod_private_acceptance_internal_application.resources[0].metadata.name == cristexhub_prod_private_acceptance_application
      - cristexhub_prod_private_acceptance_internal_application.resources[0].metadata.namespace == cristexhub_prod_private_acceptance_argocd_namespace
      - cristexhub_prod_private_acceptance_internal_application.resources[0].metadata.deletionTimestamp | default('') == ''
      - >-
        cristexhub_prod_private_acceptance_internal_application.resources[0].spec ==
        {'destination': {'namespace': cristexhub_prod_private_acceptance_namespace,
        'server': cristexhub_prod_private_acceptance_server},
        'project': cristexhub_prod_private_acceptance_appproject,
        'source': {'path': cristexhub_prod_private_acceptance_path,
        'repoURL': cristexhub_prod_private_acceptance_repository,
        'targetRevision': cristexhub_prod_private_acceptance_revision},
        'syncPolicy': {'automated': {'allowEmpty': false, 'prune': false,
        'selfHeal': true}, 'syncOptions': cristexhub_prod_private_acceptance_expected_application_sync_options}}
      - cristexhub_prod_private_acceptance_internal_application.resources[0].spec.sources | default([]) == []
      - cristexhub_prod_private_acceptance_internal_application.resources[0].spec.ignoreDifferences | default([]) == []
      - cristexhub_prod_private_acceptance_internal_application.resources[0].status.sync.status == 'Synced'
      - cristexhub_prod_private_acceptance_internal_application.resources[0].status.health.status == 'Healthy'
      - cristexhub_prod_private_acceptance_internal_application.resources[0].status.sync.revision == cristexhub_prod_private_acceptance_revision
      - >-
        cristexhub_prod_private_acceptance_internal_application.resources[0].status.sync.comparedTo ==
        {'destination': {'namespace': cristexhub_prod_private_acceptance_namespace,
        'server': cristexhub_prod_private_acceptance_server},
        'source': {'path': cristexhub_prod_private_acceptance_path,
        'repoURL': cristexhub_prod_private_acceptance_repository,
        'targetRevision': cristexhub_prod_private_acceptance_revision}}
      - cristexhub_prod_private_acceptance_internal_application.resources[0].status.operationState.phase == 'Succeeded'
      - >-
        cristexhub_prod_private_acceptance_internal_application.resources[0].status.operationState.syncResult.revision ==
        cristexhub_prod_private_acceptance_revision
      - >-
        cristexhub_prod_private_acceptance_internal_application.resources[0].status.operationState.syncResult.source ==
        {'path': cristexhub_prod_private_acceptance_path,
        'repoURL': cristexhub_prod_private_acceptance_repository,
        'targetRevision': cristexhub_prod_private_acceptance_revision}
      - >-
        cristexhub_prod_private_acceptance_internal_application.resources[0].status.operationState.operation.sync.revision ==
        cristexhub_prod_private_acceptance_revision
      - >-
        cristexhub_prod_private_acceptance_internal_application.resources[0].status.operationState.operation.sync.syncOptions ==
        cristexhub_prod_private_acceptance_expected_application_sync_options
    fail_msg: Refusing stale, aliased, drifted, unpinned, or unhealthy PROD Argo state.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query the exact PROD AppProject
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    namespace: "{{ cristexhub_prod_private_acceptance_argocd_namespace }}"
    name: "{{ cristexhub_prod_private_acceptance_appproject }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  register: cristexhub_prod_private_acceptance_internal_appproject
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require the exact deny-by-default PROD AppProject boundary and exclusions
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_appproject.resources | length == 1
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].metadata.name == cristexhub_prod_private_acceptance_appproject
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].metadata.namespace == cristexhub_prod_private_acceptance_argocd_namespace
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].metadata.deletionTimestamp | default('') == ''
      - >-
        cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec ==
        {'clusterResourceWhitelist': [],
        'destinations': [{'namespace': cristexhub_prod_private_acceptance_namespace,
        'server': cristexhub_prod_private_acceptance_server}],
        'namespaceResourceWhitelist': cristexhub_prod_private_acceptance_expected_project_kinds,
        'orphanedResources': {'warn': true},
        'sourceRepos': [cristexhub_prod_private_acceptance_repository]}
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.clusterResourceBlacklist | default([]) == []
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.namespaceResourceBlacklist | default([]) == []
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.roles | default([]) == []
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.syncWindows | default([]) == []
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.signatureKeys | default([]) == []
      - cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.sourceNamespaces | default([]) == []
      - >-
        {'group': '', 'kind': 'Secret'} not in
        cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.namespaceResourceWhitelist
      - >-
        {'group': '', 'kind': 'ServiceAccount'} not in
        cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.namespaceResourceWhitelist
      - >-
        {'group': '', 'kind': 'Namespace'} not in
        cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.namespaceResourceWhitelist
      - >-
        {'group': '*', 'kind': '*'} not in
        cristexhub_prod_private_acceptance_internal_appproject.resources[0].spec.namespaceResourceWhitelist
    fail_msg: Refusing a widened, aliased, or drifted PROD AppProject.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query the complete PROD Deployment inventory
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ cristexhub_prod_private_acceptance_namespace }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  register: cristexhub_prod_private_acceptance_internal_deployment_inventory
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require exactly the approved PROD Deployment inventory
  ansible.builtin.assert:
    that:
      - >-
        (cristexhub_prod_private_acceptance_internal_deployment_inventory.resources |
        map(attribute='metadata.name') | list | sort) ==
        (cristexhub_prod_private_acceptance_deployments | sort)
      - >-
        (cristexhub_prod_private_acceptance_internal_deployment_inventory.resources |
        selectattr('metadata.deletionTimestamp', 'defined') | list | length) == 0
    fail_msg: Refusing extra, missing, or terminating PROD Deployments.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query every exact PROD Deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ cristexhub_prod_private_acceptance_namespace }}"
    name: "{{ item }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  loop: "{{ cristexhub_prod_private_acceptance_deployments }}"
  register: cristexhub_prod_private_acceptance_internal_deployments
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require exactly one fresh Ready replica for every PROD Deployment
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.name in cristexhub_prod_private_acceptance_deployments
      - item.resources[0].metadata.namespace == cristexhub_prod_private_acceptance_namespace
      - item.resources[0].metadata.deletionTimestamp | default('') == ''
      - item.resources[0].metadata.resourceVersion is match('^[0-9]+$')
      - item.resources[0].metadata.generation | int > 0
      - >-
        item.resources[0].metadata.annotations['deployment.kubernetes.io/revision'] ==
        cristexhub_prod_private_acceptance_expected_deployment_revisions[item.item]
      - item.resources[0].spec.replicas | int == 1
      - >-
        item.resources[0].spec.selector.matchLabels ==
        {'app.kubernetes.io/name': item.item}
      - item.resources[0].spec.template.metadata.labels[cristexhub_prod_private_acceptance_workload_label] == item.item
      - >-
        item.resources[0].spec.template.metadata.labels[cristexhub_prod_private_acceptance_workload_part_label] ==
        cristexhub_prod_private_acceptance_workload_part_value
      - item.resources[0].status.observedGeneration | int == item.resources[0].metadata.generation | int
      - item.resources[0].status.replicas | int == item.resources[0].spec.replicas | int
      - item.resources[0].status.updatedReplicas | int == item.resources[0].spec.replicas | int
      - item.resources[0].status.availableReplicas | int == item.resources[0].spec.replicas | int
      - item.resources[0].status.readyReplicas | int == item.resources[0].spec.replicas | int
      - item.resources[0].status.unavailableReplicas | default(0) | int == 0
      - >-
        (item.resources[0].status.conditions | default([]) |
        selectattr('type', 'equalto', 'Available') |
        selectattr('status', 'equalto', 'True') | list | length) == 1
      - >-
        (item.resources[0].status.conditions | default([]) |
        selectattr('type', 'equalto', 'Progressing') |
        selectattr('status', 'equalto', 'True') | list | length) == 1
      - >-
        (item.resources[0].status.conditions | default([]) |
        selectattr('type', 'equalto', 'Progressing') |
        selectattr('status', 'equalto', 'True') |
        map(attribute='reason') | first) == 'NewReplicaSetAvailable'
    fail_msg: Refusing private PROD acceptance without five exact, fresh, Ready Deployments.
  loop: "{{ cristexhub_prod_private_acceptance_internal_deployments.results }}"
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Bind exact PROD Deployment revision and selector identities
  ansible.builtin.set_fact:
    cristexhub_prod_private_acceptance_internal_deployment_bindings: >-
      {{ (cristexhub_prod_private_acceptance_internal_deployment_bindings | default([])) +
      [{'name': item.item,
      'uid': item.resources[0].metadata.uid,
      'generation': item.resources[0].metadata.generation,
      'revision': item.resources[0].metadata.annotations['deployment.kubernetes.io/revision'],
      'selector': item.resources[0].spec.selector.matchLabels,
      'template_labels': item.resources[0].spec.template.metadata.labels}] }}
  loop: "{{ cristexhub_prod_private_acceptance_internal_deployments.results }}"
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query the exact current ReplicaSet for each PROD Deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: ReplicaSet
    namespace: "{{ cristexhub_prod_private_acceptance_namespace }}"
    label_selectors:
      - "{{ cristexhub_prod_private_acceptance_workload_label }}={{ item }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  loop: "{{ cristexhub_prod_private_acceptance_deployments }}"
  register: cristexhub_prod_private_acceptance_internal_replicasets
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require each PROD ReplicaSet to be the fresh Deployment controller result
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.namespace == cristexhub_prod_private_acceptance_namespace
      - item.resources[0].metadata.name.startswith(item.item ~ '-')
      - item.resources[0].metadata.deletionTimestamp | default('') == ''
      - item.resources[0].metadata.resourceVersion is match('^[0-9]+$')
      - item.resources[0].metadata.labels[cristexhub_prod_private_acceptance_workload_label] == item.item
      - >-
        item.resources[0].metadata.labels[cristexhub_prod_private_acceptance_workload_part_label] ==
        cristexhub_prod_private_acceptance_workload_part_value
      - item.resources[0].metadata.labels['pod-template-hash'] is match('^[0-9a-z]+$')
      - >-
        item.resources[0].metadata.annotations['deployment.kubernetes.io/revision'] ==
        cristexhub_prod_private_acceptance_expected_deployment_revisions[item.item]
      - >-
        item.resources[0].metadata.annotations['deployment.kubernetes.io/revision'] ==
        (cristexhub_prod_private_acceptance_internal_deployment_bindings |
        selectattr('name', 'equalto', item.item) | map(attribute='revision') | first)
      - >-
        item.resources[0].metadata.ownerReferences | default([]) | length == 1
      - >-
        item.resources[0].metadata.ownerReferences | default([]) |
        selectattr('kind', 'equalto', 'Deployment') |
        selectattr('name', 'equalto', item.item) |
        selectattr('controller', 'equalto', true) | list | length == 1
      - >-
        (item.resources[0].metadata.ownerReferences | default([]) |
        selectattr('kind', 'equalto', 'Deployment') |
        selectattr('name', 'equalto', item.item) |
        selectattr('controller', 'equalto', true) |
        map(attribute='uid') | first) ==
        (cristexhub_prod_private_acceptance_internal_deployment_bindings |
        selectattr('name', 'equalto', item.item) | map(attribute='uid') | first)
      - item.resources[0].spec.replicas | int == 1
      - >-
        item.resources[0].spec.selector.matchLabels ==
        {'app.kubernetes.io/name': item.item,
        'pod-template-hash': item.resources[0].metadata.labels['pod-template-hash']}
      - item.resources[0].spec.template.metadata.labels[cristexhub_prod_private_acceptance_workload_label] == item.item
      - >-
        item.resources[0].spec.template.metadata.labels[cristexhub_prod_private_acceptance_workload_part_label] ==
        cristexhub_prod_private_acceptance_workload_part_value
      - item.resources[0].spec.template.metadata.labels['pod-template-hash'] == item.resources[0].metadata.labels['pod-template-hash']
      - item.resources[0].status.observedGeneration | int == item.resources[0].metadata.generation | int
      - item.resources[0].status.replicas | int == 1
      - item.resources[0].status.readyReplicas | int == 1
      - item.resources[0].status.availableReplicas | int == 1
    fail_msg: Refusing a stale, widened, unowned, or non-current PROD ReplicaSet.
  loop: "{{ cristexhub_prod_private_acceptance_internal_replicasets.results }}"
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Bind exact PROD ReplicaSet controller identities
  ansible.builtin.set_fact:
    cristexhub_prod_private_acceptance_internal_replicaset_bindings: >-
      {{ (cristexhub_prod_private_acceptance_internal_replicaset_bindings | default([])) +
      [{'name': item.item,
      'replicaset_name': item.resources[0].metadata.name,
      'uid': item.resources[0].metadata.uid,
      'revision': item.resources[0].metadata.annotations['deployment.kubernetes.io/revision'],
      'pod_template_hash': item.resources[0].metadata.labels['pod-template-hash']}] }}
  loop: "{{ cristexhub_prod_private_acceptance_internal_replicasets.results }}"
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query one Pod for each exact current PROD ReplicaSet label
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ cristexhub_prod_private_acceptance_namespace }}"
    label_selectors:
      - "{{ cristexhub_prod_private_acceptance_workload_label }}={{ item.name }}"
      - "pod-template-hash={{ item.pod_template_hash }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  loop: "{{ cristexhub_prod_private_acceptance_internal_replicaset_bindings }}"
  register: cristexhub_prod_private_acceptance_internal_pods
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require each PROD Pod to be owned by the expected current ReplicaSet
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.namespace == cristexhub_prod_private_acceptance_namespace
      - >-
        item.resources[0].metadata.name.startswith(
        (item.item.replicaset_name) ~ '-')
      - item.resources[0].metadata.labels[cristexhub_prod_private_acceptance_workload_label] == item.item.name
      - item.resources[0].metadata.labels[cristexhub_prod_private_acceptance_workload_part_label] == cristexhub_prod_private_acceptance_workload_part_value
      - item.resources[0].metadata.labels['pod-template-hash'] == item.item.pod_template_hash
      - item.resources[0].metadata.deletionTimestamp | default('') == ''
      - item.resources[0].metadata.resourceVersion is match('^[0-9]+$')
      - >-
        item.resources[0].metadata.ownerReferences | default([]) | length == 1
      - >-
        item.resources[0].metadata.ownerReferences | default([]) |
        selectattr('kind', 'equalto', 'ReplicaSet') |
        selectattr('name', 'equalto', item.item.replicaset_name) |
        selectattr('controller', 'equalto', true) | list | length == 1
      - >-
        (item.resources[0].metadata.ownerReferences | default([]) |
        selectattr('kind', 'equalto', 'ReplicaSet') |
        selectattr('name', 'equalto', item.item.replicaset_name) |
        selectattr('controller', 'equalto', true) |
        map(attribute='uid') | first) == item.item.uid
      - item.resources[0].metadata.ownerReferences[0].uid == item.item.uid
      - item.resources[0].status.phase == 'Running'
      - item.resources[0].spec.hostNetwork | default(false) | bool == false
      - item.resources[0].spec.nodeName | default('') | length > 0
      - item.resources[0].status.startTime | default('') | length > 0
      - >-
        (item.resources[0].status.conditions | default([]) |
        selectattr('type', 'equalto', 'Ready') |
        selectattr('status', 'equalto', 'True') | list | length) == 1
      - >-
        (item.resources[0].status.conditions | default([]) |
        selectattr('type', 'equalto', 'ContainersReady') |
        selectattr('status', 'equalto', 'True') | list | length) == 1
      - item.resources[0].status.containerStatuses | default([]) | length > 0
      - >-
        (item.resources[0].status.containerStatuses | default([]) |
        selectattr('ready', 'equalto', true) | list | length) ==
        (item.resources[0].status.containerStatuses | default([]) | length)
    fail_msg: Refusing a missing, stale, terminating, unowned, host-network, or unready PROD workload Pod.
  loop: "{{ cristexhub_prod_private_acceptance_internal_pods.results }}"
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Query the existing PROD NetworkPolicy inventory
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{ cristexhub_prod_private_acceptance_namespace }}"
    kubeconfig: "{{ cristexhub_prod_private_acceptance_kubeconfig }}"
  register: cristexhub_prod_private_acceptance_internal_networkpolicies
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require non-empty nonterminating PROD NetworkPolicy inventory
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_networkpolicies.resources | length > 0
      - >-
        (cristexhub_prod_private_acceptance_internal_networkpolicies.resources |
        selectattr('metadata.namespace', 'equalto', 'cristexhub-prod') | list | length) ==
        cristexhub_prod_private_acceptance_internal_networkpolicies.resources | length
      - >-
        (cristexhub_prod_private_acceptance_internal_networkpolicies.resources |
        selectattr('metadata.deletionTimestamp', 'defined') | list | length) == 0
    fail_msg: Refusing private PROD acceptance without a stable namespace policy inventory.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Probe the private PROD origin without public DNS
  ansible.builtin.uri:
    url: "{{ cristexhub_prod_private_acceptance_private_origin_url }}"
    headers:
      Host: "{{ cristexhub_prod_private_acceptance_private_origin_host }}"
    method: GET
    status_code: [200, 302]
    timeout: 30
    follow_redirects: none
    return_content: false
  delegate_to: localhost
  become: false
  register: cristexhub_prod_private_acceptance_internal_route
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require private PROD origin response
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_route.status in [200, 302]
    fail_msg: The private PROD origin did not return an expected 200/302 response.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Probe the reviewed shared-realm OIDC discovery endpoint
  ansible.builtin.uri:
    url: https://auth.cristex-soft.com/realms/cristexhub/.well-known/openid-configuration
    method: GET
    headers:
      Accept: application/json
    status_code: [200]
    timeout: 30
    validate_certs: true
    return_content: true
  delegate_to: localhost
  become: false
  register: cristexhub_prod_private_acceptance_internal_oidc
  check_mode: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Parse OIDC discovery without output
  ansible.builtin.set_fact:
    cristexhub_prod_private_acceptance_internal_oidc_payload: "{{ cristexhub_prod_private_acceptance_internal_oidc.content | from_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Require the exact reviewed OIDC issuer and endpoints
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_oidc.status == 200
      - cristexhub_prod_private_acceptance_internal_oidc_payload.issuer == 'https://auth.cristex-soft.com/realms/cristexhub'
      - >-
        cristexhub_prod_private_acceptance_internal_oidc_payload.authorization_endpoint ==
        'https://auth.cristex-soft.com/realms/cristexhub/protocol/openid-connect/auth'
      - >-
        cristexhub_prod_private_acceptance_internal_oidc_payload.token_endpoint ==
        'https://auth.cristex-soft.com/realms/cristexhub/protocol/openid-connect/token'
      - cristexhub_prod_private_acceptance_internal_oidc_payload.jwks_uri == 'https://auth.cristex-soft.com/realms/cristexhub/protocol/openid-connect/certs'
    fail_msg: Refusing private PROD acceptance against an unexpected OIDC issuer or endpoint set.
  changed_when: false
  no_log: true

  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
- name: Emit the sanitized private PROD acceptance preflight receipt
  ansible.builtin.debug:
    msg:
      receipt: cristexhub-prod-private-acceptance
      receipt_format: sanitized-v1
      result: preflight-pass-not-final-acceptance
      namespace: cristexhub-prod
      application: cristexhub-prod
      revision: "{{ cristexhub_prod_private_acceptance_revision }}"
      deployment_count: 5
      ready_pod_count: 5
      networkpolicy_inventory_present: true
      private_origin_status: "{{ cristexhub_prod_private_acceptance_internal_route.status }}"
      private_origin_host_header: verified
      public_route: not-tested-and-not-authorized
      oidc_issuer: verified
      values_output: false
      credentials_rotation: separate-gate
      networkpolicy_enforcement: separate-probe
      backup_restore: separate-gate
  changed_when: false
  when: >-
    cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool

- name: Require the private PROD process guard before reporting acceptance
  ansible.builtin.assert:
    that:
      - cristexhub_prod_private_acceptance_internal_process_guard is defined
      - cristexhub_prod_private_acceptance_internal_process_guard.process_guarded | default(false) | bool
    fail_msg: >-
      ENTRYPOINT_GUARD: private PROD acceptance cannot report success when
      the canonical process guard was skipped.
  tags: [always]
  changed_when: false
  no_log: true
