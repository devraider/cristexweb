network_policy_probe_authored_object_count: 8
network_policy_probe_object_names:
  namespace: kif-cni-netpol-probe
  config_map: probe-http-content
  service: probe-server
  server_pod: probe-server
  allowed_client_pod: probe-client-allowed
  denied_client_pod: probe-client-denied
