---
- name: Reject externally supplied MongoDB bootstrap internal variables
  ansible.builtin.assert:
    that:
      - item not in vars
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied MongoDB bootstrap
      internal variable {{ item }}.
  loop:
    - mongodb_bootstrap_internal_attestation_state
    - mongodb_bootstrap_internal_manifest_states
    - mongodb_bootstrap_internal_manifests
    - mongodb_bootstrap_internal_identity_keys
    - mongodb_bootstrap_internal_runtime_objects
    - mongodb_bootstrap_internal_service_facts_before
    - mongodb_bootstrap_internal_kubeconfig_state
    - mongodb_bootstrap_internal_namespace
    - mongodb_bootstrap_internal_storage_class
    - mongodb_bootstrap_internal_secrets
    - mongodb_bootstrap_internal_pvc_prestate
    - mongodb_bootstrap_internal_pv_prestate
    - mongodb_bootstrap_internal_prestate
    - mongodb_bootstrap_internal_preflight_binding
    - mongodb_bootstrap_internal_apply
    - mongodb_bootstrap_internal_poststate
    - mongodb_bootstrap_internal_ready_statefulset
    - mongodb_bootstrap_internal_bound_pvc
    - mongodb_bootstrap_internal_bound_pv
    - mongodb_bootstrap_internal_ready_pod
    - mongodb_bootstrap_internal_private_service
    - mongodb_bootstrap_internal_service_facts_after
  changed_when: false

- name: Require the MongoDB bootstrap approval contract
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_MONGODB_BOOTSTRAP_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_MONGODB_BOOTSTRAP_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_MONGODB_BOOTSTRAP_ATTESTATION_FILE') | length > 0
      - mongodb_bootstrap_approved | bool
      - mongodb_bootstrap_state == 'present'
      - ansible_diff_mode
      - (ansible_limit | default('')) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - mongodb_bootstrap_kubeconfig == '/etc/rancher/k3s/k3s.yaml'
      - mongodb_bootstrap_repository_root == (playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname)
      - mongodb_bootstrap_manifest_paths | length == mongodb_bootstrap_object_count
      - mongodb_bootstrap_manifest_paths | unique | length == mongodb_bootstrap_object_count
      - mongodb_bootstrap_expected_hashes | length == mongodb_bootstrap_object_count
      - mongodb_bootstrap_object_count == 5
      - mongodb_bootstrap_namespace == 'shared-services'
      - mongodb_bootstrap_service_name == 'shared-mongodb'
      - mongodb_bootstrap_statefulset_name == 'shared-mongodb'
      - mongodb_bootstrap_pvc_name == 'mongodb-data-shared-mongodb-0'
      - mongodb_bootstrap_secret_contract['shared-mongodb-auth']['type'] == 'Opaque'
      - mongodb_bootstrap_secret_contract['shared-mongodb-auth']['keys'] | sort == ['password', 'username'] | sort
      - mongodb_bootstrap_secret_contract['shared-mongodb-tls']['type'] == 'Opaque'
      - mongodb_bootstrap_secret_contract['shared-mongodb-tls']['keys'] | sort == ['ca.crt', 'tls.pem'] | sort
    fail_msg: >-
      MongoDB bootstrap requires the exact wrapper, present-only approval, diff,
      one-host limit, Secret contract, and five-object closure.
  changed_when: false

- name: Inspect the ephemeral MongoDB bootstrap attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_MONGODB_BOOTSTRAP_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: mongodb_bootstrap_internal_attestation_state
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Require the private single-run MongoDB bootstrap attestation
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_attestation_state.stat.exists | default(false)
      - mongodb_bootstrap_internal_attestation_state.stat.isreg | default(false)
      - not (mongodb_bootstrap_internal_attestation_state.stat.islnk | default(false))
      - mongodb_bootstrap_internal_attestation_state.stat.pw_name == mongodb_bootstrap_controller_user
      - mongodb_bootstrap_internal_attestation_state.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_MONGODB_BOOTSTRAP_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_MONGODB_BOOTSTRAP_TOKEN') ~ ':entrypoint'
    fail_msg: >-
      Refusing a missing, reusable, foreign-owned, symlinked, or invalid MongoDB
      bootstrap attestation.
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: Inspect every exact MongoDB manifest leaf
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ mongodb_bootstrap_manifest_paths }}"
  register: mongodb_bootstrap_internal_manifest_states
  delegate_to: localhost
  changed_when: false

- name: Require canonical hash-bound MongoDB manifest leaves
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == mongodb_bootstrap_controller_user
      - item.stat.mode == '0644'
      - (item.item | ansible.builtin.realpath) == item.item
      - >-
        item.stat.checksum == mongodb_bootstrap_expected_hashes[
          item.item | replace(
            mongodb_bootstrap_repository_root ~ '/ansible/files/components/mongodb/',
            ''
          )
        ]
      - item.item.startswith(mongodb_bootstrap_repository_root ~ '/ansible/files/components/mongodb/')
    fail_msg: Refusing missing, unsafe, mode-drifted, or hash-drifted MongoDB source.
  loop: "{{ mongodb_bootstrap_internal_manifest_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  changed_when: false

- name: Load the exact MongoDB object closure
  ansible.builtin.set_fact:
    mongodb_bootstrap_internal_manifests: >-
      {{ (mongodb_bootstrap_internal_manifests | default([])) +
         [(lookup('ansible.builtin.file', item) | from_yaml)] }}
  loop: "{{ mongodb_bootstrap_manifest_paths }}"
  changed_when: false
  no_log: true

- name: Bind exact MongoDB object identities
  ansible.builtin.set_fact:
    mongodb_bootstrap_internal_identity_keys: >-
      {{ (mongodb_bootstrap_internal_identity_keys | default([])) +
         [item.apiVersion ~ '|' ~ item.kind ~ '|' ~
          (item.metadata.namespace | default('')) ~ '|' ~ item.metadata.name] }}
  loop: "{{ mongodb_bootstrap_internal_manifests }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  changed_when: false
  no_log: true

- name: Bind the exact MongoDB runtime partition
  ansible.builtin.set_fact:
    mongodb_bootstrap_internal_runtime_objects: "{{ mongodb_bootstrap_internal_manifests }}"
  changed_when: false
  no_log: true

- name: Require the exact value-free private MongoDB inventory
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_manifests | length == 5
      - mongodb_bootstrap_internal_identity_keys | length == 5
      - mongodb_bootstrap_internal_identity_keys | unique | length == 5
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'NetworkPolicy') | list | length == 2
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'ServiceAccount') | list | length == 1
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Service') | list | length == 1
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'StatefulSet') | list | length == 1
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Secret') | list | length == 0
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'PersistentVolumeClaim') | list | length == 0
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Ingress') | list | length == 0
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Job') | list | length == 0
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'CronJob') | list | length == 0
      - mongodb_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Deployment') | list | length == 0
    fail_msg: Refusing MongoDB source outside the exact five-object value-free closure.
  changed_when: false

- name: Capture service facts before MongoDB bootstrap
  ansible.builtin.service_facts:
  register: mongodb_bootstrap_internal_service_facts_before
  check_mode: false

- name: Require k3s and Tailscale before MongoDB bootstrap
  ansible.builtin.assert:
    that:
      - (mongodb_bootstrap_internal_service_facts_before.ansible_facts.services | default({})).get('k3s.service', {}).get('state', '') == 'running'
      - (mongodb_bootstrap_internal_service_facts_before.ansible_facts.services | default({})).get('tailscaled.service', {}).get('state', '') == 'running'
    fail_msg: k3s and tailscaled must already be running.
  changed_when: false

- name: Inspect the protected k3s kubeconfig
  ansible.builtin.stat:
    path: "{{ mongodb_bootstrap_kubeconfig }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: mongodb_bootstrap_internal_kubeconfig_state
  no_log: true

- name: Require group-scoped k3s administrator access without sudo
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_kubeconfig_state.stat.exists | default(false)
      - mongodb_bootstrap_internal_kubeconfig_state.stat.isreg | default(false)
      - not (mongodb_bootstrap_internal_kubeconfig_state.stat.islnk | default(false))
      - mongodb_bootstrap_internal_kubeconfig_state.stat.pw_name == 'root'
      - mongodb_bootstrap_internal_kubeconfig_state.stat.gr_name == 'k3s-admin'
      - mongodb_bootstrap_internal_kubeconfig_state.stat.mode == '0640'
    fail_msg: Refusing MongoDB bootstrap without root:k3s-admin mode-0640 kubeconfig.
  changed_when: false
  no_log: true

- name: Query the exact shared-services Namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ mongodb_bootstrap_namespace }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_namespace
  changed_when: false

- name: Require the established exact shared-services Namespace
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_namespace.resources | length == 1
      - mongodb_bootstrap_internal_namespace.resources[0].status.phase == 'Active'
      - mongodb_bootstrap_internal_namespace.resources[0].metadata.labels.get('app.kubernetes.io/part-of') == 'cristex-platform'
      - mongodb_bootstrap_internal_namespace.resources[0].metadata.labels.get('cristex.io/bootstrap-writer') == 'ansible'
      - mongodb_bootstrap_internal_namespace.resources[0].metadata.labels.get('cristex.io/desired-owner') == 'argocd'
    fail_msg: Refusing MongoDB bootstrap into a missing or drifted Namespace.
  changed_when: false

- name: Query the exact local-path StorageClass
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: local-path
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_storage_class
  changed_when: false

- name: Require the exact local-path StorageClass before MongoDB bootstrap
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_storage_class.resources | length == 1
      - mongodb_bootstrap_internal_storage_class.resources[0].metadata.name == 'local-path'
      - mongodb_bootstrap_internal_storage_class.resources[0].provisioner == 'rancher.io/local-path'
    fail_msg: Refusing MongoDB bootstrap without the exact local-path provisioner.
  changed_when: false

- name: Query exact precreated MongoDB Secret metadata
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ mongodb_bootstrap_namespace }}"
    name: "{{ item.key }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  loop: "{{ mongodb_bootstrap_secret_contract | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: mongodb_bootstrap_internal_secrets
  changed_when: false
  no_log: true

- name: Require exact Infisical-owned MongoDB Secret contracts
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.namespace == mongodb_bootstrap_namespace
      - item.resources[0].type == item.item.value.type
      - (item.resources[0].data | default({})).keys() | list | sort == item.item.value.keys | sort
      - item.resources[0].metadata.labels.get('app.kubernetes.io/managed-by') == 'infisical'
      - item.resources[0].metadata.labels.get('app.kubernetes.io/part-of') == 'shared-databases'
      - item.resources[0].metadata.labels.get('cristex.io/value-owner') == 'infisical-cloud'
      - >-
        item.item.key != 'shared-mongodb-auth' or
        ((item.resources[0].data.username | b64decode) | length >= 1 and
         (item.resources[0].data.password | b64decode) | length >= 32)
      - >-
        item.item.key != 'shared-mongodb-tls' or
        ((item.resources[0].data['ca.crt'] | b64decode) is search('BEGIN CERTIFICATE') and
         (item.resources[0].data['tls.pem'] | b64decode) is search('BEGIN CERTIFICATE') and
         (item.resources[0].data['tls.pem'] | b64decode) is search('BEGIN .*PRIVATE KEY'))
    fail_msg: >-
      Required Infisical-owned MongoDB Secret metadata is absent or drifted. Values
      must be created by the separate secret-zero procedure before check/apply.
  loop: "{{ mongodb_bootstrap_internal_secrets.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: false
  no_log: true

- name: Validate exact MongoDB Secret values without disclosure
  stateful_database_secret_contract:
    secret_results: "{{ mongodb_bootstrap_internal_secrets.results }}"
  changed_when: false
  no_log: true

- name: Query the exact generated MongoDB PVC pre-state
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: shared-services
    name: "{{ mongodb_bootstrap_pvc_name }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_pvc_prestate
  changed_when: false
  no_log: true

- name: Refuse a foreign or drifted MongoDB PVC
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_pvc_prestate.resources | length in [0, 1]
      - >-
        mongodb_bootstrap_internal_pvc_prestate.resources | length == 0 or
        (mongodb_bootstrap_internal_pvc_prestate.resources[0].metadata.labels.get('app.kubernetes.io/managed-by') == 'ansible' and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].metadata.labels.get('cristex.io/component') == 'mongodb' and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].metadata.labels.get('cristex.io/bootstrap-writer') == 'ansible' and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].metadata.labels.get('cristex.io/desired-owner') == 'argocd' and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.storageClassName == 'local-path' and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.volumeMode == 'Filesystem' and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.accessModes | sort == ['ReadWriteOnce'] and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.selector is not defined and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.dataSource is not defined and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.dataSourceRef is not defined and
         mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.resources.requests.storage == '80Gi')
    fail_msg: Refusing silent reuse of a foreign or drifted MongoDB PVC.
  changed_when: false
  no_log: true

- name: Query exact MongoDB object pre-state
  kubernetes.core.k8s_info:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.metadata.namespace | default(omit) }}"
    name: "{{ item.metadata.name }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  loop: "{{ mongodb_bootstrap_internal_manifests }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.namespace | default('cluster') }}/{{ item.metadata.name }}"
  register: mongodb_bootstrap_internal_prestate
  changed_when: false
  no_log: true

- name: Require an existing MongoDB PVC to remain paired with the guarded StatefulSet
  ansible.builtin.assert:
    that:
      - >-
        mongodb_bootstrap_internal_pvc_prestate.resources | length == 0 or
        ((mongodb_bootstrap_internal_prestate.results |
          selectattr('item.kind', 'equalto', 'StatefulSet') | first).resources | length == 1)
    fail_msg: Refusing MongoDB PVC reuse without the existing guarded StatefulSet.
  changed_when: false
  no_log: true

- name: Query the existing bound MongoDB PV identity
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolume
    name: "{{ mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.volumeName }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_pv_prestate
  changed_when: false
  no_log: true
  when:
    - mongodb_bootstrap_internal_pvc_prestate.resources | length == 1
    - mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.volumeName | default('') | length > 0

- name: Require the existing MongoDB PV to bind only the exact PVC identity
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_pv_prestate.resources | length == 1
      - mongodb_bootstrap_internal_pv_prestate.resources[0].spec.claimRef.namespace == 'shared-services'
      - mongodb_bootstrap_internal_pv_prestate.resources[0].spec.claimRef.name == mongodb_bootstrap_pvc_name
      - mongodb_bootstrap_internal_pv_prestate.resources[0].spec.claimRef.uid == mongodb_bootstrap_internal_pvc_prestate.resources[0].metadata.uid
      - mongodb_bootstrap_internal_pv_prestate.resources[0].metadata.annotations.get('pv.kubernetes.io/provisioned-by') == 'rancher.io/local-path'
    fail_msg: Refusing MongoDB reuse through a foreign or rebound PersistentVolume.
  changed_when: false
  no_log: true
  when:
    - mongodb_bootstrap_internal_pvc_prestate.resources | length == 1
    - mongodb_bootstrap_internal_pvc_prestate.resources[0].spec.volumeName | default('') | length > 0

- name: Refuse foreign existing MongoDB objects
  ansible.builtin.assert:
    that:
      - item.resources | default([]) | length in [0, 1]
      - >-
        item.resources | default([]) | length == 0 or
        ((item.resources[0].metadata.labels | default({})).get('app.kubernetes.io/managed-by', '') == 'ansible' and
         (item.resources[0].metadata.labels | default({})).get('cristex.io/component', '') == 'mongodb' and
         (item.item.kind != 'ServiceAccount' or
          (not (item.resources[0].automountServiceAccountToken | default(false)) and
           item.resources[0].secrets | default([]) | length == 0 and
           item.resources[0].imagePullSecrets | default([]) | length == 0)) and
         (item.item.kind != 'Service' or
          (item.resources[0].spec.type == 'ClusterIP' and
           item.resources[0].spec.externalIPs | default([]) | length == 0 and
           item.resources[0].spec.ports | length == 1 and
           item.resources[0].spec.ports[0].port == 27017 and
           item.resources[0].spec.ports[0].nodePort is not defined)) and
         (item.item.kind != 'NetworkPolicy' or
          (item.resources[0].spec.podSelector == item.item.spec.podSelector and
           item.resources[0].spec.policyTypes | sort == item.item.spec.policyTypes | sort and
           item.resources[0].spec.ingress | default([]) == item.item.spec.ingress | default([]) and
           item.resources[0].spec.egress | default([]) == item.item.spec.egress | default([]))) and
         (item.item.kind != 'StatefulSet' or
          (item.resources[0].spec.serviceName == 'shared-mongodb' and
           item.resources[0].spec.replicas == 1 and
           item.resources[0].spec.template.spec.serviceAccountName == 'shared-mongodb' and
           not (item.resources[0].spec.template.spec.hostNetwork | default(false)) and
           not (item.resources[0].spec.template.spec.hostPID | default(false)) and
           not (item.resources[0].spec.template.spec.hostIPC | default(false)) and
           item.resources[0].spec.template.spec.initContainers | length == 1 and
           item.resources[0].spec.template.spec.volumes | length == item.item.spec.template.spec.volumes | length and
           item.resources[0].spec.template.spec.volumes | selectattr('hostPath', 'defined') | list | length == 0 and
           item.resources[0].spec.template.spec.containers | length == 1 and
           item.resources[0].spec.template.spec.containers[0].image ==
             'docker.io/library/mongo@sha256:b112b1c1e552ab2b5bf5935b5662e1d19347d68effa8f2595687a42abfac5df4')))
    fail_msg: Refusing silent adoption of a foreign MongoDB object.
  loop: "{{ mongodb_bootstrap_internal_prestate.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true

- name: Refuse unmodeled existing MongoDB StatefulSet workload drift
  ansible.builtin.assert:
    that:
      - item.resources[0].spec.template.spec.nodeSelector == item.item.spec.template.spec.nodeSelector
      - item.resources[0].spec.template.spec.containers[0].name == item.item.spec.template.spec.containers[0].name
      - item.resources[0].spec.template.spec.containers[0].args == item.item.spec.template.spec.containers[0].args
      - item.resources[0].spec.template.spec.containers[0].env == item.item.spec.template.spec.containers[0].env
      - item.resources[0].spec.template.spec.containers[0].ports == item.item.spec.template.spec.containers[0].ports
      - item.resources[0].spec.template.spec.containers[0].resources == item.item.spec.template.spec.containers[0].resources
      - item.resources[0].spec.template.spec.containers[0].securityContext == item.item.spec.template.spec.containers[0].securityContext
      - item.resources[0].spec.template.spec.containers[0].volumeMounts == item.item.spec.template.spec.containers[0].volumeMounts
      - item.resources[0].spec.template.spec.initContainers[0].command == item.item.spec.template.spec.initContainers[0].command
      - item.resources[0].spec.template.spec.initContainers[0].args == item.item.spec.template.spec.initContainers[0].args
      - item.resources[0].spec.template.spec.initContainers[0].securityContext == item.item.spec.template.spec.initContainers[0].securityContext
      - item.resources[0].spec.template.spec.initContainers[0].volumeMounts == item.item.spec.template.spec.initContainers[0].volumeMounts
      - item.resources[0].spec.volumeClaimTemplates[0].metadata.labels == item.item.spec.volumeClaimTemplates[0].metadata.labels
      - item.resources[0].spec.volumeClaimTemplates[0].spec == item.item.spec.volumeClaimTemplates[0].spec
    fail_msg: Refusing existing MongoDB StatefulSet workload or claim-template drift.
  loop: "{{ mongodb_bootstrap_internal_prestate.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true
  when:
    - item.item.kind == 'StatefulSet'
    - item.resources | length == 1

- name: Bind the protected MongoDB preflight to this run
  ansible.builtin.set_fact:
    mongodb_bootstrap_internal_preflight_binding:
      attestation_sha256: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_MONGODB_BOOTSTRAP_TOKEN') | ansible.builtin.hash('sha256') }}"
      object_count: "{{ mongodb_bootstrap_internal_manifests | length }}"
      identity_set_sha256: >-
        {{ mongodb_bootstrap_internal_identity_keys | sort | join('\n') | hash('sha256') }}
      prestate_count: "{{ mongodb_bootstrap_internal_prestate.results | length }}"
      secret_count: "{{ mongodb_bootstrap_internal_secrets.results | length }}"
      pvc_prestate_count: "{{ mongodb_bootstrap_internal_pvc_prestate.resources | length }}"
      namespace_contract: true
      storage_contract: true
      service_contract: true
      no_delete_path: true
  changed_when: false
  no_log: true

- name: Reconcile only the exact MongoDB object closure
  mongodb_guarded_k8s:
    state: present
    definition: "{{ item }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
    wait: false
    wait_timeout: 60
  loop: "{{ mongodb_bootstrap_internal_runtime_objects }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  register: mongodb_bootstrap_internal_apply
  no_log: true

- name: Query exact MongoDB post-state
  kubernetes.core.k8s_info:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.metadata.namespace | default(omit) }}"
    name: "{{ item.metadata.name }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  loop: "{{ mongodb_bootstrap_internal_manifests }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.namespace | default('cluster') }}/{{ item.metadata.name }}"
  register: mongodb_bootstrap_internal_poststate
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require exact MongoDB post-state ownership
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].metadata.name == item.item.metadata.name
      - (item.resources[0].metadata.labels | default({})).get('app.kubernetes.io/managed-by', '') == 'ansible'
      - (item.resources[0].metadata.labels | default({})).get('cristex.io/component', '') == 'mongodb'
      - >-
        item.item.kind != 'ServiceAccount' or
        (not (item.resources[0].automountServiceAccountToken | default(false)) and
         item.resources[0].secrets | default([]) | length == 0 and
         item.resources[0].imagePullSecrets | default([]) | length == 0)
      - >-
        item.item.kind != 'Service' or
        (item.resources[0].spec.type == 'ClusterIP' and
         item.resources[0].spec.externalIPs | default([]) | length == 0 and
         item.resources[0].spec.ports | length == 1 and
         item.resources[0].spec.ports[0].port == 27017 and
         item.resources[0].spec.ports[0].targetPort == 'mongodb' and
         item.resources[0].spec.ports[0].protocol == 'TCP' and
         item.resources[0].spec.sessionAffinity == 'None' and
         item.resources[0].spec.ports[0].nodePort is not defined and
         item.resources[0].spec.selector == item.item.spec.selector)
      - >-
        item.item.kind != 'NetworkPolicy' or
        (item.resources[0].spec.podSelector == item.item.spec.podSelector and
         item.resources[0].spec.policyTypes | sort == item.item.spec.policyTypes | sort and
         item.resources[0].spec.ingress | default([]) == item.item.spec.ingress | default([]) and
         item.resources[0].spec.egress | default([]) == item.item.spec.egress | default([]))
      - >-
        item.item.kind != 'StatefulSet' or
        (item.resources[0].spec.serviceName == 'shared-mongodb' and
         item.resources[0].spec.replicas == 1 and
         item.resources[0].spec.template.spec.serviceAccountName == 'shared-mongodb' and
         not (item.resources[0].spec.template.spec.hostNetwork | default(false)) and
         not (item.resources[0].spec.template.spec.hostPID | default(false)) and
         not (item.resources[0].spec.template.spec.hostIPC | default(false)) and
         item.resources[0].spec.template.spec.initContainers | length == 1 and
         item.resources[0].spec.template.spec.volumes | length == item.item.spec.template.spec.volumes | length and
         item.resources[0].spec.template.spec.volumes | selectattr('hostPath', 'defined') | list | length == 0 and
         item.resources[0].spec.template.spec.containers | length == 1 and
         item.resources[0].spec.template.spec.containers[0].image ==
           'docker.io/library/mongo@sha256:b112b1c1e552ab2b5bf5935b5662e1d19347d68effa8f2595687a42abfac5df4')
    fail_msg: The exact MongoDB object closure was not preserved after apply.
  loop: "{{ mongodb_bootstrap_internal_poststate.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require exact MongoDB StatefulSet workload post-state
  ansible.builtin.assert:
    that:
      - item.resources[0].spec.template.spec.nodeSelector == item.item.spec.template.spec.nodeSelector
      - item.resources[0].spec.template.spec.containers[0].args == item.item.spec.template.spec.containers[0].args
      - item.resources[0].spec.template.spec.containers[0].env == item.item.spec.template.spec.containers[0].env
      - item.resources[0].spec.template.spec.containers[0].ports == item.item.spec.template.spec.containers[0].ports
      - item.resources[0].spec.template.spec.containers[0].resources == item.item.spec.template.spec.containers[0].resources
      - item.resources[0].spec.template.spec.containers[0].securityContext == item.item.spec.template.spec.containers[0].securityContext
      - item.resources[0].spec.template.spec.containers[0].volumeMounts == item.item.spec.template.spec.containers[0].volumeMounts
      - item.resources[0].spec.template.spec.initContainers[0].command == item.item.spec.template.spec.initContainers[0].command
      - item.resources[0].spec.template.spec.initContainers[0].args == item.item.spec.template.spec.initContainers[0].args
      - item.resources[0].spec.template.spec.initContainers[0].securityContext == item.item.spec.template.spec.initContainers[0].securityContext
      - item.resources[0].spec.template.spec.initContainers[0].volumeMounts == item.item.spec.template.spec.initContainers[0].volumeMounts
      - item.resources[0].spec.volumeClaimTemplates[0].metadata.labels == item.item.spec.volumeClaimTemplates[0].metadata.labels
      - item.resources[0].spec.volumeClaimTemplates[0].spec == item.item.spec.volumeClaimTemplates[0].spec
    fail_msg: MongoDB StatefulSet workload or claim-template post-state drifted.
  loop: "{{ mongodb_bootstrap_internal_poststate.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - item.item.kind == 'StatefulSet'

- name: Wait for the exact MongoDB StatefulSet rollout
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ mongodb_bootstrap_namespace }}"
    name: "{{ mongodb_bootstrap_statefulset_name }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_ready_statefulset
  until:
    - mongodb_bootstrap_internal_ready_statefulset.resources | length == 1
    - mongodb_bootstrap_internal_ready_statefulset.resources[0].status.readyReplicas | default(0) | int == 1
    - mongodb_bootstrap_internal_ready_statefulset.resources[0].status.currentReplicas | default(0) | int == 1
    - mongodb_bootstrap_internal_ready_statefulset.resources[0].status.updatedReplicas | default(0) | int == 1
    - >-
      mongodb_bootstrap_internal_ready_statefulset.resources[0].metadata.generation | int ==
      mongodb_bootstrap_internal_ready_statefulset.resources[0].status.observedGeneration | int
    - >-
      mongodb_bootstrap_internal_ready_statefulset.resources[0].status.currentRevision ==
      mongodb_bootstrap_internal_ready_statefulset.resources[0].status.updateRevision
  retries: 60
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Wait for the generated retained MongoDB PVC
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ mongodb_bootstrap_namespace }}"
    name: "{{ mongodb_bootstrap_pvc_name }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_bound_pvc
  until:
    - mongodb_bootstrap_internal_bound_pvc.resources | length == 1
    - mongodb_bootstrap_internal_bound_pvc.resources[0].status.phase == 'Bound'
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.storageClassName == 'local-path'
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.volumeMode == 'Filesystem'
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.accessModes | sort == ['ReadWriteOnce']
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.volumeName | length > 0
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.selector is not defined
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.dataSource is not defined
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.dataSourceRef is not defined
    - mongodb_bootstrap_internal_bound_pvc.resources[0].metadata.labels.get('app.kubernetes.io/managed-by') == 'ansible'
    - mongodb_bootstrap_internal_bound_pvc.resources[0].metadata.labels.get('cristex.io/component') == 'mongodb'
    - mongodb_bootstrap_internal_bound_pvc.resources[0].metadata.labels.get('cristex.io/bootstrap-writer') == 'ansible'
    - mongodb_bootstrap_internal_bound_pvc.resources[0].metadata.labels.get('cristex.io/desired-owner') == 'argocd'
    - mongodb_bootstrap_internal_bound_pvc.resources[0].spec.resources.requests.storage == '80Gi'
  retries: 60
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Query the bound MongoDB PV after bootstrap
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolume
    name: "{{ mongodb_bootstrap_internal_bound_pvc.resources[0].spec.volumeName }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_bound_pv
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Verify the bound MongoDB PV claim identity and provisioner
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_bound_pv.resources | length == 1
      - mongodb_bootstrap_internal_bound_pv.resources[0].spec.claimRef.namespace == 'shared-services'
      - mongodb_bootstrap_internal_bound_pv.resources[0].spec.claimRef.name == mongodb_bootstrap_pvc_name
      - mongodb_bootstrap_internal_bound_pv.resources[0].spec.claimRef.uid == mongodb_bootstrap_internal_bound_pvc.resources[0].metadata.uid
      - mongodb_bootstrap_internal_bound_pv.resources[0].metadata.annotations.get('pv.kubernetes.io/provisioned-by') == 'rancher.io/local-path'
    fail_msg: MongoDB PV does not bind the exact guarded PVC identity.
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Wait for the exact MongoDB Pod Ready condition
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ mongodb_bootstrap_namespace }}"
    name: "{{ mongodb_bootstrap_statefulset_name }}-0"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_ready_pod
  until:
    - mongodb_bootstrap_internal_ready_pod.resources | length == 1
    - mongodb_bootstrap_internal_ready_pod.resources[0].status.phase == 'Running'
    - >-
      mongodb_bootstrap_internal_ready_pod.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Ready') |
      selectattr('status', 'equalto', 'True') | list | length == 1
  retries: 60
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Require the exact private MongoDB Service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ mongodb_bootstrap_namespace }}"
    name: "{{ mongodb_bootstrap_service_name }}"
    kubeconfig: "{{ mongodb_bootstrap_kubeconfig }}"
  register: mongodb_bootstrap_internal_private_service
  changed_when: false
  when: not ansible_check_mode

- name: Verify the MongoDB Service remains private ClusterIP-only
  ansible.builtin.assert:
    that:
      - mongodb_bootstrap_internal_private_service.resources | length == 1
      - mongodb_bootstrap_internal_private_service.resources[0].spec.type == 'ClusterIP'
      - mongodb_bootstrap_internal_private_service.resources[0].spec.clusterIP not in ['', 'None']
      - mongodb_bootstrap_internal_private_service.resources[0].spec.ports | length == 1
      - mongodb_bootstrap_internal_private_service.resources[0].spec.ports[0].port == 27017
      - mongodb_bootstrap_internal_private_service.resources[0].spec.ports[0].targetPort == 'mongodb'
      - mongodb_bootstrap_internal_private_service.resources[0].spec.ports[0].protocol == 'TCP'
      - mongodb_bootstrap_internal_private_service.resources[0].spec.sessionAffinity == 'None'
      - >-
        mongodb_bootstrap_internal_private_service.resources[0].spec.selector ==
        {'app.kubernetes.io/name': 'shared-mongodb',
         'app.kubernetes.io/instance': 'shared-mongodb'}
      - mongodb_bootstrap_internal_private_service.resources[0].spec.externalIPs | default([]) | length == 0
      - mongodb_bootstrap_internal_private_service.resources[0].spec.externalName is not defined
      - mongodb_bootstrap_internal_private_service.resources[0].spec.loadBalancerIP is not defined
      - mongodb_bootstrap_internal_private_service.resources[0].spec.loadBalancerClass is not defined
      - mongodb_bootstrap_internal_private_service.resources[0].spec.ports[0].nodePort is not defined
    fail_msg: MongoDB Service did not converge as an exact private ClusterIP.
  changed_when: false
  when: not ansible_check_mode

- name: Capture service facts after MongoDB bootstrap
  ansible.builtin.service_facts:
  register: mongodb_bootstrap_internal_service_facts_after
  check_mode: false

- name: Require k3s and Tailscale after MongoDB bootstrap
  ansible.builtin.assert:
    that:
      - (mongodb_bootstrap_internal_service_facts_after.ansible_facts.services | default({})).get('k3s.service', {}).get('state', '') == 'running'
      - (mongodb_bootstrap_internal_service_facts_after.ansible_facts.services | default({})).get('tailscaled.service', {}).get('state', '') == 'running'
    fail_msg: MongoDB bootstrap must not stop k3s or tailscaled.
  changed_when: false
