---
- name: Reject externally supplied DEV identity internals
  ansible.builtin.assert:
    that:
      - item not in vars
    fail_msg: >-
      INTERNAL_VARIABLE_GUARD: refusing externally supplied DEV identity variable
      {{ item }}.
  loop:
    - keycloak_dev_identity_bootstrap_internal_attestation_state
    - keycloak_dev_identity_bootstrap_internal_manifest_states
    - keycloak_dev_identity_bootstrap_internal_manifests
    - keycloak_dev_identity_bootstrap_internal_identity_keys
    - keycloak_dev_identity_bootstrap_internal_preflight_binding
    - keycloak_dev_identity_bootstrap_internal_read_results
  changed_when: false

- name: Require the check-only DEV identity approval contract
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_ENTRYPOINT') == 'v1'
      - lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_TOKEN') is match('^[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_ATTESTATION_FILE') | length > 0
      - lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_ADMIN_TOKEN_FILE') | length == 0
      - lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_API_BASE_URL') | length == 0
      - keycloak_dev_identity_bootstrap_approved | bool
      - keycloak_dev_identity_bootstrap_state == 'present'
      - ansible_check_mode
      - ansible_diff_mode
      - (ansible_limit | default('')) == 'crtxweb'
      - ansible_play_hosts_all | length == 1
      - keycloak_dev_identity_bootstrap_manifest_paths | length == 4
      - keycloak_dev_identity_bootstrap_expected_hashes | length == 4
      - keycloak_dev_identity_bootstrap_object_count == 4
      - keycloak_dev_identity_bootstrap_realm == 'cristexhub-dev'
      - keycloak_dev_identity_bootstrap_legacy_realm == 'cristexhub'
      - keycloak_dev_identity_bootstrap_client_ids == ['cristexhub-dev', 'cristexhub-admin-svc-dev']
      - keycloak_dev_identity_bootstrap_static_group_names == ['cristexhub-dev-super-admin']
    fail_msg: >-
      DEV identity configuration requires the dedicated non-passthrough check-only
      wrapper, exact source closure, and retained cristexhub legacy realm.
  changed_when: false

- name: Inspect the ephemeral DEV identity attestation
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_ATTESTATION_FILE') }}"
    follow: false
    get_checksum: false
  register: keycloak_dev_identity_bootstrap_internal_attestation_state
  changed_when: false
  no_log: true

- name: Require the private single-run DEV identity attestation
  ansible.builtin.assert:
    that:
      - keycloak_dev_identity_bootstrap_internal_attestation_state.stat.isreg | default(false)
      - not (keycloak_dev_identity_bootstrap_internal_attestation_state.stat.islnk | default(false))
      - keycloak_dev_identity_bootstrap_internal_attestation_state.stat.pw_name == keycloak_dev_identity_bootstrap_controller_user
      - keycloak_dev_identity_bootstrap_internal_attestation_state.stat.mode == '0600'
      - >-
        lookup('ansible.builtin.file', lookup('ansible.builtin.env',
        'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_ATTESTATION_FILE')) ==
        lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_TOKEN') ~ ':entrypoint'
    fail_msg: Refusing an invalid DEV identity attestation.
  changed_when: false
  no_log: true

- name: Inspect every exact DEV identity source leaf
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ keycloak_dev_identity_bootstrap_manifest_paths }}"
  register: keycloak_dev_identity_bootstrap_internal_manifest_states
  changed_when: false

- name: Require hash-bound value-free DEV identity source
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == keycloak_dev_identity_bootstrap_controller_user
      - item.stat.mode == '0644'
      - (item.item | ansible.builtin.realpath) == item.item
      - item.stat.checksum == (keycloak_dev_identity_bootstrap_expected_hashes | selectattr('path', 'equalto', item.item) | map(attribute='sha256') | first)
      - item.item.startswith(keycloak_dev_identity_bootstrap_component_root ~ '/')
    fail_msg: Refusing missing, unsafe, or hash-drifted DEV identity source.
  loop: "{{ keycloak_dev_identity_bootstrap_internal_manifest_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false

- name: Load the exact value-free DEV identity contracts
  ansible.builtin.set_fact:
    keycloak_dev_identity_bootstrap_internal_manifests: >-
      {{ (keycloak_dev_identity_bootstrap_internal_manifests | default([])) +
      [lookup('ansible.builtin.file', item) | from_yaml] }}
  loop: "{{ keycloak_dev_identity_bootstrap_manifest_paths }}"
  changed_when: false
  no_log: true

- name: Bind exact DEV identity contract identities
  ansible.builtin.set_fact:
    keycloak_dev_identity_bootstrap_internal_identity_keys: >-
      {{ (keycloak_dev_identity_bootstrap_internal_identity_keys | default([])) +
      [item.apiVersion ~ '|' ~ item.kind ~ '|' ~ item.metadata.name] }}
  loop: "{{ keycloak_dev_identity_bootstrap_internal_manifests }}"
  changed_when: false
  no_log: true

- name: Require the exact DEV realm client group and mapper inventory
  ansible.builtin.assert:
    that:
      - keycloak_dev_identity_bootstrap_internal_manifests | length == 4
      - keycloak_dev_identity_bootstrap_internal_identity_keys | unique | length == 4
      - >-
        (keycloak_dev_identity_bootstrap_internal_identity_keys | sort | join('\n') |
        hash('sha256')) == keycloak_dev_identity_bootstrap_expected_identity_set_sha256
      - >-
        keycloak_dev_identity_bootstrap_internal_manifests | map(attribute='kind') |
        list == ['KeycloakRealmContract', 'KeycloakClientContract',
        'KeycloakStaticGroupContract', 'KeycloakProtocolMapperContract']
      - keycloak_dev_identity_bootstrap_internal_manifests | selectattr('spec.realm', 'equalto', 'cristexhub-dev') | list | length == 4
      - keycloak_dev_identity_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Secret') | list | length == 0
      - keycloak_dev_identity_bootstrap_internal_manifests | selectattr('kind', 'equalto', 'Ingress') | list | length == 0
    fail_msg: Refusing a DEV identity source outside the exact value-free contract.
  changed_when: false

- name: Require exact DEV identity ownership labels
  ansible.builtin.assert:
    that:
      - item.metadata.labels['cristex.io/environment'] == 'dev'
      - item.metadata.labels['cristex.io/managed-by'] == 'ansible'
      - item.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud'
    fail_msg: Refusing a DEV identity source with foreign ownership labels.
  loop: "{{ keycloak_dev_identity_bootstrap_internal_manifests }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  changed_when: false

- name: Require DEV client and static-group identity boundaries
  ansible.builtin.assert:
    that:
      - >-
        (keycloak_dev_identity_bootstrap_internal_manifests | selectattr('kind', 'equalto',
        'KeycloakClientContract') | first).spec.clients | map(attribute='clientId') | list ==
        ['cristexhub-dev', 'cristexhub-admin-svc-dev']
      - >-
        (keycloak_dev_identity_bootstrap_internal_manifests | selectattr('kind', 'equalto',
        'KeycloakStaticGroupContract') | first).spec.groups | map(attribute='name') | list ==
        ['cristexhub-dev-super-admin']
      - >-
        (keycloak_dev_identity_bootstrap_internal_manifests | selectattr('kind', 'equalto',
        'KeycloakProtocolMapperContract') | first).spec.mappers | map(attribute='name') | list ==
        ['groups', 'organization', 'cristexhub-dev-audience']
      - >-
        ((keycloak_dev_identity_bootstrap_internal_manifests |
        selectattr('kind', 'equalto', 'KeycloakClientContract') | first).spec.clients |
        map(attribute='clientId') | list |
        intersect(keycloak_dev_identity_bootstrap_forbidden_identity_names) | list |
        length) == 0
      - >-
        ((keycloak_dev_identity_bootstrap_internal_manifests |
        selectattr('kind', 'equalto', 'KeycloakStaticGroupContract') | first).spec.groups |
        map(attribute='name') | list |
        intersect(keycloak_dev_identity_bootstrap_forbidden_identity_names) | list |
        length) == 0
      - >-
        ((keycloak_dev_identity_bootstrap_internal_manifests |
        selectattr('kind', 'equalto', 'KeycloakProtocolMapperContract') | first).spec.mappers |
        map(attribute='name') | list | select('search', 'prod|master|argocd') | list |
        length) == 0
    fail_msg: Refusing PROD, master, or cross-environment DEV identity names.
  changed_when: false

- name: Bind the protected DEV identity preflight
  ansible.builtin.set_fact:
    keycloak_dev_identity_bootstrap_internal_preflight_binding:
      attestation_sha256: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_KEYCLOAK_DEV_IDENTITY_TOKEN') | hash('sha256') }}"
      object_count: "{{ keycloak_dev_identity_bootstrap_internal_manifests | length }}"
      identity_set_sha256: "{{ keycloak_dev_identity_bootstrap_internal_identity_keys | sort | join('\n') | hash('sha256') }}"
      no_delete_path: true
      offline_source_only: true
      runtime_api_access: false
      legacy_realm: cristexhub
  changed_when: false
  no_log: true

- name: Validate only the approved DEV identity source offline
  keycloak_dev_identity_guarded:
    state: present
    definition: "{{ item }}"
  loop: "{{ keycloak_dev_identity_bootstrap_internal_manifests }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  register: keycloak_dev_identity_bootstrap_internal_read_results
  no_log: true

- name: Confirm the DEV identity lane remained offline and source-only
  ansible.builtin.assert:
    that:
      - item.failed | default(false) | bool == false
      - item.changed | default(false) | bool
      - item.msg == 'DEV identity source validated offline; runtime state was not inspected'
    fail_msg: Refusing an unexpected DEV identity source validation result.
  loop: "{{ keycloak_dev_identity_bootstrap_internal_read_results.results }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.metadata.name }}"
  changed_when: false
  no_log: true
