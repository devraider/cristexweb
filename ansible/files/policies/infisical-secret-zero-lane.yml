---
policy_schema: cristex-infisical-secret-zero-v1
policy_status: source-only-runtime-blocked
owner: infisical-cloud
kubernetes_writer: ansible
project_slug: cristexweb-infrastructure
environment_slug: bootstrap
infisical_project_slug: cristexweb-infrastructure
infisical_environment_slug: bootstrap
paths:
  argocd: /argocd
  shared-postgresql: /shared-services/postgresql
  shared-mongodb: /shared-services/mongodb
identities:
  provisioning: out-of-band
  create_or_delete_allowed: false
  components:
    argocd:
      runtime:
        identity_slot: argocd-runtime-readonly
        purpose: kubernetes-operator-read-only
        access: read-only
        path: /argocd
      writer:
        identity_slot: argocd-bootstrap-writer
        purpose: controller-bootstrap-upload
        access: write-only-bootstrap
        path: /argocd
    shared-postgresql:
      runtime:
        identity_slot: shared-postgresql-runtime-readonly
        purpose: kubernetes-operator-read-only
        access: read-only
        path: /shared-services/postgresql
      writer:
        identity_slot: shared-postgresql-bootstrap-writer
        purpose: controller-bootstrap-upload
        access: write-only-bootstrap
        path: /shared-services/postgresql
    shared-mongodb:
      runtime:
        identity_slot: shared-mongodb-runtime-readonly
        purpose: kubernetes-operator-read-only
        access: read-only
        path: /shared-services/mongodb
      writer:
        identity_slot: shared-mongodb-bootstrap-writer
        purpose: controller-bootstrap-upload
        access: write-only-bootstrap
        path: /shared-services/mongodb
credential_secrets:
  labels: &credential_labels
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: infisical-operator
    cristex.io/component: infisical-runtime-auth
    cristex.io/value-owner: infisical-cloud
  contracts:
    - component: argocd
      namespace: argocd
      name: argocd-infisical-universal-auth
      type: Opaque
      keys:
        - clientId
        - clientSecret
      labels: *credential_labels
    - component: shared-postgresql
      namespace: shared-services
      name: shared-postgresql-infisical-universal-auth
      type: Opaque
      keys:
        - clientId
        - clientSecret
      labels: *credential_labels
    - component: shared-mongodb
      namespace: shared-services
      name: shared-mongodb-infisical-universal-auth
      type: Opaque
      keys:
        - clientId
        - clientSecret
      labels: *credential_labels
consumer_credentials:
  postgresql:
    - consumer: cristexhub-dev
      secret: shared-postgresql-cristexhub-dev
      username: cristexhub_dev_owner
      username_key: POSTGRESQL_CRISTEXHUB_DEV_USERNAME
      password_key: POSTGRESQL_CRISTEXHUB_DEV_PASSWORD
      activation: inactive
    - consumer: cristexhub-prod
      secret: shared-postgresql-cristexhub-prod
      username: cristexhub_prod_owner
      username_key: POSTGRESQL_CRISTEXHUB_PROD_USERNAME
      password_key: POSTGRESQL_CRISTEXHUB_PROD_PASSWORD
      activation: inactive
    - consumer: reactive-resume-dev
      secret: shared-postgresql-reactive-resume-dev
      username: reactive_resume_dev_owner
      username_key: POSTGRESQL_REACTIVE_RESUME_DEV_USERNAME
      password_key: POSTGRESQL_REACTIVE_RESUME_DEV_PASSWORD
      activation: inactive
    - consumer: reactive-resume-prod
      secret: shared-postgresql-reactive-resume-prod
      username: reactive_resume_prod_owner
      username_key: POSTGRESQL_REACTIVE_RESUME_PROD_USERNAME
      password_key: POSTGRESQL_REACTIVE_RESUME_PROD_PASSWORD
      activation: inactive
    - consumer: keycloak
      secret: shared-postgresql-keycloak
      username: keycloak_owner
      username_key: POSTGRESQL_KEYCLOAK_USERNAME
      password_key: POSTGRESQL_KEYCLOAK_PASSWORD
      activation: inactive
  mongodb:
    - consumer: cristexhub-dev
      secret: shared-mongodb-cristexhub-dev
      username: cristexhub_dev_user
      username_key: MONGODB_CRISTEXHUB_DEV_USERNAME
      password_key: MONGODB_CRISTEXHUB_DEV_PASSWORD
      activation: inactive
    - consumer: cristexhub-prod
      secret: shared-mongodb-cristexhub-prod
      username: cristexhub_prod_user
      username_key: MONGODB_CRISTEXHUB_PROD_USERNAME
      password_key: MONGODB_CRISTEXHUB_PROD_PASSWORD
      activation: inactive
value_generation:
  owner: protected-controller-value-lane
  logical_consumer_credentials: generated-and-uploaded
  provisioning_roles: forbidden
  username_contract: frozen-principal
  random_password_contract: 64-lowercase-hex
  upload_response_contract: exact-key-closure-and-revision-marker
value_paths:
  - component: argocd
    path: /argocd
    keys:
      - ARGOCD_ADMIN_PASSWORD_BCRYPT
      - ARGOCD_ADMIN_PASSWORD_MTIME
      - ARGOCD_SERVER_SECRETKEY
      - ARGOCD_REDIS_AUTH
      - ARGOCD_TLS_CA_CRT
      - ARGOCD_TLS_CRT
      - ARGOCD_TLS_KEY
    bcrypt:
      algorithm: bcrypt
      cost: 12
      format: '^\\$2[aby]\\$12\\$[./A-Za-z0-9]{53}$'
    tls:
      dns_names:
        - argocd-server.argocd.svc
        - localhost
      ca_key_bits: 3072
      leaf_key_bits: 3072
      minimum_remaining_validity_hours: 24
      signature_hashes:
        - sha256
        - sha384
        - sha512
      leaf_extended_key_usage: serverAuth
  - component: shared-postgresql
    path: /shared-services/postgresql
    keys:
      - POSTGRESQL_ADMIN_USERNAME
      - POSTGRESQL_ADMIN_PASSWORD
      - POSTGRESQL_TLS_CA_CRT
      - POSTGRESQL_TLS_CRT
      - POSTGRESQL_TLS_KEY
      - POSTGRESQL_CRISTEXHUB_DEV_USERNAME
      - POSTGRESQL_CRISTEXHUB_DEV_PASSWORD
      - POSTGRESQL_CRISTEXHUB_PROD_USERNAME
      - POSTGRESQL_CRISTEXHUB_PROD_PASSWORD
      - POSTGRESQL_REACTIVE_RESUME_DEV_USERNAME
      - POSTGRESQL_REACTIVE_RESUME_DEV_PASSWORD
      - POSTGRESQL_REACTIVE_RESUME_PROD_USERNAME
      - POSTGRESQL_REACTIVE_RESUME_PROD_PASSWORD
      - POSTGRESQL_KEYCLOAK_USERNAME
      - POSTGRESQL_KEYCLOAK_PASSWORD
    tls:
      dns_names:
        - localhost
        - shared-postgresql.shared-services.svc
        - shared-postgresql.shared-services.svc.cluster.local
      ca_key_bits: 3072
      leaf_key_bits: 3072
      minimum_remaining_validity_hours: 24
      signature_hashes:
        - sha256
        - sha384
        - sha512
      leaf_extended_key_usage: serverAuth
  - component: shared-mongodb
    path: /shared-services/mongodb
    keys:
      - MONGODB_ADMIN_USERNAME
      - MONGODB_ADMIN_PASSWORD
      - MONGODB_TLS_CA_CRT
      - MONGODB_TLS_PEM
      - MONGODB_CRISTEXHUB_DEV_USERNAME
      - MONGODB_CRISTEXHUB_DEV_PASSWORD
      - MONGODB_CRISTEXHUB_PROD_USERNAME
      - MONGODB_CRISTEXHUB_PROD_PASSWORD
    tls:
      dns_names:
        - localhost
        - shared-mongodb.shared-services.svc
        - shared-mongodb.shared-services.svc.cluster.local
      ca_key_bits: 3072
      leaf_key_bits: 3072
      minimum_remaining_validity_hours: 24
      signature_hashes:
        - sha256
        - sha384
        - sha512
      leaf_extended_key_usage: serverAuth
      combined_pem: tls.crt-and-tls.key
api:
  production_base: https://app.infisical.com/api
  login_path: /v1/auth/universal-auth/login
  batch_upload_path: /v3/secrets/batch
  metadata_preflight: /v3/secrets
  contract_status: source-only-unverified
  fake_endpoint_allowed_only_for_offline_tests: true
scope_separation:
  runtime_credentials_are_not_writer_credentials: true
  components_have_distinct_credentials: true
  project_environment_is_fixed: true
  recursive_secret_reads: false
  prod_environment_or_path: absent
runtime:
  check_apply_idempotence: not-run-blocked
  operator_crs: not-authorized
  generated_kubernetes_application_secrets: not-authorized
  database_provisioning: not-authorized
  rotation: separately-reviewed-only
  recovery: encrypted-artifact-and-independent-key-custody-required
  routine_deletion: forbidden
