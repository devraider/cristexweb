---
policy_schema: cristexhub-prod-deepseek-credential-boundary-v1
policy_status: source-only-external-owner-unverified
purpose: >-
  Define the value-free boundary for revoking the exposed DeepSeek predecessor and
  replacing it through the owning CristexHub application and DeepSeek account. This
  policy is discovery and evidence contract only; it is not a provider client,
  Infisical writer, Kubernetes controller, workload rollout, or public-route
  authorization.

scope:
  provider: deepseek
  api_host: api.deepseek.com
  api_port: 443
  transport:
    owner: ansible-oidc-connect-proxy
    source_contract: ansible/files/components/oidc-connect-proxy/config/configmap-oidc-connect-proxy.yaml
    proof: transport-only
    unauthenticated_status_is_not_credential_acceptance: true
  credential_owner: external-application-owner-and-deepseek-account-owner
  infrastructure_role: protected-metadata-and-evidence-boundary
  current_status: NOT-RUN-BLOCKED

application_target:
  owner: cristexhub-application
  repository: devraider/cristexhub
  environment: prod
  namespace: cristexhub-prod
  workload_scope:
    source: external-application-owner-and-protected-live-metadata
    status: exact-consumer-inventory-unverified
    no_infrastructure_inference: true
  secret_manager:
    status: unknown-until-protected-owner-discovery
    accepted_owners:
      - application-owned-secret-manager
      - infisical-cloud-after-owner-proof
  runtime_secret_target:
    status: absent-from-infrastructure-source
    name: none-in-this-repository
    key: unresolved-until-protected-discovery
    direct_kubernetes_secret_write: forbidden
    new_infrastructure_static_secret: forbidden

infisical_target_discovery:
  status: unresolved
  known_project_context:
    project_slug: cristexweb-infrastructure
    project_id: 619656da-14f3-4872-857b-be103cdc5326
    environment_slug: prod
    context_is_not_target_proof: true
  exact_target_required: true
  recursive: false
  accepted_only_after_application_owner_proof:
    project_id: metadata-only
    environment_slug: metadata-only
    secret_path: metadata-only
    secret_key_name: metadata-only
    source_revision: metadata-only
    target_secret_name: metadata-only
    target_secret_type: metadata-only
    target_owner_labels: metadata-only
    consumer_environment_variable_name: metadata-only
  forbidden_discovery_fields:
    - plaintext_secret_value
    - decoded_secret_value
    - base64_secret_data
    - authorization_header
    - provider_token
    - connection_string_with_credentials
  target_contract:
    one_exact_source_path_and_key: required
    one_exact_materialized_target: required_if_infisical_is_confirmed
    unrelated_keys_preserved: required
    target_value_owner: infisical-cloud-only-if-owner-proven
    source_revision_or_conditional_read: required
    ordinary_kubernetes_secret_json: forbidden

external_owner_actions:
  application_owner:
    authority: exact-application-secret-source-and-consumer
    required_actions:
      - prove_application_repository_and_deployed_revision
      - identify_exact_secret_manager_path_and_key_by_metadata_only
      - issue_or_reconcile_provider_successor_through_application_owned_path
      - prove_private_authenticated_application_health_without_value_output
    infrastructure_repo_action: evidence-review-only
  deepseek_account_owner:
    authority: provider-account-and-api-key-lifecycle
    required_actions:
      - prove_account_ownership_through_protected_provider_metadata
      - revoke_the_exposed_predecessor
      - issue_the_provider_successor
      - provide_value-free_revocation_and_successor_receipts
    provider_channel: provider-console-or-official-provider-api-owned-by-account-holder
    infrastructure_repo_action: forbidden
  infrastructure_repository:
    provider_revocation: forbidden-unless-ownership-is-proven
    current_provider_authority: absent
    provider_credentials: absent
    provider_api_calls: forbidden
    exception_requires_all:
      - explicit_human_ownership_transfer_to_this_infrastructure_owner
      - protected_provider_account_ownership_receipt
      - provider_permission_metadata_for_revocation_only
      - dedicated_source_hash_bound_guarded_lane
      - separate_provider_revocation_approval
      - value_free_preflight_and_sanitized_receipt_contract
    no_exception_implementation_in_this_repository: true

check_only_evidence:
  status: NOT-RUN-BLOCKED
  mode: source-only-check-only
  runtime_or_provider_action: forbidden
  permitted_inputs:
    - protected_owner_attestation_without_secret_values
    - provider_key_identifier_metadata_without_key_material
    - application_deployment_revision_metadata
    - Infisical_secret_path_key_revision_and_target_metadata_without_values
    - sanitized_successor_and_revocation_receipts
  required_boolean_results:
    owner_identity_proved: false
    provider_account_ownership_proved: false
    exact_application_target_proved: false
    exact_infisical_target_proved: false
    predecessor_identity_proved: false
    successor_issued: false
    successor_reconciled_to_private_consumer: false
    predecessor_revoked: false
    fresh_authentication_failure_proved: false
    plaintext_residue_absent: false
  receipt_fields_allowed:
    - evidence_id
    - source_revision
    - provider_key_metadata_identifier
    - infisical_source_revision
    - materialized_target_resource_version
    - application_deployment_revision
    - sanitized_timestamp
    - boolean_result
  receipt_fields_forbidden:
    - secret_value
    - secret_data
    - token
    - password
    - authorization_header
    - request_or_response_body
    - cookie
    - connection_string
  no_value_output: true
  no_value_persistence: true

stop_states:
  - OWNER-UNKNOWN-STOP
  - PROVIDER-ACCOUNT-UNKNOWN-STOP
  - APPLICATION-TARGET-UNKNOWN-STOP
  - INFISICAL-TARGET-UNKNOWN-STOP
  - PREDECESSOR-UNKNOWN-STOP
  - SUCCESSOR-UNKNOWN-STOP
  - CUSTODY-UNKNOWN-STOP
  - REVISION-UNKNOWN-STOP
  - PROVIDER-REVOCATION-UNKNOWN-STOP
  - AUTHENTICATION-ACCEPTANCE-UNKNOWN-STOP
  - AMBIGUOUS-WRITE-UNKNOWN-STOP
  - PLAINTEXT-RESIDUE-STOP
  - PUBLIC-CUTOVER-STOP

state_machine:
  required_order:
    - protected_owner_and_account_discovery
    - exact_application_and_infisical_target_metadata_discovery
    - encrypted_predecessor_and_successor_custody
    - provider_successor_issuance_by_deepseek_account_owner
    - application_owned_source_reconciliation
    - private_authenticated_successor_probe
    - separate_provider_predecessor_revocation_approval
    - provider_predecessor_revocation_by_account_owner
    - fresh_authentication_failure_probe
    - sanitized_receipt_and_plaintext_cleanup
  any_unknown_or_ambiguous_result: stop-state
  rollback_claim_without_provider_confirmation: forbidden

public_cutover:
  status: forbidden
  forbidden_until:
    - deepseek_owner_and_account_ownership_proved
    - exact_application_target_proved
    - exact_infisical_target_proved_or_external_path_proved
    - provider_predecessor_revoked
    - provider_successor_reconciled
    - private_authenticated_successor_probe_passed
    - fresh_predecessor_authentication_failure_proved
    - shared_mongodb_networkpolicy_enforced
    - private_prod_acceptance_passed
  no_public_route_mutation: true
  no_cloudflare_provider_operation: true
  no_infrastructure_provider_revocation: true
