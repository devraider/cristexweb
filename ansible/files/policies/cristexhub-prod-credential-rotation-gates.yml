---
policy_schema: cristexhub-prod-credential-rotation-gates-v1
policy_status: source-only-rotation-blocked
purpose: >-
  Freeze the value-free gates for replacing credentials exposed during local review.
  This policy is not a writer, rotator, broker/database administrator, registry
  client, Kubernetes controller, or public-route authorization.

common_contract:
  value_owner: infisical-cloud-or-external-provider
  values_in_source: false
  values_in_argv: false
  values_in_environment: false
  values_in_logs: false
  values_in_evidence: false
  direct_kubernetes_secret_write: forbidden
  implicit_rotation: forbidden
  predecessor_recovery_required: true
  expected_revision_or_conditional_write_required: true
  ambiguous_write_result: UNKNOWN-STOP
  preserve_unrelated_keys: true
  cross_system_operation: non-atomic
  runtime_status: NOT-RUN-BLOCKED
  required_gates:
    - identify-the-exact-predecessor-from-protected-metadata
    - verify-target-ownership-and-source-revision
    - verify-encrypted-predecessor-and-successor-recovery-custody
    - prove-conditional-write-or-refuse-to-write
    - reconcile-through-the-existing-value-owner
    - prove-private-consumer-readiness-before-revocation
    - distinguish-authorization-denial-from-authentication-revocation
    - remove-plaintext-residue-and-emit-sanitized-receipt

rotations:
  mongodb:
    scope: cristexhub-prod-consumer
    namespace: shared-services
    source:
      environment: prod
      path: /shared-services/mongodb
      recursive: false
    target:
      name: shared-mongodb-cristexhub-prod
      type: Opaque
      keys: [username, password]
    consumer:
      namespace: cristexhub-prod
      workload_secret: cristexhub-prod-runtime
      runtime_key: MONGODB_URL
      database: cristexhub_prod
    predecessor_identity: protected-metadata-only
    successor_identity: same-principal-unless-explicitly-approved
    broker_or_database_mutation: separate-approved-operation
    network_policy_gate: shared-mongodb-networkpolicy-apply-and-enforcement
    writer_source: absent
    status: blocked-until-cas-and-isolated-authorization-proof

  rabbitmq:
    scope: cristexhub-prod-consumer
    namespace: shared-services
    source:
      environment: prod
      path: /shared-services/rabbitmq
      recursive: false
    target:
      name: shared-rabbitmq-cristexhub-prod
      type: Opaque
      keys: [username, password, passwordHash]
    consumer:
      namespace: cristexhub-prod
      workload_secret: cristexhub-prod-runtime
      runtime_key: RABBITMQ_URL
      vhost: /cristexhub-prod
    predecessor_identity: protected-metadata-only
    successor_identity: cristexhub_prod_rabbitmq
    permission_contract: live-probe-required-before-freezing
    definitions_recovery: required
    message_reconciliation: required
    writer_source: absent
    design_reference: runbooks/cristexhub-prod-rabbitmq-credential-rotation.md
    status: blocked-until-cas-recovery-and-permission-proof

  ghcr:
    scope: cristexhub-prod-image-pull
    namespace: cristexhub-prod
    source:
      environment: prod
      path: /cristexhub/prod/runtime
      recursive: false
      key: DOCKER_CONFIG_JSON
    target:
      name: cristexhub-prod-ghcr-pull
      type: kubernetes.io/dockerconfigjson
      keys: [.dockerconfigjson]
    consumers:
      - backend
      - celery-worker
      - frontend
      - oauth2-proxy
      - redis
    predecessor_identity: protected-metadata-only
    successor_identity: new-registry-credential-with-explicit-revocation
    registry_scope: private-ghcr-only
    image_digests_must_not_change: true
    writer_source: absent
    status: blocked-until-registry-revocation-and-infisical-cas-proof

  deepseek:
    scope: cristexhub-prod-external-api
    source:
      path: unresolved-external-application-secret
      environment: unresolved
      key: unresolved
    target:
      name: none-in-this-repository
      type: none
      keys: []
    consumer:
      namespace: cristexhub-prod
      transport: oidc-connect-proxy-to-api.deepseek.com:443
    predecessor_identity: provider-revocation-required
    successor_identity: provider-issued-successor-required
    repository_writer: forbidden
    infrastructure_secret_source: absent
    status: blocked-until-owner-path-and-provider-revocation-are-identified

public_cutover_gate:
  forbidden_until:
    - mongodb_rotation_accepted
    - rabbitmq_rotation_accepted
    - ghcr_rotation_accepted
    - deepseek_predecessor_revoked_and_successor_verified
    - shared_mongodb_networkpolicy_enforced_and_negative_tests_passed
    - private_prod_acceptance_passed
    - foundation_state_imported_and_recovered
    - exact_two_change_cloudflare_plan_reviewed
  no_public_route_mutation: true
  no_cloudflare_provider_operation: true
  no_runtime_mutation: true
