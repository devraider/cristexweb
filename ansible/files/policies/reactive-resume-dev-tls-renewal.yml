---
policy_schema: cristex-reactive-resume-dev-tls-renewal-v1
status: source-only-guarded-runtime-blocked
hostname: resume-dev.cristex-soft.com
certificate:
  authority: browser-trusted-acme
  challenge: dns-01
  dns_provider: cloudflare
  exact_challenge_name: _acme-challenge.resume-dev.cristex-soft.com
  exact_san_set:
    - resume-dev.cristex-soft.com
  minimum_remaining_seconds: 2592000
  endpoint_preflight:
    exact_hostname_check: true
    exact_san_set_check: true
    system_trust_store_check: true
    refuses_untrusted_or_wrong_hostname_before_issuance: true
  private_key_never_in_git_argv_logs_or_opentofu_state: true
  local_private_material: protected_certbot_lineage_mode_0700_and_work_mode_0600
cloudflare:
  account_id: 8b0f511214c7a4a52ddfb62ca92c5e80
  zone_id: 3cbee16e56d7656440f93e685807e779
  token_file: ~/.config/cristexweb/cloudflare-argo-dns-token
  token_file_contract: paul:paul:0600
  mutation_scope:
    - _acme-challenge.resume-dev.cristex-soft.com
  token_validation:
    verify_endpoint: https://api.cloudflare.com/client/v4/user/tokens/verify
    exact_account_id: 8b0f511214c7a4a52ddfb62ca92c5e80
    exact_zone_id: 3cbee16e56d7656440f93e685807e779
    exact_zone_name: cristex-soft.com
    dns_read_scope_preflight: exact_challenge_name_only
    dns_write_scope: exact_challenge_probe_delete_then_certbot_dns01_then_explicit_delete_and_empty_readback
  proxied: false
  tunnel: forbidden
infisical:
  project_id: 619656da-14f3-4872-857b-be103cdc5326
  environment: prod
  path: /reactive-resume/dev/tls
  keys:
    - TLS_CRT
    - TLS_KEY
  value_owner: infisical-cloud
  upload: preauthenticated-cli-session-without-token-flag
  exact_key_closure: [TLS_CRT, TLS_KEY]
  readback: yaml_key_set_and_byte_equality_verified
  mismatch_recovery: fail_closed_without_rollback_when_postwrite_convergence_fails
  rollback_cas: unavailable
  postwrite_failure: uploaded_infisical_pair_may_remain_and_requires_guarded_manual_recovery
kubernetes:
  target_namespace: cristexhub-dev
  target_secret: reactive-resume-dev-tls
  type: kubernetes.io/tls
  keys:
    - tls.crt
    - tls.key
  creation_policy: Orphan
  writer: infisical-operator
  direct_kubectl_write: forbidden
host:
  renewal_executable: /usr/local/libexec/cristexweb/reactive-resume-dev-tls-renew
  validator: /usr/local/libexec/cristexweb/validate-reactive-resume-dev-tls-material
  service: cristexweb-reactive-resume-dev-tls-renew.service
  timer: cristexweb-reactive-resume-dev-tls-renew.timer
  schedule: daily-check-0345-randomized-15m
  enabled_by: separate-enable-apply-mode
safety:
  no_value_output: true
  exact_challenge_cleanup: explicit_cloudflare_api_delete_then_empty_readback
  certbot_issuance: persistent_lineage_keep_until_expiring_without_renew_by_default
  dependency_provenance:
    certbot_package: 4.0.0-2+deb13u1
    dns_cloudflare_package: 4.0.0-1
    infisical_cli: 0.43.121
  temporary_workspace: mode_0700
  lock: flock
  no_direct_kubernetes_secret_write: true
  no_prod_or_public_route_mutation: true
  rollback: >-
    no_automatic_rollback_without_infisical_cas; prewrite_failures_leave_values_unchanged;
    postwrite_failures_may_leave_the_uploaded_pair_pending_operator_recovery
  endpoint_tls_trust_store: /etc/ssl/certs/ca-certificates.crt
