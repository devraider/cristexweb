---
# Value-free, check-only contract for the CristexHub PROD RabbitMQ successor
# rotation.  This policy is intentionally separate from the shared architecture
# policy and authorizes no writer or broker mutation.
policy_schema: cristexhub-prod-rabbitmq-credential-rotation-v1
policy_status: source-only-check-only-writer-blocked
runtime_mutation_allowed: false
scope:
  namespace: shared-services
  vhost: /cristexhub-prod
  dev_vhost: /cristexhub-dev
  predecessor_principal: cristexhub_prod_user
  successor_principal: cristexhub_prod_rabbitmq
  dev_principal: cristexhub_dev_rabbitmq
  consumers:
    - cristexhub-prod/backend
    - cristexhub-prod/celery-worker
engine_source:
  project_id: 619656da-14f3-4872-857b-be103cdc5326
  environment: prod
  path: /shared-services/rabbitmq
  static_secret: rabbitmq-infisical-secrets
  target: shared-rabbitmq-cristexhub-prod
  target_keys: [username, password, passwordHash]
runtime_source:
  project_id: 619656da-14f3-4872-857b-be103cdc5326
  environment: prod
  path: /cristexhub/prod/runtime
  static_secret: cristexhub-prod-runtime
  target: cristexhub-prod-runtime
  target_namespace: cristexhub-prod
  key: RABBITMQ_URL
  target_keys:
    - MONGODB_URL
    - RABBITMQ_URL
    - REDIS_URL
    - REDIS_PASSWORD
    - FERNET_KEY
    - OIDC_CLIENT_SECRET
    - OAUTH2_PROXY_COOKIE_SECRET
    - PRIVATE_CA_BUNDLE
    - CODE_RUNNER_AUTH_TOKEN
    - BROWSERLESS_TOKEN
permissions:
  candidate_until_live_probe: true
  configure: '^(default|high_priority|low_priority)$'
  write: '^default$'
  read: '^(default|high_priority|low_priority)$'
  no_admin_tag: true
  no_cross_vhost: true
  no_user_management: true
  no_vhost_management: true
  no_policy_management: true
revisions_and_cas:
  engine_source_revision: required
  runtime_source_revision: required
  dual_path_update: required
  expected_revision_or_if_match: required
  unrelated_key_preservation: required
  timeout_or_ambiguous_response: UNKNOWN-STOP
  writer_available: false
  cas_proven: false
recovery:
  definitions_backup_readback_required: true
  isolated_definitions_restore_proved: false
  queued_message_recovery_proved: false
  queued_message_disposition: non-authoritative-reconcilable-direction
  definitions_restore_is_not_message_recovery: true
execution:
  check_only: true
  no_secret_values: true
  no_kubernetes_secret_payloads: true
  operator_remains_secret_owner: true
  predecessor_revocation_requires_separate_approval: true
  predecessor_delete_path: false
  public_route: false
