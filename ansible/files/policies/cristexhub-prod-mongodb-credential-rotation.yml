---
policy_schema: cristexhub-prod-mongodb-credential-rotation-v1
policy_status: source-only-check-only-blocked
purpose: >-
  Freeze a value-free, metadata-only preflight for replacing the exposed
  CristexHub PROD MongoDB consumer credential. This file is not a writer,
  Infisical client, MongoDB administrator, Kubernetes Secret mutator, workload
  restarter, or revocation authorization.

scope:
  project_id: 619656da-14f3-4872-857b-be103cdc5326
  broker_namespace: shared-services
  database: cristexhub_prod
  tls: required
  source_paths:
    engine:
      environment_slug: prod
      secret_path: /shared-services/mongodb
      recursive: false
      keys:
        - MONGODB_CRISTEXHUB_PROD_USERNAME
        - MONGODB_CRISTEXHUB_PROD_PASSWORD
    runtime_url:
      environment_slug: prod
      secret_path: /cristexhub/prod/runtime
      recursive: false
      key: MONGODB_URL
  targets:
    engine_secret:
      namespace: shared-services
      name: shared-mongodb-cristexhub-prod
      kind: Secret
      type: Opaque
      keys: [username, password]
    runtime_secret:
      namespace: cristexhub-prod
      name: cristexhub-prod-runtime
      kind: Secret
      type: Opaque
      key: MONGODB_URL
  consumers:
    - namespace: cristexhub-prod
      deployment: backend
      runtime_key: MONGODB_URL
    - namespace: cristexhub-prod
      deployment: celery-worker
      runtime_key: MONGODB_URL

revision_and_cas:
  source_revision_observation:
    engine: InfisicalStaticSecret.metadata.resourceVersion
    runtime_url: InfisicalStaticSecret.metadata.resourceVersion
  materialization_revision_observation:
    engine: Secret.metadata.annotations.secrets.infisical.com/version
    runtime_url: Secret.metadata.annotations.secrets.infisical.com/version
  remote_infisical_revision: unavailable-without-infisical-api-contract
  engine_path_cas: unavailable
  runtime_url_path_cas: unavailable
  required_write_protocol: expected-revision-or-If-Match-CAS-for-each-path
  cross_path_atomicity: not-assumed
  ambiguous_result: UNKNOWN-STOP
  missing_revision: UNKNOWN-STOP
  source_write_status: forbidden
  apply_status: NOT-RUN-BLOCKED

ownership:
  source_value_owner: infisical-cloud
  kubernetes_value_owner: infisical-operator
  direct_kubernetes_secret_write: forbidden
  source_writer: absent
  operator_reconciliation_required: true
  unrelated_keys_must_be_preserved: true

required_future_gates:
  recovery:
    encrypted_predecessor_custody: required
    encrypted_successor_custody: required
    fresh_mongodb_backup_readback: required
    isolated_restore: required
    no_plaintext_residue: required
  consumer_cutover:
    bounded_restart_only: [backend, celery-worker]
    new_pod_uids_required: true
    readiness_required: true
    argo_synced_healthy_required: true
  authorization:
    tls_scram_positive_authentication: required
    cross_database_negative: required
    cross_environment_negative: required
    networkpolicy_enforcement: required
    status: NOT-RUN-BLOCKED
  predecessor:
    identity_from_protected_metadata_only: true
    revocation_approval: separate
    authorization_denial_is_not_authentication_revocation: true
    fresh_authentication_failure_after_revoke: required
  rollback:
    source_restore_requires_expected_revision: true
    database_principal_restore_is_separate: true
    target_reconciliation_required: true
    ambiguous_state: UNKNOWN-STOP

execution:
  wrapper: ansible/bin/check-cristexhub-prod-mongodb-credential-rotation
  mode: check-only
  check_mutates_infisical: false
  check_mutates_kubernetes: false
  reads_secret_values: false
  reads_secret_data_field: false
  restarts_consumers: false
  revokes_predecessor: false
  public_route: forbidden
