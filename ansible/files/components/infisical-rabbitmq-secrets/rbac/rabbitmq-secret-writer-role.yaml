---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-rabbitmq-secret-writer
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-rabbitmq-secrets
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [shared-rabbitmq-admin, shared-rabbitmq-tls, shared-rabbitmq-cristexhub-dev, shared-rabbitmq-cristexhub-prod]
    verbs: [update]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [list, watch]
