---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-rabbitmq-static-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-rabbitmq-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [secrets.infisical.com]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [infisicalstaticsecrets]
        scope: Namespaced
  matchConditions:
    - name: rabbitmq-static-secret-identity
      expression: >-
        request.namespace == 'shared-services' &&
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name == 'rabbitmq-infisical-secrets')
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        oldObject != null && oldObject.spec == object.spec)) &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'cristex-platform' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'ansible' &&
        object.metadata.labels['cristex.io/component'] == 'infisical-rabbitmq-secrets' &&
        object.metadata.name == 'rabbitmq-infisical-secrets' &&
        object.spec.infisicalAuthRef.name == 'rabbitmq-infisical-auth' &&
        object.spec.infisicalAuthRef.namespace == 'shared-services' &&
        object.spec.sources.size() == 1 &&
        object.spec.sources[0].projectId == '619656da-14f3-4872-857b-be103cdc5326' &&
        object.spec.sources[0].environmentSlug == 'prod' &&
        object.spec.sources[0].secretPath == '/shared-services/rabbitmq' &&
        !has(object.spec.sources[0].projectSlug) &&
        object.spec.sources[0].recursive == false &&
        object.spec.sources[0].tagSlugs.size() == 0 &&
        object.spec.syncOptions.refreshInterval == '1h' &&
        object.spec.syncOptions.instantUpdates == false &&
        object.spec.targets.size() == 4 &&
        object.spec.targets.exists(t,
          t.name == 'rabbitmq-admin' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-rabbitmq' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t, t.name == 'rabbitmq-tls' && t.secretType == 'kubernetes.io/tls' && t.creationPolicy == 'Orphan') &&
        object.spec.targets.exists(t, t.name == 'rabbitmq-cristexhub-dev' && t.secretType == 'Opaque' && t.creationPolicy == 'Orphan') &&
        object.spec.targets.exists(t, t.name == 'rabbitmq-cristexhub-prod' && t.secretType == 'Opaque' && t.creationPolicy == 'Orphan')
      message: Only the guarded administrator or unchanged-spec Operator may write the exact RabbitMQ StaticSecret.
      reason: Forbidden
