---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-rabbitmq-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-rabbitmq-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        scope: Namespaced
  matchConditions:
    - name: rabbitmq-target-namespace
      expression: request.namespace == 'shared-services'
    - name: rabbitmq-controller-or-target-name
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name in ['rabbitmq-admin','rabbitmq-tls','rabbitmq-cristexhub-dev','rabbitmq-cristexhub-prod']
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        request.namespace == 'shared-services' && has(object.metadata.labels) &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'shared-rabbitmq' &&
        object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.binaryData) || object.binaryData.size() == 0) &&
        ((object.metadata.name in
        ['rabbitmq-admin','rabbitmq-cristexhub-dev','rabbitmq-cristexhub-prod'] &&
        object.type == 'Opaque' && object.data.size() == 3 &&
        object.data['username'] != null && object.data['password'] != null &&
        object.data['passwordHash'] != null) ||
        (object.metadata.name == 'rabbitmq-tls' &&
        object.type == 'kubernetes.io/tls' && object.data.size() == 3 &&
        object.data['ca.crt'] != null && object.data['tls.crt'] != null &&
        object.data['tls.key'] != null))
      message: The Infisical Operator may write only the exact RabbitMQ bootstrap administrator Secret.
      reason: Forbidden
