---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: rabbitmq-infisical-secrets
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-rabbitmq-secrets
spec:
  infisicalAuthRef:
    name: rabbitmq-infisical-auth
    namespace: shared-services
  syncOptions:
    refreshInterval: 1h
    instantUpdates: false
  sources:
    - projectId: 619656da-14f3-4872-857b-be103cdc5326
      environmentSlug: prod
      secretPath: /shared-services/rabbitmq
      recursive: false
      tagSlugs: []
  targets:
    - name: shared-rabbitmq-admin
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-rabbitmq
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          username: '{{ .RABBITMQ_ADMIN_USERNAME.Value }}'
          password: '{{ .RABBITMQ_ADMIN_PASSWORD.Value }}'
          passwordHash: '{{ .RABBITMQ_ADMIN_PASSWORD_HASH.Value }}'
    - name: shared-rabbitmq-tls
      namespace: shared-services
      kind: Secret
      secretType: kubernetes.io/tls
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-rabbitmq
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          ca.crt: '{{ .RABBITMQ_TLS_CA_CRT.Value }}'
          tls.crt: '{{ .RABBITMQ_TLS_CRT.Value }}'
          tls.key: '{{ .RABBITMQ_TLS_KEY.Value }}'
    - name: shared-rabbitmq-cristexhub-dev
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-rabbitmq
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          username: '{{ .RABBITMQ_CRISTEXHUB_DEV_USERNAME.Value }}'
          password: '{{ .RABBITMQ_CRISTEXHUB_DEV_PASSWORD.Value }}'
          passwordHash: '{{ .RABBITMQ_CRISTEXHUB_DEV_PASSWORD_HASH.Value }}'
    - name: shared-rabbitmq-cristexhub-prod
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-rabbitmq
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          username: '{{ .RABBITMQ_CRISTEXHUB_PROD_USERNAME.Value }}'
          password: '{{ .RABBITMQ_CRISTEXHUB_PROD_PASSWORD.Value }}'
          passwordHash: '{{ .RABBITMQ_CRISTEXHUB_PROD_PASSWORD_HASH.Value }}'
