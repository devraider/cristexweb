apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-cristexhub-prod-runtime-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cristexhub-prod-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
      scope: Namespaced
  matchConditions:
  - name: runtime-secret-namespace
    expression: request.namespace == 'cristexhub-prod'
  validations:
  - expression: >-
      request.namespace == 'cristexhub-prod' &&
      ((request.userInfo.username == 'system:admin' &&
      object.metadata.name == 'cristexhub-prod-infisical-universal-auth' && object.type == 'Opaque' &&
      has(object.metadata.labels) && object.metadata.labels.size() == 4 &&
      object.metadata.labels['app.kubernetes.io/managed-by'] == 'ansible' &&
      object.metadata.labels['app.kubernetes.io/part-of'] == 'infisical-operator' &&
      object.metadata.labels['cristex.io/component'] == 'infisical-runtime-auth' &&
      object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
      object.data.size() == 2 && object.data['clientId'].size() > 0 && object.data['clientSecret'].size() > 0 &&
      (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
      (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
      (!has(object.immutable) || object.immutable == false) &&
      (!has(object.stringData) || object.stringData.size() == 0)) ||
      (request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller' &&
      object.metadata.name in ['cristexhub-prod-runtime', 'cristexhub-prod-ghcr-pull'] &&
      has(object.metadata.labels) && object.metadata.labels.size() == 3 &&
      object.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
      object.metadata.labels['app.kubernetes.io/part-of'] == 'cristexhub' &&
      object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
      has(object.metadata.annotations) && object.metadata.annotations.size() == 1 &&
      'secrets.infisical.com/version' in object.metadata.annotations &&
      object.metadata.annotations['secrets.infisical.com/version'] != '' &&
      (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
      (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
      (!has(object.immutable) || object.immutable == false) &&
      (!has(object.stringData) || object.stringData.size() == 0) &&
      ((object.metadata.name == 'cristexhub-prod-runtime' && object.type == 'Opaque' &&
      object.data.size() == 9 && object.data['MONGODB_URL'].size() > 0 &&
      object.data['RABBITMQ_URL'].size() > 0 && object.data['REDIS_URL'].size() > 0 &&
      object.data['REDIS_PASSWORD'].size() > 0 && object.data['FERNET_KEY'].size() > 0 &&
      object.data['OIDC_CLIENT_SECRET'].size() > 0 && object.data['OAUTH2_PROXY_COOKIE_SECRET'].size() > 0 &&
      object.data['PRIVATE_CA_BUNDLE'].size() > 0 && object.data['CODE_RUNNER_AUTH_TOKEN'].size() > 0) ||
      (object.metadata.name == 'cristexhub-prod-ghcr-pull' && object.type == 'kubernetes.io/dockerconfigjson' &&
      object.data.size() == 1 && object.data['.dockerconfigjson'].size() > 0))))
    message: Only the canonical Infisical controller may write the exact CristexHub PROD runtime Secret names and contracts.
    reason: Forbidden
