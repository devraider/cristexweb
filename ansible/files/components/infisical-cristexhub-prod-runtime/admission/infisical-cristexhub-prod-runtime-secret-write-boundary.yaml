apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-cristexhub-prod-runtime-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cristexhub-prod-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
      scope: Namespaced
  matchConditions:
  - name: runtime-secret-namespace
    expression: request.namespace == 'cristexhub-prod'
  validations:
  - expression: >-
      request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller' &&
      request.namespace == 'cristexhub-prod' && object.metadata.name in ['cristexhub-prod-runtime', 'cristexhub-prod-ghcr-pull'] &&
      has(object.metadata.labels) && object.metadata.labels.size() == 3 &&
      object.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
      object.metadata.labels['app.kubernetes.io/part-of'] == 'cristexhub' &&
      object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
      (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
      (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
      (!has(object.binaryData) || object.binaryData.size() == 0) &&
      (!has(object.immutable) || object.immutable == false) &&
      (!has(object.stringData) || object.stringData.size() == 0) &&
      ((object.metadata.name == 'cristexhub-prod-runtime' && object.type == 'Opaque' &&
      object.data.size() == 9 && object.data['MONGODB_URL'] != null &&
      object.data['RABBITMQ_URL'] != null && object.data['REDIS_URL'] != null &&
      object.data['REDIS_PASSWORD'] != null && object.data['FERNET_KEY'] != null &&
      object.data['OIDC_CLIENT_SECRET'] != null && object.data['OAUTH2_PROXY_COOKIE_SECRET'] != null &&
      object.data['PRIVATE_CA_BUNDLE'] != null && object.data['CODE_RUNNER_AUTH_TOKEN'] != null) ||
      (object.metadata.name == 'cristexhub-prod-ghcr-pull' && object.type == 'kubernetes.io/dockerconfigjson' &&
      object.data.size() == 1 && object.data['.dockerconfigjson'] != null))
    message: Only the canonical Infisical controller may write the exact CristexHub PROD runtime Secret names and contracts.
    reason: Forbidden
