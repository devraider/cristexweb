# Value-free OIDC source contract: prod:/cristexhub/prod/runtime#OIDC_CLIENT_SECRET.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cristexhub-prod-runtime
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cristexhub-prod-runtime
  namespace: cristexhub-prod
spec:
  infisicalAuthRef:
    name: cristexhub-prod-infisical-auth
    namespace: cristexhub-prod
  syncOptions:
    refreshInterval: 1h
    instantUpdates: false
  sources:
  - projectId: 619656da-14f3-4872-857b-be103cdc5326
    environmentSlug: prod
    secretPath: /cristexhub/prod/runtime
    recursive: false
    tagSlugs: []
  targets:
  - name: cristexhub-prod-runtime
    namespace: cristexhub-prod
    kind: Secret
    secretType: Opaque
    creationPolicy: Orphan
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/managed-by: infisical
        app.kubernetes.io/part-of: cristexhub
        cristex.io/value-owner: infisical-cloud
    template:
      engineVersion: v1
      data:
        MONGODB_URL: '{{ .MONGODB_URL.Value }}'
        RABBITMQ_URL: '{{ .RABBITMQ_URL.Value }}'
        REDIS_URL: '{{ .REDIS_URL.Value }}'
        REDIS_PASSWORD: '{{ .REDIS_PASSWORD.Value }}'
        FERNET_KEY: '{{ .FERNET_KEY.Value }}'
        OIDC_CLIENT_SECRET: '{{ .OIDC_CLIENT_SECRET.Value }}'
        OAUTH2_PROXY_COOKIE_SECRET: '{{ .OAUTH2_PROXY_COOKIE_SECRET.Value }}'
        PRIVATE_CA_BUNDLE: '{{ .PRIVATE_CA_BUNDLE.Value }}'
        CODE_RUNNER_AUTH_TOKEN: '{{ .CODE_RUNNER_AUTH_TOKEN.Value }}'
  - name: cristexhub-prod-ghcr-pull
    namespace: cristexhub-prod
    kind: Secret
    secretType: kubernetes.io/dockerconfigjson
    creationPolicy: Orphan
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/managed-by: infisical
        app.kubernetes.io/part-of: cristexhub
        cristex.io/value-owner: infisical-cloud
    template:
      engineVersion: v1
      data:
        .dockerconfigjson: '{{ .DOCKER_CONFIG_JSON.Value }}'
