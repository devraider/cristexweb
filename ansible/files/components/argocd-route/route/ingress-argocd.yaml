apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ui
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/bootstrap-writer: ansible
    cristex.io/component: argocd-route
    cristex.io/desired-owner: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [argo.cristex-soft.com]
      secretName: argocd-ui-tls
  rules:
    - host: argo.cristex-soft.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port: {number: 80}
