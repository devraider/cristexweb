---
apiVersion: cristex.io/v1alpha1
kind: KeycloakIdentityActorContract
metadata:
  name: cristexhub-dev-successor-actors
  labels:
    cristex.io/component: keycloak-dev-identity-transition
    cristex.io/environment: dev
    cristex.io/managed-by: ansible
    cristex.io/value-owner: infisical-cloud
spec:
  status: source-only-check-only
  activation: blocked-pending-bootstrap-custodian-and-actor-materialization
  legacyRealm:
    name: cristexhub
    role: retained-prod-compatibility
    readMethods:
      - GET
    writeMethods: []
    users: forbidden
    memberships: forbidden
  bootstrapActor:
    name: keycloak-dev-successor-bootstrap
    clientId: cristexhub-dev-bootstrap
    realm: master
    credentialPath: prod:/cristexhub/dev/identity/bootstrap
    credentialKey: KEYCLOAK_DEV_BOOTSTRAP_CLIENT_SECRET
    credentialTarget: protected-controller-input-only
    existingBootstrapAdminReuse: forbidden
    existingBreakGlassReuse: forbidden
    requiredMasterRoles:
      - create-realm
    forbiddenMasterRoles:
      - admin
      - realm-admin
      - manage-users
      - impersonation
    purpose: one-time-create-and-initialize-cristexhub-dev
    maxUse: one-transition
    recurringReconciliation: forbidden
    allowedOperations:
      - POST /admin/realms target=cristexhub-dev
      - GET /admin/realms/cristexhub
      - initialize-exact-dev-clients-group-mappers-and-fgap
    automaticCreatorGrantLedger:
      captureBeforeCreate: required
      captureAfterCreate: required
      exactGrantedRoleIds: protected-ephemeral-ledger
      allRealmRolesExpected: true
      roleRemovalBeforeRecurringAudit: required
    retirement:
      custodianRef: keycloak-dev-bootstrap-retirement-custodian
      disableServiceAccount: required
      revokeCreateRealm: required
      removeAutomaticTargetRealmAccessByExactRoleIds: required
      verifyTokenRejected: required
      revokeCredential: separate-approval-required
      currentCapability: absent-blocker
  retirementCustodian:
    name: keycloak-dev-bootstrap-retirement-custodian
    status: absent-blocker
    distinctFromBootstrapActor: true
    recurringUse: forbidden
    allowedOperations:
      - disable-exact-bootstrap-service-account
      - revoke-exact-create-realm-role-mapping
      - remove-exact-automatic-target-realm-role-mappings
    forbiddenOperations:
      - successor-object-reconciliation
      - users
      - memberships
      - prod-writes
  recurringAuditor:
    name: keycloak-dev-auditor
    clientId: cristexhub-dev-auditor
    realm: cristexhub-dev
    credentialPath: prod:/cristexhub/dev/identity/auditor
    credentialKey: KEYCLOAK_DEV_REALM_AUDITOR_CLIENT_SECRET
    credentialTarget: protected-controller-input-only
    masterRealmAccess: forbidden
    recurringUse: future-read-only-drift-audit
    directRealmManagementRoles:
      - query-clients
      - query-groups
    forbiddenRealmManagementRoles:
      - realm-admin
      - manage-realm
      - manage-clients
      - manage-users
      - view-users
      - impersonation
      - manage-authorization
      - manage-organizations
    fineGrainedAdminPermissionsV2:
      enablement: bootstrap-owned-required
      adminPermissionsClientId: capture-opaque-uuid
      actorBinding:
        serviceAccountUserId: capture-opaque-uuid
        subjectType: exact-user-policy
      clientResource:
        resourceId: capture-opaque-client-uuid
        expectedClientId: cristexhub-dev
        scopes:
          - view
      groupResource:
        resourceId: capture-opaque-group-uuid
        expectedPath: /cristexhub-dev-super-admin
        scopes:
          - view
      selfManagement: forbidden
      serviceClientManagement: forbidden
    missingOwnedObjectBehavior: fail-closed-no-create
    allowedResources:
      - successor-browser-client-read
      - successor-static-group-read
      - successor-browser-client-mapper-read
    forbiddenResources:
      - successor-realm-settings
      - successor-service-client-metadata
      - auditor-self
      - legacy-prod-realm-writes
      - prod-clients
      - prod-groups
      - users
      - memberships
      - dynamic-groups
      - role-mappings
      - organizations
      - client-secret
      - protocol-mapper-writes
      - routes
  credentialCustody:
    valuesInSource: forbidden
    valuesInArgv: forbidden
    valuesInEnvironment: forbidden
    valuesInLogs: forbidden
    valuesInEvidence: forbidden
  currentExecution: forbidden
