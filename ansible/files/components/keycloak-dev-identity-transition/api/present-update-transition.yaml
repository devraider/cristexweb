---
apiVersion: cristex.io/v1alpha1
kind: KeycloakDevIdentityApiTransitionContract
metadata:
  name: cristexhub-dev-present-update-api-transition
  labels:
    cristex.io/component: keycloak-dev-identity-transition
    cristex.io/environment: dev
    cristex.io/managed-by: ansible
    cristex.io/value-owner: infisical-cloud
spec:
  status: source-only-check-only
  activation: apply-blocked-pending-all-transition-gates
  apply: forbidden
  transportRef: cristexhub-dev-admin-rest-port-forward
  bootstrapActorRef: keycloak-dev-successor-bootstrap
  recurringAuditorRef: keycloak-dev-auditor
  retirementCustodianRef: keycloak-dev-bootstrap-retirement-custodian
  legacyProd:
    realm: cristexhub
    allowedMethods:
      - GET
    writeMethods: []
    allowedPaths:
      - GET /admin/realms/cristexhub
      - GET /admin/realms/cristexhub/clients?clientId=cristexhub-prod
      - GET /admin/realms/cristexhub/groups?search=cristexhub-prod-super-admin
    rawResponseSha256BeforeAfter: required-sanitized
    canonicalProjectionSha256BeforeAfter: required-sanitized
    mutation: forbidden
  bootstrapPhase:
    tokenExchange:
      method: POST
      path: /realms/master/protocol/openid-connect/token
      response: memory-only-no-log
    actor: keycloak-dev-successor-bootstrap
    allowedMethods:
      - GET
      - POST
      - PUT
    allowedResources:
      - successor-realm
      - browser-client
      - disabled-admin-service-client
      - static-group
      - browser-client-mappers
      - fgap-v2-enable-admin-permissions-client-and-exact-view-policies
      - recurring-auditor-client
    realmCreate:
      method: POST
      path: /admin/realms
      exactTarget: cristexhub-dev
      status: 201
      retry: forbidden
      conflictResolution: one-exact-get-then-operator-review
    automaticCreatorGrantLedger: required
    retirementCustodianCapability: absent-blocker
    retirementBeforeRecurringAudit: required
  recurringAuditPhase:
    tokenExchange:
      method: POST
      path: /realms/cristexhub-dev/protocol/openid-connect/token
      response: memory-only-no-log
    actor: keycloak-dev-auditor
    allowedMethods:
      - GET
    exactOwnedResources:
      - expectedClientId: cristexhub-dev
        resourceId: attested-opaque-client-uuid
        cardinality: exactly-one
        operations:
          - detail-read
          - protocol-mapper-inventory-read
      - expectedGroupPath: /cristexhub-dev-super-admin
        resourceId: attested-opaque-group-uuid
        cardinality: exactly-one
        operations:
          - detail-read
    mapperCardinality:
      groups: exactly-one
      organization: exactly-one
      cristexhub-dev-audience: exactly-one
      unexpectedMapper: fail-closed
    emptyCollectionBehavior: fail-closed-missing-owned-object
    duplicateCollectionBehavior: fail-closed
    missingOwnedObjectBehavior: fail-closed-no-create
    forbiddenResources:
      - cristexhub-dev-admin-svc-dev
      - cristexhub-dev-auditor
      - realm-settings
      - fgap-policy-writes
      - client-secret
      - protocol-mapper-writes
      - group-memberships
  resourceIds:
    deriveFromNames: forbidden
    captureFromSameOriginLocationOrExactGet: required
    bindToEphemeralAttestation: required
    duplicateOrForeignOwned: fail-closed
  equality:
    requestProjection: exact-allowlisted-fields
    responseProjection: exact-allowlisted-fields
    unknownSecurityRelevantField: fail-closed
    credentialsInProjection: forbidden
    unintendedMappersRolesMemberships: fail-closed
  responseContract:
    readStatuses:
      - 200
      - 404-target-absence-only-bootstrap-phase
    createStatus: 201
    createLocation: same-private-loopback-origin-required
    updateStatus: 204-empty-body
    conflictStatus: 409-not-success
    unexpectedStatusesFailClosed:
      - 401
      - 403
      - 429
      - 500
      - 502
      - 503
    redirects: forbidden
    malformedJson: fail-closed
    timeoutOrConnectionLoss: unknown-stop
    ambiguousPostRetry: forbidden
  forbidden:
    methods:
      - DELETE
      - PATCH
    paths:
      - /admin/realms/cristexhub/users
      - /admin/realms/cristexhub-dev/users
      - /admin/realms/cristexhub/groups/{id}/members
      - /admin/realms/cristexhub-dev/groups/{id}/members
      - /admin/realms/cristexhub-dev/role-mappings
      - routes
      - ingress
      - cloudflare
      - prod-writes
    resources:
      - users
      - memberships
      - dynamic-groups
      - application-organizations
      - role-mappings
      - routes
      - legacy-prod-realm
  evidence:
    endpointMethodStatusReceipts: sanitized-only
    bodyDigests: sanitized-only
    resourceIdLedger: protected-ephemeral
    zeroDelete: required
    zeroProdWrite: required
    firstBootstrapApply: separate-approval-required
    bootstrapRetirement: separate-approval-required
    recurringAuditChangedZero: required-after-retirement
    noSecretDisclosureScan: required
  safety:
    noDeletePath: true
    noPatchPath: true
    noProdWritePath: true
    noUserPath: true
    noMembershipPath: true
    noDynamicGroupPath: true
    noRoutePath: true
    noBlindRetry: true
    readbackAfterWrite: required
    idempotenceRequired: true
    currentExecution: not-run
