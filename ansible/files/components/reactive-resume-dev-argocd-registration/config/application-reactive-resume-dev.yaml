apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reactive-resume-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: reactive-resume-dev
    app.kubernetes.io/part-of: cristexhub
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: reactive-resume-dev-argocd-registration
spec:
  project: reactive-resume-dev
  source:
    repoURL: ssh://git@ssh.github.com:443/devraider/cristexweb.git
    targetRevision: 2be0d834a5a07b28961613a564dcf5a87f020c97
    path: ansible/files/components/reactive-resume-dev-argocd
  destination:
    name: reactive-resume-dev-local
    server: ''
    namespace: cristexhub-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - Prune=false
      - ServerSideApply=false
      - Replace=false
      - FailOnSharedResource=true
