apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: reactive-resume-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: reactive-resume-dev
    app.kubernetes.io/part-of: cristexhub
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: reactive-resume-dev-argocd-registration
spec:
  sourceRepos:
    - ssh://git@ssh.github.com:443/devraider/cristexweb.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cristexhub-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
  syncWindows: []
