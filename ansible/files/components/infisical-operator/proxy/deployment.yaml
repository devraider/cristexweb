---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-egress-proxy
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-operator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical-egress-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        cristex.io/proxy-config-sha256: e3df9588dc4b140593fcc970717f28625106a8a09bea70a442316ce71f086615
      labels:
        app.kubernetes.io/part-of: cristex-platform
        app.kubernetes.io/managed-by: ansible
        cristex.io/component: infisical-operator
        app.kubernetes.io/name: infisical-egress-proxy
    spec:
      serviceAccountName: infisical-egress-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: docker.io/ubuntu/squid@sha256:94f844158e12b52f51b4ae996515e37e8fb3e8d85e1c86caba1a297376e4ec4f
          imagePullPolicy: IfNotPresent
          command:
            - /usr/sbin/squid
          args:
            - -f
            - /etc/squid/squid.conf
            - -NYC
          ports:
            - name: https-proxy
              containerPort: 3129
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: https-proxy
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: https-proxy
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: https-proxy
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
            - name: proxy-tls
              mountPath: /etc/squid/proxy-tls
              readOnly: true
            - name: auth
              mountPath: /etc/squid/auth
              readOnly: true
            - name: logs
              mountPath: /var/log/squid
            - name: spool
              mountPath: /var/spool/squid
            - name: run
              mountPath: /run/squid
      volumes:
        - name: config
          configMap:
            name: infisical-egress-proxy
        - name: proxy-tls
          secret:
            secretName: infisical-egress-proxy-tls
            defaultMode: 288
        - name: auth
          secret:
            secretName: infisical-egress-proxy-auth
            defaultMode: 288
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: spool
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
      terminationGracePeriodSeconds: 30
