---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infisical-proxy-allow-operator
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infisical-egress-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: infisical-operator-controller
      ports:
        - protocol: TCP
          port: 3129
