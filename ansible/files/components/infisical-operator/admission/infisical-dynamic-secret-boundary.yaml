---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-dynamic-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - secrets.infisical.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - infisicaldynamicsecrets
        scope: Namespaced
  validations:
    - expression: request.namespace in ['shared-services', 'argocd', 'cristexhub-dev', 'platform-edge']
      message: Only the four reviewed namespaces may contain Infisical custom resources.
      reason: Forbidden
    - expression: has(object.spec.authentication.universalAuth) && !has(object.spec.authentication.awsIamAuth) && !has(object.spec.authentication.azureAuth) &&
        !has(object.spec.authentication.gcpIamAuth) && !has(object.spec.authentication.gcpIdTokenAuth) && !has(object.spec.authentication.kubernetesAuth) &&
        !has(object.spec.authentication.ldapAuth)
      message: Only Universal Auth is allowed.
      reason: Forbidden
    - expression: object.spec.authentication.universalAuth.credentialsRef.secretNamespace == request.namespace &&
        object.spec.managedSecretReference.secretNamespace == request.namespace
      message: Credential and target references must remain in the object namespace.
      reason: Forbidden
    - expression: "!has(object.spec.hostAPI) || object.spec.hostAPI == '' || object.spec.hostAPI == 'https://app.infisical.com/api'"
      message: Only Infisical Cloud API is allowed.
      reason: Forbidden
    - expression: "!has(object.spec.tls) || !has(object.spec.tls.caRef) || object.spec.tls.caRef.secretNamespace == request.namespace"
      message: TLS CA references must remain in the object namespace.
      reason: Forbidden
