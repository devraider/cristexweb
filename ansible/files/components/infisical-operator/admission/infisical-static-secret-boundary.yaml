---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-static-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - secrets.infisical.com
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - infisicalstaticsecrets
        scope: Namespaced
  validations:
    - expression: request.namespace in ['shared-services', 'argocd', 'cristexhub-dev']
      message: Only the three reviewed namespaces may contain Infisical custom resources.
      reason: Forbidden
    - expression: object.spec.infisicalAuthRef.namespace == request.namespace
      message: Authentication references must remain in the object namespace.
      reason: Forbidden
    - expression: object.spec.targets.all(t, t.namespace == request.namespace)
      message: Every target must remain in the object namespace.
      reason: Forbidden
