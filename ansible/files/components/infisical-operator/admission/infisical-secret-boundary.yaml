---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - secrets.infisical.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - infisicalsecrets
        scope: Namespaced
  validations:
    - expression: request.namespace in ['shared-services', 'argocd', 'cristexhub-dev']
      message: Only the three reviewed namespaces may contain Infisical custom resources.
      reason: Forbidden
    - expression: has(object.spec.authentication) && has(object.spec.authentication.universalAuth) && !has(object.spec.authentication.awsIamAuth) &&
        !has(object.spec.authentication.azureAuth) && !has(object.spec.authentication.gcpIamAuth) && !has(object.spec.authentication.gcpIdTokenAuth) &&
        !has(object.spec.authentication.kubernetesAuth) && !has(object.spec.authentication.ldapAuth) &&
        !has(object.spec.authentication.serviceAccount) && !has(object.spec.authentication.serviceToken)
      message: Only Universal Auth is allowed.
      reason: Forbidden
    - expression: object.spec.authentication.universalAuth.credentialsRef.secretNamespace == request.namespace
      message: Credential references must remain in the object namespace.
      reason: Forbidden
    - expression: "!has(object.spec.hostAPI) || object.spec.hostAPI == '' || object.spec.hostAPI == 'https://app.infisical.com/api'"
      message: Only Infisical Cloud API is allowed.
      reason: Forbidden
    - expression: "!has(object.spec.managedKubeSecretReferences) || object.spec.managedKubeSecretReferences.all(r, r.secretNamespace == request.namespace)"
      message: Managed Secret targets must remain in the object namespace.
      reason: Forbidden
    - expression: "!has(object.spec.managedKubeConfigMapReferences) || object.spec.managedKubeConfigMapReferences.all(r, r.configMapNamespace == request.namespace)"
      message: Managed ConfigMap targets must remain in the object namespace.
      reason: Forbidden
    - expression: "!has(object.spec.managedSecretReference) || object.spec.managedSecretReference.secretNamespace == request.namespace"
      message: Managed Secret references must remain in the object namespace.
      reason: Forbidden
    - expression: "!has(object.spec.tokenSecretReference) || object.spec.tokenSecretReference.secretNamespace == request.namespace"
      message: Token references must remain in the object namespace.
      reason: Forbidden
    - expression: "!has(object.spec.tls) || !has(object.spec.tls.caRef) || object.spec.tls.caRef.secretNamespace == request.namespace"
      message: TLS CA references must remain in the object namespace.
      reason: Forbidden
