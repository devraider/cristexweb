---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-auth-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - secrets.infisical.com
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - infisicalauths
        scope: Namespaced
  validations:
    - expression: request.namespace in ['shared-services', 'argocd', 'cristexhub-dev', 'cristexhub-prod', 'platform-edge']
      message: Only the five reviewed namespaces may contain Infisical custom resources.
      reason: Forbidden
    - expression: object.spec.method == 'universal' && has(object.spec.universal)
      message: Only Universal Auth is allowed.
      reason: Forbidden
    - expression: "!has(object.spec.awsIam) && !has(object.spec.azure) && !has(object.spec.gcpIam) && !has(object.spec.gcpIdToken) && !has(object.spec.kubernetes)
        && !has(object.spec.ldap)"
      message: Alternate authentication methods are forbidden.
      reason: Forbidden
    - expression: object.spec.infisicalConnectionRef.namespace == request.namespace && object.spec.universal.clientIdRef.namespace == request.namespace &&
        object.spec.universal.clientSecretRef.namespace == request.namespace
      message: Connection and credential references must remain in the object namespace.
      reason: Forbidden
