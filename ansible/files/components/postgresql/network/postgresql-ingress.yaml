---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-postgresql-ingress
  namespace: shared-services
  labels:
    app.kubernetes.io/name: shared-postgresql
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/component: postgresql
    cristex.io/desired-owner: argocd
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: shared-postgresql
      cnpg.io/instanceRole: primary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cristexhub-dev
                  - cristexhub-prod
          podSelector:
            matchLabels:
              cristex.io/database-client: shared-postgresql
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cristexhub-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: reactive-resume-dev
              app.kubernetes.io/part-of: cristexhub
              cristex.io/database-client: shared-postgresql
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              cristex.io/database-client: shared-postgresql
      ports:
        - protocol: TCP
          port: 5432
