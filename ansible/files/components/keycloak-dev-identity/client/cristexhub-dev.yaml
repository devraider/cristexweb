---
apiVersion: cristex.io/v1alpha1
kind: KeycloakClientContract
metadata:
  name: cristexhub-dev-clients
  labels:
    cristex.io/component: keycloak-dev-identity
    cristex.io/environment: dev
    cristex.io/managed-by: ansible
    cristex.io/value-owner: infisical-cloud
spec:
  realm: cristexhub-dev
  clients:
    - clientId: cristexhub-dev
      name: CristexHub DEV browser client
      protocol: openid-connect
      enabled: true
      publicClient: false
      bearerOnly: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      authorizationServicesEnabled: false
      redirectUris:
        - https://dev-hub.cristex-soft.com/oauth2/callback
      webOrigins:
        - https://dev-hub.cristex-soft.com
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: https://dev-hub.cristex-soft.com/
      authorizationScopeContract:
        required:
          - openid
          - profile
          - email
          - organization
        organizationContextRequired: true
      credentialContract:
        owner: infisical-cloud
        path: prod:/cristexhub/dev/identity
        key: OIDC_CLIENT_SECRET
        materialization: blocked-pending-successor-value-lane
    - clientId: cristexhub-admin-svc-dev
      name: CristexHub DEV administration service client
      protocol: openid-connect
      enabled: false
      activation: blocked-pending-least-privilege-role-selection
      publicClient: false
      bearerOnly: false
      standardFlowEnabled: false
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      authorizationServicesEnabled: false
      redirectUris: []
      webOrigins: []
      attributes: {}
      authorizationContract:
        realmManagementRoles: []
        applicationAudiences: []
        status: blocked-pending-least-privilege-role-selection
      credentialContract:
        owner: infisical-cloud
        path: prod:/cristexhub/dev/identity
        key: ADMIN_SERVICE_CLIENT_SECRET
        materialization: blocked-pending-successor-value-lane
