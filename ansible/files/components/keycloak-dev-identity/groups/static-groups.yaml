---
apiVersion: cristex.io/v1alpha1
kind: KeycloakStaticGroupContract
metadata:
  name: cristexhub-dev-static-groups
  labels:
    cristex.io/component: keycloak-dev-identity
    cristex.io/environment: dev
    cristex.io/managed-by: ansible
    cristex.io/value-owner: infisical-cloud
spec:
  realm: cristexhub-dev
  groups:
    - name: cristexhub-dev-super-admin
      path: /cristexhub-dev-super-admin
      owner: ansible
      dynamicMembership: false
  dynamicGroupOwner: cristexhub-application
  dynamicGroupModel:
    authorizationGroups: realm-groups
    organizationMembership: keycloak-organizations
    globallyUniqueLeafNamesRequired: true
    membershipMigration: blocked
  forbiddenGroups:
    - cristexhub-prod-super-admin
    - cristexhub-prod-<organization-alias>-<role>
    - argocd-admin
    - argocd-readonly
    - master-admin
  mutation:
    mode: present-update-only
    deletion: forbidden
