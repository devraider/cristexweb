apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reactive-resume-dev-allow-backend
  namespace: cristexhub-dev
  labels:
    app.kubernetes.io/name: reactive-resume-dev
    app.kubernetes.io/part-of: cristexhub
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/bootstrap-writer: ansible
    cristex.io/component: reactive-resume-dev-backend-integration
    cristex.io/desired-owner: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reactive-resume-dev
      app.kubernetes.io/part-of: cristexhub
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
              app.kubernetes.io/part-of: cristexhub
      ports:
        - protocol: TCP
          port: 3000
