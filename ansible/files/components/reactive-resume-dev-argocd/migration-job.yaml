---
apiVersion: batch/v1
kind: Job
metadata:
  name: reactive-resume-dev-migrate
  namespace: cristexhub-dev
  labels:
    app.kubernetes.io/name: reactive-resume-dev-migrate
    app.kubernetes.io/part-of: cristexhub
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/desired-owner: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  completions: 1
  parallelism: 1
  manualSelector: false
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reactive-resume-dev-migrate
        app.kubernetes.io/part-of: cristexhub
        cristex.io/database-client: shared-postgresql
    spec:
      restartPolicy: Never
      serviceAccountName: reactive-resume-dev
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: cristexhub-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/devraider/cristex-reactive-resume@sha256:a4f0157e023c10c1c6ff163d34bf25c3343647247eddb1d4f9bfa9b46e1a3093
          imagePullPolicy: IfNotPresent
          command: [node]
          args: [apps/server/dist/migrate.mjs]
          env:
            - name: NODE_ENV
              value: production
            - name: MIGRATION_MODE
              value: apply
            - name: MIGRATION_TIMEOUT_MS
              value: "300000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-dev-migration
                  key: DATABASE_URL
                  optional: false
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-dev-migration
                  key: MIGRATION_DATABASE_URL
                  optional: false
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/reactive-resume/postgresql/ca.crt
          volumeMounts:
            - name: postgresql-ca
              mountPath: /etc/reactive-resume/postgresql
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: postgresql-ca
          configMap:
            name: reactive-resume-dev-postgresql-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
