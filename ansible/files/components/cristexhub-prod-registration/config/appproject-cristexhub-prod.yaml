apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cristexhub-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: cristexhub-prod
    app.kubernetes.io/part-of: cristexhub
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: cristexhub-prod-registration
spec:
  sourceRepos:
    - ssh://git@ssh.github.com:443/devraider/cristexhub.git
  destinations:
    - name: cristexhub-prod-local
      namespace: cristexhub-prod
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
  orphanedResources:
    warn: true
