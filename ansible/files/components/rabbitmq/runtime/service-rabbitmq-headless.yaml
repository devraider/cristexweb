---
apiVersion: v1
kind: Service
metadata:
  name: shared-rabbitmq-headless
  namespace: shared-services
  labels:
    app.kubernetes.io/name: shared-rabbitmq
    app.kubernetes.io/part-of: shared-rabbitmq
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: rabbitmq
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: shared-rabbitmq
    app.kubernetes.io/part-of: shared-rabbitmq
  ports:
  - name: amqps
    port: 5671
    targetPort: amqps
    protocol: TCP
  - name: mgmt-https
    port: 15671
    targetPort: mgmt-https
    protocol: TCP
