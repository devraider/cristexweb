apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-cristexhub-dev-runtime-source-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cristexhub-dev-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - secrets.infisical.com
      apiVersions:
      - v1beta1
      operations:
      - CREATE
      - UPDATE
      resources:
      - infisicalconnections
      - infisicalauths
      scope: Namespaced
  matchConditions:
  - name: runtime-source-identities
    expression: request.namespace == 'cristexhub-dev' && (request.userInfo.username
      == 'system:serviceaccount:shared-services:infisical-operator-controller' || object.metadata.name
      in ['infisical-cloud','cristexhub-dev-infisical-auth'])
  validations:
  - expression: >-
      (request.userInfo.username == 'system:admin' ||
      (request.userInfo.username ==
      'system:serviceaccount:shared-services:infisical-operator-controller' && oldObject
      != null && oldObject.spec == object.spec)) && object.metadata.labels.size() == 3 &&
      object.metadata.labels['app.kubernetes.io/part-of'] == 'cristex-platform' &&
      object.metadata.labels['app.kubernetes.io/managed-by'] == 'ansible' &&
      object.metadata.labels['cristex.io/component'] == 'infisical-cristexhub-dev-runtime' &&
      ((object.kind == 'InfisicalConnection' && object.metadata.name == 'infisical-cloud' &&
      object.spec.address == 'https://app.infisical.com') ||
      (object.kind == 'InfisicalAuth' && object.metadata.name == 'cristexhub-dev-infisical-auth' &&
      object.spec.method == 'universal' && object.spec.infisicalConnectionRef.name == 'infisical-cloud' &&
      object.spec.infisicalConnectionRef.namespace == 'cristexhub-dev' &&
      object.spec.universal.clientIdRef.name == 'cristexhub-dev-infisical-universal-auth' &&
      object.spec.universal.clientIdRef.namespace == 'cristexhub-dev' && object.spec.universal.clientIdRef.key == 'clientId' &&
      object.spec.universal.clientSecretRef.name == 'cristexhub-dev-infisical-universal-auth' &&
      object.spec.universal.clientSecretRef.namespace == 'cristexhub-dev' && object.spec.universal.clientSecretRef.key == 'clientSecret'))
    message: Only the exact guarded runtime Connection and Auth identities are allowed.
    reason: Forbidden
