apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-cristexhub-dev-runtime-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cristexhub-dev-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
      scope: Namespaced
  matchConditions:
  - name: runtime-target-namespace
    expression: request.namespace == 'cristexhub-dev'
  - name: runtime-controller-or-target
    expression: request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller'
      || object.metadata.name == 'cristexhub-dev-runtime'
  validations:
  - expression: request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller'
      && request.namespace == 'cristexhub-dev' && object.metadata.name == 'cristexhub-dev-runtime'
      && object.type == 'Opaque' && object.metadata.labels.size() == 3 && object.metadata.labels['app.kubernetes.io/managed-by']
      == 'infisical' && object.metadata.labels['app.kubernetes.io/part-of'] == 'cristexhub'
      && object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
      (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size()
      == 0) && object.data.size() == 8 && object.data.exists(k, k == 'MONGODB_URL')
      && object.data.exists(k, k == 'RABBITMQ_URL') && object.data.exists(k, k ==
      'REDIS_URL') && object.data.exists(k, k == 'REDIS_PASSWORD') && object.data.exists(k,
      k == 'FERNET_KEY') && object.data.exists(k, k == 'OIDC_CLIENT_SECRET') && object.data.exists(k,
      k == 'OAUTH2_PROXY_COOKIE_SECRET') && object.data.exists(k, k == 'PRIVATE_CA_BUNDLE')
    message: Only the Infisical controller may write the exact CristexHub DEV runtime
      Secret contract.
    reason: Forbidden
