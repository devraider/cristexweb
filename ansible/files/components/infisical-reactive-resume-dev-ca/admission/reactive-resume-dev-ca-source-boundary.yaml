      expression: request.namespace == 'cristexhub-dev' && (request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller' || object.metadata.name == 'reactive-resume-dev-ca')
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
