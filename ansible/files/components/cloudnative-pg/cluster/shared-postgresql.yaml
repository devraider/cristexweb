---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-postgresql
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: shared-databases
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: postgresql
spec:
  description: Single-node shared PostgreSQL 17 test cluster
  instances: 1
  postgresUID: 999
  postgresGID: 999
  imageName: docker.io/library/postgres:17.10@sha256:dbbeb22a65db2503050cdbbe5e78f017478f10a1002a226463f049dbb017e99b
  imagePullPolicy: IfNotPresent
  enablePDB: false
  bootstrap:
    initdb:
      database: platform_admin
      owner: postgres_admin
      secret:
        name: shared-postgresql-admin
      encoding: UTF8
      localeCType: C.UTF-8
      localeCollate: C.UTF-8
  storage:
    storageClass: local-path
    size: 40Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.2
      log_connections: "on"
      log_disconnections: "on"
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: shared-databases
      cristex.io/component: postgresql
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: cristexhub-dev-owner
  namespace: shared-services
spec:
  cluster:
    name: shared-postgresql
  name: cristexhub_dev_owner
  ensure: present
  login: true
  inherit: true
  passwordSecret:
    name: shared-postgresql-cristexhub-dev
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: cristexhub-prod-owner
  namespace: shared-services
spec:
  cluster:
    name: shared-postgresql
  name: cristexhub_prod_owner
  ensure: present
  login: true
  inherit: true
  passwordSecret:
    name: shared-postgresql-cristexhub-prod
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
