metadata:
  name: reactive-resume-dev-owner
  namespace: shared-services
spec:
  cluster:
    name: shared-postgresql
  name: reactive_resume_dev_owner
  ensure: present
  login: true
  inherit: true
  passwordSecret:
    name: shared-postgresql-reactive-resume-dev
  databaseRoleReclaimPolicy: retain
---
