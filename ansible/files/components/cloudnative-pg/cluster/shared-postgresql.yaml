  name: keycloak_owner
  ensure: present
  login: true
  inherit: true
  passwordSecret:
    name: shared-postgresql-keycloak
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: cristexhub-dev
  namespace: shared-services
spec:
  cluster:
    name: shared-postgresql
  name: cristexhub_dev
  owner: cristexhub_dev_owner
  ensure: present
  databaseReclaimPolicy: retain
  encoding: UTF8
