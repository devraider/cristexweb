apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oidc-connect-proxy-allow-auth-egress
  namespace: shared-services
  labels:
    app.kubernetes.io/name: oidc-connect-proxy
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/component: oidc-connect-proxy
    cristex.io/desired-owner: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oidc-connect-proxy
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      # NetworkPolicy cannot express a DNS hostname; Squid's exact CONNECT ACL
      # is the hostname/port boundary, while this policy blocks private ranges.
      ports:
        - {protocol: TCP, port: 443}
