apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oidc-connect-proxy-allow-dns
  namespace: shared-services
  labels:
    app.kubernetes.io/name: oidc-connect-proxy
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/component: oidc-connect-proxy
    cristex.io/desired-owner: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oidc-connect-proxy
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
