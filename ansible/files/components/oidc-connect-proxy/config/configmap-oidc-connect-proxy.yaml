apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-connect-proxy-config
  namespace: shared-services
  labels:
    app.kubernetes.io/name: oidc-connect-proxy
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/component: oidc-connect-proxy
    cristex.io/desired-owner: argocd
data:
  squid.conf: |-
    visible_hostname cristexhub-oidc-connect-proxy
    http_port 3128
    dns_v4_first on
    forwarded_for delete
    via off
    acl connect_method method CONNECT
    # Runtime consumers use only the Keycloak issuer, Zoho EU broker, and
    # DeepSeek API. Fonts are bundled; never add a broad browser CDN exception.
    acl allowed_https_host dstdomain auth.cristex-soft.com accounts.zoho.eu api.deepseek.com
    acl tls_port port 443
    acl forbidden_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
    acl forbidden_dst6 dst ::/128 ::1/128 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
    http_access deny !connect_method
    http_access deny !tls_port
    http_access deny !allowed_https_host
    http_access deny forbidden_dst
    http_access deny forbidden_dst6
    http_access allow connect_method tls_port allowed_https_host
    http_access deny all
    cache deny all
    access_log none
    cache_log stdio:/dev/stderr
    pid_filename none
