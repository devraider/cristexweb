---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: shared-mongodb
  namespace: shared-services
  labels:
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: shared-databases
    cristex.io/component: mongodb
spec:
  members: 1
  type: ReplicaSet
  version: "8.0.12"
  featureCompatibilityVersion: "8.0"
  security:
    authentication:
      modes: [SCRAM]
    tls:
      enabled: true
      optional: false
      certificateKeySecretRef:
        name: shared-mongodb-tls
      caCertificateSecretRef:
        name: shared-mongodb-tls
  users:
    - name: mongodb_admin
      db: admin
      passwordSecretRef:
        name: shared-mongodb-auth
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: shared-mongodb-admin-scram
    - name: cristexhub_dev_user
      db: admin
      passwordSecretRef:
        name: shared-mongodb-cristexhub-dev
      roles:
        - name: readWrite
          db: cristexhub_dev
      scramCredentialsSecretName: shared-mongodb-cristexhub-dev-scram
    - name: cristexhub_prod_user
      db: admin
      passwordSecretRef:
        name: shared-mongodb-cristexhub-prod
      roles:
        - name: readWrite
          db: cristexhub_prod
      scramCredentialsSecretName: shared-mongodb-cristexhub-prod-scram
  statefulSet:
    metadata:
      labels:
        app.kubernetes.io/part-of: shared-databases
        cristex.io/component: mongodb
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: shared-databases
            cristex.io/component: mongodb
        spec:
          containers:
            - name: mongod
              image: quay.io/mongodb/mongodb-community-server:8.0.12-ubi8@sha256:5500852ab0693ac56134cecf5ad45d3b81d25e4681f4f960a834e48cd34fe71b
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
            - name: mongodb-agent
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
      volumeClaimTemplates:
        - metadata:
            name: data-volume
            labels:
              app.kubernetes.io/part-of: shared-databases
              cristex.io/component: mongodb
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: local-path
            resources:
              requests:
                storage: 80Gi
        - metadata:
            name: logs-volume
            labels:
              app.kubernetes.io/part-of: shared-databases
              cristex.io/component: mongodb-logs
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: local-path
            resources:
              requests:
                storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: shared-mongodb
  namespace: shared-services
  labels:
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: shared-databases
    cristex.io/component: mongodb
spec:
  type: ClusterIP
  selector:
    app: shared-mongodb-svc
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
