---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-argocd-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-argocd-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - secrets
        scope: Namespaced
  matchConditions:
    - name: argocd-target-namespace
      expression: request.namespace == 'argocd'
    - name: argocd-controller-or-target-name
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name in ['argocd-secret', 'argocd-redis', 'argocd-server-tls']
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        request.namespace == 'argocd' &&
        has(object.metadata.labels) && object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
        object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.binaryData) || object.binaryData.size() == 0) &&
        ((object.metadata.name == 'argocd-secret' && object.type == 'Opaque' &&
          object.data.size() == 3 && object.data['admin.password'] != null &&
          object.data['admin.passwordMtime'] != null && object.data['server.secretkey'] != null) ||
         (object.metadata.name == 'argocd-redis' && object.type == 'Opaque' &&
          object.data.size() == 1 && object.data['auth'] != null) ||
         (object.metadata.name == 'argocd-server-tls' && object.type == 'kubernetes.io/tls' &&
          object.data.size() == 3 && object.data['ca.crt'] != null &&
          object.data['tls.crt'] != null && object.data['tls.key'] != null)))
      message: The Infisical Operator may write only the three reviewed Argo CD Secrets.
      reason: Forbidden
