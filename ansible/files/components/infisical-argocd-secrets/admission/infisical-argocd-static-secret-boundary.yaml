---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-argocd-static-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-argocd-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - secrets.infisical.com
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - infisicalstaticsecrets
        scope: Namespaced
  validations:
    - expression: >-
        request.namespace != 'argocd' ||
        (object.metadata.name == 'argocd-infisical-secrets' &&
        object.spec.infisicalAuthRef.name == 'argocd-infisical-auth' &&
        object.spec.infisicalAuthRef.namespace == 'argocd' &&
        object.spec.sources.size() == 1 &&
        object.spec.sources[0].projectSlug == 'cristexweb-infrastructure' &&
        object.spec.sources[0].environmentSlug == 'bootstrap' &&
        object.spec.sources[0].secretPath == '/argocd' &&
        !has(object.spec.sources[0].projectId) &&
        has(object.spec.sources[0].recursive) &&
        object.spec.sources[0].recursive == false &&
        has(object.spec.sources[0].tagSlugs) &&
        object.spec.sources[0].tagSlugs.size() == 0 &&
        object.spec.syncOptions.refreshInterval == '1h' &&
        has(object.spec.syncOptions.instantUpdates) &&
        object.spec.syncOptions.instantUpdates == false &&
        object.spec.targets.size() == 3 &&
        object.spec.targets.exists(t,
          t.name == 'argocd-secret' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'argocd-redis' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'argocd-server-tls' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'kubernetes.io/tls' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud'))
      message: Only the exact argocd StaticSecret identity, source, and three targets are allowed.
      reason: Forbidden
