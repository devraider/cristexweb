---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-argocd-static-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-argocd-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - secrets.infisical.com
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - infisicalstaticsecrets
        scope: Namespaced
  matchConditions:
    - name: argocd-static-secret-identity
      expression: >-
        request.namespace == 'argocd' &&
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name == 'argocd-infisical-secrets')
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        oldObject != null && oldObject.spec == object.spec)) &&
        object.metadata.name == 'argocd-infisical-secrets' &&
        object.spec.infisicalAuthRef.name == 'argocd-infisical-auth' &&
        object.spec.infisicalAuthRef.namespace == 'argocd' &&
        object.spec.sources.size() == 1 &&
        object.spec.sources[0].projectId == '619656da-14f3-4872-857b-be103cdc5326' &&
        object.spec.sources[0].environmentSlug == 'prod' &&
        object.spec.sources[0].secretPath == '/argocd' &&
        !has(object.spec.sources[0].projectSlug) &&
        has(object.spec.sources[0].recursive) &&
        object.spec.sources[0].recursive == false &&
        has(object.spec.sources[0].tagSlugs) &&
        object.spec.sources[0].tagSlugs.size() == 0 &&
        object.spec.syncOptions.refreshInterval == '5m' &&
        has(object.spec.syncOptions.instantUpdates) &&
        object.spec.syncOptions.instantUpdates == false &&
        object.spec.targets.size() == 5 &&
        object.spec.targets.exists(t,
          t.name == 'argocd-secret' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'argocd-redis' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'argocd-server-tls' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'kubernetes.io/tls' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'argocd-repository-cristexhub' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 4 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['argocd.argoproj.io/secret-type'] == 'repository' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
          t.template.data.size() == 3 &&
          t.template.data['type'] == 'git' &&
          t.template.data['url'] == 'ssh://git@ssh.github.com:443/devraider/cristexhub.git' &&
          t.template.data['sshPrivateKey'] == '{{ .ARGOCD_CRISTEXHUB_REPOSITORY_SSH_PRIVATE_KEY.Value }}') &&
        object.spec.targets.exists(t,
          t.name == 'argocd-repository-cristexweb' && t.namespace == 'argocd' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' &&
          has(t.metadata) && t.metadata.annotations.size() == 0 &&
          t.metadata.labels.size() == 4 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'argocd' &&
          t.metadata.labels['argocd.argoproj.io/secret-type'] == 'repository' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
          t.template.data.size() == 3 &&
          t.template.data['type'] == 'git' &&
          t.template.data['url'] == 'ssh://git@ssh.github.com:443/devraider/cristexweb.git' &&
          t.template.data['sshPrivateKey'] == '{{ .ARGOCD_CRISTEXWEB_REPOSITORY_SSH_PRIVATE_KEY.Value }}')
      message: Only the guarded exact administrator source or unchanged-spec Infisical Operator may write the Argo CD StaticSecret.
      reason: Forbidden
