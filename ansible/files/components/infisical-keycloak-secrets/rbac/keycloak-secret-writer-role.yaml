---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-keycloak-secret-writer
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-keycloak-secrets
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [keycloak-bootstrap-admin]
    verbs: [update]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [list, watch]
