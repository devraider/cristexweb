---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: keycloak-infisical-secrets
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-keycloak-secrets
spec:
  infisicalAuthRef:
    name: keycloak-infisical-auth
    namespace: shared-services
  syncOptions:
    refreshInterval: 1h
    instantUpdates: false
  sources:
    - projectId: 619656da-14f3-4872-857b-be103cdc5326
      environmentSlug: prod
      secretPath: /shared-services/keycloak
      recursive: false
      tagSlugs: []
  targets:
    - name: keycloak-bootstrap-admin
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: keycloak
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          username: '{{ .KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME.Value }}'
          password: '{{ .KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD.Value }}'
