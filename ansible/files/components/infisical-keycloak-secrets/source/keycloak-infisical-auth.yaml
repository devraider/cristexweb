---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: keycloak-infisical-auth
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-keycloak-secrets
spec:
  infisicalConnectionRef:
    name: infisical-cloud
    namespace: shared-services
  method: universal
  universal:
    clientIdRef:
      name: keycloak-infisical-universal-auth
      namespace: shared-services
      key: clientId
    clientSecretRef:
      name: keycloak-infisical-universal-auth
      namespace: shared-services
      key: clientSecret
