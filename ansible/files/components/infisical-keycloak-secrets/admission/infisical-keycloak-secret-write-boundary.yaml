---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-keycloak-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-keycloak-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        scope: Namespaced
  matchConditions:
    - name: keycloak-target-namespace
      expression: request.namespace == 'shared-services'
    - name: keycloak-target-name
      expression: >-
        object.metadata.name in ['keycloak-bootstrap-admin', 'keycloak-ghcr-pull']
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        request.namespace == 'shared-services' && has(object.metadata.labels) &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'keycloak' &&
        object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.binaryData) || object.binaryData.size() == 0) &&
        ((object.metadata.name == 'keycloak-bootstrap-admin' && object.type == 'Opaque' &&
        object.data.size() == 2 && object.data['username'] != null &&
        object.data['password'] != null) ||
        (object.metadata.name == 'keycloak-ghcr-pull' &&
        object.type == 'kubernetes.io/dockerconfigjson' && object.data.size() == 1 &&
        object.data['.dockerconfigjson'] != null))
      message: The Infisical Operator may write only the exact Keycloak administrator or GHCR pull Secret.
      reason: Forbidden
