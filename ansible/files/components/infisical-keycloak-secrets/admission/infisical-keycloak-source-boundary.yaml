---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-keycloak-source-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-keycloak-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [secrets.infisical.com]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [infisicalconnections, infisicalauths]
        scope: Namespaced
  matchConditions:
    - name: keycloak-source-identities
      expression: >-
        request.namespace == 'shared-services' &&
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name in ['infisical-cloud','keycloak-infisical-auth'])
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        oldObject != null && oldObject.spec == object.spec)) &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'cristex-platform' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'ansible' &&
        object.metadata.labels['cristex.io/component'] == 'infisical-keycloak-secrets' &&
        ((object.kind == 'InfisicalConnection' &&
        object.metadata.name == 'infisical-cloud' &&
        object.spec.address == 'https://app.infisical.com/api') ||
        (object.kind == 'InfisicalAuth' &&
        object.metadata.name == 'keycloak-infisical-auth' &&
        object.spec.method == 'universal' &&
        object.spec.infisicalConnectionRef.name == 'infisical-cloud' &&
        object.spec.infisicalConnectionRef.namespace == 'shared-services' &&
        object.spec.universal.clientIdRef.name == 'keycloak-infisical-universal-auth' &&
        object.spec.universal.clientIdRef.namespace == 'shared-services' &&
        object.spec.universal.clientIdRef.key == 'clientId' &&
        object.spec.universal.clientSecretRef.name == 'keycloak-infisical-universal-auth' &&
        object.spec.universal.clientSecretRef.namespace == 'shared-services' &&
        object.spec.universal.clientSecretRef.key == 'clientSecret'))
      message: Only the guarded administrator or unchanged-spec Operator may write the exact Keycloak Connection and Auth sources.
      reason: Forbidden
