apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-auth
  namespace: shared-services
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/component: keycloak-route
    cristex.io/desired-owner: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: shared-services-keycloak-root-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: auth.cristex-soft.com
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /realms/cristexhub
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
