apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform-edge
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/component: cloudflared
    cristex.io/desired-owner: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/part-of: cristex-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/part-of: cristex-platform
        app.kubernetes.io/managed-by: ansible
        cristex.io/component: cloudflared
    spec:
      serviceAccountName: cloudflared
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 1.0.0.1]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared@sha256:b392761b711c0e5649d9b64e1fc9a10ba0563fa3e712ed7c26bde5cc1fbe9059
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:20241
            - run
            - --token-file
            - /etc/cloudflared/token/token
          ports:
            - name: metrics
              containerPort: 20241
              protocol: TCP
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /ready, port: metrics, scheme: HTTP}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: metrics, scheme: HTTP}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthcheck, port: metrics, scheme: HTTP}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tunnel-token
          secret:
            secretName: cloudflared-token
            items:
              - key: token
                path: token
            defaultMode: 288
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
