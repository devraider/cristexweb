apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: shared-services
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/component: keycloak
    cristex.io/desired-owner: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: cristex-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: cristex-platform
        app.kubernetes.io/managed-by: ansible
        cristex.io/component: keycloak
        cristex.io/database-client: shared-postgresql
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: keycloak-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: ghcr.io/devraider/cristexhub/keycloak@sha256:0c9d87edd491aeecaefab87643640d836f17ba11aa76bea8dc3e6aa8e9c1902f
          imagePullPolicy: IfNotPresent
          args: [start, --import-realm]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://shared-postgresql-rw.shared-services.svc:5432/keycloak?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/postgresql-ca.crt"}
            - {name: KC_DB_USERNAME, valueFrom: {secretKeyRef: {name: shared-postgresql-keycloak, key: username}}}
            - {name: KC_DB_PASSWORD, valueFrom: {secretKeyRef: {name: shared-postgresql-keycloak, key: password}}}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: {secretKeyRef: {name: keycloak-bootstrap-admin, key: username}}}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: keycloak-bootstrap-admin, key: password}}}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HOSTNAME, value: "https://auth.cristex-soft.com"}
            - {name: KC_HOSTNAME_STRICT, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: HTTPS_PROXY, value: "http://oidc-connect-proxy.shared-services.svc.cluster.local:3128"}
            - {name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.svc.cluster.local"}
          volumeMounts:
            - {name: postgresql-ca, mountPath: /opt/keycloak/conf/postgresql-ca.crt, subPath: ca.crt, readOnly: true}
            - {name: keycloak-data, mountPath: /opt/keycloak/data}
            - {name: cristexhub-realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/ready, port: management, scheme: HTTP}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management, scheme: HTTP}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: management, scheme: HTTP}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: cristexhub-realm
          configMap:
            name: keycloak-realm-cristexhub
            items: [{key: cristexhub-realm.json, path: cristexhub-realm.json}]
        - name: postgresql-ca
          secret:
            secretName: shared-postgresql-ca
            items: [{key: ca.crt, path: ca.crt}]
            defaultMode: 0444
        - name: keycloak-data
          emptyDir:
            sizeLimit: 2Gi
