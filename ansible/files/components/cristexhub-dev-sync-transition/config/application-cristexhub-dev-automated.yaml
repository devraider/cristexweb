apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cristexhub-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: cristexhub-dev
    app.kubernetes.io/part-of: cristexhub
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: cristexhub-dev-sync-transition
spec:
  project: cristexhub-dev
  source:
    repoURL: ssh://git@ssh.github.com:443/devraider/cristexhub.git
    targetRevision: ceb38425b55c138a1dc44f4ffc754938fbf8fa63
    path: infra/kubernetes/cristexhub-dev
  destination:
    name: cristexhub-dev-local
    server: ''
    namespace: cristexhub-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - Prune=false
      - ServerSideApply=false
      - Replace=false
      - FailOnSharedResource=true
