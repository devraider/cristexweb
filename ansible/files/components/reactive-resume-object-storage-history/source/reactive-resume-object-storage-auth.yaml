apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: reactive-resume-object-storage-auth
  namespace: shared-services
  labels:
    app.kubernetes.io/name: reactive-resume-object-storage
    app.kubernetes.io/part-of: reactive-resume
    app.kubernetes.io/managed-by: ansible
    cristex.io/bootstrap-writer: ansible
    cristex.io/desired-owner: argocd
    cristex.io/component: object-storage
spec:
  infisicalAuthRef:
    name: cristexhub-dev-infisical-auth
    namespace: cristexhub-dev
  syncOptions:
    refreshInterval: 1h
    instantUpdates: false
  sources:
    - projectId: 619656da-14f3-4872-857b-be103cdc5326
      environmentSlug: prod
      secretPath: /reactive-resume/dev/runtime
      recursive: false
      tagSlugs: []
  targets:
    - name: reactive-resume-object-storage-auth
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: reactive-resume
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          accessKey: '{{ .S3_ACCESS_KEY_ID.Value }}'
          secretKey: '{{ .S3_SECRET_ACCESS_KEY.Value }}'
