---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-cloudflared-static-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cloudflared-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [secrets.infisical.com]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [infisicalstaticsecrets]
        scope: Namespaced
  matchConditions:
    - name: cloudflared-static-secret
      expression: request.namespace == 'platform-edge'
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
        (request.userInfo.username ==
        'system:serviceaccount:platform-edge:infisical-operator-controller' &&
        oldObject != null && oldObject.spec == object.spec)) &&
        object.metadata.name == 'cloudflared-infisical-secrets' &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'cristex-platform' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'ansible' &&
        object.metadata.labels['cristex.io/component'] == 'infisical-cloudflared-secrets' &&
        object.spec.infisicalAuthRef.name == 'cloudflared-infisical-auth' &&
        object.spec.infisicalAuthRef.namespace == 'platform-edge' &&
        object.spec.sources.size() == 1 &&
        object.spec.sources[0].projectId == '619656da-14f3-4872-857b-be103cdc5326' &&
        object.spec.sources[0].environmentSlug == 'prod' &&
        object.spec.sources[0].secretPath == '/platform-edge/cloudflared' &&
        object.spec.sources[0].recursive == false &&
        object.spec.targets.size() == 1 &&
        object.spec.targets[0].name == 'cloudflared-token' &&
        object.spec.targets[0].namespace == 'platform-edge' &&
        object.spec.targets[0].kind == 'Secret' &&
        object.spec.targets[0].secretType == 'Opaque' &&
        object.spec.targets[0].creationPolicy == 'Orphan' &&
        object.spec.targets[0].template.data.token == '{{ .CLOUDFLARE_TUNNEL_TOKEN.Value }}'
      message: Only the exact Cloudflare StaticSecret source and token target are permitted.
      reason: Forbidden
