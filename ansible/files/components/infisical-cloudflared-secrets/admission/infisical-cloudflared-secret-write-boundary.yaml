---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-cloudflared-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cloudflared-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        scope: Namespaced
  matchConditions:
    - name: cloudflared-target
      expression: request.namespace == 'platform-edge'
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        object.metadata.name == 'cloudflared-token' &&
        object.type == 'Opaque' && has(object.metadata.labels) &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'cloudflared' &&
        object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
        object.data.size() == 1 && object.data['token'] != null &&
        (!has(object.binaryData) || object.binaryData.size() == 0) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0)
      message: Only Infisical may write the exact Cloudflare tunnel token Secret.
      reason: Forbidden
