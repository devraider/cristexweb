apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cloudflared-infisical-secrets
  namespace: platform-edge
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-cloudflared-secrets
spec:
  infisicalAuthRef:
    name: cloudflared-infisical-auth
    namespace: platform-edge
  syncOptions:
    refreshInterval: 1h
    instantUpdates: false
  sources:
  - projectId: 619656da-14f3-4872-857b-be103cdc5326
    environmentSlug: prod
    secretPath: /platform-edge/cloudflared
    recursive: false
    tagSlugs: []
  targets:
  - name: cloudflared-token
    namespace: platform-edge
    kind: Secret
    secretType: Opaque
    creationPolicy: Orphan
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/managed-by: infisical
        app.kubernetes.io/part-of: cloudflared
        cristex.io/value-owner: infisical-cloud
    template:
      engineVersion: v1
      data:
        token: '{{ .CLOUDFLARE_TUNNEL_TOKEN.Value }}'
