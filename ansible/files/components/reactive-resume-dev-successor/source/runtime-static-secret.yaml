---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: reactive-resume-dev-runtime
  namespace: cristexhub-dev
  labels:
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: reactive-resume
    cristex.io/component: reactive-resume-dev-successor
    cristex.io/environment: dev
spec:
  infisicalAuthRef:
    name: cristexhub-dev-infisical-auth
    namespace: cristexhub-dev
  syncOptions:
    refreshInterval: 1h
    instantUpdates: false
  sources:
    - projectId: 619656da-14f3-4872-857b-be103cdc5326
      environmentSlug: prod
      secretPath: /reactive-resume/dev/runtime
      recursive: false
      tagSlugs: []
  targets:
    - name: reactive-resume-dev-runtime
      namespace: cristexhub-dev
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: reactive-resume
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          APP_URL: '{{ .APP_URL.Value }}'
          AUTH_SECRET: '{{ .AUTH_SECRET.Value }}'
          DATABASE_URL: '{{ .DATABASE_URL.Value }}'
          OAUTH_CLIENT_ID: '{{ .OAUTH_CLIENT_ID.Value }}'
          OAUTH_CLIENT_SECRET: '{{ .OAUTH_CLIENT_SECRET.Value }}'
          OAUTH_DISCOVERY_URL: '{{ .OAUTH_DISCOVERY_URL.Value }}'
          OAUTH_ISSUER: '{{ .OAUTH_ISSUER.Value }}'
          OAUTH_PROVIDER_NAME: '{{ .OAUTH_PROVIDER_NAME.Value }}'
          OAUTH_SCOPES: '{{ .OAUTH_SCOPES.Value }}'
          S3_ACCESS_KEY_ID: '{{ .S3_ACCESS_KEY_ID.Value }}'
          S3_BUCKET: '{{ .S3_BUCKET.Value }}'
          S3_ENDPOINT: '{{ .S3_ENDPOINT.Value }}'
          S3_FORCE_PATH_STYLE: '{{ .S3_FORCE_PATH_STYLE.Value }}'
          S3_REGION: '{{ .S3_REGION.Value }}'
          S3_SECRET_ACCESS_KEY: '{{ .S3_SECRET_ACCESS_KEY.Value }}'
