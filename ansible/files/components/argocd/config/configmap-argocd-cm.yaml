---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: v3.5.0-sha256-521d6b62ecd0434c9cc6e9242a74f0e1137bb8fc0026b2c48
    cristex.io/component: argocd
data:
  admin.enabled: 'true'
  application.instanceLabelKey: argocd.argoproj.io/instance
  resource.inclusions: |
    - apiGroups:
        - ''
      kinds:
        - ConfigMap
        - Service
        - ServiceAccount
      clusters:
        - https://kubernetes.default.svc
    - apiGroups:
        - apps
      kinds:
        - Deployment
      clusters:
        - https://kubernetes.default.svc
    - apiGroups:
        - networking.k8s.io
      kinds:
        - Ingress
        - NetworkPolicy
      clusters:
        - https://kubernetes.default.svc
  resource.respectRBAC: 'strict'
  timeout.reconciliation: 180s
