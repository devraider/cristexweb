---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-database-secret-write-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-database-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - secrets
        scope: Namespaced
  matchConditions:
    - name: shared-database-target-namespace
      expression: request.namespace == 'shared-services'
    - name: shared-database-controller-or-target-name
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name in ['shared-postgresql-admin', 'shared-postgresql-tls',
        'shared-mongodb-auth', 'shared-mongodb-tls',
        'shared-postgresql-cristexhub-dev', 'shared-postgresql-cristexhub-prod',
        'shared-postgresql-reactive-resume-dev',
        'shared-postgresql-reactive-resume-prod', 'shared-postgresql-keycloak',
        'shared-mongodb-cristexhub-dev', 'shared-mongodb-cristexhub-prod']
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        request.namespace == 'shared-services' &&
        has(object.metadata.labels) && object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
        object.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud' &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.binaryData) || object.binaryData.size() == 0) &&
        ((object.metadata.name == 'shared-postgresql-admin' && object.type == 'Opaque' &&
          object.data.size() == 2 && object.data['username'] != null &&
          object.data['password'] != null) ||
         (object.metadata.name == 'shared-postgresql-tls' && object.type == 'kubernetes.io/tls' &&
          object.data.size() == 3 && object.data['ca.crt'] != null &&
          object.data['tls.crt'] != null && object.data['tls.key'] != null) ||
         (object.metadata.name == 'shared-mongodb-auth' && object.type == 'Opaque' &&
          object.data.size() == 2 && object.data['username'] != null &&
          object.data['password'] != null) ||
         (object.metadata.name == 'shared-mongodb-tls' && object.type == 'Opaque' &&
          object.data.size() == 2 && object.data['ca.crt'] != null &&
          object.data['tls.pem'] != null) ||
         (object.metadata.name in ['shared-postgresql-cristexhub-dev',
          'shared-postgresql-cristexhub-prod',
          'shared-postgresql-reactive-resume-dev',
          'shared-postgresql-reactive-resume-prod',
          'shared-postgresql-keycloak',
          'shared-mongodb-cristexhub-dev',
          'shared-mongodb-cristexhub-prod'] && object.type == 'Opaque' &&
          object.data.size() == 2 && object.data['username'] != null &&
          object.data['password'] != null)))
      message: The Infisical Operator may write only the eleven reviewed database Secrets.
      reason: Forbidden
