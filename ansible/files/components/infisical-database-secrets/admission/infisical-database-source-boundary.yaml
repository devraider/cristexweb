---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-database-source-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-database-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [secrets.infisical.com]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [infisicalconnections, infisicalauths]
        scope: Namespaced
  matchConditions:
    - name: shared-database-source-identities
      expression: >-
        request.namespace == 'shared-services' &&
        (request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name in ['infisical-cloud','shared-postgresql-infisical-auth','shared-mongodb-infisical-auth'])
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
        (request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller' &&
        oldObject != null && oldObject.spec == object.spec)) &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'cristex-platform' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'ansible' &&
        object.metadata.labels['cristex.io/component'] == 'infisical-database-secrets' &&
        object.metadata.name in ['infisical-cloud','shared-postgresql-infisical-auth','shared-mongodb-infisical-auth']
      message: Only the exact guarded database Connection and Auth identities are allowed.
      reason: Forbidden
