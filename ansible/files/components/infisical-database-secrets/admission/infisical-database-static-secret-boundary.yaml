---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-database-static-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-database-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - secrets.infisical.com
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - infisicalstaticsecrets
        scope: Namespaced
  matchConditions:
    - name: shared-database-static-secret-identities
      expression: >-
        request.namespace == 'shared-services' &&
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name in
        ['shared-postgresql-infisical-secrets',
        'shared-mongodb-infisical-secrets'])
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
        (request.userInfo.username ==
        'system:serviceaccount:shared-services:infisical-operator-controller' &&
        oldObject != null && oldObject.spec == object.spec)) &&
        ((object.metadata.name == 'shared-postgresql-infisical-secrets' &&
        object.spec.infisicalAuthRef.name == 'shared-postgresql-infisical-auth' &&
        object.spec.infisicalAuthRef.namespace == 'shared-services' &&
        object.spec.sources.size() == 1 &&
        object.spec.sources[0].projectSlug == 'cristexweb-infrastructure' &&
        object.spec.sources[0].environmentSlug == 'bootstrap' &&
        object.spec.sources[0].secretPath == '/shared-services/postgresql' &&
        !has(object.spec.sources[0].projectId) &&
        has(object.spec.sources[0].recursive) &&
        object.spec.sources[0].recursive == false &&
        has(object.spec.sources[0].tagSlugs) &&
        object.spec.sources[0].tagSlugs.size() == 0 &&
        object.spec.syncOptions.refreshInterval == '1h' &&
        has(object.spec.syncOptions.instantUpdates) &&
        object.spec.syncOptions.instantUpdates == false &&
        object.spec.targets.size() == 7 &&
        object.spec.targets.exists(t,
          t.name == 'shared-postgresql-admin' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-postgresql-tls' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'kubernetes.io/tls' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-postgresql-cristexhub-dev' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-postgresql-cristexhub-prod' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-postgresql-reactive-resume-dev' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-postgresql-reactive-resume-prod' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-postgresql-keycloak' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud')) ||
        (object.metadata.name == 'shared-mongodb-infisical-secrets' &&
        object.spec.infisicalAuthRef.name == 'shared-mongodb-infisical-auth' &&
        object.spec.infisicalAuthRef.namespace == 'shared-services' &&
        object.spec.sources.size() == 1 &&
        object.spec.sources[0].projectSlug == 'cristexweb-infrastructure' &&
        object.spec.sources[0].environmentSlug == 'bootstrap' &&
        object.spec.sources[0].secretPath == '/shared-services/mongodb' &&
        !has(object.spec.sources[0].projectId) &&
        has(object.spec.sources[0].recursive) &&
        object.spec.sources[0].recursive == false &&
        has(object.spec.sources[0].tagSlugs) &&
        object.spec.sources[0].tagSlugs.size() == 0 &&
        object.spec.syncOptions.refreshInterval == '1h' &&
        has(object.spec.syncOptions.instantUpdates) &&
        object.spec.syncOptions.instantUpdates == false &&
        object.spec.targets.size() == 4 &&
        object.spec.targets.exists(t,
          t.name == 'shared-mongodb-auth' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-mongodb-tls' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-mongodb-cristexhub-dev' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud') &&
        object.spec.targets.exists(t,
          t.name == 'shared-mongodb-cristexhub-prod' && t.namespace == 'shared-services' &&
          t.kind == 'Secret' && t.secretType == 'Opaque' &&
          t.creationPolicy == 'Orphan' && has(t.template) &&
          t.template.engineVersion == 'v1' && has(t.metadata) &&
          t.metadata.annotations.size() == 0 && t.metadata.labels.size() == 3 &&
          t.metadata.labels['app.kubernetes.io/managed-by'] == 'infisical' &&
          t.metadata.labels['app.kubernetes.io/part-of'] == 'shared-databases' &&
          t.metadata.labels['cristex.io/value-owner'] == 'infisical-cloud'))
      message: Only the guarded administrator or unchanged-spec Operator may write the exact database StaticSecrets.
      reason: Forbidden
