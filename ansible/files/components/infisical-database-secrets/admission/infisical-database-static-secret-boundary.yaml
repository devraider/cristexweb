---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: infisical-database-static-secret-boundary
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-database-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [secrets.infisical.com]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [infisicalstaticsecrets]
        scope: Namespaced
  matchConditions:
    - name: shared-database-static-secret-identities
      expression: >-
        request.namespace == 'shared-services' &&
        (request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller' ||
        object.metadata.name in ['shared-postgresql-infisical-secrets','shared-mongodb-infisical-secrets'])
  validations:
    - expression: >-
        (request.userInfo.username == 'system:admin' ||
        (request.userInfo.username == 'system:serviceaccount:shared-services:infisical-operator-controller' &&
        oldObject != null && oldObject.spec == object.spec)) &&
        object.metadata.labels.size() == 3 &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'cristex-platform' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'ansible' &&
        object.metadata.labels['cristex.io/component'] == 'infisical-database-secrets' &&
        object.metadata.name in ['shared-postgresql-infisical-secrets','shared-mongodb-infisical-secrets'] &&
        object.spec.sources.size() == 1 &&
        object.spec.sources[0].projectId == '619656da-14f3-4872-857b-be103cdc5326' &&
        object.spec.sources[0].environmentSlug == 'prod' &&
        object.spec.sources[0].secretPath in ['/shared-services/postgresql','/shared-services/mongodb'] &&
        !has(object.spec.sources[0].projectSlug) &&
        object.spec.sources[0].recursive == false &&
        object.spec.sources[0].tagSlugs.size() == 0 &&
        object.spec.syncOptions.refreshInterval == '1h' &&
        object.spec.syncOptions.instantUpdates == false &&
        ((object.metadata.name == 'shared-postgresql-infisical-secrets' && object.spec.targets.size() == 7) ||
         (object.metadata.name == 'shared-mongodb-infisical-secrets' && object.spec.targets.size() == 4))
      message: Only the exact guarded PostgreSQL and MongoDB StaticSecret identities are allowed.
      reason: Forbidden
