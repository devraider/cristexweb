---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: shared-mongodb-infisical-secrets
  namespace: shared-services
  labels:
    app.kubernetes.io/part-of: cristex-platform
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: infisical-database-secrets
spec:
  infisicalAuthRef:
    name: shared-mongodb-infisical-auth
    namespace: shared-services
  syncOptions:
    refreshInterval: 1h
    instantUpdates: false
  sources:
    - projectSlug: cristexweb-infrastructure
      environmentSlug: bootstrap
      secretPath: /shared-services/mongodb
      recursive: false
      tagSlugs: []
  targets:
    - name: shared-mongodb-auth
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-databases
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          username: '{{ .MONGODB_ADMIN_USERNAME.Value }}'
          password: '{{ .MONGODB_ADMIN_PASSWORD.Value }}'
    - name: shared-mongodb-tls
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-databases
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          ca.crt: '{{ .MONGODB_TLS_CA_CRT.Value }}'
          tls.pem: '{{ .MONGODB_TLS_PEM.Value }}'
    - name: shared-mongodb-cristexhub-dev
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-databases
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          username: '{{ .MONGODB_CRISTEXHUB_DEV_USERNAME.Value }}'
          password: '{{ .MONGODB_CRISTEXHUB_DEV_PASSWORD.Value }}'
    - name: shared-mongodb-cristexhub-prod
      namespace: shared-services
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/managed-by: infisical
          app.kubernetes.io/part-of: shared-databases
          cristex.io/value-owner: infisical-cloud
      template:
        engineVersion: v1
        data:
          username: '{{ .MONGODB_CRISTEXHUB_PROD_USERNAME.Value }}'
          password: '{{ .MONGODB_CRISTEXHUB_PROD_PASSWORD.Value }}'
