apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cristexhub-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: cristexhub-dev
    app.kubernetes.io/part-of: cristexhub
    app.kubernetes.io/managed-by: ansible
    cristex.io/component: cristexhub-dev-registration
spec:
  project: cristexhub-dev
  source:
    repoURL: ssh://git@ssh.github.com:443/devraider/cristexhub.git
    targetRevision: ef57a7e2814321344a12233d906360fa5ff2e093
    path: infra/kubernetes/cristexhub-dev
  destination:
    name: cristexhub-dev-local
    server: ''
    namespace: cristexhub-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - Prune=false
      - ServerSideApply=false
      - Replace=false
      - FailOnSharedResource=true
