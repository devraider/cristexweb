---
- name: Configure guarded OpenTofu state backup scheduler
  hosts: crtxweb
  gather_facts: false
  become: true
  any_errors_fatal: true
  serial: 1
  vars:
    opentofu_state_backup_approved: false
    opentofu_state_backup_mode: install
    opentofu_state_backup_repository_root: "{{ playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname }}"
    opentofu_state_backup_source_closure_sha256: c9a04e04303b30148f410dd57c8c5c8cf69d0cbf58b88cbc70023c824e214fae
    opentofu_state_backup_backup_receipt_pattern: >-
      ^backup_status=success schema=1 service=opentofu state=foundation\.tfstate
      run_id=20[0-9]{6}T[0-9]{6}Z archive_bytes=[1-9][0-9]*
      archive_sha256=[0-9a-f]{64} readback=verified private_residue=none
      address_scope=exact-(five|six) source_closure_sha256={{ opentofu_state_backup_source_closure_sha256 }}$
    opentofu_state_backup_restore_receipt_pattern: >-
      ^restore_status=success schema=1 run_id=20[0-9]{6}T[0-9]{6}Z
      source_run_id=20[0-9]{6}T[0-9]{6}Z source_timestamp=20[0-9]{6}T[0-9]{6}Z
      target=isolated-tmpfs checksum=verified private_residue=none
      state_validation=tofu-state-list address_scope=exact-(five|six)
      source_closure_sha256={{ opentofu_state_backup_source_closure_sha256 }} non_mutating=true$
  pre_tasks:
    - name: Require bounded OpenTofu state backup approval
      ansible.builtin.assert:
        that:
          - opentofu_state_backup_approved | bool
          - lookup('ansible.builtin.env', 'CRISTEXWEB_OPENTOFU_STATE_BACKUP_ENTRYPOINT') == 'v1'
          - (ansible_limit | default('') | string) == 'crtxweb'
          - ansible_play_hosts_all | length == 1
          - opentofu_state_backup_mode in ['install', 'test', 'restore', 'enable']
      changed_when: false
    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: apt
    - name: Require pinned age
      ansible.builtin.assert:
        that:
          - ansible_facts.packages.age | default([]) | length == 1
          - ansible_facts.packages.age[0].version == '1.2.1-1+b5'
          - ansible_facts.packages.age[0].arch == 'amd64'
      changed_when: false
    - name: Inspect protected backup inputs
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /usr/local/bin/rclone
        - /opt/rclone/1.71.1/rclone
        - /home/paul/.config/rclone/rclone.conf
        - /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
        - /var/lib/opentofu/cristexweb/foundation.tfstate
      register: opentofu_state_backup_inputs
    - name: Require protected backup inputs
      ansible.builtin.assert:
        that:
          - opentofu_state_backup_inputs.results[0].stat.islnk | default(false)
          - opentofu_state_backup_inputs.results[0].stat.lnk_source == '/opt/rclone/1.71.1/rclone'
          - opentofu_state_backup_inputs.results[0].stat.pw_name == 'root'
          - opentofu_state_backup_inputs.results[1].stat.isreg | default(false)
          - opentofu_state_backup_inputs.results[1].stat.pw_name == 'root'
          - opentofu_state_backup_inputs.results[1].stat.mode == '0755'
          - opentofu_state_backup_inputs.results[2].stat.isreg | default(false)
          - opentofu_state_backup_inputs.results[2].stat.pw_name == 'paul'
          - opentofu_state_backup_inputs.results[2].stat.mode == '0600'
          - opentofu_state_backup_inputs.results[3].stat.isreg | default(false)
          - opentofu_state_backup_inputs.results[3].stat.pw_name == 'paul'
          - opentofu_state_backup_inputs.results[3].stat.mode == '0644'
          - opentofu_state_backup_mode == 'install' or (opentofu_state_backup_inputs.results[4].stat.isreg | default(false))
          - opentofu_state_backup_mode == 'install' or opentofu_state_backup_inputs.results[4].stat.pw_name == 'paul'
          - opentofu_state_backup_mode == 'install' or opentofu_state_backup_inputs.results[4].stat.mode == '0600'
      changed_when: false
    - name: Verify the sole configured rclone remote without reading its token
      ansible.builtin.command:
        argv: [/usr/local/bin/rclone, --config, /home/paul/.config/rclone/rclone.conf, listremotes]
      become: false
      register: opentofu_state_backup_rclone_remotes
      changed_when: false
      check_mode: false
      no_log: true
    - name: Require the exact Google Drive remote
      ansible.builtin.assert:
        that:
          - opentofu_state_backup_rclone_remotes.stdout_lines == ['drive:']
      changed_when: false
  tasks:
    - name: Create protected OpenTofu backup directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/cristexweb-backup, owner: root, group: paul, mode: '0750'}
        - {path: /usr/local/libexec/cristexweb, owner: root, group: root, mode: '0755'}
        - {path: /var/lib/cristexweb-backup, owner: paul, group: paul, mode: '0700'}
        - {path: /var/lib/cristexweb-backup/opentofu, owner: paul, group: paul, mode: '0700'}
        - {path: /var/lib/cristexweb-backup/opentofu/foundation, owner: paul, group: paul, mode: '0700'}
    - name: Install public age recipient
      ansible.builtin.copy:
        src: /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
        dest: /etc/cristexweb-backup/age.recipient
        owner: root
        group: paul
        mode: '0640'
    - name: Install OpenTofu backup and restore executables
      ansible.builtin.copy:
        src: "{{ opentofu_state_backup_repository_root }}/ansible/files/backup/{{ item.src }}"
        dest: "/usr/local/libexec/cristexweb/{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - {src: opentofu-state-backup, dest: opentofu-state-backup}
        - {src: restore-opentofu-state-rehearsal, dest: restore-opentofu-state-rehearsal}
    - name: Install OpenTofu systemd units
      ansible.builtin.copy:
        src: "{{ opentofu_state_backup_repository_root }}/ansible/files/backup/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - cristexweb-opentofu-state-backup.service
        - cristexweb-opentofu-state-backup.timer
      register: opentofu_state_backup_units
    - name: Reload systemd  # noqa no-handler
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: opentofu_state_backup_units.changed
    - name: Keep timer disabled until restore acceptance
      ansible.builtin.systemd_service:
        name: cristexweb-opentofu-state-backup.timer
        enabled: false
        state: stopped
      when:
        - opentofu_state_backup_mode in ['install', 'test', 'restore']
        - not ansible_check_mode
    - name: Run approved OpenTofu state backup test
      ansible.builtin.systemd_service:
        name: cristexweb-opentofu-state-backup.service
        state: started
      when:
        - opentofu_state_backup_mode == 'test'
        - not ansible_check_mode
    - name: Run approved isolated OpenTofu state restore
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --preserve-status
          - 3600
          - /usr/local/libexec/cristexweb/restore-opentofu-state-rehearsal
      become: false
      register: opentofu_state_restore_result
      changed_when: true
      when:
        - opentofu_state_backup_mode == 'restore'
        - not ansible_check_mode
    - name: Require sanitized OpenTofu restore receipt
      ansible.builtin.assert:
        that:
          - opentofu_state_restore_result.stdout is match(opentofu_state_backup_restore_receipt_pattern)
      changed_when: false
      when:
        - opentofu_state_backup_mode == 'restore'
        - not ansible_check_mode
    - name: Inspect persisted fresh backup and restore acceptance evidence
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /var/lib/cristexweb-backup/acceptance/opentofu/foundation/backup.receipt
        - /var/lib/cristexweb-backup/acceptance/opentofu/foundation/restore.receipt
      register: opentofu_state_backup_acceptance_states
      when:
        - opentofu_state_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Capture acceptance freshness reference epoch
      ansible.builtin.command:
        argv: [/usr/bin/date, +%s]
      register: opentofu_state_backup_acceptance_now
      check_mode: false
      changed_when: false
      when:
        - opentofu_state_backup_mode == 'enable'
      no_log: true

    - name: Require persisted fresh matching backup and restore acceptance evidence
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
          - item.stat.mtime is defined
          - item.stat.mtime | int > (opentofu_state_backup_acceptance_now.stdout | int - 86400)
      loop: "{{ opentofu_state_backup_acceptance_states.results | default([]) }}"
      when:
        - opentofu_state_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Read persisted acceptance receipts
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/lib/cristexweb-backup/acceptance/opentofu/foundation/backup.receipt
        - /var/lib/cristexweb-backup/acceptance/opentofu/foundation/restore.receipt
      register: opentofu_state_backup_acceptance_contents
      when:
        - opentofu_state_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Parse exact persisted backup and restore receipts without output
      ansible.builtin.set_fact:
        opentofu_state_backup_acceptance_backup_receipt: "{{ opentofu_state_backup_acceptance_contents.results[0].content | b64decode }}"
        opentofu_state_backup_acceptance_restore_receipt: "{{ opentofu_state_backup_acceptance_contents.results[1].content | b64decode }}"
      when:
        - opentofu_state_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Extract persisted backup and restore run identities without output
      ansible.builtin.set_fact:
        opentofu_state_backup_acceptance_backup_run_id: >-
          {{ opentofu_state_backup_acceptance_backup_receipt | regex_findall('run_id=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        opentofu_state_backup_acceptance_restore_run_id: >-
          {{ opentofu_state_backup_acceptance_restore_receipt | regex_findall('run_id=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        opentofu_state_backup_acceptance_restore_source_run_id: >-
          {{ opentofu_state_backup_acceptance_restore_receipt | regex_findall('source_run_id=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        opentofu_state_backup_acceptance_restore_source_timestamp: >-
          {{ opentofu_state_backup_acceptance_restore_receipt | regex_findall('source_timestamp=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        opentofu_state_backup_acceptance_backup_scope: >-
          {{ opentofu_state_backup_acceptance_backup_receipt | regex_findall('address_scope=(exact-(?:five|six))') | first | default('') }}
        opentofu_state_backup_acceptance_restore_scope: >-
          {{ opentofu_state_backup_acceptance_restore_receipt | regex_findall('address_scope=(exact-(?:five|six))') | first | default('') }}
      when:
        - opentofu_state_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Require exact full current-source-bound acceptance schema
      ansible.builtin.assert:
        that:
          - opentofu_state_backup_acceptance_backup_receipt is match(opentofu_state_backup_backup_receipt_pattern)
          - opentofu_state_backup_acceptance_restore_receipt is match(opentofu_state_backup_restore_receipt_pattern)
          - opentofu_state_backup_acceptance_backup_run_id is match('^20[0-9]{6}T[0-9]{6}Z$')
          - opentofu_state_backup_acceptance_restore_run_id is match('^20[0-9]{6}T[0-9]{6}Z$')
          - opentofu_state_backup_acceptance_restore_source_run_id == opentofu_state_backup_acceptance_backup_run_id
          - opentofu_state_backup_acceptance_restore_source_timestamp == opentofu_state_backup_acceptance_backup_run_id
          - opentofu_state_backup_acceptance_restore_run_id != opentofu_state_backup_acceptance_backup_run_id
          - opentofu_state_backup_acceptance_backup_scope in ['exact-five', 'exact-six']
          - opentofu_state_backup_acceptance_restore_scope == opentofu_state_backup_acceptance_backup_scope
          - opentofu_state_backup_acceptance_restore_receipt is search('checksum=verified')
          - opentofu_state_backup_acceptance_backup_receipt is search('readback=verified')
          - opentofu_state_backup_acceptance_restore_receipt is search('non_mutating=true$')
      when:
        - opentofu_state_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Enable and validate the accepted timer with rollback
      block:
        - name: Enable accepted timer
          ansible.builtin.systemd_service:
            name: cristexweb-opentofu-state-backup.timer
            enabled: true
            state: started
          when: opentofu_state_backup_mode == 'enable'
        - name: Verify timer active after enable
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-active, cristexweb-opentofu-state-backup.timer]
          register: opentofu_state_backup_enable_active
          changed_when: false
          check_mode: false
          when:
            - opentofu_state_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Verify timer enabled after enable
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-enabled, cristexweb-opentofu-state-backup.timer]
          register: opentofu_state_backup_enable_enabled
          changed_when: false
          check_mode: false
          when:
            - opentofu_state_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Require timer health after enable
          ansible.builtin.assert:
            that:
              - opentofu_state_backup_enable_active.rc == 0
              - opentofu_state_backup_enable_active.stdout == 'active'
              - opentofu_state_backup_enable_enabled.rc == 0
              - opentofu_state_backup_enable_enabled.stdout == 'enabled'
            fail_msg: Timer failed post-enable validation.
          when:
            - opentofu_state_backup_mode == 'enable'
            - not ansible_check_mode
      rescue:
        - name: Roll back timer after failed post-enable validation
          ansible.builtin.systemd_service:
            name: cristexweb-opentofu-state-backup.timer
            enabled: false
            state: stopped
          when:
            - opentofu_state_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Refuse timer acceptance after rollback
          ansible.builtin.fail:
            msg: Timer enablement rolled back after failed validation.
