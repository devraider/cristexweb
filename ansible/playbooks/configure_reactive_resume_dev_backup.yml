---
- name: Configure the guarded twice-daily Reactive Resume DEV backup scheduler
  hosts: crtxweb
  gather_facts: false
  become: true
  any_errors_fatal: true
  serial: 1
  strategy: reactive_resume_dev_backup_guarded_linear

  vars:
    reactive_resume_dev_backup_approved: false
    reactive_resume_dev_backup_mode: install
    reactive_resume_dev_backup_age_version: 1.2.1-1+b5
    reactive_resume_dev_backup_recipient_sha256: ce615905ec27fa6e085578d96e48dc798677b3f2ade5c417770f22e78248ad28
    reactive_resume_dev_backup_repository_root: "{{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_REPOSITORY_ROOT') | trim }}"
    reactive_resume_dev_backup_entrypoint_token: >-
      {{ lookup('ansible.builtin.env',
                'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_ENTRYPOINT_TOKEN') | trim }}
    reactive_resume_dev_backup_entrypoint_attestation: >-
      {{ lookup('ansible.builtin.env',
                'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_ENTRYPOINT_ATTESTATION_FILE') | trim }}
    reactive_resume_dev_backup_wrapper_sha256: 4d7f08bff393eeb822c0f3394298b268f78657c1c083be9208370fab813e1d0a
    reactive_resume_dev_backup_playbook_sha256: 8061c448f79cff21cf40960da83f09fc37083059c45c6e11a1bea019705a50e6
    reactive_resume_dev_backup_service: cristexweb-reactive-resume-dev-backup.service
    reactive_resume_dev_backup_timer: cristexweb-reactive-resume-dev-backup.timer
    reactive_resume_dev_backup_acceptance_directory: /var/lib/cristexweb-backup/reactive-resume/dev/acceptance
    reactive_resume_dev_backup_acceptance_max_age_seconds: 86400
    reactive_resume_dev_backup_journal_pattern: >-
      (?m)^(backup_status=success service=reactive-resume-dev
      run_id=20[0-9]{6}T[0-9]{6}Z database=reactive_resume_dev_successor
      object_bucket=reactive-resume-dev object_count=[1-9][0-9]*
      total_object_bytes=[1-9][0-9]* backup_duration_seconds=[0-9]+
      readback=verified encrypted=true private_residue=none)$

  pre_tasks:
    - name: Reject externally supplied backup internal variables
      ansible.builtin.assert:
        that: item not in vars
        fail_msg: "INTERNAL_VARIABLE_GUARD: refusing externally supplied backup internal variable {{ item }}."
      loop:
        - reactive_resume_dev_backup_internal_preflight_complete
        - reactive_resume_dev_backup_internal_preflight_binding
        - reactive_resume_dev_backup_entrypoint_attestation_state
        - reactive_resume_dev_backup_source_states
        - reactive_resume_dev_backup_input_states
        - reactive_resume_dev_backup_rclone_remotes
        - reactive_resume_dev_backup_acceptance_states
        - reactive_resume_dev_backup_acceptance_contents
        - reactive_resume_dev_backup_acceptance_now
        - reactive_resume_dev_backup_acceptance_backup
        - reactive_resume_dev_backup_acceptance_restore
        - reactive_resume_dev_backup_service_unit
        - reactive_resume_dev_backup_timer_unit
        - reactive_resume_dev_backup_test_start_epoch
        - reactive_resume_dev_backup_test_result
        - reactive_resume_dev_backup_test_status
        - reactive_resume_dev_backup_test_journal
        - reactive_resume_dev_backup_test_receipts
        - reactive_resume_dev_backup_test_receipt
        - reactive_resume_dev_backup_test_run_id
        - reactive_resume_dev_backup_test_epoch
        - reactive_resume_dev_backup_restore_result
        - reactive_resume_dev_backup_restore_failure_stage
        - reactive_resume_dev_backup_restore_source_run_id
        - reactive_resume_dev_backup_restore_epoch
        - reactive_resume_dev_backup_timer_active
        - reactive_resume_dev_backup_timer_enabled
      changed_when: false
      no_log: true

    - name: Require the canonical twice-daily backup contract
      ansible.builtin.assert:
        that:
          - reactive_resume_dev_backup_approved | bool
          - lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_ENTRYPOINT') == 'v1'
          - (ansible_limit | default('') | string) == 'crtxweb'
          - (ansible_play_hosts_all | length) == 1
          - inventory_hostname == 'crtxweb'
          - reactive_resume_dev_backup_mode in ['install', 'test', 'restore', 'enable']
          - reactive_resume_dev_backup_age_version == '1.2.1-1+b5'
          - reactive_resume_dev_backup_repository_root == '/home/paul/projects/cristexweb'
        fail_msg: Refusing backup scheduler execution outside the fixed guarded wrapper.
      changed_when: false
      no_log: true

    - name: Inspect the private single-run backup entrypoint attestation
      ansible.builtin.stat:
        path: '{{ reactive_resume_dev_backup_entrypoint_attestation }}'
        follow: false
      register: reactive_resume_dev_backup_entrypoint_attestation_state
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Require the private single-run backup entrypoint attestation
      ansible.builtin.assert:
        that:
          - reactive_resume_dev_backup_entrypoint_token is match('^[0-9a-f]{64}$')
          - reactive_resume_dev_backup_entrypoint_attestation_state.stat.exists | default(false)
          - reactive_resume_dev_backup_entrypoint_attestation_state.stat.isreg | default(false)
          - not (reactive_resume_dev_backup_entrypoint_attestation_state.stat.islnk | default(false))
          - reactive_resume_dev_backup_entrypoint_attestation_state.stat.pw_name == lookup('ansible.builtin.env', 'USER')
          - reactive_resume_dev_backup_entrypoint_attestation_state.stat.mode == '0600'
          - lookup('ansible.builtin.file', reactive_resume_dev_backup_entrypoint_attestation) == reactive_resume_dev_backup_entrypoint_token ~ ':entrypoint'
        fail_msg: Refusing backup scheduler execution without the wrapper-created single-run attestation.
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Inspect exact hash-bound backup source closure
      ansible.builtin.stat:
        path: '{{ reactive_resume_dev_backup_repository_root }}/{{ item.path }}'
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - path: ansible/bin/configure-reactive-resume-dev-backup
          mode: '0755'
          sha256: 48758d5442d4d41accacabdad1ef9e574bd306f02cedef570b2d8e02cde71316
        - path: ansible/ansible.cfg
          mode: '0644'
          sha256: 4e39dec40f1f0a0735e7f27e35f464093de3b16e8be1e5fa05299005528a85d9
        - path: ansible/plugins/strategy/reactive_resume_dev_backup_guarded_linear.py
          mode: '0644'
          sha256: 2878e72b0783deefcdb2fad49e518ff8b864d476d4ff6fa836c1a00fc17608e6
        - path: ansible/plugins/action/reactive_resume_dev_backup_entrypoint_guarded.py
          mode: '0644'
          sha256: bfac8efaefe0bb27042f31156bb677cbb9ddd78441ea7ce76426cc5c378151ab
        - path: ansible/files/backup/reactive-resume-dev-backup
          mode: '0755'
          sha256: b92f0696f70550c14661a2e6cd0c899f4349ac4d0c6da0cc95ebc192a8e846b1
        - path: ansible/files/backup/restore-reactive-resume-dev-backup-rehearsal
          mode: '0755'
          sha256: 23bb8842a5d609f15a64f011c69665b7a6b330bfcce34ee2dacc58af0b60a5a6
        - path: ansible/files/backup/cristexweb-reactive-resume-dev-backup.service
          mode: '0644'
          sha256: cd1a1cf09646d6675ebdefba085735755c00e229f1a21ae1d2a5ab2c196dbae2
        - path: ansible/files/backup/cristexweb-reactive-resume-dev-backup.timer
          mode: '0644'
          sha256: c0b4d246b523e46a375e55eb0aa4bb70d344b9a7a1c4a5f5e1c05e37ac315461
        - path: ansible/files/backup/reactive-resume-dev-backup-networkpolicy.yaml
          mode: '0644'
          sha256: 7469f12bbbfa80e4b53b3d04eed58d67694cb5bc304060095629e7a009f270d2
      register: reactive_resume_dev_backup_source_states
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Require exact hash-bound backup source closure
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'paul'
          - item.stat.mode == item.item.mode
          - item.stat.checksum == item.item.sha256
        fail_msg: Refusing missing, mode-drifted, symlinked, or hash-drifted backup source.
      loop: '{{ reactive_resume_dev_backup_source_states.results }}'
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Verify the pinned age package
      ansible.builtin.assert:
        that:
          - "'age' in ansible_facts.packages"
          - (ansible_facts.packages.age | length) == 1
          - ansible_facts.packages.age[0].version == reactive_resume_dev_backup_age_version
          - ansible_facts.packages.age[0].arch == 'amd64'
        fail_msg: Refusing an absent or drifted age package.
      changed_when: false

    - name: Inspect protected host backup inputs
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - /usr/local/bin/rclone
        - /opt/rclone/1.71.1/rclone
        - /home/paul/.config/rclone/rclone.conf
        - /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
        - /etc/rancher/k3s/k3s.yaml
      register: reactive_resume_dev_backup_input_states

    - name: Verify protected host backup input metadata
      ansible.builtin.assert:
        that:
          - reactive_resume_dev_backup_input_states.results[0].stat.islnk | default(false)
          - reactive_resume_dev_backup_input_states.results[0].stat.lnk_source == '/opt/rclone/1.71.1/rclone'
          - reactive_resume_dev_backup_input_states.results[0].stat.pw_name == 'root'
          - reactive_resume_dev_backup_input_states.results[1].stat.isreg | default(false)
          - not (reactive_resume_dev_backup_input_states.results[1].stat.islnk | default(false))
          - reactive_resume_dev_backup_input_states.results[1].stat.pw_name == 'root'
          - reactive_resume_dev_backup_input_states.results[1].stat.mode == '0755'
          - reactive_resume_dev_backup_input_states.results[2].stat.isreg | default(false)
          - not (reactive_resume_dev_backup_input_states.results[2].stat.islnk | default(false))
          - reactive_resume_dev_backup_input_states.results[2].stat.pw_name == 'paul'
          - reactive_resume_dev_backup_input_states.results[2].stat.mode == '0600'
          - reactive_resume_dev_backup_input_states.results[3].stat.isreg | default(false)
          - not (reactive_resume_dev_backup_input_states.results[3].stat.islnk | default(false))
          - reactive_resume_dev_backup_input_states.results[3].stat.pw_name == 'paul'
          - reactive_resume_dev_backup_input_states.results[3].stat.mode == '0644'
          - reactive_resume_dev_backup_input_states.results[3].stat.checksum == reactive_resume_dev_backup_recipient_sha256
          - reactive_resume_dev_backup_input_states.results[4].stat.isreg | default(false)
          - reactive_resume_dev_backup_input_states.results[4].stat.gr_name == 'k3s-admin'
          - reactive_resume_dev_backup_input_states.results[4].stat.mode == '0640'
        fail_msg: Refusing unsafe rclone, recipient, or kubeconfig metadata.
      changed_when: false
      no_log: true

    - name: Verify the sole configured rclone remote without reading its token
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rclone
          - --config
          - /home/paul/.config/rclone/rclone.conf
          - listremotes
          - --long
      become: false
      register: reactive_resume_dev_backup_rclone_remotes
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the exact Google Drive remote
      ansible.builtin.assert:
        that:
          - "reactive_resume_dev_backup_rclone_remotes.stdout_lines | map('trim') | list == ['drive: drive']"
        fail_msg: Refusing a host rclone configuration outside the exact drive remote.
      changed_when: false
      no_log: true

    - name: Inspect machine acceptance evidence before timer enablement
      ansible.builtin.stat:
        path: "{{ reactive_resume_dev_backup_acceptance_directory }}/{{ item }}"
        follow: false
      loop:
        - backup-test.json
        - restore.json
      register: reactive_resume_dev_backup_acceptance_states
      changed_when: false
      when: reactive_resume_dev_backup_mode == 'enable'
      no_log: true

    - name: Require root-owned machine acceptance evidence files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == '0600'
        fail_msg: Refusing timer enablement without exact root-owned acceptance evidence.
      loop: "{{ reactive_resume_dev_backup_acceptance_states.results | default([]) }}"
      changed_when: false
      when: reactive_resume_dev_backup_mode == 'enable'
      no_log: true

    - name: Read machine acceptance evidence without output
      ansible.builtin.slurp:
        src: "{{ reactive_resume_dev_backup_acceptance_directory }}/{{ item }}"
      loop:
        - backup-test.json
        - restore.json
      register: reactive_resume_dev_backup_acceptance_contents
      failed_when: false
      changed_when: false
      when: reactive_resume_dev_backup_mode == 'enable'
      no_log: true

    - name: Read current epoch for acceptance freshness
      ansible.builtin.command:
        argv: [/usr/bin/date, +%s]
      register: reactive_resume_dev_backup_acceptance_now
      changed_when: false
      check_mode: false
      when: reactive_resume_dev_backup_mode == 'enable'
      no_log: true

    - name: Parse machine acceptance evidence
      ansible.builtin.set_fact:
        reactive_resume_dev_backup_acceptance_backup: "{{ (reactive_resume_dev_backup_acceptance_contents.results[0].content | b64decode | from_json) }}"
        reactive_resume_dev_backup_acceptance_restore: "{{ (reactive_resume_dev_backup_acceptance_contents.results[1].content | b64decode | from_json) }}"
      when: reactive_resume_dev_backup_mode == 'enable'
      no_log: true

    - name: Require successful current backup and restore evidence
      ansible.builtin.assert:
        that:
          - reactive_resume_dev_backup_acceptance_backup.kind == 'reactive-resume-dev-backup-test'
          - reactive_resume_dev_backup_acceptance_backup.status == 'success'
          - reactive_resume_dev_backup_acceptance_backup.run_id is match('^20[0-9]{6}T[0-9]{6}Z$')
          - reactive_resume_dev_backup_acceptance_backup.receipt is match(reactive_resume_dev_backup_journal_pattern)
          - reactive_resume_dev_backup_acceptance_restore.kind == 'reactive-resume-dev-restore'
          - reactive_resume_dev_backup_acceptance_restore.status == 'success'
          - reactive_resume_dev_backup_acceptance_backup.completed_epoch is integer
          - reactive_resume_dev_backup_acceptance_restore.completed_epoch is integer
          - reactive_resume_dev_backup_acceptance_restore.completed_epoch >= reactive_resume_dev_backup_acceptance_backup.completed_epoch
          - reactive_resume_dev_backup_acceptance_now.stdout | int >= reactive_resume_dev_backup_acceptance_backup.completed_epoch
          - reactive_resume_dev_backup_acceptance_now.stdout | int >= reactive_resume_dev_backup_acceptance_restore.completed_epoch
          - >-
            (reactive_resume_dev_backup_acceptance_now.stdout | int) -
            reactive_resume_dev_backup_acceptance_backup.completed_epoch <=
            reactive_resume_dev_backup_acceptance_max_age_seconds
          - >-
            (reactive_resume_dev_backup_acceptance_now.stdout | int) -
            reactive_resume_dev_backup_acceptance_restore.completed_epoch <=
            reactive_resume_dev_backup_acceptance_max_age_seconds
          - reactive_resume_dev_backup_acceptance_restore.source_run_id is match('^20[0-9]{6}T[0-9]{6}Z$')
          - reactive_resume_dev_backup_acceptance_restore.source_run_id == reactive_resume_dev_backup_acceptance_backup.run_id
        fail_msg: Refusing timer enablement without fresh successful backup and restore evidence.
      changed_when: false
      when: reactive_resume_dev_backup_mode == 'enable'
      no_log: true

    - name: Bind the canonical guarded backup preflight
      ansible.builtin.set_fact:
        reactive_resume_dev_backup_internal_preflight_binding:
          schema: 1
          task_source: ansible/playbooks/configure_reactive_resume_dev_backup.yml
          task_name: Mark the complete guarded backup preflight
          task_action: reactive_resume_dev_backup_entrypoint_guarded
          source_register: reactive_resume_dev_backup_source_states
          source_result_count: 9
          source_contract_sha256: b3df87b0dc31907f18aa614f4ee0171f0eeef040094ab9eba4d7007ec2e8a89e
          no_apply_path: true
      changed_when: false
      no_log: true

    - name: Mark the complete guarded backup preflight
      reactive_resume_dev_backup_entrypoint_guarded: {}
      changed_when: false
      no_log: true

  tasks:
    - name: Execute backup operations only after the complete guarded preflight
      when: reactive_resume_dev_backup_internal_preflight_complete | default(false) | bool
      block:
        - name: Reconcile the exact backup helper ingress policy
          kubernetes.core.k8s:
            state: present
            kubeconfig: /etc/rancher/k3s/k3s.yaml
            src: "{{ reactive_resume_dev_backup_repository_root }}/ansible/files/backup/reactive-resume-dev-backup-networkpolicy.yaml"
            apply: false
            wait: true
            wait_timeout: 60
          become: false

        - name: Create protected backup directories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
          loop:
            - {path: /etc/cristexweb-backup, owner: root, group: paul, mode: '0750'}
            - {path: /usr/local/libexec/cristexweb, owner: root, group: root, mode: '0755'}
            - {path: /var/lib/cristexweb-backup, owner: paul, group: paul, mode: '0700'}
            - {path: /var/lib/cristexweb-backup/reactive-resume, owner: paul, group: paul, mode: '0700'}
            - {path: /var/lib/cristexweb-backup/reactive-resume/dev, owner: paul, group: paul, mode: '0700'}
            - {path: /var/lib/cristexweb-backup/reactive-resume/dev/acceptance, owner: root, group: root, mode: '0700'}

        - name: Install the public age recipient
          ansible.builtin.copy:
            src: /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
            dest: /etc/cristexweb-backup/age.recipient
            owner: root
            group: paul
            mode: '0640'

        - name: Install the combined logical and object backup executable
          ansible.builtin.copy:
            src: "{{ reactive_resume_dev_backup_repository_root }}/ansible/files/backup/reactive-resume-dev-backup"
            dest: /usr/local/libexec/cristexweb/reactive-resume-dev-backup
            owner: root
            group: root
            mode: '0755'

        - name: Install the isolated combined restore executable
          ansible.builtin.copy:
            src: "{{ reactive_resume_dev_backup_repository_root }}/ansible/files/backup/restore-reactive-resume-dev-backup-rehearsal"
            dest: /usr/local/libexec/cristexweb/restore-reactive-resume-dev-backup-rehearsal
            owner: root
            group: root
            mode: '0755'

        - name: Install the twice-daily systemd service unit
          ansible.builtin.copy:
            src: "{{ reactive_resume_dev_backup_repository_root }}/ansible/files/backup/cristexweb-reactive-resume-dev-backup.service"
            dest: /etc/systemd/system/cristexweb-reactive-resume-dev-backup.service
            owner: root
            group: root
            mode: '0644'
          register: reactive_resume_dev_backup_service_unit

        - name: Install the twice-daily systemd timer unit
          ansible.builtin.copy:
            src: "{{ reactive_resume_dev_backup_repository_root }}/ansible/files/backup/cristexweb-reactive-resume-dev-backup.timer"
            dest: /etc/systemd/system/cristexweb-reactive-resume-dev-backup.timer
            owner: root
            group: root
            mode: '0644'
          register: reactive_resume_dev_backup_timer_unit

        - name: Reload systemd for installed units
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: reactive_resume_dev_backup_service_unit.changed or reactive_resume_dev_backup_timer_unit.changed

        - name: Keep the twice-daily timer disabled until restore acceptance
          ansible.builtin.systemd_service:
            name: "{{ reactive_resume_dev_backup_timer }}"
            enabled: false
            state: stopped
          when:
            - reactive_resume_dev_backup_mode in ['install', 'test', 'restore']
            - not ansible_check_mode or not reactive_resume_dev_backup_timer_unit.changed

        - name: Read one-time backup start epoch
          ansible.builtin.command:
            argv: [/usr/bin/date, +%s]
          register: reactive_resume_dev_backup_test_start_epoch
          changed_when: false
          check_mode: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Execute the separately approved one-time combined backup test
          ansible.builtin.systemd_service:
            name: "{{ reactive_resume_dev_backup_service }}"
            state: started
          register: reactive_resume_dev_backup_test_result
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode

        - name: Verify the one-time backup service completed successfully
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - show
              - "{{ reactive_resume_dev_backup_service }}"
              - --property=ExecMainCode
              - --property=ExecMainStatus
              - --property=Result
          register: reactive_resume_dev_backup_test_status
          changed_when: false
          check_mode: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Require successful one-time backup service evidence
          ansible.builtin.assert:
            that:
              - reactive_resume_dev_backup_test_status.stdout is search('(?m)^ExecMainCode=exited$')
              - reactive_resume_dev_backup_test_status.stdout is search('(?m)^ExecMainStatus=0$')
              - reactive_resume_dev_backup_test_status.stdout is search('(?m)^Result=success$')
            fail_msg: The one-time backup service did not complete successfully.
          changed_when: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Capture the exact sanitized successful backup journal receipt
          ansible.builtin.command:
            argv:
              - /usr/bin/journalctl
              - --unit
              - "{{ reactive_resume_dev_backup_service }}"
              - --since
              - "@{{ reactive_resume_dev_backup_test_start_epoch.stdout | int }}"
              - --output=cat
              - --no-pager
          register: reactive_resume_dev_backup_test_journal
          changed_when: false
          check_mode: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Parse the exact successful backup receipt without output
          ansible.builtin.set_fact:
            reactive_resume_dev_backup_test_receipts: >-
              {{ reactive_resume_dev_backup_test_journal.stdout
                 | regex_findall(reactive_resume_dev_backup_journal_pattern) }}
          changed_when: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Require exactly one current sanitized backup receipt
          ansible.builtin.assert:
            that:
              - reactive_resume_dev_backup_test_receipts | length == 1
            fail_msg: The current backup journal did not contain exactly one sanitized success receipt.
          changed_when: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Extract the successful backup run ID without output
          ansible.builtin.set_fact:
            reactive_resume_dev_backup_test_receipt: "{{ reactive_resume_dev_backup_test_receipts | first }}"
            reactive_resume_dev_backup_test_run_id: >-
              {{ (reactive_resume_dev_backup_test_receipts | first
                  | regex_findall('run_id=(20[0-9]{6}T[0-9]{6}Z)')) | first }}
          changed_when: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Read one-time backup evidence epoch
          ansible.builtin.command:
            argv: [/usr/bin/date, +%s]
          register: reactive_resume_dev_backup_test_epoch
          changed_when: false
          check_mode: false
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Record root-owned successful backup evidence
          ansible.builtin.copy:
            dest: "{{ reactive_resume_dev_backup_acceptance_directory }}/backup-test.json"
            content: >-
              {{ {'kind': 'reactive-resume-dev-backup-test', 'status': 'success',
                  'completed_epoch': (reactive_resume_dev_backup_test_epoch.stdout | int),
                  'run_id': reactive_resume_dev_backup_test_run_id,
                  'receipt': reactive_resume_dev_backup_test_receipt} | to_json }}
            owner: root
            group: root
            mode: '0600'
          when:
            - reactive_resume_dev_backup_mode == 'test'
            - not ansible_check_mode
          no_log: true

        - name: Execute the separately approved isolated combined restore rehearsal
          ansible.builtin.command:
            argv:
              - /usr/local/libexec/cristexweb/restore-reactive-resume-dev-backup-rehearsal
              - restore
          become: false
          environment:
            CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_ENTRYPOINT: >-
              {{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_ENTRYPOINT') }}
            CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_APPROVED: >-
              {{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_APPROVED') }}
            CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_ATTESTATION_FILE: >-
              {{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_ATTESTATION_FILE') }}
            CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_TOKEN: >-
              {{ lookup('ansible.builtin.env', 'CRISTEXWEB_REACTIVE_RESUME_DEV_BACKUP_RESTORE_TOKEN') }}
          register: reactive_resume_dev_backup_restore_result
          changed_when: true
          failed_when: false
          no_log: true
          when:
            - reactive_resume_dev_backup_mode == 'restore'
            - not ansible_check_mode

        - name: Extract only the allowlisted restore failure stage
          ansible.builtin.set_fact:
            reactive_resume_dev_backup_restore_failure_stage: >-
              {{ (reactive_resume_dev_backup_restore_result.stderr
                  | regex_findall('restore_status=failed stage=([a-z0-9_-]+)')
                  | last) | default('unclassified', true) }}
          no_log: true
          when:
            - reactive_resume_dev_backup_mode == 'restore'
            - not ansible_check_mode
            - reactive_resume_dev_backup_restore_result.rc != 0

        - name: Report the sanitized restore failure stage
          ansible.builtin.fail:
            msg: "Restore rehearsal failed at sanitized stage: {{ reactive_resume_dev_backup_restore_failure_stage }}"
          when:
            - reactive_resume_dev_backup_mode == 'restore'
            - not ansible_check_mode
            - reactive_resume_dev_backup_restore_result.rc != 0

        - name: Require the sanitized successful combined restore receipt
          ansible.builtin.assert:
            that:
              - >-
                reactive_resume_dev_backup_restore_result.stdout is match(
                '^restore_status=success source_run_id=20[0-9]{6}T[0-9]{6}Z '
                ~ 'backup_duration_seconds=[0-9]+ restore_duration_seconds=[0-9]+ rpo_seconds=[0-9]+ '
                ~ 'postgres_catalog_table_count=[0-9]+ object_count=[1-9][0-9]* object_bytes=[1-9][0-9]* '
                ~ 'checksum=verified target=isolated-emptydir-postgresql-and-seaweedfs private_residue=none$')
            fail_msg: The combined isolated restore rehearsal did not produce the exact sanitized success receipt.
          changed_when: false
          when:
            - reactive_resume_dev_backup_mode == 'restore'
            - not ansible_check_mode

        - name: Extract the successful restore source run ID
          ansible.builtin.set_fact:
            reactive_resume_dev_backup_restore_source_run_id: >-
              {{ reactive_resume_dev_backup_restore_result.stdout
                 | regex_findall('source_run_id=(20[0-9]{6}T[0-9]{6}Z)') | first }}
          when:
            - reactive_resume_dev_backup_mode == 'restore'
            - not ansible_check_mode
          no_log: true

        - name: Read successful restore evidence epoch
          ansible.builtin.command:
            argv: [/usr/bin/date, +%s]
          register: reactive_resume_dev_backup_restore_epoch
          changed_when: false
          check_mode: false
          when:
            - reactive_resume_dev_backup_mode == 'restore'
            - not ansible_check_mode
          no_log: true

        - name: Record root-owned successful restore evidence
          ansible.builtin.copy:
            dest: "{{ reactive_resume_dev_backup_acceptance_directory }}/restore.json"
            content: >-
              {"kind":"reactive-resume-dev-restore","status":"success",
              "completed_epoch":{{ reactive_resume_dev_backup_restore_epoch.stdout | int }},
              "source_run_id":"{{ reactive_resume_dev_backup_restore_source_run_id }}"}
            owner: root
            group: root
            mode: '0600'
          when:
            - reactive_resume_dev_backup_mode == 'restore'
            - not ansible_check_mode
          no_log: true

        - name: Enable the accepted twice-daily timer
          ansible.builtin.systemd_service:
            name: "{{ reactive_resume_dev_backup_timer }}"
            enabled: true
            state: started
          when:
            - reactive_resume_dev_backup_mode == 'enable'
            - not ansible_check_mode or not reactive_resume_dev_backup_timer_unit.changed

  post_tasks:
    - name: Execute backup post-checks only after the complete guarded preflight
      when: reactive_resume_dev_backup_internal_preflight_complete | default(false) | bool
      block:
        - name: Collect final service facts
          ansible.builtin.service_facts:

        - name: Inspect final timer active state
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-active, "{{ reactive_resume_dev_backup_timer }}"]
          become: false
          register: reactive_resume_dev_backup_timer_active
          changed_when: false
          check_mode: false
          failed_when: false
          when:
            - reactive_resume_dev_backup_mode == 'enable'
            - not ansible_check_mode

        - name: Inspect final timer enabled state
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-enabled, "{{ reactive_resume_dev_backup_timer }}"]
          become: false
          register: reactive_resume_dev_backup_timer_enabled
          changed_when: false
          check_mode: false
          failed_when: false
          when:
            - reactive_resume_dev_backup_mode == 'enable'
            - not ansible_check_mode

        - name: Verify critical services and requested timer state
          ansible.builtin.assert:
            that:
              - ansible_facts.services['k3s.service'].state == 'running'
              - ansible_facts.services['tailscaled.service'].state == 'running'
              - >-
                ansible_check_mode or reactive_resume_dev_backup_mode != 'enable' or
                (reactive_resume_dev_backup_timer_active.rc == 0 and
                 reactive_resume_dev_backup_timer_active.stdout == 'active' and
                 reactive_resume_dev_backup_timer_enabled.rc == 0 and
                 reactive_resume_dev_backup_timer_enabled.stdout == 'enabled')
            fail_msg: Refusing acceptance because service health or timer state is wrong.
          changed_when: false
