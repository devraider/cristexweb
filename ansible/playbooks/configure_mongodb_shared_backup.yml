---
- name: Configure the guarded shared MongoDB backup scheduler
  hosts: crtxweb
  gather_facts: false
  become: true
  any_errors_fatal: true
  serial: 1

  vars:
    mongodb_shared_backup_approved: false
    mongodb_shared_backup_mode: install
    mongodb_shared_backup_age_version: 1.2.1-1+b5
    mongodb_shared_backup_recipient_sha256: ce615905ec27fa6e085578d96e48dc798677b3f2ade5c417770f22e78248ad28
    mongodb_shared_backup_repository_root: "{{ playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname }}"
    mongodb_shared_backup_source_closure_sha256: 0854e224017e74debe7ff123f3d5fe0b134a5ec10b17a322f9ece6b6d5e9bc69

  pre_tasks:
    - name: Require the canonical backup scheduler contract
      ansible.builtin.assert:
        that:
          - mongodb_shared_backup_approved | bool
          - lookup('ansible.builtin.env', 'CRISTEXWEB_MONGODB_SHARED_BACKUP_ENTRYPOINT') == 'v1'
          - (ansible_limit | default('') | string) == 'crtxweb'
          - (ansible_play_hosts_all | length) == 1
          - inventory_hostname == 'crtxweb'
          - mongodb_shared_backup_mode in ['install', 'test', 'restore', 'enable']
          - mongodb_shared_backup_age_version == '1.2.1-1+b5'
        fail_msg: Refusing backup scheduler execution outside the canonical bounded wrapper.
      changed_when: false

    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Verify the pinned age package
      ansible.builtin.assert:
        that:
          - "'age' in ansible_facts.packages"
          - (ansible_facts.packages.age | length) == 1
          - ansible_facts.packages.age[0].version == mongodb_shared_backup_age_version
          - ansible_facts.packages.age[0].arch == 'amd64'
        fail_msg: Refusing an absent or drifted age package.
      changed_when: false

    - name: Inspect protected host backup inputs
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - /usr/local/bin/rclone
        - /opt/rclone/1.71.1/rclone
        - /home/paul/.config/rclone/rclone.conf
        - /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
        - /etc/rancher/k3s/k3s.yaml
      register: mongodb_shared_backup_input_states

    - name: Verify protected host backup input metadata
      ansible.builtin.assert:
        that:
          - mongodb_shared_backup_input_states.results[0].stat.islnk | default(false)
          - mongodb_shared_backup_input_states.results[0].stat.lnk_source == '/opt/rclone/1.71.1/rclone'
          - mongodb_shared_backup_input_states.results[0].stat.pw_name == 'root'
          - mongodb_shared_backup_input_states.results[1].stat.isreg | default(false)
          - not (mongodb_shared_backup_input_states.results[1].stat.islnk | default(false))
          - mongodb_shared_backup_input_states.results[1].stat.pw_name == 'root'
          - mongodb_shared_backup_input_states.results[1].stat.mode == '0755'
          - mongodb_shared_backup_input_states.results[2].stat.isreg | default(false)
          - not (mongodb_shared_backup_input_states.results[2].stat.islnk | default(false))
          - mongodb_shared_backup_input_states.results[2].stat.pw_name == 'paul'
          - mongodb_shared_backup_input_states.results[2].stat.mode == '0600'
          - mongodb_shared_backup_input_states.results[3].stat.isreg | default(false)
          - not (mongodb_shared_backup_input_states.results[3].stat.islnk | default(false))
          - mongodb_shared_backup_input_states.results[3].stat.pw_name == 'paul'
          - mongodb_shared_backup_input_states.results[3].stat.mode == '0644'
          - mongodb_shared_backup_input_states.results[3].stat.checksum == mongodb_shared_backup_recipient_sha256
          - mongodb_shared_backup_input_states.results[4].stat.isreg | default(false)
          - mongodb_shared_backup_input_states.results[4].stat.gr_name == 'k3s-admin'
          - mongodb_shared_backup_input_states.results[4].stat.mode == '0640'
        fail_msg: Refusing unsafe rclone, recipient, or kubeconfig metadata.
      changed_when: false

    - name: Verify the sole configured rclone remote without reading its token
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rclone
          - --config
          - /home/paul/.config/rclone/rclone.conf
          - listremotes
      become: false
      register: mongodb_shared_backup_rclone_remotes
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the exact Google Drive remote
      ansible.builtin.assert:
        that:
          - mongodb_shared_backup_rclone_remotes.stdout_lines == ['drive:']
        fail_msg: Refusing a host rclone configuration outside the exact drive remote.
      changed_when: false

  tasks:
    - name: Create protected backup directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/cristexweb-backup, owner: root, group: paul, mode: '0750'}
        - {path: /usr/local/libexec/cristexweb, owner: root, group: root, mode: '0755'}
        - {path: /var/lib/cristexweb-backup, owner: paul, group: paul, mode: '0700'}
        - {path: /var/lib/cristexweb-backup/mongodb, owner: paul, group: paul, mode: '0700'}
        - {path: /var/lib/cristexweb-backup/mongodb/shared-mongodb, owner: paul, group: paul, mode: '0700'}

    - name: Install the public age recipient
      ansible.builtin.copy:
        src: /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
        dest: /etc/cristexweb-backup/age.recipient
        owner: root
        group: paul
        mode: '0640'

    - name: Install the guarded backup executable
      ansible.builtin.copy:
        src: "{{ mongodb_shared_backup_repository_root }}/ansible/files/backup/mongodb-shared-backup"
        dest: /usr/local/libexec/cristexweb/mongodb-shared-backup
        owner: root
        group: root
        mode: '0755'

    - name: Install the isolated restore rehearsal executable
      ansible.builtin.copy:
        src: "{{ mongodb_shared_backup_repository_root }}/ansible/files/backup/restore-mongodb-shared-rehearsal"
        dest: /usr/local/libexec/cristexweb/restore-mongodb-shared-rehearsal
        owner: root
        group: root
        mode: '0755'

    - name: Install the systemd service unit
      ansible.builtin.copy:
        src: "{{ mongodb_shared_backup_repository_root }}/ansible/files/backup/cristexweb-mongodb-shared-backup.service"
        dest: /etc/systemd/system/cristexweb-mongodb-shared-backup.service
        owner: root
        group: root
        mode: '0644'
      register: mongodb_shared_backup_service_unit

    - name: Install the systemd timer unit
      ansible.builtin.copy:
        src: "{{ mongodb_shared_backup_repository_root }}/ansible/files/backup/cristexweb-mongodb-shared-backup.timer"
        dest: /etc/systemd/system/cristexweb-mongodb-shared-backup.timer
        owner: root
        group: root
        mode: '0644'
      register: mongodb_shared_backup_timer_unit

    - name: Reload systemd for installed units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when:
        - mongodb_shared_backup_service_unit.changed or mongodb_shared_backup_timer_unit.changed

    - name: Keep the timer disabled until restore acceptance
      ansible.builtin.systemd_service:
        name: cristexweb-mongodb-shared-backup.timer
        enabled: false
        state: stopped
      when:
        - mongodb_shared_backup_mode in ['install', 'test', 'restore']
        - not ansible_check_mode

    - name: Execute the separately approved one-time backup test
      ansible.builtin.systemd_service:
        name: cristexweb-mongodb-shared-backup.service
        state: started
      when:
        - mongodb_shared_backup_mode == 'test'
        - not ansible_check_mode

    - name: Execute the separately approved isolated restore rehearsal
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --preserve-status
          - 3600
          - /usr/local/libexec/cristexweb/restore-mongodb-shared-rehearsal
      become: false
      register: mongodb_shared_backup_restore_result
      changed_when: true
      when:
        - mongodb_shared_backup_mode == 'restore'
        - not ansible_check_mode

    - name: Require the sanitized successful restore receipt
      ansible.builtin.assert:
        that:
          - >-
            mongodb_shared_backup_restore_result.stdout is match(
            '^restore_status=success schema=1 source_timestamp=20[0-9]{6}T[0-9]{6}Z '
            ~ 'source_closure_sha256=' ~ mongodb_shared_backup_source_closure_sha256 ~ ' '
            ~ 'target=isolated-emptydir application_database_count=[0-9]+ '
            ~ 'checksum=verified private_residue=none$')
        fail_msg: The isolated restore rehearsal did not produce the exact sanitized success receipt.
      changed_when: false
      when:
        - mongodb_shared_backup_mode == 'restore'
        - not ansible_check_mode

    - name: Inspect persisted fresh backup and restore acceptance evidence
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /var/lib/cristexweb-backup/acceptance/mongodb/shared-mongodb/backup.receipt
        - /var/lib/cristexweb-backup/acceptance/mongodb/shared-mongodb/restore.receipt
      register: mongodb_shared_backup_acceptance_states
      when:
        - mongodb_shared_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Capture acceptance freshness reference epoch
      ansible.builtin.command:
        argv: [/usr/bin/date, +%s]
      register: mongodb_shared_backup_acceptance_now
      check_mode: false
      changed_when: false
      when:
        - mongodb_shared_backup_mode == 'enable'
      no_log: true

    - name: Require persisted fresh matching backup and restore acceptance evidence
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
          - item.stat.mtime is defined
          - item.stat.mtime | int > (mongodb_shared_backup_acceptance_now.stdout | int - 86400)
      loop: "{{ mongodb_shared_backup_acceptance_states.results | default([]) }}"
      when:
        - mongodb_shared_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Read persisted acceptance receipts
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/lib/cristexweb-backup/acceptance/mongodb/shared-mongodb/backup.receipt
        - /var/lib/cristexweb-backup/acceptance/mongodb/shared-mongodb/restore.receipt
      register: mongodb_shared_backup_acceptance_contents
      when:
        - mongodb_shared_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Parse exact persisted acceptance identities without output
      ansible.builtin.set_fact:
        mongodb_shared_backup_acceptance_backup_receipt: "{{ mongodb_shared_backup_acceptance_contents.results[0].content | b64decode }}"
        mongodb_shared_backup_acceptance_restore_receipt: "{{ mongodb_shared_backup_acceptance_contents.results[1].content | b64decode }}"
        mongodb_shared_backup_acceptance_backup_timestamp: >-
          {{ mongodb_shared_backup_acceptance_contents.results[0].content | b64decode |
          regex_findall('timestamp=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        mongodb_shared_backup_acceptance_restore_source_timestamp: >-
          {{ mongodb_shared_backup_acceptance_contents.results[1].content | b64decode |
          regex_findall('source_timestamp=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        mongodb_shared_backup_acceptance_backup_schema: >-
          {{ mongodb_shared_backup_acceptance_contents.results[0].content | b64decode |
          regex_findall('schema=([0-9]+)') | first | default('') }}
        mongodb_shared_backup_acceptance_restore_schema: >-
          {{ mongodb_shared_backup_acceptance_contents.results[1].content | b64decode |
          regex_findall('schema=([0-9]+)') | first | default('') }}
        mongodb_shared_backup_acceptance_backup_closure: >-
          {{ mongodb_shared_backup_acceptance_contents.results[0].content | b64decode |
          regex_findall('source_closure_sha256=([0-9a-f]{64})') | first | default('') }}
        mongodb_shared_backup_acceptance_restore_closure: >-
          {{ mongodb_shared_backup_acceptance_contents.results[1].content | b64decode |
          regex_findall('source_closure_sha256=([0-9a-f]{64})') | first | default('') }}
      when:
        - mongodb_shared_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Require exact current-source-bound acceptance receipts
      ansible.builtin.assert:
        that:
          - >-
            mongodb_shared_backup_acceptance_backup_receipt is match(
            '^backup_status=success schema=1 service=mongodb purpose=shared-mongodb '
            ~ 'timestamp=20[0-9]{6}T[0-9]{6}Z archive_bytes=[1-9][0-9]* '
            ~ 'duration_seconds=[0-9]+ readback=verified consistency=oplog '
            ~ 'private_residue=none source_closure_sha256=' ~ mongodb_shared_backup_source_closure_sha256 ~ '$')
          - >-
            mongodb_shared_backup_acceptance_restore_receipt is match(
            '^restore_status=success schema=1 source_timestamp=20[0-9]{6}T[0-9]{6}Z '
            ~ 'source_closure_sha256=' ~ mongodb_shared_backup_source_closure_sha256 ~ ' '
            ~ 'target=isolated-emptydir application_database_count=[0-9]+ '
            ~ 'checksum=verified private_residue=none$')
          - mongodb_shared_backup_acceptance_backup_timestamp | length == 16
          - mongodb_shared_backup_acceptance_restore_source_timestamp | length == 16
          - mongodb_shared_backup_acceptance_backup_timestamp == mongodb_shared_backup_acceptance_restore_source_timestamp
          - mongodb_shared_backup_acceptance_backup_schema == '1'
          - mongodb_shared_backup_acceptance_restore_schema == '1'
          - mongodb_shared_backup_acceptance_backup_closure == mongodb_shared_backup_source_closure_sha256
          - mongodb_shared_backup_acceptance_restore_closure == mongodb_shared_backup_source_closure_sha256
      when:
        - mongodb_shared_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Enable and validate the accepted timer with rollback
      block:
        - name: Enable the accepted daily timer
          ansible.builtin.systemd_service:
            name: cristexweb-mongodb-shared-backup.timer
            enabled: true
            state: started
          when: mongodb_shared_backup_mode == 'enable'
        - name: Verify timer active after enable
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-active, cristexweb-mongodb-shared-backup.timer]
          register: mongodb_shared_backup_enable_active
          changed_when: false
          check_mode: false
          when:
            - mongodb_shared_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Verify timer enabled after enable
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-enabled, cristexweb-mongodb-shared-backup.timer]
          register: mongodb_shared_backup_enable_enabled
          changed_when: false
          check_mode: false
          when:
            - mongodb_shared_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Require timer health after enable
          ansible.builtin.assert:
            that:
              - mongodb_shared_backup_enable_active.rc == 0
              - mongodb_shared_backup_enable_active.stdout == 'active'
              - mongodb_shared_backup_enable_enabled.rc == 0
              - mongodb_shared_backup_enable_enabled.stdout == 'enabled'
            fail_msg: Timer failed post-enable validation.
          when:
            - mongodb_shared_backup_mode == 'enable'
            - not ansible_check_mode
      rescue:
        - name: Roll back timer after failed post-enable validation
          ansible.builtin.systemd_service:
            name: cristexweb-mongodb-shared-backup.timer
            enabled: false
            state: stopped
          when:
            - mongodb_shared_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Refuse timer acceptance after rollback
          ansible.builtin.fail:
            msg: Timer enablement rolled back after failed validation.

  post_tasks:
    - name: Collect final service facts
      ansible.builtin.service_facts:

    - name: Inspect final timer active state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - cristexweb-mongodb-shared-backup.timer
      become: false
      register: mongodb_shared_backup_timer_active
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - mongodb_shared_backup_mode == 'enable'
        - not ansible_check_mode

    - name: Inspect final timer enabled state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - cristexweb-mongodb-shared-backup.timer
      become: false
      register: mongodb_shared_backup_timer_enabled
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - mongodb_shared_backup_mode == 'enable'
        - not ansible_check_mode

    - name: Verify critical services and requested timer state
      ansible.builtin.assert:
        that:
          - ansible_facts.services['k3s.service'].state == 'running'
          - ansible_facts.services['tailscaled.service'].state == 'running'
          - >-
            ansible_check_mode or mongodb_shared_backup_mode != 'enable' or
            (mongodb_shared_backup_timer_active.rc == 0 and
             mongodb_shared_backup_timer_active.stdout == 'active' and
             mongodb_shared_backup_timer_enabled.rc == 0 and
             mongodb_shared_backup_timer_enabled.stdout == 'enabled')
        fail_msg: Refusing acceptance because service health or timer state is wrong.
      changed_when: false
