---
- name: Configure guarded RabbitMQ definitions backup scheduler
  hosts: crtxweb
  gather_facts: false
  become: true
  any_errors_fatal: true
  serial: 1
  vars:
    rabbitmq_definitions_backup_approved: false
    rabbitmq_definitions_backup_mode: install
    rabbitmq_definitions_backup_repository_root: "{{ playbook_dir | ansible.builtin.dirname | ansible.builtin.dirname }}"
    rabbitmq_definitions_backup_source_closure_sha256: 5adb0422abe0151f4bd18630f987d50908aa2c892c480e02401cecb902fbcf5c
  pre_tasks:
    - name: Require bounded RabbitMQ backup approval
      ansible.builtin.assert:
        that:
          - rabbitmq_definitions_backup_approved | bool
          - lookup('ansible.builtin.env', 'CRISTEXWEB_RABBITMQ_DEFINITIONS_BACKUP_ENTRYPOINT') == 'v1'
          - (ansible_limit | default('') | string) == 'crtxweb'
          - ansible_play_hosts_all | length == 1
          - rabbitmq_definitions_backup_mode in ['install', 'test', 'restore', 'enable']
        fail_msg: Refusing RabbitMQ backup outside the bounded wrapper.
      changed_when: false
    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: apt
    - name: Require pinned age
      ansible.builtin.assert:
        that:
          - ansible_facts.packages.age | default([]) | length == 1
          - ansible_facts.packages.age[0].version == '1.2.1-1+b5'
          - ansible_facts.packages.age[0].arch == 'amd64'
      changed_when: false
    - name: Check protected backup inputs
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /usr/local/bin/rclone
        - /home/paul/.config/rclone/rclone.conf
        - /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
      register: rabbitmq_backup_inputs
    - name: Require protected backup inputs
      ansible.builtin.assert:
        that:
          - rabbitmq_backup_inputs.results[0].stat.islnk | default(false)
          - rabbitmq_backup_inputs.results[1].stat.isreg | default(false)
          - rabbitmq_backup_inputs.results[1].stat.mode == '0600'
          - rabbitmq_backup_inputs.results[2].stat.isreg | default(false)
          - rabbitmq_backup_inputs.results[2].stat.mode == '0644'
      changed_when: false
  tasks:
    - name: Create protected RabbitMQ backup directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/cristexweb-backup, owner: root, group: paul, mode: '0750'}
        - {path: /usr/local/libexec/cristexweb, owner: root, group: root, mode: '0755'}
        - {path: /var/lib/cristexweb-backup, owner: paul, group: paul, mode: '0700'}
        - {path: /var/lib/cristexweb-backup/rabbitmq, owner: paul, group: paul, mode: '0700'}
        - {path: /var/lib/cristexweb-backup/rabbitmq/definitions, owner: paul, group: paul, mode: '0700'}
    - name: Install public age recipient
      ansible.builtin.copy:
        src: /home/paul/.config/cristexweb/backup/shared-database-backup.recipient
        dest: /etc/cristexweb-backup/age.recipient
        owner: root
        group: paul
        mode: '0640'
    - name: Install RabbitMQ backup and restore executables
      ansible.builtin.copy:
        src: "{{ rabbitmq_definitions_backup_repository_root }}/ansible/files/backup/{{ item.src }}"
        dest: "/usr/local/libexec/cristexweb/{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - {src: rabbitmq-shared-definitions-backup, dest: rabbitmq-shared-definitions-backup}
        - {src: restore-rabbitmq-definitions-rehearsal, dest: restore-rabbitmq-definitions-rehearsal}
    - name: Install RabbitMQ systemd units
      ansible.builtin.copy:
        src: "{{ rabbitmq_definitions_backup_repository_root }}/ansible/files/backup/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - cristexweb-rabbitmq-definitions-backup.service
        - cristexweb-rabbitmq-definitions-backup.timer
      register: rabbitmq_units
    - name: Reload systemd  # noqa no-handler
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: rabbitmq_units.changed
    - name: Keep timer disabled until restore acceptance
      ansible.builtin.systemd_service:
        name: cristexweb-rabbitmq-definitions-backup.timer
        enabled: false
        state: stopped
      when:
        - rabbitmq_definitions_backup_mode in ['install', 'test', 'restore']
        - not ansible_check_mode
    - name: Run approved RabbitMQ definitions backup test
      ansible.builtin.systemd_service:
        name: cristexweb-rabbitmq-definitions-backup.service
        state: started
      when:
        - rabbitmq_definitions_backup_mode == 'test'
        - not ansible_check_mode
    - name: Run approved isolated definitions restore
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --preserve-status
          - 3600
          - /usr/local/libexec/cristexweb/restore-rabbitmq-definitions-rehearsal
      become: false
      register: rabbitmq_restore_result
      changed_when: true
      when:
        - rabbitmq_definitions_backup_mode == 'restore'
        - not ansible_check_mode
    - name: Require sanitized restore receipt
      ansible.builtin.assert:
        that:
          - >-
            rabbitmq_restore_result.stdout is match(
            '^restore_status=success schema=1 source_timestamp=20[0-9]{6}T[0-9]{6}Z '
            ~ 'source_closure_sha256=' ~ rabbitmq_definitions_backup_source_closure_sha256 ~ ' '
            ~ 'target=isolated-emptydir checksum=verified private_residue=none '
            ~ 'definitions_only=true message_recovery=not_claimed$')
      changed_when: false
      when:
        - rabbitmq_definitions_backup_mode == 'restore'
        - not ansible_check_mode
    - name: Inspect persisted fresh backup and restore acceptance evidence
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /var/lib/cristexweb-backup/acceptance/rabbitmq/definitions/backup.receipt
        - /var/lib/cristexweb-backup/acceptance/rabbitmq/definitions/restore.receipt
      register: rabbitmq_definitions_backup_acceptance_states
      when:
        - rabbitmq_definitions_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Capture acceptance freshness reference epoch
      ansible.builtin.command:
        argv: [/usr/bin/date, +%s]
      register: rabbitmq_definitions_backup_acceptance_now
      check_mode: false
      changed_when: false
      when:
        - rabbitmq_definitions_backup_mode == 'enable'
      no_log: true

    - name: Require persisted fresh matching backup and restore acceptance evidence
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
          - item.stat.mtime is defined
          - item.stat.mtime | int > (rabbitmq_definitions_backup_acceptance_now.stdout | int - 86400)
      loop: "{{ rabbitmq_definitions_backup_acceptance_states.results | default([]) }}"
      when:
        - rabbitmq_definitions_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Read persisted acceptance receipts
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/lib/cristexweb-backup/acceptance/rabbitmq/definitions/backup.receipt
        - /var/lib/cristexweb-backup/acceptance/rabbitmq/definitions/restore.receipt
      register: rabbitmq_definitions_backup_acceptance_contents
      when:
        - rabbitmq_definitions_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Parse exact persisted acceptance identities without output
      ansible.builtin.set_fact:
        rabbitmq_definitions_backup_acceptance_backup_receipt: "{{ rabbitmq_definitions_backup_acceptance_contents.results[0].content | b64decode }}"
        rabbitmq_definitions_backup_acceptance_restore_receipt: "{{ rabbitmq_definitions_backup_acceptance_contents.results[1].content | b64decode }}"
        rabbitmq_definitions_backup_acceptance_backup_timestamp: >-
          {{ rabbitmq_definitions_backup_acceptance_contents.results[0].content | b64decode |
          regex_findall('timestamp=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        rabbitmq_definitions_backup_acceptance_restore_source_timestamp: >-
          {{ rabbitmq_definitions_backup_acceptance_contents.results[1].content | b64decode |
          regex_findall('source_timestamp=(20[0-9]{6}T[0-9]{6}Z)') | first | default('') }}
        rabbitmq_definitions_backup_acceptance_backup_schema: >-
          {{ rabbitmq_definitions_backup_acceptance_contents.results[0].content | b64decode |
          regex_findall('schema=([0-9]+)') | first | default('') }}
        rabbitmq_definitions_backup_acceptance_restore_schema: >-
          {{ rabbitmq_definitions_backup_acceptance_contents.results[1].content | b64decode |
          regex_findall('schema=([0-9]+)') | first | default('') }}
        rabbitmq_definitions_backup_acceptance_backup_closure: >-
          {{ rabbitmq_definitions_backup_acceptance_contents.results[0].content | b64decode |
          regex_findall('source_closure_sha256=([0-9a-f]{64})') | first | default('') }}
        rabbitmq_definitions_backup_acceptance_restore_closure: >-
          {{ rabbitmq_definitions_backup_acceptance_contents.results[1].content | b64decode |
          regex_findall('source_closure_sha256=([0-9a-f]{64})') | first | default('') }}
      when:
        - rabbitmq_definitions_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Require exact current-source-bound acceptance receipts
      ansible.builtin.assert:
        that:
          - >-
            rabbitmq_definitions_backup_acceptance_backup_receipt is match(
            '^backup_status=success schema=1 service=rabbitmq purpose=definitions '
            ~ 'timestamp=20[0-9]{6}T[0-9]{6}Z archive_bytes=[1-9][0-9]* '
            ~ 'duration_seconds=[0-9]+ readback=verified '
            ~ 'source_closure_sha256=' ~ rabbitmq_definitions_backup_source_closure_sha256 ~ '$')
          - >-
            rabbitmq_definitions_backup_acceptance_restore_receipt is match(
            '^restore_status=success schema=1 source_timestamp=20[0-9]{6}T[0-9]{6}Z '
            ~ 'source_closure_sha256=' ~ rabbitmq_definitions_backup_source_closure_sha256 ~ ' '
            ~ 'target=isolated-emptydir checksum=verified private_residue=none '
            ~ 'definitions_only=true message_recovery=not_claimed$')
          - rabbitmq_definitions_backup_acceptance_backup_timestamp | length == 16
          - rabbitmq_definitions_backup_acceptance_restore_source_timestamp | length == 16
          - rabbitmq_definitions_backup_acceptance_backup_timestamp == rabbitmq_definitions_backup_acceptance_restore_source_timestamp
          - rabbitmq_definitions_backup_acceptance_backup_schema == '1'
          - rabbitmq_definitions_backup_acceptance_restore_schema == '1'
          - rabbitmq_definitions_backup_acceptance_backup_closure == rabbitmq_definitions_backup_source_closure_sha256
          - rabbitmq_definitions_backup_acceptance_restore_closure == rabbitmq_definitions_backup_source_closure_sha256
      when:
        - rabbitmq_definitions_backup_mode == 'enable'
      changed_when: false
      no_log: true

    - name: Enable and validate the accepted timer with rollback
      block:
        - name: Enable accepted timer
          ansible.builtin.systemd_service:
            name: cristexweb-rabbitmq-definitions-backup.timer
            enabled: true
            state: started
          when: rabbitmq_definitions_backup_mode == 'enable'
        - name: Verify timer active after enable
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-active, cristexweb-rabbitmq-definitions-backup.timer]
          register: rabbitmq_definitions_backup_enable_active
          changed_when: false
          check_mode: false
          when:
            - rabbitmq_definitions_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Verify timer enabled after enable
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, is-enabled, cristexweb-rabbitmq-definitions-backup.timer]
          register: rabbitmq_definitions_backup_enable_enabled
          changed_when: false
          check_mode: false
          when:
            - rabbitmq_definitions_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Require timer health after enable
          ansible.builtin.assert:
            that:
              - rabbitmq_definitions_backup_enable_active.rc == 0
              - rabbitmq_definitions_backup_enable_active.stdout == 'active'
              - rabbitmq_definitions_backup_enable_enabled.rc == 0
              - rabbitmq_definitions_backup_enable_enabled.stdout == 'enabled'
            fail_msg: Timer failed post-enable validation.
          when:
            - rabbitmq_definitions_backup_mode == 'enable'
            - not ansible_check_mode
      rescue:
        - name: Roll back timer after failed post-enable validation
          ansible.builtin.systemd_service:
            name: cristexweb-rabbitmq-definitions-backup.timer
            enabled: false
            state: stopped
          when:
            - rabbitmq_definitions_backup_mode == 'enable'
            - not ansible_check_mode
        - name: Refuse timer acceptance after rollback
          ansible.builtin.fail:
            msg: Timer enablement rolled back after failed validation.
  post_tasks:
    - name: Verify host services
      ansible.builtin.service_facts:
    - name: Verify requested timer state
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, "{{ item }}", cristexweb-rabbitmq-definitions-backup.timer]
      loop: [is-active, is-enabled]
      register: rabbitmq_timer_state
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - rabbitmq_definitions_backup_mode == 'enable'
        - not ansible_check_mode
    - name: Require service health and timer state
      ansible.builtin.assert:
        that:
          - ansible_facts.services['k3s.service'].state == 'running'
          - ansible_facts.services['tailscaled.service'].state == 'running'
          - >-
            ansible_check_mode or rabbitmq_definitions_backup_mode != 'enable' or
            (rabbitmq_timer_state.results[0].stdout == 'active' and
            rabbitmq_timer_state.results[1].stdout == 'enabled')
      changed_when: false
